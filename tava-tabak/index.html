<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<title>TAVA & TABAK — Köfteleri Yakala!</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  :root{ --bg:#fdf3e3; --ink:#4a3220; --dim:#a08663; --kirmizi:#d1382f; --sari:#f0a832; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  #hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;
    justify-content:space-between;align-items:flex-start;padding:0 14px;pointer-events:none;z-index:5}
  .kutu{text-align:center}
  .label{font-size:9px;letter-spacing:.2em;color:var(--dim);font-weight:800}
  .deger{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
  #ortaHud{display:flex;flex-direction:column;align-items:center;gap:4px}
  #durdur{pointer-events:auto;font:inherit;font-size:17px;font-weight:900;color:var(--ink);
    background:rgba(74,50,32,.1);border:1.5px solid rgba(74,50,32,.25);
    border-radius:12px;width:44px;height:44px;cursor:pointer}
  #canEl{font-size:15px;letter-spacing:2px}
  #toast{position:fixed;top:24%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;
    color:var(--kirmizi);opacity:0;pointer-events:none;white-space:nowrap;z-index:6}
  #toast.pop{animation:tp .8s ease-out}
  @keyframes tp{0%{opacity:0;transform:translateX(-50%) scale(.6)}
    15%{opacity:1;transform:translateX(-50%) scale(1.08)}80%{opacity:1}100%{opacity:0}}
  .kart{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;background:rgba(253,243,227,.97);
    transition:opacity .3s;padding:24px;z-index:10}
  .kart.gizli{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
  .kart.gizli .btn{pointer-events:none}
  .kart h1{font-size:clamp(34px,9vw,58px);font-weight:900;line-height:1.05;color:var(--kirmizi);transform:rotate(-2deg)}
  .kart h1 span{color:var(--sari)}
  .kart p{max-width:38ch;color:var(--dim);font-size:14.5px;line-height:1.6}
  .kart .puanlar{font-size:30px;font-weight:900}
  .btn{font:inherit;font-weight:900;font-size:16px;letter-spacing:.06em;text-transform:uppercase;
    color:#fff;background:linear-gradient(180deg,#e8632e,#d1382f);border:none;border-radius:999px;
    padding:15px 42px;cursor:pointer;box-shadow:0 5px 0 #8f2018}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8f2018}
  .btn:focus-visible{outline:3px solid var(--kirmizi);outline-offset:3px}
  .hint{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .btn2{font:inherit;font-weight:800;font-size:13.5px;letter-spacing:.05em;color:var(--ink);
    background:rgba(74,50,32,.08);border:1.5px solid rgba(74,50,32,.25);
    border-radius:999px;padding:11px 26px;cursor:pointer}
  .diller{display:flex;gap:8px}
  .dil{font:inherit;font-size:13px;font-weight:900;color:var(--dim);background:none;
    border:1.5px solid rgba(74,50,32,.25);border-radius:10px;padding:8px 14px;cursor:pointer}
  .dil.aktif{color:#fff;background:var(--kirmizi);border-color:var(--kirmizi)}
  #nasilIcerik{text-align:left;white-space:pre-line}
</style>
<canvas id="c"></canvas>
<div id="hud">
  <div class="kutu"><div class="label">KÖFTE</div><div class="deger" id="puanEl">0</div></div>
  <div id="ortaHud">
    <button id="durdur" aria-label="Durdur / Devam">⏸</button>
    <div id="canEl">❤️❤️❤️</div>
  </div>
  <div class="kutu"><div class="label">SERİ</div><div class="deger" id="seriEl">0</div></div>
</div>
<div id="toast"></div>

<div class="kart" id="giris">
  <h1>TAVA <span>&</span> TABAK</h1>
  <p id="girisMetin">Usta tavadan köfteleri fırlatıyor — <b>tabağı parmağınla kaydır</b>, hepsini yakala! 🌶️ Acı biberlere dikkat: tabağa düşerse can gider. Köfteyi yere düşürmek de can yakar. Arada uçan ❤️ canını tazeler.</p>
  <div class="diller">
    <button class="dil" data-dil="tr">TR</button>
    <button class="dil" data-dil="en">EN</button>
    <button class="dil" data-dil="es">ES</button>
  </div>
  <button class="btn" id="baslaBtn">Mutfağa Gir</button>
  <button class="btn2" id="nasilBtn">❓ Nasıl Oynanır</button>
  <span class="hint" id="bestIntro"></span>
  <span class="hint" id="klavyeHint">klavye: ← → ile tabak</span>
</div>

<div class="kart gizli" id="nasil">
  <h1 id="nasilBaslik" style="font-size:28px">NASIL OYNANIR</h1>
  <p id="nasilIcerik"></p>
  <button class="btn" id="nasilKapat">Tamam</button>
</div>

<div class="kart gizli" id="son">
  <h1 id="sonBaslik">SERVİS BİTTİ!</h1>
  <div class="puanlar" id="sonPuan"></div>
  <p id="sonMsg"></p>
  <button class="btn" id="tekrarBtn">Tekrar Dene</button>
</div>

<script>
'use strict';
/* ── ÇOK DİLLİ ── */
const DILLER={
tr:{giris:'Usta tavadan köfteleri fırlatıyor — tabağı parmağınla kaydır, hepsini yakala! 🌶️ Acı biberlere dikkat: tabağa düşerse can gider. Köfteyi yere düşürmek de can yakar. Arada uçan ❤️ canını tazeler.',
 basla:'Mutfağa Gir',tekrar:'Tekrar Dene',nasilBtn:'❓ Nasıl Oynanır',tamam:'Tamam',nasilBaslik:'NASIL OYNANIR',
 nasil:'1️⃣ Tabağı parmağınla (veya ← →) sağa-sola kaydır.\n\n2️⃣ Uçan köfteleri tabakla yakala: her biri +1.\n\n3️⃣ 🌶️ Acı biberi YAKALAMA — tabağa düşerse can gider.\n\n4️⃣ Köfteyi yere düşürmek de can götürür (3 canın var).\n\n5️⃣ Uçan ❤️ kalpleri yakala, canın tazelensin.\n\n6️⃣ 12 köftede Garson Hüsnü, 28\'de Kâmil katılır — üç koldan yağmur başlar!',
 klavye:'klavye: ← → ile tabak',lPuan:'KÖFTE',lSeri:'SERİ',dur:'DURAKLATILDI',devamIp:'devam için ▶ düğmesine bas',
 sonBaslik:'SERVİS BİTTİ!',sonPuanF:n=>n+' köfte yakaladın',rekor:'🏆 YENİ REKOR! ',enIyiF:b=>'En iyin: '+b+'. ',
 sonEk:'Usta yine tavayı salladı bile…',seriF:n=>'🔥 Seri x'+n+'!',canArti:'❤️ +1 can!',
 biberMsg:'🌶️ Acı biber tabağa düştü!',dusMsg:'Köfte yere düştü!',
 garson1:'🤵 Garson Hüsnü katıldı!',garson2:'🤵 Garson Kâmil de geldi!',enIyiIntroF:b=>'EN İYİ: '+b+' köfte'},
en:{giris:'The chef is flinging meatballs from the pan — slide the plate with your finger and catch them all! 🌶️ Watch out for hot peppers: catching one costs a life. Dropping a meatball hurts too. Flying ❤️ hearts refill your lives.',
 basla:'Enter the Kitchen',tekrar:'Try Again',nasilBtn:'❓ How to Play',tamam:'OK',nasilBaslik:'HOW TO PLAY',
 nasil:'1️⃣ Slide the plate with your finger (or ← →).\n\n2️⃣ Catch flying meatballs: +1 each.\n\n3️⃣ Do NOT catch 🌶️ hot peppers — they cost a life.\n\n4️⃣ Letting a meatball hit the floor also costs one (3 lives).\n\n5️⃣ Catch flying ❤️ hearts to refill.\n\n6️⃣ At 12 meatballs Waiter Hüsnü joins, at 28 Kâmil — food rains from three sides!',
 klavye:'keys: ← → move plate',lPuan:'CAUGHT',lSeri:'STREAK',dur:'PAUSED',devamIp:'press ▶ to continue',
 sonBaslik:'SERVICE OVER!',sonPuanF:n=>'you caught '+n+' meatballs',rekor:'🏆 NEW RECORD! ',enIyiF:b=>'Your best: '+b+'. ',
 sonEk:'The chef is already shaking the pan again…',seriF:n=>'🔥 Streak x'+n+'!',canArti:'❤️ +1 life!',
 biberMsg:'🌶️ Hot pepper landed on the plate!',dusMsg:'A meatball hit the floor!',
 garson1:'🤵 Waiter Hüsnü joined!',garson2:'🤵 Waiter Kâmil is here too!',enIyiIntroF:b=>'BEST: '+b+' meatballs'},
es:{giris:'¡El chef lanza albóndigas desde la sartén! Desliza el plato con el dedo y atrápalas todas. 🌶️ Cuidado con los chiles: atrapar uno resta una vida. Dejar caer una albóndiga también. Los ❤️ voladores recargan tus vidas.',
 basla:'Entrar a la Cocina',tekrar:'Otra Vez',nasilBtn:'❓ Cómo Jugar',tamam:'Vale',nasilBaslik:'CÓMO JUGAR',
 nasil:'1️⃣ Desliza el plato con el dedo (o ← →).\n\n2️⃣ Atrapa las albóndigas voladoras: +1 cada una.\n\n3️⃣ NO atrapes los 🌶️ chiles: restan una vida.\n\n4️⃣ Dejar caer una albóndiga también resta (3 vidas).\n\n5️⃣ Atrapa los ❤️ para recuperar vidas.\n\n6️⃣ A las 12 se une el camarero Hüsnü, a las 28 Kâmil: ¡lluvia por tres lados!',
 klavye:'teclas: ← → mueven el plato',lPuan:'ATRAPADAS',lSeri:'RACHA',dur:'PAUSA',devamIp:'pulsa ▶ para seguir',
 sonBaslik:'¡FIN DEL SERVICIO!',sonPuanF:n=>'atrapaste '+n+' albóndigas',rekor:'🏆 ¡NUEVO RÉCORD! ',enIyiF:b=>'Tu récord: '+b+'. ',
 sonEk:'El chef ya está sacudiendo la sartén otra vez…',seriF:n=>'🔥 ¡Racha x'+n+'!',canArti:'❤️ ¡+1 vida!',
 biberMsg:'🌶️ ¡Un chile cayó en el plato!',dusMsg:'¡Una albóndiga cayó al suelo!',
 garson1:'🤵 ¡Se unió el camarero Hüsnü!',garson2:'🤵 ¡Llegó el camarero Kâmil!',enIyiIntroF:b=>'RÉCORD: '+b+' albóndigas'}};
let dil=localStorage.getItem('mp_dil')||'tr';
if(!DILLER[dil])dil='tr';
const S=k=>DILLER[dil][k]??DILLER.tr[k];
function uygulaDil(){
  document.getElementById('girisMetin').textContent=S('giris');
  document.getElementById('baslaBtn').textContent=S('basla');
  document.getElementById('tekrarBtn').textContent=S('tekrar');
  document.getElementById('nasilBtn').textContent=S('nasilBtn');
  document.getElementById('nasilKapat').textContent=S('tamam');
  document.getElementById('nasilBaslik').textContent=S('nasilBaslik');
  document.getElementById('nasilIcerik').textContent=S('nasil');
  document.getElementById('klavyeHint').textContent=S('klavye');
  document.getElementById('sonBaslik').textContent=S('sonBaslik');
  const et=document.querySelectorAll('#hud .label');
  et[0].textContent=S('lPuan'); et[1].textContent=S('lSeri');
  document.getElementById('bestIntro').textContent=best>0?S('enIyiIntroF')(best):'';
  document.querySelectorAll('.dil').forEach(b=>b.classList.toggle('aktif',b.dataset.dil===dil));
}
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,3); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0); }
resize(); addEventListener('resize',resize);

let best=+(localStorage.getItem('tavatabak_best')||0);


let AC=null;
const audio=()=>{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; };
function blip(f,d=0.1,v=0.12,tip='triangle'){ try{ const a=audio(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=tip; o.frequency.value=f; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+0.02); }catch(e){} }
function cizir(){ try{ const a=audio(),t=a.currentTime,n=a.createBufferSource(),
  buf=a.createBuffer(1,a.sampleRate*0.25,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const g=a.createGain(); g.gain.setValueAtTime(0.14,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
  n.buffer=buf; n.connect(g).connect(a.destination); n.start(t); }catch(e){} }
const buzz=p=>{ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} };
function toast(t){ const el=document.getElementById('toast'); el.textContent=t;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

let state='intro', tick=0, puan=0, seri=0, can=3, zorluk=0, atisT=90;
let tabakX=0.5, hedefX=0.5, objler=[], parcalar=[], popups=[], sarsinti=0, tabaktakiler=0;
const TABAK_Y=()=>H*0.82, G=0.24;
function popup(x,y,metin,renk){ popups.push({x,y,metin,renk,omur:46}); }

function reset(){ tick=0; puan=0; seri=0; can=3; zorluk=0; atisT=60;
  tabakX=0.5; hedefX=0.5; objler=[]; parcalar=[]; updHud(); }
function updHud(){
  document.getElementById('puanEl').textContent=puan;
  document.getElementById('seriEl').textContent=seri;
  document.getElementById('canEl').textContent='❤️'.repeat(can)+'🖤'.repeat(3-can);
}

/* fırlatıcı kadrosu: usta hep var, garsonlar puanla katılır */
const ATICILAR=[
  {esik:0,  ad:'',                          px:()=>W*0.14, py:()=>H*0.24},
  {esik:12, ad:'garson1',  px:()=>W*0.86, py:()=>H*0.33},
  {esik:28, ad:'garson2', px:()=>W*0.12, py:()=>H*0.55}
];
function firlat(){
  const acik=ATICILAR.filter(a=>puan>=a.esik);
  const atici=acik[Math.floor(Math.random()*acik.length)];
  const r=Math.random();
  const tip=r<0.72?'kofte':(r<0.88?'biber':(can<3?'kalp':'kofte'));
  const hx=(0.16+Math.random()*0.68)*W;
  const x0=atici.px(), y0=atici.py();
  const ucus=(66-Math.min(24,zorluk*3))*(0.9+Math.random()*0.25);
  const vx=(hx-x0)/ucus;
  const vy=-(G*ucus)/2+(TABAK_Y()-y0)/ucus;
  objler.push({x:x0,y:y0,vx,vy,tip,don:Math.random()*6.28,hit:false});
  blip(tip==='biber'?300:520,0.06,0.08);
}

function physics(dt){
  tick+=dt;
  zorluk=Math.min(12,puan/9);
  atisT-=dt;
  /* daha sık atış: 60 birimden başlar, ~108 köftede 19'a kadar iner */
  if(atisT<=0){ firlat(); atisT=(60-zorluk*3.4)*(0.8+Math.random()*0.35); }
  tabakX+=(hedefX-tabakX)*(1-Math.pow(0.72,dt));
  const ty=TABAK_Y(), tw=Math.min(W*0.19,96);
  for(const o of objler){
    if(o.hit)continue;
    o.x+=o.vx*dt; o.y+=o.vy*dt; o.vy+=G*dt; o.don+=0.12*dt;
    /* tabakla temas */
    if(o.vy>0&&Math.abs(o.y-ty)<20&&Math.abs(o.x-tabakX*W)<tw/2+10){
      o.hit=true;
      if(o.tip==='kofte'){ puan++; seri++; tabaktakiler=Math.min(4,tabaktakiler+1); updHud();
        blip(620+Math.min(seri,8)*30,0.07,0.12); blip(880,0.1,0.1); buzz(8);
        popup(o.x,ty-30,'+1','#3f8d2c');
        /* yeni garson katılımı */
        for(const a of ATICILAR) if(a.esik===puan&&a.ad){ toast(S(a.ad));
          blip(523,0.15,0.13); blip(659,0.2,0.12); buzz([20,30,20]); }
        if(seri>0&&seri%5===0){ toast(S('seriF')(seri)); blip(1040,0.12,0.12); }
        pat(o.x,ty,'#8f5a2b'); }
      else if(o.tip==='kalp'){ can=Math.min(3,can+1); updHud();
        toast(S('canArti')); blip(660,0.1,0.13); blip(880,0.14,0.12); buzz([15,25,15]); }
      else { canKaybi(S('biberMsg')); pat(o.x,ty,'#d1382f'); }
    }
    /* yere düştü */
    else if(o.y>H+30){
      o.hit=true;
      if(o.tip==='kofte'){ canKaybi(S('dusMsg')); }
    }
  }
  objler=objler.filter(o=>!o.hit);
  for(const p of parcalar){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=0.3*dt; p.omur-=dt; }
  parcalar=parcalar.filter(p=>p.omur>0);
  for(const p of popups){ p.y-=1.1*dt; p.omur-=dt; }
  popups=popups.filter(p=>p.omur>0);
  if(sarsinti>0)sarsinti-=dt;
}
function canKaybi(msg){
  can--; seri=0; tabaktakiler=0; sarsinti=12; updHud(); toast('💥 '+msg);
  cizir(); buzz([40,30,40]);
  if(can<=0){
    state='son';
    const rekor=puan>best;
    if(rekor){ best=puan; localStorage.setItem('tavatabak_best',best); }
    document.getElementById('sonPuan').textContent=S('sonPuanF')(puan);
    document.getElementById('sonMsg').textContent=(rekor?S('rekor'):S('enIyiF')(best))+S('sonEk');
    setTimeout(()=>document.getElementById('son').classList.remove('gizli'),450);
  }
}
function pat(x,y,renk){
  for(let i=0;i<8;i++) parcalar.push({x,y,vx:(Math.random()-0.5)*5,vy:-Math.random()*4-1,omur:24+Math.random()*12,renk});
}

/* ── ÇİZİM ── */
function cizArka(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#fdf3e3'); g.addColorStop(1,'#f6e2c4');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  /* fayans */
  ctx.strokeStyle='rgba(74,50,32,.07)'; ctx.lineWidth=2;
  for(let y=0;y<H*0.6;y+=54){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  for(let x=0;x<W;x+=54){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H*0.6); ctx.stroke(); }
  /* pencere + güneş ışığı */
  const px2=W*0.72, py2=H*0.16;
  ctx.fillStyle='#bfe3f2';
  ctx.beginPath(); ctx.roundRect(px2,py2,W*0.2,H*0.13,10); ctx.fill();
  ctx.fillStyle='#a5d5ea';
  ctx.beginPath(); ctx.moveTo(px2,py2+H*0.13); ctx.lineTo(px2+W*0.2,py2);
  ctx.lineTo(px2+W*0.2,py2+H*0.13); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#8a6a42'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.roundRect(px2,py2,W*0.2,H*0.13,10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px2+W*0.1,py2); ctx.lineTo(px2+W*0.1,py2+H*0.13);
  ctx.moveTo(px2,py2+H*0.065); ctx.lineTo(px2+W*0.2,py2+H*0.065); ctx.stroke();
  /* raf + kavanozlar */
  const ry=H*0.38;
  ctx.fillStyle='#a86f38'; ctx.beginPath(); ctx.roundRect(W*0.62,ry,W*0.33,9,4); ctx.fill();
  const kavanoz=(kx,renk,doluluk)=>{
    ctx.fillStyle='rgba(210,225,235,.75)';
    ctx.beginPath(); ctx.roundRect(kx,ry-34,26,34,5); ctx.fill();
    ctx.fillStyle=renk;
    ctx.beginPath(); ctx.roundRect(kx+2,ry-34+34*(1-doluluk),22,34*doluluk-2,4); ctx.fill();
    ctx.fillStyle='#8a6a42'; ctx.beginPath(); ctx.roundRect(kx-1,ry-40,28,7,3); ctx.fill();
  };
  kavanoz(W*0.65,'#d1382f',0.6); kavanoz(W*0.74,'#3f8d2c',0.75); kavanoz(W*0.83,'#f0a832',0.5);
  /* asılı kepçe & spatula */
  ctx.strokeStyle='#5a4630'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(W*0.08,H*0.1); ctx.lineTo(W*0.08,H*0.16); ctx.stroke();
  ctx.fillStyle='#7a6248'; ctx.beginPath(); ctx.arc(W*0.08,H*0.185,13,0,3.14); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W*0.16,H*0.1); ctx.lineTo(W*0.16,H*0.17); ctx.stroke();
  ctx.fillStyle='#7a6248'; ctx.beginPath(); ctx.roundRect(W*0.16-9,H*0.17,18,24,5); ctx.fill();
  /* tezgah */
  ctx.fillStyle='#c98d4e';
  ctx.fillRect(0,H*0.9,W,H*0.1);
  ctx.fillStyle='#a86f38'; ctx.fillRect(0,H*0.9,W,10);
  for(let x=20;x<W;x+=70){ ctx.fillStyle='rgba(74,50,32,.15)';
    ctx.beginPath(); ctx.roundRect(x,H*0.93,44,4,2); ctx.fill(); }
}
function cizTava(){
  const x=W*0.14, y=H*0.24, sal=Math.sin(tick*0.09)*0.1-(atisT<14?0.35:0);
  ctx.save(); ctx.translate(x,y); ctx.rotate(sal);
  ctx.fillStyle='#3a3f47';
  ctx.beginPath(); ctx.roundRect(-8,-12,86,14,7); ctx.fill();     /* sap */
  ctx.fillStyle='#2b2f36';
  ctx.beginPath(); ctx.ellipse(-26,-4,42,20,0,0,6.28); ctx.fill(); /* tava */
  ctx.fillStyle='#454b54';
  ctx.beginPath(); ctx.ellipse(-26,-8,36,15,0,0,6.28); ctx.fill();
  /* içindeki köfteler */
  for(const dx of [-40,-24,-8]){ ctx.fillStyle='#8f5a2b';
    ctx.beginPath(); ctx.arc(dx,-10,8,0,6.28); ctx.fill();
    ctx.fillStyle='#7a4a20'; ctx.beginPath(); ctx.arc(dx-2,-12,2.4,0,6.28); ctx.fill(); }
  /* buhar */
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=3; ctx.lineCap='round';
  for(let i=0;i<3;i++){ const by=-24-((tick*0.8+i*18)%36);
    ctx.globalAlpha=1-(-by-24)/40;
    ctx.beginPath(); ctx.moveTo(-38+i*14,by); ctx.quadraticCurveTo(-34+i*14,by-7,-38+i*14,by-13); ctx.stroke(); }
  ctx.globalAlpha=1; ctx.restore();
  /* usta aşçı */
  const ux=Math.max(30,x-58), uy=y-34, sal2=Math.sin(tick*0.09)*2;
  ctx.save(); ctx.translate(ux,uy+sal2*0.4);
  /* gövde: önlük */
  ctx.fillStyle='#e8e2d4';
  ctx.beginPath(); ctx.roundRect(-24,-6,48,52,14); ctx.fill();
  ctx.fillStyle='#d1382f';
  ctx.beginPath(); ctx.roundRect(-24,14,48,32,12); ctx.fill();
  ctx.fillStyle='rgba(74,50,32,.25)';
  ctx.beginPath(); ctx.roundRect(-10,20,20,3,2); ctx.fill();
  /* kol: tavaya uzanır */
  ctx.strokeStyle='#e8e2d4'; ctx.lineWidth=11; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(18,6); ctx.quadraticCurveTo(34,10+sal2,50,10); ctx.stroke();
  ctx.fillStyle='#f2c9a0'; ctx.beginPath(); ctx.arc(52,10,6.5,0,6.28); ctx.fill();
  /* kafa */
  ctx.fillStyle='#f2c9a0';
  ctx.beginPath(); ctx.arc(0,-24,17,0,6.28); ctx.fill();
  /* yüz */
  ctx.fillStyle='#4a3220';
  ctx.beginPath(); ctx.arc(-5,-26,2,0,6.28); ctx.arc(5,-26,2,0,6.28); ctx.fill();
  ctx.strokeStyle='#4a3220'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,-21,6,0.3,Math.PI-0.3); ctx.stroke();
  /* bıyık */
  ctx.fillStyle='#5a4630';
  ctx.beginPath(); ctx.ellipse(-4.5,-17.5,4.5,2.4,0.25,0,6.28); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4.5,-17.5,4.5,2.4,-0.25,0,6.28); ctx.fill();
  /* aşçı şapkası */
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.roundRect(-15,-46,30,13,5); ctx.fill();
  ctx.beginPath(); ctx.arc(-9,-47,8,0,6.28); ctx.arc(0,-51,9,0,6.28); ctx.arc(9,-47,8,0,6.28); ctx.fill();
  ctx.restore();
  /* katılan garsonlar */
  if(puan>=ATICILAR[1].esik) cizGarson(ATICILAR[1].px(),ATICILAR[1].py(),-1,'#2b3950');
  if(puan>=ATICILAR[2].esik) cizGarson(ATICILAR[2].px(),ATICILAR[2].py(),1,'#5a3a6e');
}
function cizGarson(gx,gy,yon,yelekRenk){
  const sal2=Math.sin(tick*0.11+gx)*2;
  ctx.save(); ctx.translate(gx,gy+sal2*0.4); ctx.scale(yon,1);
  /* gövde: beyaz gömlek + yelek */
  ctx.fillStyle='#f4f0e6';
  ctx.beginPath(); ctx.roundRect(-19,-4,38,46,12); ctx.fill();
  ctx.fillStyle=yelekRenk;
  ctx.beginPath(); ctx.moveTo(-19,-2); ctx.lineTo(-6,4); ctx.lineTo(-8,42); ctx.lineTo(-19,42); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(19,-2); ctx.lineTo(6,4); ctx.lineTo(8,42); ctx.lineTo(19,42); ctx.closePath(); ctx.fill();
  /* papyon */
  ctx.fillStyle='#d1382f';
  ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(-7,-6); ctx.lineTo(-7,2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(7,-6); ctx.lineTo(7,2); ctx.closePath(); ctx.fill();
  /* tepsi tutan kol */
  ctx.strokeStyle='#f4f0e6'; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(14,4); ctx.quadraticCurveTo(28,6+sal2,40,4); ctx.stroke();
  ctx.fillStyle='#f2c9a0'; ctx.beginPath(); ctx.arc(42,4,5.5,0,6.28); ctx.fill();
  /* tepsi + üstünde köfteler */
  ctx.fillStyle='#b9c2d4';
  ctx.beginPath(); ctx.ellipse(46,-2,16,4.5,0,0,6.28); ctx.fill();
  ctx.fillStyle='#8f5a2b';
  ctx.beginPath(); ctx.arc(40,-7,5,0,6.28); ctx.arc(50,-7,5,0,6.28); ctx.fill();
  /* kafa */
  ctx.fillStyle='#f2c9a0';
  ctx.beginPath(); ctx.arc(0,-20,15,0,6.28); ctx.fill();
  /* saç */
  ctx.fillStyle='#3a2a18';
  ctx.beginPath(); ctx.arc(0,-24,15,Math.PI,0); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-15,-26,30,7,3); ctx.fill();
  /* yüz */
  ctx.fillStyle='#4a3220';
  ctx.beginPath(); ctx.arc(-4.5,-21,1.9,0,6.28); ctx.arc(4.5,-21,1.9,0,6.28); ctx.fill();
  ctx.strokeStyle='#4a3220'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,-16.5,5,0.35,Math.PI-0.35); ctx.stroke();
  ctx.restore();
}
function cizObj(o){
  ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(o.don);
  if(o.tip==='kofte'){
    ctx.fillStyle='rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(0,16,13,4,0,0,6.28); ctx.fill();
    const g=ctx.createRadialGradient(-4,-4,2,0,0,15);
    g.addColorStop(0,'#a86c38'); g.addColorStop(1,'#7a4a20');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,14,0,6.28); ctx.fill();
    ctx.fillStyle='rgba(58,34,12,.6)';
    for(const [px,py] of [[-5,-3],[4,2],[0,-7],[6,-5],[-6,5]]){ ctx.beginPath(); ctx.arc(px,py,1.7,0,6.28); ctx.fill(); }
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(-5,-6,3.5,0,6.28); ctx.fill();
  } else if(o.tip==='biber'){
    ctx.fillStyle='#3f7d2c';
    ctx.beginPath(); ctx.roundRect(-2,-20,5,9,3); ctx.fill();
    const g=ctx.createLinearGradient(-8,0,8,0);
    g.addColorStop(0,'#e8402e'); g.addColorStop(1,'#b31f14');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(0,-13); ctx.quadraticCurveTo(11,-8,7,6); ctx.quadraticCurveTo(4,17,-3,19);
    ctx.quadraticCurveTo(2,10,-2,2); ctx.quadraticCurveTo(-7,-8,0,-13);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(2,-6,2.4,5,0.4,0,6.28); ctx.fill();
  } else { /* kalp */
    const g=ctx.createRadialGradient(0,0,2,0,0,26);
    g.addColorStop(0,'rgba(255,90,110,.4)'); g.addColorStop(1,'rgba(255,90,110,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,26,0,6.28); ctx.fill();
    ctx.fillStyle='#ff4d6a';
    ctx.beginPath(); ctx.moveTo(0,11);
    ctx.bezierCurveTo(-17,-2,-13,-15,0,-7);
    ctx.bezierCurveTo(13,-15,17,-2,0,11); ctx.fill();
  }
  ctx.restore();
}
function cizTabak(){
  const x=tabakX*W, y=TABAK_Y(), tw=Math.min(W*0.19,96);
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.beginPath(); ctx.ellipse(x,y+16,tw*0.62,8,0,0,6.28); ctx.fill();
  const g=ctx.createLinearGradient(x-tw/2,0,x+tw/2,0);
  g.addColorStop(0,'#dfe5ee'); g.addColorStop(0.5,'#ffffff'); g.addColorStop(1,'#c9d2df');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(x,y+6,tw/2+8,15,0,0,6.28); ctx.fill();
  ctx.fillStyle='#eef2f8';
  ctx.beginPath(); ctx.ellipse(x,y+3,tw/2,10,0,0,6.28); ctx.fill();
  ctx.strokeStyle='#3d8bfd'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.ellipse(x,y+3,tw/2-7,6.5,0,0,6.28); ctx.stroke();
  /* tabakta biriken köfteler (seri hissi) */
  for(let i=0;i<tabaktakiler;i++){
    const kx=x+(i-(tabaktakiler-1)/2)*16, ky=y-6-(i%2)*4;
    const g2=ctx.createRadialGradient(kx-2,ky-2,1,kx,ky,9);
    g2.addColorStop(0,'#a86c38'); g2.addColorStop(1,'#7a4a20');
    ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(kx,ky,8.5,0,6.28); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.3)'; ctx.beginPath(); ctx.arc(kx-3,ky-3,2.2,0,6.28); ctx.fill();
  }
}
function draw(){
  ctx.save();
  if(sarsinti>0) ctx.translate((Math.random()-0.5)*sarsinti,(Math.random()-0.5)*sarsinti);
  cizArka(); cizTava();
  for(const p of parcalar){ ctx.globalAlpha=Math.min(1,p.omur/14);
    ctx.fillStyle=p.renk; ctx.beginPath(); ctx.arc(p.x,p.y,3.2,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  for(const o of objler) cizObj(o);
  cizTabak();
  /* uçan puanlar */
  for(const p of popups){
    ctx.globalAlpha=Math.min(1,p.omur/18);
    ctx.fillStyle=p.renk; ctx.font='900 20px "Avenir Next",system-ui'; ctx.textAlign='center';
    ctx.fillText(p.metin,p.x,p.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();
  if(state==='dur'){
    ctx.fillStyle='rgba(253,243,227,.8)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#4a3220'; ctx.font='900 30px "Avenir Next",system-ui'; ctx.textAlign='center';
    ctx.fillText(S('dur'),W/2,H/2-8);
    ctx.font='700 14px "Avenir Next",system-ui'; ctx.fillStyle='#a08663';
    ctx.fillText(S('devamIp'),W/2,H/2+24);
  }
}
let sonTs=0;
function loop(ts){
  const dt=sonTs?Math.min(3,Math.max(0.25,(ts-sonTs)/16.667)):1; sonTs=ts;
  if(state==='play') physics(dt);
  if(state!=='intro') draw();
  requestAnimationFrame(loop);
}

/* ── KONTROLLER ── */
const surukle=x=>{ hedefX=Math.max(0.07,Math.min(0.93,x/W)); };
cv.addEventListener('touchstart',e=>{ e.preventDefault(); audio(); surukle(e.touches[0].clientX); },{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault(); surukle(e.touches[0].clientX); },{passive:false});
cv.addEventListener('mousemove',e=>{ if(e.buttons||state==='play') surukle(e.clientX); });
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') hedefX=Math.max(0.07,hedefX-0.09);
  else if(e.key==='ArrowRight') hedefX=Math.min(0.93,hedefX+0.09);
  else if(e.key==='p'||e.key==='P'||e.key===' ') durdurToggle();
});
function durdurToggle(){
  if(state==='play'){ state='dur'; document.getElementById('durdur').textContent='▶'; }
  else if(state==='dur'){ state='play'; document.getElementById('durdur').textContent='⏸'; }
}
document.getElementById('durdur').addEventListener('click',durdurToggle);
const tap=(el,fn)=>{ el.addEventListener('click',fn);
  el.addEventListener('touchend',e=>{ e.preventDefault(); e.stopPropagation(); fn(); },{passive:false}); };
tap(document.getElementById('baslaBtn'),()=>{ audio(); reset(); state='play';
  document.getElementById('giris').classList.add('gizli'); });
tap(document.getElementById('tekrarBtn'),()=>{ audio(); reset(); state='play';
  document.getElementById('son').classList.add('gizli'); });
tap(document.getElementById('nasilBtn'),()=>document.getElementById('nasil').classList.remove('gizli'));
tap(document.getElementById('nasilKapat'),()=>document.getElementById('nasil').classList.add('gizli'));
document.querySelectorAll('.dil').forEach(b=>tap(b,()=>{
  dil=b.dataset.dil; localStorage.setItem('mp_dil',dil); uygulaDil();
}));
uygulaDil();
loop();
</script>
