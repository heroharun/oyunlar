<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1630">
<title>Namaz Vakti — Koş ve Öğren</title>
<style>
:root{
  --gece:#0d1630; --lacivert:#1b2a5e; --turkuaz:#17968a; --turkuaz-ac:#2fd0be;
  --altin:#d9a441; --fildisi:#f3efe2; --kiremit:#c0563f; --duman:#8b93ab;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--gece); color:var(--fildisi);
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
  overflow:hidden; overscroll-behavior:none;
  display:flex; align-items:center; justify-content:center;
}
#sahne{position:relative;width:100%;height:100%;max-width:1100px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ---- üst şerit: vakitler ---- */
#serit{
  position:absolute;top:0;left:0;right:0;z-index:5;
  display:flex;align-items:center;gap:2px;
  padding:8px 10px calc(8px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,rgba(9,14,32,.72),rgba(9,14,32,0));
  pointer-events:none;
}
.vk{
  flex:1;text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:#7f88a3;padding:5px 0;border-top:2px solid #2a3358;transition:.35s;
}
.vk.on{color:var(--altin);border-top-color:var(--altin)}
#skorkutu{
  position:absolute;top:calc(38px + env(safe-area-inset-top,0px));right:12px;z-index:5;
  text-align:right;line-height:1.35;pointer-events:none;
}
#skor{font-size:22px;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#rekor{font-size:11px;color:var(--duman);letter-spacing:.1em}
#menzil{
  position:absolute;top:calc(40px + env(safe-area-inset-top,0px));left:12px;z-index:5;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--turkuaz-ac);
  pointer-events:none;
}
#menzil b{display:block;font-size:9px;color:var(--duman);letter-spacing:.16em;margin-top:2px}

/* ---- perde (menü / duraklat) ---- */
.perde{
  position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:24px;
  background:radial-gradient(120% 90% at 50% 0%,#1b2a5e 0%,#0b1128 68%);
  text-align:center;
}
.perde.gizli{display:none}
.logo{font-size:clamp(30px,8vw,50px);font-weight:800;letter-spacing:.02em;margin:0;line-height:1}
.logo span{color:var(--turkuaz-ac)}
.alt{margin:0;color:var(--duman);font-size:13px;letter-spacing:.16em;text-transform:uppercase}

/* ---- hadis kartı: sayfanın imzası ---- */
#hadiskart{
  position:relative;width:min(520px,100%);
  background:linear-gradient(160deg,#16224a,#101836);
  border:1px solid #2c3a6e;border-radius:18px;padding:22px 20px 18px;
  box-shadow:0 18px 44px rgba(0,0,0,.45);
}
#hadiskart::before{
  content:"";position:absolute;inset:6px;border-radius:13px;
  border:1px solid rgba(217,164,65,.28);pointer-events:none;
}
.hbaslik{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--altin);margin-bottom:12px;
}
#hmetin{font-size:clamp(14px,3.6vw,17px);line-height:1.62;margin:0 0 10px}
#hkaynak{font-size:11px;color:var(--duman);letter-spacing:.06em;margin:0}
#halka{position:absolute;top:14px;right:14px;width:18px;height:18px;transform:rotate(-90deg)}
#halka circle{fill:none;stroke-width:2.5}
.hka{stroke:#2c3a6e} .hkb{stroke:var(--altin);stroke-linecap:round;transition:stroke-dashoffset 1s linear}

.dugmeler{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
button{font-family:inherit;cursor:pointer;border:0}
.bas{
  background:var(--turkuaz);color:#04120f;font-weight:800;
  font-size:16px;letter-spacing:.1em;text-transform:uppercase;
  padding:15px 34px;border-radius:999px;box-shadow:0 8px 0 #0d5f57;transition:.12s;
}
.bas:active{transform:translateY(4px);box-shadow:0 4px 0 #0d5f57}
.ikincil{
  background:transparent;color:var(--fildisi);border:1px solid #33406f;
  padding:12px 20px;border-radius:999px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
}
.ikincil:active{background:#1a2447}
.ipuc{color:#6e7796;font-size:12px;margin:0;line-height:1.7}
.ipuc kbd{
  background:#1c2750;border:1px solid #36426f;border-bottom-width:2px;
  border-radius:5px;padding:1px 7px;font-family:inherit;font-size:11px;color:#c3cbe4;
}
#istatistik{display:flex;gap:22px;justify-content:center;color:var(--duman);font-size:12px}
#istatistik b{display:block;font-size:19px;color:var(--fildisi);font-variant-numeric:tabular-nums}

/* ---- soru penceresi ---- */
#soruperde{
  position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  padding:18px;background:rgba(6,10,24,.9);backdrop-filter:blur(4px);
}
#soruperde.gizli{display:none}
#sorukutu{
  width:min(540px,100%);max-height:100%;overflow:auto;
  background:#121b3d;border:1px solid #2e3a6b;border-radius:20px;padding:20px;
  box-shadow:0 22px 50px rgba(0,0,0,.55);
}
#soruust{
  display:flex;justify-content:space-between;align-items:center;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--turkuaz-ac);margin-bottom:6px;
}
#soruust em{font-style:normal;color:var(--duman)}
#cubuk{height:3px;background:#26305a;border-radius:2px;overflow:hidden;margin-bottom:16px}
#cubukic{height:100%;width:0;background:var(--altin);transition:width .3s}
#sorumetin{font-size:clamp(16px,4.2vw,19px);line-height:1.5;margin:0 0 16px;font-weight:600}
.sik{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:#1a2450;color:var(--fildisi);border:1px solid #2e3a6b;border-radius:13px;
  padding:14px 15px;margin-bottom:9px;font-size:15px;line-height:1.35;transition:.15s;
}
.sik span{
  flex:none;width:26px;height:26px;border-radius:8px;background:#26325f;color:#9aa5c8;
  display:grid;place-items:center;font-size:12px;font-weight:800;
}
.sik:active{background:#222f63}
.sik.dogru{background:#12513f;border-color:#1e8a68;color:#d8ffef}
.sik.dogru span{background:#1e8a68;color:#04120f}
.sik.yanlis{background:#4d1f21;border-color:#8c3a35;color:#ffdcd6}
.sik.yanlis span{background:#8c3a35;color:#fff}
.sik:disabled{cursor:default;opacity:.75}
.sik.dogru:disabled,.sik.yanlis:disabled{opacity:1}
#geribildirim{
  margin:6px 0 0;font-size:13px;line-height:1.55;color:#a9b3d1;min-height:1px;
  border-left:2px solid var(--altin);padding-left:11px;
}
#devam{width:100%;margin-top:14px}

/* ---- dokunmatik tuşlar ---- */
#tuslar{position:absolute;inset:auto 0 0 0;z-index:6;display:none;
  padding:0 14px calc(16px + env(safe-area-inset-bottom,0px));gap:12px}
#tuslar button{
  flex:1;height:62px;border-radius:16px;background:rgba(28,38,78,.6);
  border:1px solid #333f70;color:#c9d2ea;font-size:22px;
}
#tuslar button:active{background:rgba(46,60,116,.85)}
body.dokunmatik #tuslar{display:flex}

#mujde{
  position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.9);z-index:8;
  text-align:center;opacity:0;transition:.4s;pointer-events:none;
}
#mujde.gor{opacity:1;transform:translate(-50%,-50%) scale(1)}
#mujde b{display:block;font-size:clamp(20px,6vw,30px);font-weight:800;color:var(--altin);letter-spacing:.04em}
#mujde i{font-style:normal;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--fildisi)}
#geri{
  position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:22;
  color:#6e7796;font-size:12px;text-decoration:none;letter-spacing:.1em;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="sahne">
  <canvas id="tuval"></canvas>

  <div id="serit"></div>
  <div id="menzil">Menzil <b id="menziladi">Namaz</b></div>
  <div id="skorkutu"><div id="skor">0</div><div id="rekor">REKOR 0</div></div>

  <div id="mujde"><b id="mujdeb"></b><i id="mujdei"></i></div>

  <div id="tuslar">
    <button id="tzipla" aria-label="Zıpla">▲ Zıpla</button>
    <button id="tegil" aria-label="Eğil">▼ Eğil</button>
  </div>

  <!-- ANA EKRAN -->
  <div class="perde" id="anaekran">
    <div>
      <h1 class="logo">Namaz <span>Vakti</span></h1>
      <p class="alt">Koş · Öğren · Devam et</p>
    </div>

    <div id="hadiskart">
      <svg id="halka" viewBox="0 0 20 20"><circle class="hka" cx="10" cy="10" r="8"/><circle class="hkb" cx="10" cy="10" r="8" stroke-dasharray="50.3" stroke-dashoffset="0"/></svg>
      <div class="hbaslik">☾ Hadîs-i Şerîf</div>
      <p id="hmetin"></p>
      <p id="hkaynak"></p>
    </div>

    <div id="istatistik">
      <div><b id="ibilinen">0</b>Doğru</div>
      <div><b id="itoplam">0</b>Soru</div>
      <div><b id="imenzil">1</b>Menzil</div>
    </div>

    <div class="dugmeler">
      <button class="bas" id="basla">Başla</button>
      <button class="ikincil" id="sesdugme">Ses açık</button>
      <button class="ikincil" id="sifirla">Baştan</button>
    </div>
    <p class="ipuc"><kbd>Boşluk</kbd> zıpla · <kbd>↓</kbd> eğil · Telefonda ekrana dokun<br>Oyun bitmez — engele çarpınca soru gelir, cevapla ve devam et.</p>
    <a href="../" id="geri">← Tüm oyunlar</a>
  </div>

  <!-- DURAKLAT -->
  <div class="perde gizli" id="duraklat">
    <h1 class="logo">Ara</h1>
    <p class="alt" id="duraklatalt">Nefeslen</p>
    <div class="dugmeler">
      <button class="bas" id="devamet">Devam</button>
      <button class="ikincil" id="anayadon">Ana ekran</button>
    </div>
  </div>

  <!-- SORU -->
  <div id="soruperde" class="gizli">
    <div id="sorukutu">
      <div id="soruust"><span id="sorumenzil">Namaz</span><em id="sorusayac">1 / 10</em></div>
      <div id="cubuk"><div id="cubukic"></div></div>
      <p id="sorumetin"></p>
      <div id="sikler"></div>
      <p id="geribildirim"></p>
      <button class="bas gizli" id="devam">Devam</button>
    </div>
  </div>
</div>

/* ---------------- kayıt ---------------- */
var VARSAYILAN={mi:0,qi:0,sira:null,dogru:0,yanlis:0,toplam:0,msoru:0,rekor:0,ses:1};
var st;
function yukle(){
  try{ st=JSON.parse(localStorage.getItem("nv2")||"null"); }catch(e){ st=null; }
  if(!st||typeof st.mi!=="number") st=JSON.parse(JSON.stringify(VARSAYILAN));
  if(st.mi>=MENZILLER.length) st.mi=0;
  if(typeof st.msoru!=="number") st.msoru=st.toplam||0;
  if(!st.sira||!st.sira.length||st.sira.length!==MENZILLER[st.mi].sorular.length) yeniSira();
  if(st.qi>=st.sira.length) st.qi=0;
}
function kaydet(){ try{ localStorage.setItem("nv2",JSON.stringify(st)); }catch(e){} }
function yeniSira(){
  var n=MENZILLER[st.mi].sorular.length,a=[],i;
  for(i=0;i<n;i++)a.push(i);
  for(i=n-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}
  st.sira=a; st.qi=0;
}

/* ---------------- ses ---------------- */
var AC=null;
function ton(f,sure,tip,ses){
  if(!st.ses)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=tip||"square"; o.frequency.value=f;
    g.gain.setValueAtTime(ses||0.05,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+sure);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+sure);
  }catch(e){}
}
function sesZipla(){ton(520,.09,"square",.045);}
function sesDogru(){ton(660,.11,"triangle",.06);setTimeout(function(){ton(880,.18,"triangle",.06);},110);}
function sesYanlis(){ton(180,.26,"sawtooth",.045);}
function sesMenzil(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){ton(f,.16,"triangle",.055);},i*120);});}

/* ---------------- tuval ---------------- */
var tuval=$("tuval"),cx=tuval.getContext("2d"),W=0,H=0,S=1,ZEMIN=0;
function olcek(){
  var r=tuval.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
  tuval.width=Math.round(r.width*d); tuval.height=Math.round(r.height*d);
  cx.setTransform(d,0,0,d,0,0);
  W=r.width; H=r.height;
  S=Math.max(.7,Math.min(1.5,H/460));
  ZEMIN=H-Math.max(78,H*0.20);
}
window.addEventListener("resize",function(){olcek();});

/* ---------------- oyun durumu ---------------- */
var durum="menu";
var oyuncu={x:0,y:0,vy:0,egik:false,yerde:true,adim:0};
var engeller=[],zerreler=[],hiz=0,tabanHiz=3.6,mesafe=0,skor=0,sonSpawn=0,kalkan=0,vakitIx=0,sonZaman=0;

function oyunSifirla(){
  engeller=[];zerreler=[];hiz=tabanHiz;mesafe=0;skor=0;sonSpawn=0;kalkan=0;vakitIx=0;
  oyuncu.y=0;oyuncu.vy=0;oyuncu.egik=false;oyuncu.yerde=true;oyuncu.adim=0;

}

  }

/* ---------------- çizim yardımcıları ---------------- */
function yuvarlak(x,y,w,h,r){
  cx.beginPath();
  cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);
  cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();
}
function cami(x,taban,ol,renk){
  cx.fillStyle=renk;
  var g=26*ol,k=18*ol;
  cx.fillRect(x,taban-g,g*2.2,g);                       /* gövde */
  cx.beginPath();cx.arc(x+g*1.1,taban-g,g*1.1,Math.PI,0);cx.fill();   /* kubbe */
  cx.fillRect(x-8*ol,taban-k*3.2,5*ol,k*3.2);            /* minare */
  cx.beginPath();cx.moveTo(x-8*ol,taban-k*3.2);cx.lineTo(x-5.5*ol,taban-k*3.9);
  cx.lineTo(x-3*ol,taban-k*3.2);cx.fill();
  cx.fillRect(x+g*2.4,taban-k*2.8,4.5*ol,k*2.8);
  cx.beginPath();cx.moveTo(x+g*2.4,taban-k*2.8);cx.lineTo(x+g*2.4+2.2*ol,taban-k*3.4);
  cx.lineTo(x+g*2.4+4.5*ol,taban-k*2.8);cx.fill();
}

function lamba(x,taban,ol,yanik,v){
  var h=94*ol, lx=x+18*ol, ly=taban-h+10*ol;
  if(yanik){                                   /* yerdeki ışık havuzu */
    var p=cx.createRadialGradient(lx,taban,0,lx,taban,58*ol);
    p.addColorStop(0,"rgba(255,206,132,.26)");
    p.addColorStop(1,"rgba(255,206,132,0)");
    cx.save();cx.translate(lx,taban);cx.scale(1,.3);
    cx.fillStyle=p;cx.beginPath();cx.arc(0,0,58*ol,0,7);cx.fill();cx.restore();
  }
  cx.fillStyle=yanik?"#3d4870":"#2b2118";
  cx.fillRect(x,taban-h,3.5*ol,h);
  cx.fillRect(x-2*ol,taban-5*ol,7.5*ol,5*ol);
  cx.strokeStyle=yanik?"#3d4870":"#2b2118";cx.lineWidth=3*ol;
  cx.beginPath();cx.moveTo(x+3.5*ol,taban-h+2*ol);
  cx.quadraticCurveTo(x+15*ol,taban-h,x+18*ol,ly-4*ol);cx.stroke();
  if(yanik){
    var g=cx.createRadialGradient(lx,ly,0,lx,ly,52*ol);
    g.addColorStop(0,"rgba(255,222,158,.55)");
    g.addColorStop(.4,"rgba(255,199,112,.15)");
    g.addColorStop(1,"rgba(255,199,112,0)");
    cx.fillStyle=g;cx.beginPath();cx.arc(lx,ly,52*ol,0,7);cx.fill();
    cx.fillStyle="#ffe9bb";
  }else cx.fillStyle="#4a4438";
  cx.beginPath();cx.moveTo(lx-6.5*ol,ly-4*ol);cx.lineTo(lx+6.5*ol,ly-4*ol);
  cx.lineTo(lx+4.5*ol,ly+5*ol);cx.lineTo(lx-4.5*ol,ly+5*ol);cx.closePath();cx.fill();
  cx.lineWidth=1;
}
function lambalar(){
  var v=VAKITLER[vakitIx], ara=260*S, kay=(mesafe*.62)%ara;
  for(var c=-1;c*ara-kay<W+ara;c++) lamba(c*ara-kay,ZEMIN,S*0.92,v.lamba===1,v);
}

var yildizlar=[];
for(var yi=0;yi<70;yi++) yildizlar.push({x:Math.random(),y:Math.random()*.55,p:Math.random()});

function arkaPlan(){
  var v=VAKITLER[vakitIx];
  var g=cx.createLinearGradient(0,0,0,ZEMIN);
  g.addColorStop(0,v.ust); g.addColorStop(1,v.alt);
  cx.fillStyle=g; cx.fillRect(0,0,W,ZEMIN);

  if(v.gok==="yildiz"){
    for(var i=0;i<yildizlar.length;i++){
      var s=yildizlar[i];
      cx.globalAlpha=.35+.55*Math.abs(Math.sin(mesafe*.004+s.p*9));
      cx.fillStyle="#fff";
      cx.fillRect(s.x*W,s.y*ZEMIN,1.6,1.6);
    }
    cx.globalAlpha=1;
    cx.fillStyle="#f6efd8";
    cx.beginPath();cx.arc(W*0.82,ZEMIN*0.24,17*S,0,7);cx.fill();
    cx.fillStyle=v.ust;
    cx.beginPath();cx.arc(W*0.82+7*S,ZEMIN*0.24-5*S,15*S,0,7);cx.fill();
  }else{
    cx.fillStyle="rgba(255,246,214,.85)";
    cx.beginPath();cx.arc(W*0.8,ZEMIN*0.22,20*S,0,7);cx.fill();
  }

  /* uzak tepeler */
  cx.fillStyle=v.uzak;
  cx.beginPath();cx.moveTo(0,ZEMIN);
  for(var x=0;x<=W;x+=18) cx.lineTo(x,ZEMIN-24*S-Math.sin((x+mesafe*.12)*.012)*13*S);
  cx.lineTo(W,ZEMIN);cx.closePath();cx.fill();

  /* cami siluetleri */
  var ara=340*S, kay=(mesafe*.32)%ara;
  for(var c=-1;c*ara-kay<W+ara;c++) cami(c*ara-kay,ZEMIN,S*0.9,v.yer);

  /* zemin */
  cx.fillStyle=v.yer; cx.fillRect(0,ZEMIN,W,H-ZEMIN);
  cx.strokeStyle="rgba(255,255,255,.16)";cx.lineWidth=2;
  cx.beginPath();cx.moveTo(0,ZEMIN+1);cx.lineTo(W,ZEMIN+1);cx.stroke();
  cx.fillStyle="rgba(255,255,255,.10)";
  var t=(mesafe*1)%64;
  for(var d=-t;d<W;d+=64) cx.fillRect(d,ZEMIN+14*S,22*S,2);
  lambalar();
}

function oyuncuCiz(){
  var w=22*S,h=(oyuncu.egik?30:46)*S,x=W*0.14,y=ZEMIN-h-oyuncu.y;
  if(kalkan>0 && Math.floor(kalkan*10)%2===0){ cx.globalAlpha=.55; }
  /* gölge */
  cx.globalAlpha*=1;
  cx.fillStyle="rgba(0,0,0,.25)";
  cx.beginPath();cx.ellipse(x+w/2,ZEMIN+3,w*0.7,4*S,0,0,7);cx.fill();

  var bacak=Math.sin(oyuncu.adim)*8*S;
  cx.strokeStyle="#2b2118";cx.lineWidth=4*S;cx.lineCap="round";
  cx.beginPath();
  cx.moveTo(x+w*0.35,y+h-6*S);cx.lineTo(x+w*0.35-bacak,ZEMIN);
  cx.moveTo(x+w*0.65,y+h-6*S);cx.lineTo(x+w*0.65+bacak,ZEMIN);
  cx.stroke();

  /* kaftan */
  cx.fillStyle=kalkan>0?"#d9a441":"#17968a";
  yuvarlak(x,y+13*S,w,h-13*S,5*S);cx.fill();
  cx.fillStyle="rgba(255,255,255,.22)";
  cx.fillRect(x+w*0.42,y+16*S,2.5*S,h-20*S);

  /* kollar */
  cx.strokeStyle=kalkan>0?"#b8862c":"#0f7167";cx.lineWidth=4.5*S;
  cx.beginPath();
  cx.moveTo(x+w*0.5,y+20*S);
  cx.lineTo(x+w*(oyuncu.egik?1.15:0.95),y+(oyuncu.egik?24:30)*S+bacak*0.5);
  cx.stroke();

  /* baş + takke */
  cx.fillStyle="#f0d3b0";
  cx.beginPath();cx.arc(x+w*0.5,y+8*S,8*S,0,7);cx.fill();
  cx.fillStyle="#f3efe2";
  cx.beginPath();cx.arc(x+w*0.5,y+4*S,7*S,Math.PI,0);cx.fill();
  cx.fillRect(x+w*0.5-7*S,y+3.5*S,14*S,2.5*S);
  cx.globalAlpha=1;
}

function engelCiz(e){
  cx.fillStyle=VAKITLER[vakitIx].engel;
  if(e.tip==="kus"){
    var k=Math.sin(mesafe*.09)*e.h*0.5;
    cx.beginPath();
    cx.moveTo(e.x,e.y+e.h/2);
    cx.lineTo(e.x+e.w*0.5,e.y+e.h/2-k);
    cx.lineTo(e.x+e.w,e.y+e.h/2);
    cx.lineTo(e.x+e.w*0.5,e.y+e.h/2+e.h*0.35);
    cx.closePath();cx.fill();
  }else if(e.tip==="tas"){
    cx.beginPath();
    cx.moveTo(e.x,e.y+e.h);cx.lineTo(e.x+e.w*0.18,e.y+e.h*0.25);
    cx.lineTo(e.x+e.w*0.55,e.y);cx.lineTo(e.x+e.w,e.y+e.h*0.45);
    cx.lineTo(e.x+e.w*0.86,e.y+e.h);cx.closePath();cx.fill();
    cx.fillStyle="rgba(255,255,255,.12)";
    cx.fillRect(e.x+e.w*0.3,e.y+e.h*0.3,e.w*0.2,e.h*0.12);
  }else{
    var n=e.w>30?3:2;
    for(var i=0;i<n;i++){
      var bx=e.x+i*(e.w/n), bh=e.h*(i===1?1:0.72);
      cx.fillRect(bx+e.w/n*0.3,e.y+e.h-bh,e.w/n*0.36,bh);
      cx.beginPath();cx.arc(bx+e.w/n*0.48,e.y+e.h-bh,e.w/n*0.34,0,7);cx.fill();
    }
  }
}

/* ---------------- fizik ---------------- */
function engelUret(){
  var r=Math.random(),e;
  if(r<0.22 && skor>120){
    var yuk=Math.random()<0.5;
    e={tip:"kus",w:30*S,h:20*S,x:W+20,y:ZEMIN-(yuk?62:44)*S};
  }else if(r<0.62){
    e={tip:"tas",w:(20+Math.random()*14)*S,h:(24+Math.random()*14)*S,x:W+20,y:0};
    e.y=ZEMIN-e.h;
  }else{
    var g=Math.random()<0.35;
    e={tip:"cali",w:(g?44:26)*S,h:(28+Math.random()*10)*S,x:W+20,y:0};
    e.y=ZEMIN-e.h;
  }
  engeller.push(e);
}
function carpisma(){
  var w=22*S,h=(oyuncu.egik?30:46)*S,x=W*0.14,y=ZEMIN-h-oyuncu.y;
  var ax=x+4,ay=y+4,aw=w-8,ah=h-6;
  for(var i=0;i<engeller.length;i++){
    var e=engeller[i];
    if(ax<e.x+e.w-3 && ax+aw>e.x+3 && ay<e.y+e.h-3 && ay+ah>e.y+3) return e;
  }
  return null;
}
function zipla(){
  if(durum!=="oyun")return;
  if(oyuncu.yerde){ oyuncu.vy=13.6*S; oyuncu.yerde=false; sesZipla(); }
}
function egilBasla(){ if(durum==="oyun") oyuncu.egik=true; }
function egilBitir(){ oyuncu.egik=false; }

/* ---------------- döngü ---------------- */
function dongu(zaman){
  requestAnimationFrame(dongu);
  var dt=Math.min(2.6,(zaman-sonZaman)/16.6667)||1; sonZaman=zaman;
  if(durum==="oyun"){
    hiz=Math.min(11.5,tabanHiz+skor*0.0016);
    mesafe+=hiz*dt; skor=Math.floor(mesafe/9);
    oyuncu.adim+=hiz*dt*0.11;
    oyuncu.vy-=0.72*S*dt;
    oyuncu.y+=oyuncu.vy*dt;
    if(oyuncu.y<=0){oyuncu.y=0;oyuncu.vy=0;oyuncu.yerde=true;}
    if(oyuncu.egik && !oyuncu.yerde) oyuncu.vy-=0.55*S*dt;

    sonSpawn-=hiz*dt;
    if(sonSpawn<=0){ engelUret(); sonSpawn=(210+Math.random()*190)*S*(hiz/6.5); }
    for(var i=engeller.length-1;i>=0;i--){
      engeller[i].x-=hiz*dt*1.55;
      if(engeller[i].x+engeller[i].w<-40) engeller.splice(i,1);
    }
    if(kalkan>0) kalkan-=dt/60;
    else{ var c=carpisma(); if(c){ soruAc(); } }

    var yv=Math.floor(mesafe/9000)%VAKITLER.length;
    if(yv!==vakitIx && durum==="oyun"){ vakitIx=yv; seritCiz(); vakitSoruAc(); }

    $("skor").textContent=skor;
    if(skor>st.rekor){ st.rekor=skor; $("rekor").textContent="REKOR "+skor; }
  }
  arkaPlan();
  for(var j=0;j<engeller.length;j++) engelCiz(engeller[j]);
  oyuncuCiz();
}

/* ---------------- sorular ---------------- */
var aktifSoru=null,aktifDogru=0,vakitSorusu=false;
function soruHazirla(s,baslik,sayac,oran,renk){
  durum="soru"; aktifSoru=s;
  var sik=s.o.slice(), dgr=s.o[0];
  for(var i=sik.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=sik[i];sik[i]=sik[j];sik[j]=t;}
  aktifDogru=sik.indexOf(dgr);
  $("sorumenzil").textContent=baslik;
  $("sorumenzil").style.color=renk;
  $("sorusayac").textContent=sayac;
  $("cubukic").style.width=Math.round(oran*100)+"%";
  $("cubukic").style.background=renk;
  $("sorumetin").textContent=s.s;
  $("geribildirim").textContent="";
  $("devam").classList.add("gizli");

  var harf=["A","B","C","D"],h="";
  for(var k=0;k<sik.length;k++)
    h+='<button class="sik" data-i="'+k+'"><span>'+harf[k]+"</span>"+sik[k]+"</button>";
  $("sikler").innerHTML=h;
  var dgm=$("sikler").querySelectorAll(".sik");
  for(var d=0;d<dgm.length;d++) dgm[d].addEventListener("click",cevapla);
  $("soruperde").classList.remove("gizli");
}
function soruAc(){
  vakitSorusu=false;
  var m=MENZILLER[st.mi];
  var tur=Math.floor(st.msoru/10)+1, ici=st.msoru%10+1;
  soruHazirla(m.sorular[st.sira[st.qi]], m.ad, tur+". tur · "+ici+" / 10",
              st.qi/m.sorular.length, m.renk);
}
function vakitSoruAc(){
  vakitSorusu=true;
  var v=VAKITLER[vakitIx], liste=VAKIT_SORULARI[vakitIx];
  soruHazirla(liste[Math.floor(Math.random()*liste.length)],
              "Vakit sorusu · "+v.ad, v.ad+" vakti girdi", 1, "#d9a441");
}
function cevapla(ev){
  var btn=ev.currentTarget, sec=parseInt(btn.getAttribute("data-i"),10);
  var dgm=$("sikler").querySelectorAll(".sik"),i;
  for(i=0;i<dgm.length;i++){ dgm[i].disabled=true; dgm[i].removeEventListener("click",cevapla); }
  dgm[aktifDogru].classList.add("dogru");
  st.toplam++;
  if(sec===aktifDogru){
    btn.classList.add("dogru");
    st.dogru++; sesDogru();
    $("geribildirim").textContent=vakitSorusu
      ? "Doğru. "+VAKITLER[vakitIx].ad+" vaktinde koşmaya devam."
      : "Doğru. Kalkanla devam ediyorsun.";
  }else{
    btn.classList.add("yanlis");
    st.yanlis++; sesYanlis();
    $("geribildirim").textContent="Doğrusu: "+aktifSoru.o[0];
  }
  var menzilBitti=false, turBitti=false;
  if(!vakitSorusu){
    st.msoru++; st.qi++;
    if(st.qi>=st.sira.length){ st.mi=(st.mi+1)%MENZILLER.length; yeniSira(); menzilBitti=true; }
    turBitti=(st.msoru%10===0);
  }
  var vakitti=vakitSorusu;
  kaydet(); istatistikYaz();
  $("devam").classList.remove("gizli");
  $("devam").onclick=function(){ soruKapat(menzilBitti,turBitti,vakitti); };
}
function soruKapat(menzilBitti,turBitti,vakitti){
  $("soruperde").classList.add("gizli");
  durum="oyun"; kalkan=2.6;
  engeller=engeller.filter(function(e){ return e.x>W*0.55; });
  $("menziladi").textContent=MENZILLER[st.mi].ad;
  if(vakitti){ sesMenzil(); mujde(VAKITLER[vakitIx].ad+" vakti","Yeni vakit başladı"); }
  else if(menzilBitti){ sesMenzil(); mujde("Yeni menzil","→ "+MENZILLER[st.mi].ad); }
  else if(turBitti){ sesMenzil(); mujde((Math.floor(st.msoru/10))+". tur tamam","Toplam doğru: "+st.dogru); }
}
var mujdeZaman=null;
function mujde(b,i){
  $("mujdeb").textContent=b; $("mujdei").textContent=i;
  $("mujde").classList.add("gor");
  clearTimeout(mujdeZaman);
  mujdeZaman=setTimeout(function(){ $("mujde").classList.remove("gor"); },2100);
}

/* ---------------- hadis (1 dakikada bir) ---------------- */
var hIx=Math.floor(Math.random()*HADISLER.length),hSayac=0,hTimer=null;
var CEVRE=2*Math.PI*8;
function hadisYaz(){
  var h=HADISLER[hIx%HADISLER.length];
  $("hmetin").textContent="“"+h[0]+"”";
  $("hkaynak").textContent=h[1];
  hSayac=0;
}
function hadisTik(){
  hSayac++;
  var o=CEVRE*(hSayac/60);
  document.querySelector(".hkb").setAttribute("stroke-dashoffset",(-o).toFixed(2));
  if(hSayac>=60){ hIx++; hadisYaz(); document.querySelector(".hkb").setAttribute("stroke-dashoffset","0"); }
}
function hadisBasla(){ if(!hTimer) hTimer=setInterval(hadisTik,1000); }

/* ---------------- ekranlar ---------------- */
function istatistikYaz(){
  $("ibilinen").textContent=st.dogru;
  $("itoplam").textContent=st.toplam;
  $("imenzil").textContent=(st.mi+1);
  $("menziladi").textContent=MENZILLER[st.mi].ad;
  $("rekor").textContent="REKOR "+st.rekor;
}
function anaEkran(){
  durum="menu";
  $("anaekran").classList.remove("gizli");
  $("duraklat").classList.add("gizli");
  $("soruperde").classList.add("gizli");
  istatistikYaz();
}
function basla(){
  $("anaekran").classList.add("gizli");
  $("duraklat").classList.add("gizli");
  oyunSifirla(); durum="oyun";
}
function ara(){
  if(durum!=="oyun")return;
  durum="ara";
  var h=HADISLER[hIx%HADISLER.length];
  $("duraklatalt").textContent=h[0];
  $("duraklat").classList.remove("gizli");
}
function araBitir(){ $("duraklat").classList.add("gizli"); durum="oyun"; }

/* ---------------- girdi ---------------- */
document.addEventListener("keydown",function(e){
  if(durum==="soru"){
    var n="1234".indexOf(e.key);
    if(n>=0){ var d=$("sikler").querySelectorAll(".sik"); if(d[n]&&!d[n].disabled) d[n].click(); }
    if(e.key==="Enter"&&!$("devam").classList.contains("gizli")) $("devam").click();
    return;
  }
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){
    e.preventDefault();
    if(durum==="menu") basla(); else if(durum==="ara") araBitir(); else zipla();
  }
  if(e.code==="ArrowDown"||e.code==="KeyS"){ e.preventDefault(); egilBasla(); }
  if(e.code==="Escape"||e.code==="KeyP"){ durum==="ara"?araBitir():ara(); }
});
document.addEventListener("keyup",function(e){
  if(e.code==="ArrowDown"||e.code==="KeyS") egilBitir();
});
tuval.addEventListener("pointerdown",function(e){ e.preventDefault(); if(durum==="oyun") zipla(); });
var tz=$("tzipla"),te=$("tegil");
tz.addEventListener("pointerdown",function(e){e.preventDefault();zipla();});
te.addEventListener("pointerdown",function(e){e.preventDefault();egilBasla();});
te.addEventListener("pointerup",egilBitir); te.addEventListener("pointercancel",egilBitir);
te.addEventListener("pointerleave",egilBitir);
if("ontouchstart" in window) document.body.classList.add("dokunmatik");

$("basla").addEventListener("click",basla);
$("devamet").addEventListener("click",araBitir);
$("anayadon").addEventListener("click",anaEkran);
$("sesdugme").addEventListener("click",function(){
  st.ses=st.ses?0:1; kaydet();
  this.textContent=st.ses?"Ses açık":"Ses kapalı";
});
$("sifirla").addEventListener("click",function(){
  if(!confirm("Tüm ilerleme silinsin mi? Soru sırası ve rekor sıfırlanır."))return;
  st=JSON.parse(JSON.stringify(VARSAYILAN)); yeniSira(); kaydet(); istatistikYaz();
});
document.addEventListener("visibilitychange",function(){ if(document.hidden&&durum==="oyun") ara(); });

/* ---------------- başlat ---------------- */
seritKur(); olcek(); yukle();
$("sesdugme").textContent=st.ses?"Ses açık":"Ses kapalı";
istatistikYaz(); hadisYaz(); hadisBasla(); oyunSifirla(); anaEkran();
requestAnimationFrame(function(t){ sonZaman=t; requestAnimationFrame(dongu); });
})();
</script>
