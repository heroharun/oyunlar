<body>

<i class="ky-meteor" aria-hidden="true"></i>
<i class="ky-meteor" aria-hidden="true"></i>

<div class="app" id="app">

  <header class="hud">
    <button class="icon-btn" id="btnMenu" aria-label="Bölümler">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>

    <div class="hud-title">
      <span class="eyebrow" id="lvNo">Bölüm 01</span>
      <h1 id="lvTitle">Kuru Bahçe</h1>
    </div>

    <div class="hud-stats">
      <span class="stat stat--coin" id="statCoin" title="Yıldız tozu">0</span>
      <span class="stat stat--score" id="statScore" title="Puan">0</span>
    </div>

    <button class="icon-btn" id="btnSound" aria-label="Sesi aç veya kapat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5z"/><path class="wave" d="M17 9.5a4 4 0 0 1 0 5"/></svg>
    </button>
  </header>

  <section class="scene" id="scene"></section>

  <div class="ribbon">
    <div class="track"><i id="bar"></i></div>
    <span class="ribbon-text" id="ribbonText">Dünyan uyanmayı bekliyor</span>
  </div>

  <section class="slots" id="slots" aria-label="Bulunacak kelimeler"></section>

  <div class="bonus" id="bonus" hidden>
    <span class="bonus-label">Bonus</span>
    <span class="bonus-list" id="bonusList"></span>
  </div>

  <section class="orbit">
    <div class="current" id="current" aria-live="polite"></div>
    <div class="wheel-wrap">
      <canvas id="wheel" width="320" height="320"></canvas>
      <button class="shuffle" id="btnShuffle" aria-label="Harfleri karıştır">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l8 10h4M4 17h4l3-4M16 7h4M18 5l2 2-2 2M18 15l2 2-2 2"/></svg>
      </button>
    </div>
  </section>

  <nav class="tools" id="tools" aria-label="İpuçları">
    <button class="tool" data-hint="letter"><span class="tool-name">Harf aç</span><span class="tool-cost" data-cost="letter">25</span></button>
    <button class="tool" data-hint="target"><span class="tool-name">Işık tut</span><span class="tool-cost" data-cost="target">40</span></button>
    <button class="tool" data-hint="word"><span class="tool-name">Kelimeyi aç</span><span class="tool-cost" data-cost="word">80</span></button>
  </nav>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sheet" id="sheet" hidden></div>

<!-- MasalPark: Nasıl Oynanır katmanı (oyun koduna dokunmaz) -->
<style>
#mpNasilBtn{position:fixed;left:10px;top:64px;z-index:2147483000;
  width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.55);cursor:pointer;
  background:rgba(20,22,40,.78);color:#ffc94d;font-size:22px;font-weight:900;
  font-family:system-ui,sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.35);transition:opacity .4s}
#mpNasilBtn.mpGizli{opacity:0;pointer-events:none}
#mpNasilKap{position:fixed;inset:0;z-index:2147483001;display:none;align-items:center;justify-content:center;
  background:rgba(10,12,26,.82);padding:20px}
#mpNasilKap.mpAcik{display:flex}
#mpNasilKart{background:#fff;color:#26283a;border-radius:20px;max-width:420px;width:100%;
  padding:22px 20px;font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;
  box-shadow:0 18px 50px rgba(0,0,0,.4);max-height:82vh;overflow-y:auto}
#mpNasilKart h2{font-size:20px;font-weight:900;margin:0 0 12px;color:#1a1c30}
#mpNasilKart p{font-size:14.5px;line-height:1.75;white-space:pre-line;margin:0 0 16px}
#mpNasilKart button{font:inherit;font-weight:800;font-size:15px;width:100%;padding:13px;
  border:none;border-radius:999px;background:#1a1c30;color:#ffc94d;cursor:pointer}
</style>
<button id="mpNasilBtn" aria-label="Nasıl oynanır">?</button>
<div id="mpNasilKap" role="dialog" aria-modal="true">
  <div id="mpNasilKart">
    <h2>❓ NASIL OYNANIR — KELİME YÖRÜNGESİ</h2>
    <p></p>
    <button id="mpNasilTamam">Anladım, Oynayalım!</button>
  </div>
</div>
<script>
(function(){
  var btn=document.getElementById('mpNasilBtn'),
      kap=document.getElementById('mpNasilKap');
  document.querySelector('#mpNasilKart p').textContent='1️⃣ Harfleri parmağınla birleştirerek kelime yaz.\n2️⃣ Bulunan her kelime bölmecedeki boşluklara yerleşir.\n3️⃣ Bonus kelimeler ekstra yıldız kazandırır.\n4️⃣ Takılırsan 💡 ipucu kullan, harfleri karıştırabilirsin.\n💡 Kısa kelimelerden başla, uzunlar sonra görünür.';
  function ac(e){ if(e){e.preventDefault();e.stopPropagation();} kap.classList.add('mpAcik'); }
  function kapat(e){ if(e){e.preventDefault();e.stopPropagation();} kap.classList.remove('mpAcik'); }
  btn.addEventListener('click',ac); btn.addEventListener('touchend',ac);
  document.getElementById('mpNasilTamam').addEventListener('click',kapat);
  document.getElementById('mpNasilTamam').addEventListener('touchend',kapat);
  kap.addEventListener('click',function(e){ if(e.target===kap) kapat(e); });
  /* oyun başlayınca düğme kaybolsun: butona/modala olmayan 2. dokunuştan sonra */
  var sayac=0;
  document.addEventListener('pointerdown',function(e){
    if(e.target.closest('#mpNasilBtn,#mpNasilKap')) return;
    if(++sayac>=2) setTimeout(function(){ btn.classList.add('mpGizli'); },400);
  },true);
  /* sessiz oyuna yumuşak tuş sesi */
  var mpAC=null;
  function mpTik(){ try{ mpAC=mpAC||new (window.AudioContext||window.webkitAudioContext)();
    if(mpAC.state==='suspended')mpAC.resume();
    var t=mpAC.currentTime,o=mpAC.createOscillator(),g=mpAC.createGain();
    o.type='triangle'; o.frequency.value=520;
    g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
    o.connect(g); g.connect(mpAC.destination); o.start(t); o.stop(t+0.09); }catch(e){} }
  document.addEventListener('click',function(e){
    if(e.target.closest('button, .btn, [data-act], a.sec, .sec, .parca')) mpTik();
  },true);
})();
</script>
<script>/* MasalPark: oyun sirasinda ekran uykuya gecmesin */
(function(){var wl=null;function al(){try{if(navigator.wakeLock&&document.visibilityState==='visible')
navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){});}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden)al();});
document.addEventListener('pointerdown',al,{once:true});al();})();</script>
