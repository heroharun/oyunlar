<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<title>GÖKYÜZÜ KARTALI — İHA Görevi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  :root{ --bg:#1a2416; --ink:#e8f0dd; --dim:#93a884; --gold:#ffd166; --red:#ff6b5f; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Avenir Next","Futura","Trebuchet MS",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%;cursor:crosshair}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));pointer-events:none;z-index:2}
  .label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#f2f7e8;font-weight:700;
    text-shadow:0 1px 3px rgba(15,25,10,.85),0 0 8px rgba(15,25,10,.6)}
  .value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;
    text-shadow:0 1px 3px rgba(15,25,10,.85),0 0 10px rgba(15,25,10,.6)}
  #missionBar{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:2;
    background:linear-gradient(180deg,rgba(26,36,22,.95),rgba(20,28,17,.9));
    border:1.5px solid rgba(255,209,102,.4);border-radius:12px;
    padding:9px 18px;font-size:13px;font-weight:700;pointer-events:none;white-space:nowrap;
    box-shadow:0 4px 18px rgba(0,0,0,.35)}
  #missionBar b{color:var(--gold)}
  #missionBar::before{content:'🎖️ ';font-size:12px}
  #toast{position:fixed;top:22%;left:50%;transform:translateX(-50%);font-size:24px;font-weight:900;
    color:var(--gold);opacity:0;pointer-events:none;text-shadow:0 0 14px rgba(255,209,102,.7);
    white-space:nowrap;z-index:3}
  #toast.pop{animation:tp 1.1s ease-out}
  @keyframes tp{0%{opacity:0;transform:translateX(-50%) scale(.5)}
    15%{opacity:1;transform:translateX(-50%) scale(1.08)}82%{opacity:1}100%{opacity:0}}
  .card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:13px;text-align:center;background:rgba(26,36,22,.95);
    transition:opacity .3s;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:10;
    overflow-y:auto;justify-content:safe center}
  .card.hidden{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
  .card.hidden .btn{pointer-events:none}
  .card h1{font-size:clamp(32px,8.5vw,64px);font-weight:900;line-height:1;text-wrap:balance;
    background:linear-gradient(180deg,#e8f0dd,#93c47d);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .card p{max-width:37ch;color:var(--dim);font-size:14px;line-height:1.55}
  .hangar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:400px}
  .drone{background:linear-gradient(180deg,rgba(232,240,221,.1),rgba(232,240,221,.03));
    border:2px solid rgba(232,240,221,.2);border-radius:14px;
    padding:10px 12px;min-width:104px;font-size:12.5px;font-weight:800;line-height:1.45;cursor:pointer;
    color:var(--ink);letter-spacing:.04em;transition:transform .1s,border-color .1s}
  .drone small{display:block;font-size:9.5px;color:var(--dim);font-weight:700;letter-spacing:0}
  .drone.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,209,102,.22),rgba(255,209,102,.08));
    transform:translateY(-2px);box-shadow:0 4px 14px rgba(255,209,102,.2)}
  .drone.lock{pointer-events:none;color:#c3cfb4;
    background:linear-gradient(180deg,rgba(232,240,221,.10),rgba(232,240,221,.04));
    border:2px dashed rgba(232,240,221,.38)}
  .drone.lock small{color:#9db08c}
  .ic{width:13px;height:13px;fill:currentColor;vertical-align:-2px}
  .ic.lk{fill:var(--gold)}
  .skyband{width:min(420px,86vw);height:78px;border-radius:14px;overflow:hidden;flex:none;
    border:1.5px solid rgba(255,209,102,.35);box-shadow:0 6px 22px rgba(0,0,0,.45)}
  .skyband svg{width:100%;height:100%;display:block}
  .btn{font:inherit;font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase;
    color:#1a2416;background:linear-gradient(180deg,#93c47d,#6b9e4f);border:none;border-radius:999px;
    padding:14px 38px;cursor:pointer;box-shadow:0 5px 0 #3d5e2a}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3d5e2a}
  .btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>

<canvas id="cv"></canvas>
<div id="hud">
  <div><div class="label">Puan</div><div class="value" id="scoreEl">0</div></div>
  <div style="text-align:right"><div class="label">Füze</div><div class="value" id="ammoEl">∞</div></div>
</div>
<div id="missionBar"></div>
<div id="toast"></div>

<div class="card" id="intro">
  <div class="skyband" aria-hidden="true"><svg viewBox="0 0 400 90" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4a6f"/><stop offset=".55" stop-color="#c96f4a"/>
      <stop offset="1" stop-color="#f2b552"/></linearGradient></defs>
    <rect width="400" height="90" fill="url(#sbg)"/>
    <circle cx="318" cy="64" r="26" fill="#ffd166" opacity=".35"/>
    <circle cx="318" cy="64" r="17" fill="#ffe29a"/>
    <g fill="#fff" opacity=".85">
      <ellipse cx="86" cy="32" rx="34" ry="9"/><ellipse cx="110" cy="26" rx="20" ry="7"/>
      <ellipse cx="228" cy="48" rx="26" ry="7" opacity=".65"/>
    </g>
    <g fill="#252b38" transform="translate(160 38)">
      <rect x="-30" y="-1.6" width="60" height="3.2" rx="1.6"/>
      <rect x="-4" y="-4.5" width="17" height="5.5" rx="2.7"/>
      <rect x="-19" y="4.5" width="12" height="2.2" rx="1.1"/>
    </g>
    <path d="M0 78 Q80 66 160 76 T400 72 V90 H0 Z" fill="#3d5e2a"/>
  </svg></div>
  <h1>🦅 GÖKYÜZÜ KARTALI</h1>
  <p>Yerli ve milli İHA filon göreve hazır! Kameradan hedefleri izle, dokunarak füzeyi bırak. Hedefler kaçar, saklanır, hızlanır. Görevleri tamamla, yeni İHA'lar hangara katılsın. Sonu yok — gökyüzü senin! 🇹🇷</p>
  <div class="hangar" id="hangar"></div>
  <button class="btn" id="startBtn">Göreve Başla</button>
</div>

<script>
'use strict';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();

let AC=null;
const audio=()=>{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; };
function boom(v=0.4){ try{ const a=audio(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(30,t+0.3);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+0.4);
  const b=a.createBuffer(1,a.sampleRate*0.18,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const n=a.createBufferSource();n.buffer=b;
  const ng=a.createGain();ng.gain.setValueAtTime(v*0.7,t);ng.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  n.connect(ng).connect(a.destination);n.start(t);}catch(e){} }
function whistle(){ try{ const a=audio(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(1400,t);o.frequency.exponentialRampToValueAtTime(300,t+0.55);
  g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.55);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+0.6);}catch(e){} }
function ding(s=0){ try{ const a=audio(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='triangle';o.frequency.value=440*Math.pow(1.12,s+2);
  g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+0.32);}catch(e){} }
const buzz=ms=>{ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} };

/* İHA filosu — Türk göklerinin gururu */
/* cd: İHA'ya özel yeniden doldurma (ms) — füzenin düşmesi beklenmez! */
const DRONES=[
  {name:'TB2',       desc:'efsanenin kendisi', speed:5.5, blast:60, multi:2, cd:900, unlock:0},
  {name:'ANKA',      desc:'yüksek irtifa',     speed:7,   blast:70, multi:3, cd:650, unlock:3},
  {name:'AKSUNGUR',  desc:'ağır yük ustası',   speed:6,   blast:110,multi:3, cd:800, unlock:7},
  {name:'AKINCI',    desc:'taarruzun kalbi',   speed:8.5, blast:95, multi:4, cd:420, unlock:12},
  {name:'KIZILELMA', desc:'jet hızında',       speed:11,  blast:85, multi:6, cd:220, unlock:18},
];
let lastFire=0;
let score=0, missions=0, drone=0;
try{ const s=JSON.parse(localStorage.getItem('iha_save'));
  if(s){ score=s.score||0; missions=s.missions||0; drone=s.drone||0; } }catch(e){}
function save(){ try{ localStorage.setItem('iha_save',JSON.stringify({score,missions,drone})); }catch(e){} }

let targets=[], missiles=[], booms=[], smoke=[], trees=[], state='intro', tick=0, scroll=0;
let mission=null, missionN=0;

/* görevler: her görev bir hedef türü + adet */
const MISSION_TYPES=[
  {k:'jip',   n:5,  txt:'5 hızlı jip durdur',        pts:30},
  {k:'kamp',  n:3,  txt:'3 sığınağı imha et',        pts:60},
  {k:'jip',   n:8,  txt:'8 jip durdur',              pts:30},
  {k:'tank',  n:2,  txt:'2 zırhlıyı durdur',         pts:100},
  {k:'kamp',  n:5,  txt:'5 sığınağı imha et',        pts:60},
  {k:'tank',  n:4,  txt:'4 zırhlıyı durdur',         pts:100},
];
function newMission(){
  const m=MISSION_TYPES[missionN%MISSION_TYPES.length];
  mission={...m, done:0, hard:1+Math.floor(missionN/MISSION_TYPES.length)*0.3};
  updMission();
}
function updMission(){
  document.getElementById('missionBar').innerHTML=
    'GÖREV '+(missions+1)+': '+mission.txt+' — <b>'+mission.done+' / '+mission.n+'</b>';
}
function updHud(){ document.getElementById('scoreEl').textContent=score.toLocaleString('tr-TR');
  document.getElementById('ammoEl').textContent='×'+DRONES[drone].multi; }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

function makeTrees(){ trees=[];
  for(let i=0;i<26;i++) trees.push({x:Math.random()*W,y:Math.random()*H,r:8+Math.random()*14}); }
makeTrees();

/* --- görsel katman yardımcıları (mekaniğe etkisi yok) --- */
const hsh=k=>{ const x=Math.sin(k*127.1+311.7)*43758.5453; return x-Math.floor(x); };
function shade(hex,amt){ const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,Math.min(255,(n>>16)+amt)),
        g2=Math.max(0,Math.min(255,((n>>8)&255)+amt)),
        b=Math.max(0,Math.min(255,(n&255)+amt));
  return 'rgb('+r+','+g2+','+b+')'; }
function rr(x,y,w,h,r){ ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); }
const FIELD_COLS=['#557d3a','#618942','#4b7434','#6a9349','#b3934b','#8a6b45','#5f8a3e','#c2a355'];
let clouds=[], bank=0, bankT=0;
function makeClouds(){ clouds=[];
  for(let i=0;i<4;i++) clouds.push({x:Math.random()*W,y:Math.random()*H,
    r:90+Math.random()*120, vx:0.10+Math.random()*0.12, vy:0.03+Math.random()*0.04}); }
makeClouds();

function drawTerrain(){
  const bandH=Math.max(72,H/7), slant=18, off=scroll*0.5;
  const base=Math.floor((-off-bandH)/bandH)-1;
  for(let k=base;k<=base+Math.ceil(H/bandH)+3;k++){
    const y=k*bandH+off;
    if(y>H+slant||y+bandH<-slant) continue;
    const c=FIELD_COLS[Math.floor(hsh(k)*FIELD_COLS.length)];
    const g=ctx.createLinearGradient(0,y,0,y+bandH);
    g.addColorStop(0,shade(c,16)); g.addColorStop(1,shade(c,-10));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y-slant);
    ctx.lineTo(W,y+bandH-slant+1); ctx.lineTo(0,y+bandH+1); ctx.closePath(); ctx.fill();
    // ekin çizgileri: bazı bantlar sürülmüş tarla
    if(hsh(k+53)<0.45){ ctx.strokeStyle='rgba(0,0,0,.08)'; ctx.lineWidth=3;
      for(let s=10;s<bandH-4;s+=14){ ctx.beginPath();
        ctx.moveTo(0,y+s); ctx.lineTo(W,y+s-slant); ctx.stroke(); } }
    // tarla sınırı ince gölgesi
    ctx.strokeStyle='rgba(28,38,18,.32)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,y+bandH); ctx.lineTo(W,y+bandH-slant); ctx.stroke();
  }
}
function riverPath(X,f1,a1,f2,a2,ph){
  ctx.beginPath();
  for(let sy=-30;sy<=H+30;sy+=24){
    const wy=sy-scroll*0.5;
    const x=X+Math.sin(wy*f1+ph)*a1+Math.sin(wy*f2)*a2;
    sy===-30?ctx.moveTo(x,sy):ctx.lineTo(x,sy);
  }
}
function drawRiver(){
  const X=W*0.76;
  ctx.lineCap='round'; ctx.lineJoin='round';
  riverPath(X,0.006,30,0.017,10,0);
  ctx.strokeStyle='rgba(30,50,40,.35)'; ctx.lineWidth=30; ctx.stroke();
  riverPath(X,0.006,30,0.017,10,0);
  ctx.strokeStyle='#3e6f80'; ctx.lineWidth=24; ctx.stroke();
  riverPath(X,0.006,30,0.017,10,0);
  ctx.strokeStyle='#5b93a3'; ctx.lineWidth=13; ctx.stroke();
  riverPath(X-3,0.006,30,0.017,10,0);
  ctx.strokeStyle='rgba(225,246,250,.35)'; ctx.lineWidth=2.5; ctx.stroke();
}
function drawRoad(){
  const X=W*0.24;
  ctx.lineCap='round'; ctx.lineJoin='round';
  riverPath(X,0.004,36,0.011,8,2);
  ctx.strokeStyle='rgba(45,32,16,.30)'; ctx.lineWidth=18; ctx.stroke();
  riverPath(X,0.004,36,0.011,8,2);
  ctx.strokeStyle='#9a7c50'; ctx.lineWidth=13; ctx.stroke();
  riverPath(X,0.004,36,0.011,8,2);
  ctx.strokeStyle='rgba(70,52,28,.45)'; ctx.lineWidth=1.5;
  ctx.setLineDash([9,13]); ctx.lineDashOffset=-scroll*0.5; ctx.stroke(); ctx.setLineDash([]);
}
function drawCloudShadows(){
  for(const c of clouds){
    c.x+=c.vx; c.y+=c.vy;
    if(c.x-c.r>W){c.x=-c.r; c.y=Math.random()*H;}
    if(c.y-c.r>H){c.y=-c.r;}
    const cg=ctx.createRadialGradient(0,0,c.r*0.15,0,0,c.r);
    cg.addColorStop(0,'rgba(18,28,22,.15)'); cg.addColorStop(1,'rgba(18,28,22,0)');
    ctx.save(); ctx.translate(c.x,c.y); ctx.scale(1,0.6);
    ctx.fillStyle=cg; ctx.fillRect(-c.r,-c.r,c.r*2,c.r*2);
    ctx.restore();
    ctx.save(); ctx.translate(c.x+c.r*0.5,c.y+c.r*0.22); ctx.scale(0.55,0.35);
    ctx.fillStyle=cg; ctx.fillRect(-c.r,-c.r,c.r*2,c.r*2);
    ctx.restore();
  }
}
function drawDrone(){
  bank+=(bankT-bank)*0.08; bankT*=0.97;
  const bob=Math.sin(tick*0.06)*3, dxc=W/2+bank*46, dyc=H-72+bob;
  // yükseklikle yumuşayan yer gölgesi
  const sr=30+bob*1.3;
  const sg=ctx.createRadialGradient(dxc+22,H-26,2,dxc+22,H-26,sr);
  sg.addColorStop(0,'rgba(18,26,10,.30)'); sg.addColorStop(1,'rgba(18,26,10,0)');
  ctx.fillStyle=sg;
  ctx.beginPath(); ctx.ellipse(dxc+22,H-26,sr,sr*0.38,0,0,6.28); ctx.fill();
  ctx.save(); ctx.translate(dxc,dyc); ctx.rotate(bank*0.55);
  // kanat — metal degrade
  let wg=ctx.createLinearGradient(-46,0,46,0);
  wg.addColorStop(0,'#79838c'); wg.addColorStop(0.5,'#ccd5db'); wg.addColorStop(1,'#79838c');
  ctx.fillStyle=wg; rr(-46,-3,92,7,3.5); ctx.fill();
  // gövde
  let fg=ctx.createLinearGradient(-5,0,5,0);
  fg.addColorStop(0,'#939da6'); fg.addColorStop(0.5,'#e2eaef'); fg.addColorStop(1,'#87919a');
  ctx.fillStyle=fg; rr(-4.5,-27,9,45,4.5); ctx.fill();
  // kuyruk
  ctx.fillStyle='#9aa4ad'; rr(-15,13,30,4,2); ctx.fill();
  // burun kamera camı + parlama
  ctx.fillStyle='#557f91';
  ctx.beginPath(); ctx.ellipse(0,-20,3.4,5.2,0,0,6.28); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(-1.1,-22,1.2,2,0,0,6.28); ctx.fill();
  // arka pervane — yarı saydam disk + dönen bulanık pale çizgileri
  ctx.globalAlpha=.14; ctx.fillStyle='#eef4f7';
  ctx.beginPath(); ctx.arc(0,20,13,0,6.28); ctx.fill();
  ctx.globalAlpha=.35; ctx.strokeStyle='#f4f8fa'; ctx.lineWidth=2;
  for(let p=0;p<3;p++){ const a=tick*0.9+p*2.094;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*3,20+Math.sin(a)*3);
    ctx.lineTo(Math.cos(a)*12,20+Math.sin(a)*12); ctx.stroke(); }
  ctx.globalAlpha=1;
  ctx.restore();
}

function spawnTarget(){
  const kinds=['jip','jip','kamp','tank'];
  const want=mission?mission.k:'jip';
  const k=Math.random()<0.5?want:kinds[Math.floor(Math.random()*kinds.length)];
  const fromLeft=Math.random()<0.5;
  const speedMul=(mission?mission.hard:1);
  const t={ k,
    x: fromLeft?-40:W+40,
    y: H*0.2+Math.random()*H*0.65,
    vx: (fromLeft?1:-1)*(k==='jip'?1.8:k==='tank'?0.7:0)*speedMul,
    vy: 0, hp: k==='tank'?2:1, wob:Math.random()*6.28,
    dodge: k==='jip'&&Math.random()<0.5,
  };
  if(k==='kamp'){ t.x=W*0.15+Math.random()*W*0.7; t.vx=0; }
  targets.push(t);
}
function physics(){
  tick++;
  scroll+=0.3;
  if(tick%Math.max(40,90-missions*3)===0 && targets.length<7) spawnTarget();
  for(const t of targets){
    t.wob+=0.05;
    if(t.k==='jip'){ t.vy=Math.sin(t.wob*2)*1.2*(t.dodge?1.8:0.6); }
    t.x+=t.vx; t.y+=t.vy;
    // füzeden kaçınma (zigzag)
    if(t.dodge){ for(const m of missiles){
      if(Math.hypot(m.x-t.x,m.y-t.y)<130){ t.vy+=(t.y>m.y?1:-1)*0.5; } } }
    t.y=Math.max(H*0.15,Math.min(H*0.92,t.y));
  }
  targets=targets.filter(t=>t.x>-80&&t.x<W+80);
  for(const m of missiles){
    const dx=m.tx-m.x, dy=m.ty-m.y, d=Math.hypot(dx,dy);
    if(d<m.speed){ explode(m.tx,m.ty,m.blast); m.dead=true; }
    else { m.x+=dx/d*m.speed; m.y+=dy/d*m.speed; m.trail.push({x:m.x,y:m.y});
      if(m.trail.length>12)m.trail.shift();
      /* egzoz dumanı */
      if(tick%2===0) smoke.push({x:m.x-dx/d*10,y:m.y-dy/d*10,
        vx:(Math.random()-.5)*0.6,vy:(Math.random()-.5)*0.6,life:0.7,r:3+Math.random()*3}); }
  }
  missiles=missiles.filter(m=>!m.dead);
  for(const s of smoke){ s.x+=s.vx; s.y+=s.vy; s.r+=0.25; s.life-=0.03; }
  smoke=smoke.filter(s=>s.life>0);
  for(const b of booms){ b.r+=b.vr; b.life-=0.04; }
  booms=booms.filter(b=>b.life>0);
}
function explode(x,y,r){
  boom(0.45); buzz(30);
  booms.push({x,y,r:10,vr:r/9,life:1,max:r});
  let hit=false;
  for(const t of targets){
    if(Math.hypot(t.x-x,t.y-y)<r+18){
      t.hp--;
      if(t.hp<=0){ t.dead=true; hit=true;
        const pts=t.k==='tank'?100:t.k==='kamp'?60:30;
        score+=pts; updHud();
        if(mission&&t.k===mission.k){ mission.done++;
          updMission();
          if(mission.done>=mission.n){ missionDone(); } }
      }
    }
  }
  targets=targets.filter(t=>!t.dead);
  if(hit) ding(2);
  save();
}
function missionDone(){
  missions++; score+=mission.pts*mission.n; updHud();
  const before=DRONES.filter(d=>missions>=d.unlock).length;
  toast('GÖREV TAMAM! +'+(mission.pts*mission.n)+' 🎖️');
  ding(5); ding(8); buzz([40,60,40]);
  // yeni İHA açıldı mı
  DRONES.forEach((d,i)=>{ if(d.unlock===missions){
    setTimeout(()=>{ toast('🦅 '+d.name+' HANGARA KATILDI!'); ding(10); },1300);
  } });
  missionN++; newMission(); save(); renderHangar();
}

/* dokun = füze bırak */
function fire(x,y){
  if(state!=='play') return;
  const d=DRONES[drone], now=performance.now();
  if(now-lastFire<d.cd || missiles.length>=d.multi) return;   // İHA'ya özel reload
  lastFire=now;
  bankT=Math.max(-0.42,Math.min(0.42,(x-W/2)/(W/2)*0.38)); // görsel: İHA hedefe doğru yatar
  missiles.push({x:W/2,y:H+20,tx:x,ty:y,speed:d.speed,blast:d.blast,trail:[]});
  whistle(); buzz(8);
}
addEventListener('touchstart',e=>{ if(e.target.closest('.card'))return;
  audio(); for(const t of e.changedTouches) fire(t.clientX,t.clientY); },{passive:true});
addEventListener('mousedown',e=>{ if(!e.target.closest('.card')){ audio(); fire(e.clientX,e.clientY); } });

const IC_LOCK='<svg class="ic lk" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 0 1 6 0v3H9z"/></svg>';
const IC_PLANE='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>';
function renderHangar(){
  const h=document.getElementById('hangar'); h.innerHTML='';
  DRONES.forEach((d,i)=>{
    const locked=missions<d.unlock;
    const b=document.createElement('button');
    b.className='drone'+(i===drone?' on':'')+(locked?' lock':'');
    b.innerHTML=locked
      ? IC_LOCK+' '+d.name+'<small>'+d.unlock+' görev gerekli</small>'
      : IC_PLANE+' '+d.name+'<small>'+d.desc+' · füze ×'+d.multi+'</small>';
    b.addEventListener('click',()=>{ if(!locked&&drone!==i){ drone=i; save(); renderHangar(); updHud();
      toast('🦅 '+d.name+' GÖREVDE!'); ding(4); buzz(15); } });
    h.appendChild(b);
  });
}

function draw(){
  // arazi mozaiği: tarla bantları + toprak yol + nehir
  drawTerrain();
  drawRoad();
  drawRiver();
  // ağaçlar: ofset gölge + katmanlı yeşil kümeler (ışık sol üstten)
  for(const t of trees){
    const ty=(t.y+scroll*0.5)%(H+40)-20;
    ctx.fillStyle='rgba(24,34,14,.32)';
    ctx.beginPath(); ctx.ellipse(t.x+t.r*0.55,ty+t.r*0.5,t.r*1.05,t.r*0.48,0,0,6.28); ctx.fill();
    ctx.fillStyle='#2f4a22';
    ctx.beginPath(); ctx.arc(t.x,ty,t.r,0,6.28); ctx.fill();
    ctx.fillStyle='#417033';
    ctx.beginPath(); ctx.arc(t.x-t.r*0.16,ty-t.r*0.16,t.r*0.78,0,6.28); ctx.fill();
    ctx.fillStyle='#5d9346';
    ctx.beginPath(); ctx.arc(t.x-t.r*0.3,ty-t.r*0.3,t.r*0.46,0,6.28); ctx.fill();
    ctx.fillStyle='rgba(255,240,190,.28)';
    ctx.beginPath(); ctx.arc(t.x-t.r*0.42,ty-t.r*0.46,t.r*0.17,0,6.28); ctx.fill();
  }
  // hedefler
  for(const t of targets){
    ctx.save(); ctx.translate(t.x,t.y);
    if(t.k==='jip'){
      ctx.rotate(t.vx>0?0:Math.PI);
      // kontak gölgesi
      ctx.fillStyle='rgba(22,28,10,.38)';
      ctx.beginPath(); ctx.ellipse(4,4,25,15,0,0,6.28); ctx.fill();
      // tekerlekler
      ctx.fillStyle='#22241c';
      for(const wx of [-13,12]){ rr(wx-5,-14,10,5,2); ctx.fill(); rr(wx-5,9,10,5,2); ctx.fill(); }
      // kaporta degradesi
      const jg=ctx.createLinearGradient(0,-10,0,10);
      jg.addColorStop(0,'#83876f'); jg.addColorStop(0.45,'#5e6250'); jg.addColorStop(1,'#42463a');
      ctx.fillStyle=jg; rr(-20,-10,40,20,5); ctx.fill();
      // kaput çizgileri
      ctx.strokeStyle='rgba(0,0,0,.28)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(12,-9); ctx.lineTo(12,9); ctx.moveTo(-14,-9); ctx.lineTo(-14,9); ctx.stroke();
      // ön cam + parlama
      ctx.fillStyle='#7fa9b8'; rr(3,-7,8,14,2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.moveTo(4,-6); ctx.lineTo(9,-6); ctx.lineTo(4,4); ctx.closePath(); ctx.fill();
      // farlar
      ctx.fillStyle='#ffe9a8'; ctx.fillRect(18,-8,2.5,4); ctx.fillRect(18,4,2.5,4);
    } else if(t.k==='tank'){
      ctx.rotate(t.vx>0?0:Math.PI);
      ctx.fillStyle='rgba(22,28,10,.38)';
      ctx.beginPath(); ctx.ellipse(4,4,31,18,0,0,6.28); ctx.fill();
      // paletler
      ctx.fillStyle='#2b3024';
      rr(-26,-14,52,8,3); ctx.fill(); rr(-26,6,52,8,3); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1;
      for(let px=-22;px<26;px+=6){ ctx.beginPath();
        ctx.moveTo(px,-14); ctx.lineTo(px,-6); ctx.moveTo(px,6); ctx.lineTo(px,14); ctx.stroke(); }
      // gövde degradesi
      const tg=ctx.createLinearGradient(0,-8,0,8);
      tg.addColorStop(0,'#5a664c'); tg.addColorStop(0.5,'#46523c'); tg.addColorStop(1,'#333d2b');
      ctx.fillStyle=tg; rr(-24,-8,48,16,3); ctx.fill();
      // kule: radyal ışıklı
      const kg=ctx.createRadialGradient(-3,-3,2,0,0,13);
      kg.addColorStop(0,'#66755a'); kg.addColorStop(1,'#3c4834');
      ctx.fillStyle=kg; ctx.beginPath(); ctx.arc(0,0,12,0,6.28); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(0,0,12,0,6.28); ctx.stroke();
      // namlu + ağız
      const ng2=ctx.createLinearGradient(0,-3,0,3);
      ng2.addColorStop(0,'#4b5540'); ng2.addColorStop(1,'#2e3626');
      ctx.fillStyle=ng2; rr(9,-2.5,27,5,2); ctx.fill();
      ctx.fillStyle='#222a1c'; rr(33,-3.2,4,6.4,1.5); ctx.fill();
      if(t.hp>1){ ctx.save(); if(t.vx<0) ctx.rotate(Math.PI);
        ctx.fillStyle='#ffd166'; ctx.font='bold 12px system-ui'; ctx.textAlign='center';
        ctx.shadowColor='rgba(15,25,10,.8)'; ctx.shadowBlur=4;
        ctx.fillText('×2',0,-22); ctx.restore(); }
    } else {
      // sığınak/çadır: gölge + iki yüz (aydınlık sol, koyu sağ)
      ctx.fillStyle='rgba(22,28,10,.38)';
      ctx.beginPath(); ctx.ellipse(5,16,27,7,0,0,6.28); ctx.fill();
      ctx.fillStyle='#8a7d64';
      ctx.beginPath(); ctx.moveTo(-24,14); ctx.lineTo(0,-18); ctx.lineTo(0,14); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#5d5443';
      ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(24,14); ctx.lineTo(0,14); ctx.closePath(); ctx.fill();
      // tepe ışığı
      ctx.strokeStyle='rgba(255,235,180,.45)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-22,13); ctx.lineTo(0,-17); ctx.stroke();
      // giriş
      ctx.fillStyle='#2c2820';
      ctx.beginPath(); ctx.moveTo(-8,14); ctx.lineTo(0,2); ctx.lineTo(8,14); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  // süzülen bulut gölgeleri
  drawCloudShadows();
  // füzeler
  for(const m of missiles){
    for(let i=1;i<m.trail.length;i++){ ctx.globalAlpha=i/m.trail.length*0.5;
      ctx.strokeStyle='#ffd166'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(m.trail[i-1].x,m.trail[i-1].y);
      ctx.lineTo(m.trail[i].x,m.trail[i].y); ctx.stroke(); }
    ctx.globalAlpha=1;
    const a=Math.atan2(m.ty-m.y,m.tx-m.x);
    ctx.save(); ctx.translate(m.x,m.y); ctx.rotate(a);
    ctx.fillStyle='#d9dde3'; ctx.fillRect(-10,-3,20,6);
    ctx.fillStyle='#ff6b5f'; ctx.beginPath();
    ctx.moveTo(10,-3); ctx.lineTo(16,0); ctx.lineTo(10,3); ctx.fill();
    ctx.restore();
    // hedef işareti
    ctx.strokeStyle='rgba(255,107,95,.8)'; ctx.lineWidth=2;
    const s=8+Math.sin(tick*0.3)*2;
    ctx.strokeRect(m.tx-s,m.ty-s,s*2,s*2);
  }
  // egzoz dumanı
  for(const s of smoke){ ctx.globalAlpha=s.life*0.4; ctx.fillStyle='#d9dde3';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  // patlamalar: çekirdek + şok dalgası halkası
  for(const b of booms){
    ctx.globalAlpha=b.life;
    const bg2=ctx.createRadialGradient(b.x,b.y,2,b.x,b.y,b.r);
    bg2.addColorStop(0,'#ffffff'); bg2.addColorStop(0.25,'#fff3d1');
    bg2.addColorStop(0.55,'#ffd166'); bg2.addColorStop(1,'rgba(255,107,95,0)');
    ctx.fillStyle=bg2;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28); ctx.fill();
    ctx.globalAlpha=b.life*0.7;
    ctx.strokeStyle='#fff3d1'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*1.35,0,6.28); ctx.stroke();
    ctx.globalAlpha=b.life*0.35;
    ctx.strokeStyle='#ffd166'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*1.7,0,6.28); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // oyuncu İHA'sı
  if(state==='play') drawDrone();
  // gün doğumu ışığı (sol üstten) + ufuk vinyeti
  const sun=ctx.createRadialGradient(W*0.08,-H*0.05,0,W*0.08,-H*0.05,Math.max(W,H)*1.15);
  sun.addColorStop(0,'rgba(255,225,160,.20)'); sun.addColorStop(0.5,'rgba(255,210,140,.06)');
  sun.addColorStop(1,'rgba(255,200,120,0)');
  ctx.fillStyle=sun; ctx.fillRect(0,0,W,H);
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.45,W/2,H/2,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(14,24,10,0)'); vg.addColorStop(1,'rgba(12,20,10,.38)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  // kamera çerçevesi
  ctx.strokeStyle='rgba(232,240,221,.25)'; ctx.lineWidth=1.5;
  const cs=26;
  for(const [cx,cy,sx,sy] of [[14,14,1,1],[W-14,14,-1,1],[14,H-14,1,-1],[W-14,H-14,-1,-1]]){
    ctx.beginPath(); ctx.moveTo(cx+sx*cs,cy); ctx.lineTo(cx,cy); ctx.lineTo(cx,cy+sy*cs); ctx.stroke();
  }
  if(state==='play'&&tick%90<45){ ctx.fillStyle='#ff6b5f';
    ctx.beginPath(); ctx.arc(W-30,32,5,0,6.28); ctx.fill();
    ctx.save(); ctx.shadowColor='rgba(15,25,10,.85)'; ctx.shadowBlur=4;
    ctx.fillStyle='rgba(245,250,238,.92)'; ctx.font='700 10px system-ui'; ctx.textAlign='right';
    ctx.fillText('● CANLI — '+DRONES[drone].name.toUpperCase(),W-42,36); ctx.restore(); }
}
function loop(){ if(state==='play') physics(); draw(); requestAnimationFrame(loop); }
function tap(el,fn){ el._fn=fn;
  const fire2=e=>{ e.preventDefault(); e.stopPropagation(); if(el._fn)el._fn(); };
  el.addEventListener('click',fire2); el.addEventListener('touchend',fire2); }
tap(document.getElementById('startBtn'),()=>{ try{audio();}catch(e){}
  if(!mission) newMission();
  state='play'; updHud();
  document.getElementById('intro').classList.add('hidden'); });
newMission(); renderHangar(); updHud(); loop();
</script>
