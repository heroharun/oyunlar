/* ---------- Örgü adımı ---------- */
function braidStep(choice){
  if(!State.braidActive){ toast('Önce bir bölüm seç.'); return; }
  var side=State.braidActive;
  var expect=BRAID_SEQ[State.braidNext%BRAID_SEQ.length];
  if(choice!==expect){
    State.mistakes++;
    var b=$('.bstrand[data-strand="'+choice+'"]');
    if(b){ b.classList.add('wrong'); setTimeout(function(){ b.classList.remove('wrong'); },320); }
    setExpression('uneasy',0.5); toast('Yanıp sönen tutama dokun 👆');
    return;
  }
  State.braidNext++;
  State.braidSide[side]=clamp(State.braidSide[side]+1/8,0,1);
  Audio_.tone(520+State.braidNext*40,0.08,'triangle',0.05);
  var pts=braidCenterline(side,State.braidSide[side]);
  var tip=pts[pts.length-1];
  sparkleBurst(tip[0],tip[1],4);
  nudgeSway(side, side==='L'?-0.35:0.35);
  renderBraids();
  if(State.braidSide[side]>=0.999){
    Audio_.reward(); setExpression('happy',2.4);
    toast((side==='L'?'Sol':'Sağ')+' örgü tamamlandı, lastik takıldı.');
    State.braidNext=0;
    bumpTask('braid1',1);
    var sides=braidSidesFor(State.braidStyle);
    var rest=sides.filter(function(s){ return State.braidSide[s]<0.999; });
    State.braidActive = rest.length? rest[0] : null;
  }
  buildToolPanel(); updateProgress();
}

/* ============================================================
   Puanlama & sonuç
   ============================================================ */
function dominantDyeColorId(){
  var counts={}, best=null, bn=0;
  for(var r in State.dyedRegions){
    var hex=State.dyedRegions[r].color;
    counts[hex]=(counts[hex]||0)+1;
    if(counts[hex]>bn){ bn=counts[hex]; best=hex; }
  }
  if(!best) return State.hairColor;
  var id=null;
  HAIR_COLORS.forEach(function(c){ if(c.hex===best) id=c.id; });
  return id||State.hairColor;
}
function calculateScore(){
  var want = State.customer ? State.customer.want : null;
  var c={};

  /* 1. istek uyumu */
  if(want){
    var pts=0, max=0;
    max+=30; if(want.braid){ if(State.braidStyle===want.braid && braidSidesFor(want.braid).every(function(s){return State.braidSide[s]>=0.99;})) pts+=30; else if(State.braidStyle===want.braid) pts+=14; }
    else { if(!State.braidStyle) pts+=30; else pts+=12; }
    max+=25; if(want.color){ if(dominantDyeColorId()===want.color) pts+=25; else if(Object.keys(State.dyedRegions).length) pts+=8; }
    else { if(Object.keys(State.dyedRegions).length===0) pts+=25; else pts+=14; }
    max+=25; if(want.style){ if(State.hairStyle===want.style) pts+=25; else pts+=10; }
    max+=20; if(want.keepLength){ var lost=1-Math.min(State.hairLengthLeft,State.hairLengthRight); pts+=Math.round(clamp(20-lost*90,0,20)); }
    else { pts += (State.usedTools.cut? 20:8); }
    c.request=Math.round(pts/max*100);
  } else c.request=82;

  c.health = Math.round(clamp(State.hairHealth,0,100));
  c.shine  = Math.round(clamp(State.hairShine,0,100));
  var diff=Math.abs(State.hairLengthLeft-State.hairLengthRight);
  c.symmetry = Math.round(clamp(100-diff*420,0,100));
  /* renk uyumu: boyanan bölge sayısı + teknik tutarlılığı */
  var regions=Object.keys(State.dyedRegions);
  if(!regions.length) c.color=78;
  else {
    var techs={}; regions.forEach(function(r){ techs[State.dyedRegions[r].tech]=1; });
    c.color=Math.round(clamp(100-(Object.keys(techs).length-1)*18,45,100));
  }
  var residue = gridPct('foam',0.35);
  c.clean = Math.round(clamp(100-residue*160-State.hairWetness*70,0,100));
  c.accuracy = Math.round(clamp(100-State.mistakes*9,0,100));
  var accWant = want? (want.acc||0) : 1;
  var accHave = State.accessories.length;
  c.accessory = Math.round(clamp(100-Math.abs(accHave-accWant)*22,20,100));

  var W={request:.22, health:.14, shine:.14, symmetry:.12, color:.10, clean:.10, accuracy:.10, accessory:.08};
  var total=0;
  for(var k in W) total+=c[k]*W[k];
  var score=Math.round(clamp(total,0,100));
  return {score:score, crit:c};
}
var CRIT_LABEL={request:'İstek uyumu', health:'Saç sağlığı', shine:'Parlaklık', symmetry:'Simetri',
  color:'Renk uyumu', clean:'Temizlik', accuracy:'İşlem doğruluğu', accessory:'Aksesuar uyumu'};
function commentFor(score){
  if(score>=90) return pick(['Saçlarım tam istediğim gibi zarif ve parlak oldu!','Aynada kendimi tanıyamadım, harika olmuş.']);
  if(score>=75) return pick(['Çok beğendim, ışıl ışıl görünüyorum.','Beklediğimden güzel oldu, teşekkürler.']);
  if(score>=55) return pick(['Güzel olmuş ama birkaç detay eksik kalmış.','İdare eder, bir dahakine daha iyisini bekliyorum.']);
  return pick(['Açıkçası hayal ettiğim bu değildi.','Biraz daha özen bekliyordum.']);
}
function captureShot(){
  try{
    var clone=SVG.cloneNode(true);
    clone.removeAttribute('id');
    clone.setAttribute('width','360'); clone.setAttribute('height','492');
    var bg=document.createElementNS(SVGNS,'rect');
    bg.setAttribute('x',String(VIEW_X)); bg.setAttribute('y',String(VIEW_Y));
    bg.setAttribute('width',String(VIEW_W)); bg.setAttribute('height',String(VIEW_H));
    bg.setAttribute('fill','#f6ece6');
    clone.insertBefore(bg, clone.childNodes[1]||null);
    var str=new XMLSerializer().serializeToString(clone);
    if(str.indexOf('xmlns=')<0) str=str.replace('<svg','<svg xmlns="'+SVGNS+'"');
    return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str);
  }catch(e){ return null; }
}

  for(var i=0;i<14;i++) spawn('coin', 300+rnd(-60,60), 300+rnd(-30,30), {vy:rnd(-3,-1.2), vx:rnd(-1,1), r:rnd(5,9), decay:.012});

    '<path d="M79 48 q6 30 0 52 q-8 -14 -6 -34 Z" fill="#3a2620"/>'+
    '<ellipse cx="42" cy="56" rx="5" ry="6" fill="#3a2620"/><ellipse cx="62" cy="56" rx="5" ry="6" fill="#3a2620"/>'+
    '<circle cx="40.4" cy="54" r="1.8" fill="#fff"/><circle cx="60.4" cy="54" r="1.8" fill="#fff"/>'+
    '<path d="M46 70 q6 4 12 0" stroke="#c96f7d" stroke-width="2.4" fill="none" stroke-linecap="round"/>'+
    '<ellipse cx="36" cy="64" rx="5" ry="2.6" fill="#f0a6ab" opacity=".5"/>'+
    '<ellipse cx="68" cy="64" rx="5" ry="2.6" fill="#f0a6ab" opacity=".5"/></svg>';
}
function showBrief(){
  var c=pick(CUSTOMERS);
  State.pendingCustomer=c;
  $('#briefAv').innerHTML=avatarSVG();
  $('#briefTag').textContent=c.tag;
  $('#briefName').textContent=c.name;
  $('#briefWish').textContent='“'+c.wish+'”';
  $('#refThumb').innerHTML=refThumbSVG(c.ref);
  $('#refName').textContent=c.refName;
  $('#refDesc').textContent=c.refDesc;
  showScreen('brief');
}

/* ============================================================
   Olay bağlama & başlatma
   ============================================================ */
function bindUI(){
  /* HUD */
  $('#btnHome').innerHTML=icon('home');
  $('#btnSettings').innerHTML=icon('gear');
  $('#sheetClose').innerHTML=icon('close');
  $('#btnUndo').innerHTML=icon('undo');
  $('#btnRedo').innerHTML=icon('redo');
  $('.hud-stat.coin .ic').outerHTML=icon('coin');
  $('.hud-stat.gem .ic').outerHTML=icon('gem');
  $('#logoMark').innerHTML='<svg viewBox="0 0 48 48" fill="none" stroke="#8d6a74" stroke-width="1.6" stroke-linecap="round"><path d="M24 6c-8 0-13 6-13 13 0 9 5 14 5 23"/><path d="M24 6c8 0 13 6 13 13 0 9-5 14-5 23"/><path d="M24 12c-4 4-6 9-6 14M24 12c4 4 6 9 6 14"/><circle cx="24" cy="40" r="2.6" fill="#d8b473" stroke="none"/></svg>';

  $('#btnHome').addEventListener('click',function(){ Audio_.click(); showScreen('menu'); });
  $('#btnSettings').addEventListener('click',function(){ Audio_.click(); openSheet('settings'); });
  $('#btnSound').addEventListener('click',function(){
    State.soundEnabled=!State.soundEnabled; saveGame(); updateHUD();
    if(State.soundEnabled){ Audio_.init(); Audio_.click(); }
    toast(State.soundEnabled?'Ses açık':'Ses kapalı');
  });
  $('#sheetClose').addEventListener('click',function(){ Audio_.click(); closeSheet(); });
  $('#sheet').addEventListener('click',function(e){ if(e.target===this) closeSheet(); });

  /* Menü */
  var tiles=[['salon','Salon','salon'],['catalog','Saç Kataloğu','catalog'],['customers','Müşteriler','people'],
             ['collection','Koleksiyon','collection'],['tasks','Günlük Görevler','tasks'],['settings','Ayarlar','gear']];
  $('#menuGrid').innerHTML=tiles.map(function(t){
    return '<button class="menu-tile" data-sheet="'+t[0]+'">'+icon(t[2])+t[1]+'</button>';
  }).join('');
  $('#menuGrid').addEventListener('click',function(e){
    var b=e.target.closest('[data-sheet]'); if(!b) return;
    Audio_.init(); Audio_.click(); openSheet(b.getAttribute('data-sheet'));
  });
  $('#btnNewCustomer').addEventListener('click',function(){ Audio_.init(); Audio_.click(); showBrief(); });
  $('#btnFreeMode').addEventListener('click',function(){ Audio_.init(); Audio_.click(); initializeGame('free'); });

  /* Brifing */
  $('#btnBriefBack').addEventListener('click',function(){ Audio_.click(); showScreen('menu'); });
  $('#btnStart').addEventListener('click',function(){
    Audio_.click();
    initializeGame('customer');
    State.customer=State.pendingCustomer||State.customer;
  });

  /* Sheet içi tıklamalar */
  $('#sheetBody').addEventListener('click',function(e){
    var th=e.target.closest('[data-theme]');
    if(th){
      var id=th.getAttribute('data-theme');
      if(State.unlockedItems.indexOf(id)<0){ toast('Bu tema henüz kilitli.'); Audio_.bad(); return; }
      State.theme=id; document.body.setAttribute('data-theme',id); saveGame();
      Audio_.good(); openSheet('salon');
      return;
    }
    var act=e.target.closest('[data-act]');
    if(!act) return;
    var a=act.getAttribute('data-act');
    if(a==='sound'){
      State.soundEnabled=!State.soundEnabled; saveGame(); updateHUD(); openSheet('settings');
      if(State.soundEnabled) Audio_.click();
    }
    if(a==='reset'){
      if(act.dataset.confirm){ resetGame(); closeSheet(); toast('Tüm veriler sıfırlandı.'); }
      else { act.dataset.confirm='1'; act.textContent='Emin misin?'; }
    }
  });

  /* Aşama rayı */
  $('#stageRail').addEventListener('click',function(e){
    var b=e.target.closest('[data-stage]'); if(!b) return;
    var i=+b.getAttribute('data-stage');
    if(i>State.currentStage && !canAdvance()){ toast('Önce bu aşamayı tamamla.'); Audio_.bad(); return; }
    gotoStage(i);
  });

  /* Araç paneli — delege dinleyici */
  $('#panelScroll').addEventListener('click',function(e){
    var t=e.target.closest('[data-tool]');
    if(t){ State.selectedTool=t.getAttribute('data-tool'); Audio_.click(); buildToolPanel(); return; }
    var c=e.target.closest('[data-color]');
    if(c){ State.dyeColor=c.getAttribute('data-color'); State.selectedTool='dyebrush'; Audio_.click(); buildToolPanel(); return; }
    var tech=e.target.closest('[data-tech]');
    if(tech){ State.dyeTechnique=tech.getAttribute('data-tech'); Audio_.click(); buildToolPanel(); return; }
    var st=e.target.closest('[data-style]');
    if(st){
      State.hairStyle=st.getAttribute('data-style');
      var m=null; STYLE_MODELS.forEach(function(x){ if(x.id===State.hairStyle) m=x; });
      applyStyleWaves(m); Audio_.click(); buildToolPanel(); renderHair(); return;
    }
    var br=e.target.closest('[data-braid]');
    if(br){
      var bid=br.getAttribute('data-braid');
      pushUndo();
      if(State.braidStyle===bid){ State.braidStyle=null; State.braidSide={L:0,R:0}; State.braidActive=null; }
      else { State.braidStyle=bid; State.braidSide={L:0,R:0}; State.braidNext=0; State.braidActive=braidSidesFor(bid)[0]; }
      Audio_.click(); renderHair(); buildToolPanel(); updateProgress(); return;
    }
    var bs=e.target.closest('[data-bside]');
    if(bs){ State.braidActive=bs.getAttribute('data-bside'); State.braidNext=0; Audio_.click(); buildToolPanel(); return; }
    var sd=e.target.closest('[data-strand]');
    if(sd){ braidStep(sd.getAttribute('data-strand')); return; }
    var bu=e.target.closest('[data-bun]');
    if(bu){
      pushUndo();
      var bv=bu.getAttribute('data-bun');
      State.bunStyle = (bv==='none'||State.bunStyle===bv)? null : bv;
      Audio_.click(); renderHair(); buildToolPanel(); return;
    }
    var ac=e.target.closest('[data-acc]');
    if(ac){ State.accPending=ac.getAttribute('data-acc'); State.accSelected=null; Audio_.click(); buildToolPanel(); toast('Şimdi saçın üzerine dokun.'); return; }
    var act=e.target.closest('[data-act]');
    if(act){
      var a=act.getAttribute('data-act');
      if(a==='even') Stage.evenSides();
      if(a==='resetcut') Stage.resetCut();
      if(a==='undo') doUndo();
      if(a==='redo') doRedo();
      if(a==='heat'){ State.heatProtect=!State.heatProtect; Audio_.click(); buildToolPanel(); toast(State.heatProtect?'Isı koruyucu uygulandı.':'Isı koruyucu kapatıldı.'); }
      if(a==='shoot') takePhoto();
      if(a==='accdel'){
        pushUndo();
        State.accessories.splice(State.accSelected,1); State.accSelected=null;
        renderAccessories(); buildToolPanel(); updateProgress();
      }
      return;
    }
  });

  /* Alt bar */
  $('#btnNext').addEventListener('click',function(){ Audio_.click(); nextStage(); });
  $('#btnUndo').addEventListener('click',doUndo);
  $('#btnRedo').addEventListener('click',doRedo);

  /* Mobil panel kolu */
  $('#panelHandle').addEventListener('click',function(){
    var col=$('#toolPanel').classList.toggle('collapsed');
    document.body.classList.toggle('panel-min', col);
    setTimeout(function(){ if(typeof resizeFX==='function') resizeFX(); }, 360);
    Audio_.click();
  });

  /* Sonuç ekranı */
  $('#resultCard').addEventListener('click',function(e){
    var b=e.target.closest('[data-act]'); if(!b) return;
    var a=b.getAttribute('data-act');
    Audio_.click();
    if(a==='again') showBrief();
    if(a==='menu') showScreen('menu');
  });

  /* Klavye kısayolları (masaüstü) */
  window.addEventListener('keydown',function(e){
    if(State.currentScreen!=='game') return;
    if(e.key==='ArrowRight'){ nextStage(); }
    if(e.key==='ArrowLeft'){ gotoStage(State.currentStage-1); }
    if((e.ctrlKey||e.metaKey) && e.key==='z'){ e.preventDefault(); doUndo(); }
    if((e.ctrlKey||e.metaKey) && e.key==='y'){ e.preventDefault(); doRedo(); }
  });

  window.addEventListener('resize',function(){ resizeFX(); });
  window.addEventListener('orientationchange',function(){ setTimeout(resizeFX,200); });
}

/* ---------- Başlangıç ---------- */
function boot(){
  loadGame();
  updateHUD();
  buildScene();
  buildGrid();
  bindUI();
  bindInput();
  updateMeters();
  renderStageRail();
  resizeFX();
  showScreen('menu');
  requestAnimationFrame(function(ts){ Anim.last=ts; requestAnimationFrame(tick); });
  /* ilk kullanıcı etkileşimine kadar ses başlatılmaz */
  var once=function(){ Audio_.init(); window.removeEventListener('pointerdown',once); window.removeEventListener('keydown',once); };
  window.addEventListener('pointerdown',once);
  window.addEventListener('keydown',once);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();

})();

</script>
