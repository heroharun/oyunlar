<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f7efe8">
<title>Helal Dairede Kuaför Salonum — Müslim TR</title>
<meta name="description" content="Yıkama, bakım, kurutma, tarama, kesim, boya, şekillendirme, örgü ve aksesuar: 10 aşamalı gerçek kuaför salonu oyunu. Reklamsız, üyeliksiz, çevrimdışı çalışır.">
<meta name="theme-color" content="#f6ece6">
<meta property="og:type" content="website">
<meta property="og:title" content="Helal Dairede Kuaför Salonum">
<meta property="og:description" content="Kendi salonunu işlet: yıka, kes, boya, şekillendir, ör. 10 aşama, 14 renk, 8 boyama tekniği. Reklamsız ve üyeliksiz.">
<meta property="og:site_name" content="Müslim TR">
<style>
/* ============================================================
   HELAL DAİREDE KUAFÖR SALONUM — tek dosya, bağımlılıksız
   Bölüm 1: Tasarım jetonları (tokens)
   ============================================================ */
:root{
  --cream:#f8f1e9;
  --cream-2:#efe3d8;
  --powder:#f0c7cd;
  --powder-deep:#d99aa6;
  --lavender:#cfc3e6;
  --gold:#d8b473;
  --gold-deep:#a9813f;
  --ink:#3a2b2b;
  --ink-soft:#6b5654;
  --white:#fffdfb;
  --glass:rgba(255,253,251,.62);
  --glass-strong:rgba(255,253,251,.86);
  --line:rgba(58,43,43,.12);
  --shadow-s:0 2px 10px rgba(88,62,60,.10);
  --shadow-m:0 10px 30px rgba(88,62,60,.16);
  --shadow-l:0 24px 60px rgba(88,62,60,.22);
  --r-s:12px; --r-m:18px; --r-l:28px; --r-pill:999px;
  --font-display:"Cochin","Optima","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg-a:#f7efe8; --bg-b:#e9d9d2; --bg-c:#d8c6dd;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
/* Salon temaları */
body[data-theme="sakura"]{ --bg-a:#fdeef1; --bg-b:#f6d9de; --bg-c:#e7c9dc; --powder:#f4b9c4; --lavender:#e0c4d8; }
body[data-theme="midnight"]{
  --bg-a:#2b2436; --bg-b:#3a3049; --bg-c:#4a3a52;
  --cream:#efe8f2; --cream-2:#d9cfe2; --ink:#f3ecf3; --ink-soft:#c9bcd1;
  --glass:rgba(52,43,66,.66); --glass-strong:rgba(58,48,73,.9);
  --line:rgba(255,255,255,.14);
  --gold:#e5c98e;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0; padding:0}
body{
  font-family:var(--font-ui);
  color:var(--ink);
  background:
    radial-gradient(120% 80% at 20% 0%, var(--bg-a) 0%, transparent 60%),
    radial-gradient(120% 90% at 90% 20%, var(--bg-c) 0%, transparent 55%),
    linear-gradient(160deg, var(--bg-a), var(--bg-b) 60%, var(--bg-c));
  background-attachment:fixed;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
}
button{font-family:inherit; color:inherit; border:0; background:none; cursor:pointer}
:focus-visible{outline:2px solid var(--gold-deep); outline-offset:2px; border-radius:8px}
.hidden{display:none !important}

/* ---------- Uygulama kabuğu ---------- */
#app{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  padding:0;
}
.shell{
  position:relative;
  width:100%; height:100%;
  max-width:1180px; max-height:820px;
  background:linear-gradient(170deg, rgba(255,253,251,.5), rgba(255,253,251,.18));
  overflow:hidden;
  display:flex; flex-direction:column;
}
@media (min-width:900px) and (min-height:660px){
  #app{padding:18px}
  .shell{border-radius:var(--r-l); box-shadow:var(--shadow-l); border:1px solid rgba(255,255,255,.5)}
}

/* ---------- Ortak bileşenler ---------- */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(14px) saturate(1.25);
  backdrop-filter:blur(14px) saturate(1.25);
  border:1px solid rgba(255,255,255,.45);
  box-shadow:var(--shadow-s);
}
body[data-theme="midnight"] .glass{border-color:rgba(255,255,255,.14)}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 20px; border-radius:var(--r-pill);
  font-size:14px; letter-spacing:.02em; font-weight:600;
  background:var(--glass-strong); color:var(--ink);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:var(--shadow-s);
  transition:transform .16s cubic-bezier(.2,.9,.25,1.1), box-shadow .16s, opacity .16s;
}
.btn:active{transform:scale(.955)}
.btn[disabled]{opacity:.42; pointer-events:none}
.btn.primary{
  background:linear-gradient(135deg,var(--powder),var(--lavender));
  color:#4a2f36; border-color:rgba(255,255,255,.7); box-shadow:var(--shadow-m);
}
body[data-theme="midnight"] .btn.primary{color:#2b2436}
.btn.ghost{background:transparent; box-shadow:none; border-color:var(--line)}
.btn.small{padding:8px 14px; font-size:12.5px}
.icon-btn{
  width:38px; height:38px; border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--glass-strong); border:1px solid rgba(255,255,255,.55);
  box-shadow:var(--shadow-s); transition:transform .16s;
}
.icon-btn:active{transform:scale(.9)}
.ic{width:20px; height:20px; display:block; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.ic.fill{fill:currentColor; stroke:none}
.eyebrow{
  font-size:10.5px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--ink-soft); font-weight:700;
}
h1,h2,h3{font-family:var(--font-display); font-weight:500; margin:0; letter-spacing:.01em}

/* ---------- HUD ---------- */
#hud{
  position:relative; z-index:30;
  display:flex; align-items:center; gap:8px;
  padding:calc(8px + var(--safe-t)) 12px 8px;
}
.hud-stat{
  display:flex; align-items:center; gap:6px;
  padding:6px 12px 6px 8px; border-radius:var(--r-pill);
  font-size:13px; font-weight:700; letter-spacing:.01em;
  background:var(--glass); border:1px solid rgba(255,255,255,.5);
  box-shadow:var(--shadow-s);
}
.hud-stat .ic{width:16px;height:16px}
.hud-stat.coin{color:var(--gold-deep)}
body[data-theme="midnight"] .hud-stat.coin{color:var(--gold)}
.hud-stat.gem{color:#8a7ab5}
.hud-level{display:flex; flex-direction:column; gap:3px; min-width:96px}
.hud-level .lvl-row{display:flex; justify-content:space-between; font-size:10.5px; font-weight:700; color:var(--ink-soft)}
.xpbar{height:5px; border-radius:99px; background:rgba(58,43,43,.14); overflow:hidden}
.xpbar > i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--gold),var(--powder-deep)); transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hud-spacer{flex:1}

/* ---------- Ekranlar ---------- */
.screen{position:absolute; inset:0; display:flex; flex-direction:column; z-index:10}
.screen[hidden]{display:none}
.fade-in{animation:fadeIn .42s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0; transform:translateY(18px) scale(.985)} to{opacity:1; transform:none}}

/* ---------- Menü ---------- */
#screen-menu{align-items:center; justify-content:center; padding:20px; overflow:auto}
.menu-inner{width:min(560px,100%); text-align:center; padding-bottom:20px}
.logo-mark{
  width:96px; height:96px; margin:0 auto 14px; border-radius:50%;
  display:grid; place-items:center;
  background:radial-gradient(circle at 35% 30%, #fff, var(--powder) 55%, var(--lavender));
  box-shadow:var(--shadow-m), inset 0 -6px 18px rgba(255,255,255,.7);
  animation:floaty 6s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.logo-mark svg{width:54px;height:54px}
.logo-title{font-family:var(--font-display); font-size:clamp(34px,8vw,52px); line-height:1; letter-spacing:.02em}
.logo-title em{font-style:italic; color:var(--gold-deep)}
body[data-theme="midnight"] .logo-title em{color:var(--gold)}
.logo-sub{margin:10px 0 26px; font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:var(--ink-soft)}
.menu-actions{display:flex; flex-direction:column; gap:10px; align-items:center}
.menu-actions .btn{width:min(300px,100%); padding:14px 22px; font-size:15px}
.menu-grid{
  margin-top:22px; display:grid; grid-template-columns:repeat(3,1fr); gap:9px;
}
.menu-tile{
  padding:13px 8px; border-radius:var(--r-m); text-align:center;
  background:var(--glass); border:1px solid rgba(255,255,255,.5);
  box-shadow:var(--shadow-s); transition:transform .18s, box-shadow .18s;
  font-size:11.5px; font-weight:600; color:var(--ink-soft);
}
.menu-tile:active{transform:translateY(2px) scale(.97)}
.menu-tile .ic{width:22px;height:22px;margin:0 auto 7px; color:var(--ink)}

/* ---------- Sayfa panelleri (salon, katalog vb.) ---------- */
.sheet{position:absolute; inset:0; z-index:40; display:flex; flex-direction:column; background:rgba(30,20,25,.28); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px)}
.sheet[hidden]{display:none}
.sheet-card{
  margin:auto; width:min(620px,calc(100% - 24px)); max-height:min(84%,700px);
  display:flex; flex-direction:column; border-radius:var(--r-l);
  background:var(--glass-strong);
  -webkit-backdrop-filter:blur(18px) saturate(1.3); backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid rgba(255,255,255,.6); box-shadow:var(--shadow-l);
  overflow:hidden; animation:rise .38s cubic-bezier(.2,.8,.2,1) both;
}
.sheet-head{display:flex; align-items:center; gap:10px; padding:16px 18px 12px}
.sheet-head h2{font-size:22px; flex:1}
.sheet-body{padding:0 18px 18px; overflow:auto; -webkit-overflow-scrolling:touch}
.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px}
.mini-card{
  padding:12px; border-radius:var(--r-m); background:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.6); box-shadow:var(--shadow-s);
  text-align:left; transition:transform .16s;
}
body[data-theme="midnight"] .mini-card{background:rgba(255,255,255,.08)}
.mini-card:active{transform:scale(.975)}
.mini-card.sel{border-color:var(--gold); box-shadow:0 0 0 2px rgba(216,180,115,.5), var(--shadow-s)}
.mini-card h4{margin:0 0 4px; font-family:var(--font-display); font-size:15px; font-weight:600}
.mini-card p{margin:0; font-size:11.5px; color:var(--ink-soft); line-height:1.45}
.swatch-row{display:flex; gap:5px; margin-top:9px}
.swatch-row i{width:16px;height:16px;border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.locked{opacity:.5}
.task-row{display:flex; align-items:center; gap:12px; padding:12px; border-radius:var(--r-m); background:rgba(255,255,255,.45); margin-bottom:9px; border:1px solid rgba(255,255,255,.5)}
body[data-theme="midnight"] .task-row{background:rgba(255,255,255,.07)}
.task-row .t-txt{flex:1; font-size:13px; font-weight:600}
.task-row .t-txt small{display:block; font-weight:500; color:var(--ink-soft); font-size:11px; margin-top:3px}
.task-bar{height:5px; border-radius:99px; background:rgba(58,43,43,.13); margin-top:6px; overflow:hidden}
.task-bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--powder-deep),var(--gold)); border-radius:99px}
.task-done{color:var(--gold-deep); font-size:20px}
.row-set{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 2px; border-bottom:1px solid var(--line); font-size:13.5px; font-weight:600}
.row-set:last-child{border-bottom:0}
.toggle{width:48px; height:28px; border-radius:99px; background:rgba(58,43,43,.18); position:relative; transition:background .22s; flex:none}
.toggle i{position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:var(--shadow-s); transition:transform .22s cubic-bezier(.2,.9,.25,1.1)}
.toggle.on{background:linear-gradient(135deg,var(--powder-deep),var(--lavender))}
.toggle.on i{transform:translateX(20px)}

/* ---------- Müşteri brifing ---------- */
#screen-brief{align-items:center; justify-content:center; padding:18px; overflow:auto}
.brief-card{width:min(520px,100%); border-radius:var(--r-l); padding:22px; text-align:center}
.brief-av{
  width:104px;height:104px;border-radius:50%; margin:0 auto 12px; overflow:hidden;
  background:linear-gradient(160deg,#fff,var(--powder));
  box-shadow:var(--shadow-m); border:2px solid rgba(255,255,255,.8);
}
.brief-av svg{width:100%;height:100%;display:block}
.brief-name{font-family:var(--font-display); font-size:27px; margin-bottom:2px}
.brief-quote{
  margin:14px 0 16px; font-size:14.5px; line-height:1.6; color:var(--ink-soft);
  font-family:var(--font-display); font-style:italic;
}
.ref-card{
  display:flex; align-items:center; gap:12px; text-align:left;
  padding:11px; border-radius:var(--r-m); background:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.6); margin-bottom:18px;
}
body[data-theme="midnight"] .ref-card{background:rgba(255,255,255,.08)}
.ref-thumb{width:62px;height:78px;border-radius:12px;overflow:hidden;background:var(--cream-2); flex:none}
.ref-thumb svg{width:100%;height:100%;display:block}
.ref-card h4{margin:0 0 3px; font-family:var(--font-display); font-size:16px; font-weight:600}
.ref-card p{margin:0; font-size:11.5px; color:var(--ink-soft); line-height:1.45}

/* ---------- Oyun ekranı ---------- */
#screen-game{flex-direction:column}
.game-grid{flex:1; display:flex; min-height:0; position:relative}
/* Aşama rayı */
#stageRail{
  width:150px; flex:none; padding:8px 10px 8px 12px; overflow:auto; display:flex; flex-direction:column; gap:5px;
}
.stg{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:var(--r-pill);
  font-size:12px; font-weight:600; color:var(--ink-soft); text-align:left;
  border:1px solid transparent; transition:background .2s, color .2s, transform .16s;
}
.stg .ic{width:17px;height:17px; flex:none}
.stg .num{font-size:9.5px; opacity:.6; font-variant-numeric:tabular-nums; width:12px}
.stg.cur{background:var(--glass-strong); color:var(--ink); border-color:rgba(255,255,255,.6); box-shadow:var(--shadow-s)}
.stg.done{color:var(--gold-deep)}
body[data-theme="midnight"] .stg.done{color:var(--gold)}
.stg:active{transform:scale(.97)}

/* Sahne */
#stageWrap{flex:1; position:relative; min-width:0; display:flex; align-items:center; justify-content:center}
#sceneBox{position:absolute; inset:0}
#char{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none}
#fx{position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none}
#hitLayer{position:absolute; inset:0; touch-action:none; cursor:crosshair}
#brushRing{position:absolute; width:0; height:0; pointer-events:none; z-index:5;
  border-radius:50%; border:2.5px solid rgba(255,255,255,.9);
  box-shadow:0 0 0 2px rgba(0,0,0,.14), inset 0 0 22px rgba(255,255,255,.30);
  transition:width .12s ease, height .12s ease, margin .12s ease}
#brushRing.hidden{display:none}
#brushRing.on{border-color:rgba(255,255,255,1); box-shadow:0 0 0 2px rgba(0,0,0,.2), inset 0 0 26px rgba(255,255,255,.5), 0 0 16px rgba(255,255,255,.5)}
#coach{position:absolute; width:0; height:0; pointer-events:none; z-index:6}
#coach.hidden{display:none}
#coach i{position:absolute; left:-38px; top:-38px; width:76px; height:76px; border-radius:50%;
  border:3px solid rgba(255,255,255,.95); box-shadow:0 0 0 3px rgba(0,0,0,.10), 0 6px 18px rgba(0,0,0,.18);
  background:radial-gradient(circle, rgba(255,255,255,.34), rgba(255,255,255,0) 70%);
  animation:coachRing 1.6s ease-in-out infinite}
#coach b{position:absolute; left:-13px; top:-6px; width:26px; height:34px; border-radius:13px 13px 10px 10px;
  background:linear-gradient(180deg,#fff,#f0dcd0); border:2px solid rgba(90,60,50,.45);
  box-shadow:0 4px 10px rgba(0,0,0,.22); animation:coachMove 1.6s ease-in-out infinite}
.bstrand.next{animation:strandPulse 1.1s ease-in-out infinite}
@keyframes strandPulse{0%,100%{transform:scale(1); box-shadow:0 0 0 0 rgba(216,180,115,.65)} 50%{transform:scale(1.06); box-shadow:0 0 0 10px rgba(216,180,115,0)}}
@keyframes coachRing{0%,100%{transform:scale(.72); opacity:.35} 50%{transform:scale(1); opacity:.95}}
@keyframes coachMove{0%{transform:translate(0,-26px) scale(.94)} 50%{transform:translate(0,26px) scale(1)} 100%{transform:translate(0,-26px) scale(.94)}}
body[data-coach="side"] #coach b{animation-name:coachSide}
@keyframes coachSide{0%{transform:translate(-26px,0)} 50%{transform:translate(26px,0)} 100%{transform:translate(-26px,0)}}
body[data-coach="tap"] #coach b{animation-name:coachTap}
@keyframes coachTap{0%,100%{transform:scale(.86)} 50%{transform:scale(1.16)}}
.salon-vignette{
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(70% 60% at 50% 38%, rgba(255,255,255,.35), transparent 62%),
             radial-gradient(120% 100% at 50% 120%, rgba(88,62,60,.18), transparent 55%);
}
/* Sahne üstü rozetler */
.scene-top{position:absolute; top:8px; left:50%; transform:translateX(-50%); display:flex; gap:7px; z-index:5; pointer-events:none}
.badge{
  padding:6px 12px; border-radius:var(--r-pill); font-size:11.5px; font-weight:700;
  background:var(--glass); border:1px solid rgba(255,255,255,.5); box-shadow:var(--shadow-s);
  white-space:nowrap;
}
.meters{position:absolute; left:10px; top:10px; z-index:5; display:flex; flex-direction:column; gap:7px; pointer-events:none}
.meter{display:flex; align-items:center; gap:7px; font-size:10px; font-weight:700; color:var(--ink-soft)}
.meter span{width:52px}
.meter .bar{width:70px; height:5px; border-radius:99px; background:rgba(58,43,43,.15); overflow:hidden}
.meter .bar > i{display:block; height:100%; border-radius:99px; transition:width .35s}
.m-health > i{background:linear-gradient(90deg,#b7d6a8,#7fb069)}
.m-shine > i{background:linear-gradient(90deg,#f6e2b3,var(--gold))}
.m-soft > i{background:linear-gradient(90deg,#e7cfe6,var(--lavender))}
.heat-wrap{position:absolute; right:10px; top:10px; z-index:5; pointer-events:none}
.heat{width:8px; height:96px; border-radius:99px; background:rgba(58,43,43,.14); overflow:hidden; position:relative; margin:0 auto}
.heat > i{position:absolute; bottom:0; left:0; right:0; background:linear-gradient(0deg,#f2c66a,#e2705a); border-radius:99px; transition:height .2s}
.heat-wrap small{display:block; text-align:center; font-size:9px; font-weight:700; color:var(--ink-soft); margin-top:5px; letter-spacing:.1em}

/* Araç paneli */
#toolPanel{
  width:212px; flex:none; padding:8px 12px 8px 6px; overflow:auto;
  display:flex; flex-direction:column; gap:10px;
}
.panel-card{border-radius:var(--r-m); padding:11px}
.panel-card > .eyebrow{display:block; margin-bottom:9px}
.tool-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px}
.tool{
  aspect-ratio:1/1; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.6);
  font-size:8.5px; font-weight:700; color:var(--ink-soft); text-align:center; line-height:1.15; padding:3px;
  transition:transform .16s, box-shadow .2s, background .2s;
}
body[data-theme="midnight"] .tool{background:rgba(255,255,255,.08)}
.tool .ic{width:21px;height:21px; color:var(--ink)}
.tool:active{transform:scale(.93)}
.tool.sel{
  background:linear-gradient(135deg,var(--powder),var(--lavender));
  color:#4a2f36; box-shadow:0 0 0 2px rgba(216,180,115,.55), var(--shadow-m); transform:translateY(-1px);
}
body[data-theme="midnight"] .tool.sel{color:#2b2436}
.tool.sel .ic{color:#4a2f36}
body[data-theme="midnight"] .tool.sel .ic{color:#2b2436}
.chip-wrap{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  padding:6px 11px; border-radius:var(--r-pill); font-size:11px; font-weight:700; color:var(--ink-soft);
  background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.6); transition:transform .14s;
}
body[data-theme="midnight"] .chip{background:rgba(255,255,255,.08)}
.chip:active{transform:scale(.94)}
.chip.sel{background:linear-gradient(135deg,var(--powder),var(--lavender)); color:#4a2f36}

.sw{aspect-ratio:1/1; border-radius:50%; border:2px solid rgba(255,255,255,.85); box-shadow:var(--shadow-s); transition:transform .14s}

.sw.sel{transform:scale(1.14); box-shadow:0 0 0 2px var(--gold), var(--shadow-s)}
.hintline{font-size:11px; line-height:1.5; color:var(--ink-soft); margin:0}

#bottomBar{
  position:relative; z-index:20;

}
#progWrap{flex:1; min-width:0}

#progBar{height:6px; border-radius:99px; background:rgba(58,43,43,.14); overflow:hidden}
#progBar > i{display:block; height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,var(--powder-deep),var(--gold)); transition:width .3s}

/* Mobil araç şeridi */
#mobileTools{display:none}

/* Örgü mini oyunu */
.braid-play{display:flex; gap:8px; justify-content:center; margin-top:8px}
.bstrand{
  flex:1; max-width:64px; padding:10px 4px; border-radius:14px; font-size:11px; font-weight:800;
  background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.6); box-shadow:var(--shadow-s);
  transition:transform .14s, background .2s;
}
body[data-theme="midnight"] .bstrand{background:rgba(255,255,255,.09)}
.bstrand.next{background:linear-gradient(135deg,var(--powder),var(--lavender)); color:#4a2f36; animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,154,166,.5)}50%{box-shadow:0 0 0 8px rgba(217,154,166,0)}}
.bstrand:active{transform:scale(.92)}
.bstrand.wrong{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Aksesuar tepsisi */
.acc-tray{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.acc-item{
  aspect-ratio:1/1; border-radius:12px; display:grid; place-items:center;
  background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.6); transition:transform .14s;
}
body[data-theme="midnight"] .acc-item{background:rgba(255,255,255,.08)}
.acc-item:active{transform:scale(.9)}
.acc-item.sel{box-shadow:0 0 0 2px var(--gold)}
.acc-item svg{width:26px;height:26px}
.slider{width:100%; -webkit-appearance:none; appearance:none; height:4px; border-radius:99px; background:rgba(58,43,43,.16); outline:none; margin:8px 0}
.slider::-webkit-slider-thumb{-webkit-appearance:none; width:18px;height:18px;border-radius:50%; background:#fff; box-shadow:var(--shadow-s); border:1px solid var(--line)}
.slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid var(--line)}

/* Sonuç */
#screen-result{align-items:center; justify-content:center; padding:16px; overflow:auto}
.result-card{width:min(560px,100%); border-radius:var(--r-l); padding:20px; text-align:center}
.ba-row{display:flex; gap:10px; margin:6px 0 14px}
.ba{flex:1; border-radius:var(--r-m); overflow:hidden; background:linear-gradient(160deg,var(--cream),var(--cream-2)); position:relative; aspect-ratio:3/4; box-shadow:var(--shadow-s)}
.ba img,.ba svg{width:100%;height:100%;display:block;object-fit:cover}
.ba b{position:absolute; left:8px; top:8px; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; background:var(--glass-strong); padding:3px 8px; border-radius:99px}
.score-big{font-family:var(--font-display); font-size:56px; line-height:1; color:var(--gold-deep)}
body[data-theme="midnight"] .score-big{color:var(--gold)}
.stars{font-size:26px; letter-spacing:5px; color:var(--gold); margin:4px 0 10px; height:32px}
.crit{display:grid; grid-template-columns:1fr 1fr; gap:7px 14px; margin:12px 0; text-align:left}
.crit div{display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:600; color:var(--ink-soft)}
.crit .cbar{flex:1; height:4px; border-radius:99px; background:rgba(58,43,43,.14); overflow:hidden}
.crit .cbar > i{display:block;height:100%; background:linear-gradient(90deg,var(--powder-deep),var(--gold)); border-radius:99px}
.reward-row{display:flex; justify-content:center; gap:10px; margin:14px 0}
.reward{padding:9px 16px; border-radius:var(--r-m); background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.6); font-weight:800; font-size:14px; display:flex; align-items:center; gap:6px}
body[data-theme="midnight"] .reward{background:rgba(255,255,255,.08)}

/* Toast */
#toast{
  position:absolute; left:50%; bottom:76px; transform:translate(-50%,14px);
  z-index:60; padding:10px 18px; border-radius:var(--r-pill); font-size:12.5px; font-weight:700;
  background:var(--glass-strong); border:1px solid rgba(255,255,255,.6); box-shadow:var(--shadow-m);
  opacity:0; pointer-events:none; transition:opacity .28s, transform .28s; max-width:82%; text-align:center;
}
#toast.show{opacity:1; transform:translate(-50%,0)}

#flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:55}

@keyframes flashAnim{0%{opacity:0}12%{opacity:.95}100%{opacity:0}}

  }

  .tool-grid{display:flex; gap:8px; overflow-x:auto; padding-bottom:3px; scrollbar-width:none}
  .tool-grid::-webkit-scrollbar{display:none}
  .tool{width:70px; height:70px; flex:none}
  .color-grid{display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px; scrollbar-width:none}
  .color-grid::-webkit-scrollbar{display:none}
  .sw{width:30px;height:30px;flex:none}
  .chip-wrap{flex-wrap:nowrap; overflow-x:auto; padding-bottom:3px; scrollbar-width:none}
  .chip-wrap::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap; flex:none}

  #stageWrap{position:absolute; top:40px; left:0; right:0; bottom:calc(40% + 60px)}

  #bottomBar{
    position:absolute; left:0; right:0; bottom:0; z-index:22; height:60px; padding:0 10px;

    border-top:1px solid rgba(255,255,255,.5);
  }

  .meters{

  .meter span{width:auto}
  .meter .bar{width:40px; height:4px}
  /* rozetler sahnenin en altında */
  .scene-top{top:auto; bottom:2px}
  .badge{padding:4px 9px; font-size:10px}
  .heat-wrap{top:auto; bottom:26px; right:8px}
  .heat{height:62px; width:7px}
  .menu-grid{grid-template-columns:repeat(3,1fr)}
}
#panelHandle{
  display:none; align-items:center; justify-content:center; gap:8px;

body[data-theme="midnight"] #panelHandle::before{background:rgba(255,255,255,.28)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important; transition-duration:.08s !important}
}

var Audio_ = {
  ctx:null,
  ready:false,
  init:function(){
    if(this.ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{ this.ctx = new AC(); this.ready = true; }catch(e){ this.ready=false; }
  },
  resume:function(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone:function(freq,dur,type,vol,slideTo){
    if(!State.soundEnabled) return;
    this.init(); if(!this.ready) return;
    this.resume();
    var ctx=this.ctx, t=ctx.currentTime;
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40,slideTo), t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.12, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t+dur+0.03);
  },
  noise:function(dur,vol,freq,q){
    if(!State.soundEnabled) return;
    this.init(); if(!this.ready) return;
    this.resume();
    var ctx=this.ctx, t=ctx.currentTime;
    var len=Math.max(1,Math.floor(ctx.sampleRate*dur));
    var buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    var src=ctx.createBufferSource(); src.buffer=buf;
    var f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1200; f.Q.value=q||1;
    var g=ctx.createGain(); g.gain.value=vol||0.09;
    src.connect(f); f.connect(g); g.connect(ctx.destination);
    src.start(t);
  },
  click:function(){ this.tone(660,0.06,'triangle',0.06,880); },
  good:function(){ this.tone(880,0.12,'sine',0.09); var s=this; setTimeout(function(){ s.tone(1320,0.16,'sine',0.07); },70); },
  bad:function(){ this.tone(200,0.18,'sawtooth',0.05,120); },
  snip:function(){ this.noise(0.07,0.10,2600,6); this.tone(2400,0.04,'square',0.03); },
  water:function(){ this.noise(0.16,0.05,900,0.7); },
  dryer:function(){ this.noise(0.14,0.04,520,0.5); },
  shutter:function(){ this.noise(0.05,0.16,1800,2); var s=this; setTimeout(function(){ s.noise(0.07,0.11,900,2); },60); },
  reward:function(){
    var s=this, n=[523,659,784,1046];
    n.forEach(function(f,i){ setTimeout(function(){ s.tone(f,0.22,'sine',0.08); }, i*95); });
  }
};

function loadGame(){
  var raw=null;
  try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){}
  if(raw){
    try{
      var d=JSON.parse(raw);
      if(d && typeof d==='object'){
        ['coins','gems','level','experience','soundEnabled','theme','servedCount','taskDate'].forEach(function(k){
          if(d[k]!==undefined) State[k]=d[k];
        });
        if(Array.isArray(d.unlockedItems)) State.unlockedItems=d.unlockedItems;
        if(Array.isArray(d.collection)) State.collection=d.collection;
        if(d.completedTasks && typeof d.completedTasks==='object') State.completedTasks=d.completedTasks;
      }
    }catch(e){}
  }
  var today=new Date().toISOString().slice(0,10);
  if(State.taskDate!==today){ State.taskDate=today; State.completedTasks={}; saveGame(); }
  if(State.unlockedItems.indexOf('parisian')<0) State.unlockedItems.push('parisian');
  document.body.setAttribute('data-theme', State.theme);
}

function xpNeeded(lv){ return 100+(lv-1)*80; }
function addRewards(coins,xp){
  State.coins+=coins; State.experience+=xp;
  while(State.experience>=xpNeeded(State.level)){
    State.experience-=xpNeeded(State.level);
    State.level++;
    State.gems+=2;
    THEMES.forEach(function(t){
      if(t.unlock<=State.level && State.unlockedItems.indexOf(t.id)<0) State.unlockedItems.push(t.id);
    });
    toast('Salon seviyesi '+State.level+'! Yeni içerikler açıldı.');
    Audio_.reward();
  }
  saveGame(); updateHUD();
}
function bumpTask(id,amount){
  var t=null;
  for(var i=0;i<DAILY_TASKS.length;i++) if(DAILY_TASKS[i].id===id) t=DAILY_TASKS[i];
  if(!t) return;
  var cur=State.completedTasks[id]||0;
  if(cur>=t.goal) return;
  State.completedTasks[id]=Math.min(t.goal,cur+(amount||1));
  if(State.completedTasks[id]>=t.goal){
    State.coins+=40; State.gems+=1;
    toast('Günlük görev tamamlandı: '+t.text);
    Audio_.good();
  }
  saveGame(); updateHUD();
}

var SVG = null;                 // #char
var G = {};                     // katman grupları
var HAIR_DEFS = ['back','sideL','sideR','faceL','faceR','top','bangs'];

/* --- Catmull-Rom noktalarını yumuşak cubic bezier yoluna çevirir --- */
function smoothPath(pts, close){
  if(pts.length<2) return '';
  var d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
  var n=pts.length;
  for(var i=0;i<n-1;i++){
    var p0=pts[i>0?i-1:0], p1=pts[i], p2=pts[i+1], p3=pts[i+2<n?i+2:n-1];
    var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    var c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+='C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);
  }
  if(close) d+='Z';
  return d;
}

/* --- Bir saç tutamının merkez hattını üretir --- */
function strandCenterline(s, steps){
  steps = steps||16;
  var wetness = State.hairWetness;
  var sideWave = (s.side==='R') ? State.styleWave.R : (s.side==='L' ? State.styleWave.L : (State.styleWave.L+State.styleWave.R)/2);
  var lenScale = (s.side==='R') ? State.hairLengthRight : (s.side==='L' ? State.hairLengthLeft : (State.hairLengthLeft+State.hairLengthRight)/2);
  var len = s.len * lenScale * (1 + 0.06*(1-wetness));   // kuruyunca hacim artar
  var amp = s.wave * sideWave * (1 - 0.6*wetness);
  var seg = len/steps;
  var x=s.x, y=s.y, a=s.angle;
  var pts=[[x,y]];
  for(var i=1;i<=steps;i++){
    var t=i/steps;
    var curl = Math.sin(t*s.waves*Math.PI*2 + s.phase) * amp * (0.18+t*0.95);
    var aa = a + curl*0.30 + s.drift*t;
    x += Math.sin(aa)*seg;
    y += Math.cos(aa)*seg;
    pts.push([x,y]);
  }
  return pts;
}

/* --- Merkez hattından şerit (dolgu) yolu üretir --- */
function ribbonPath(pts, w0, w1, volume){
  var n=pts.length, left=[], right=[];
  for(var i=0;i<n;i++){
    var t=i/(n-1);
    var p=pts[i];
    var prev=pts[i>0?i-1:0], next=pts[i<n-1?i+1:n-1];
    var dx=next[0]-prev[0], dy=next[1]-prev[1];
    var L=Math.sqrt(dx*dx+dy*dy)||1;
    var nx=-dy/L, ny=dx/L;
    var w=(lerp(w0,w1,Math.pow(t,0.8)))*0.5*(1+0.16*volume*Math.sin(t*Math.PI));
    left.push([p[0]+nx*w, p[1]+ny*w]);
    right.push([p[0]-nx*w, p[1]-ny*w]);
  }
  right.reverse();
  return smoothPath(left.concat(right), true);
}

/* --- Merkez hattını yana kaydırıp ince parlaklık teli üretir --- */
function offsetLine(pts, off, from, to){
  var n=pts.length, out=[];
  var i0=Math.floor(n*(from||0)), i1=Math.ceil(n*(to||1));
  for(var i=i0;i<i1 && i<n;i++){
    var p=pts[i];
    var prev=pts[i>0?i-1:0], next=pts[i<n-1?i+1:n-1];
    var dx=next[0]-prev[0], dy=next[1]-prev[1];
    var L=Math.sqrt(dx*dx+dy*dy)||1;
    out.push([p[0]-dy/L*off, p[1]+dx/L*off]);
  }
  return smoothPath(out,false);
}

/* ---------- Renk / gradyan hesabı ---------- */
function baseHex(){ return colorById(State.hairColor).hex; }
function regionStops(region){
  var base = baseHex();
  var d = State.dyedRegions[region];
  var top=base, mid=base, bot=base;
  if(d){
    var c=d.color, tech=d.tech;
    if(tech==='full'){ top=c; mid=c; bot=c; }
    else if(tech==='root'){ top=c; mid=mixHex(c,base,.7); bot=base; }
    else if(tech==='tips'){ top=base; mid=mixHex(base,c,.25); bot=c; }
    else if(tech==='ombre'){ top=base; mid=mixHex(base,c,.5); bot=c; }
    else if(tech==='balayage'){ top=base; mid=mixHex(base,c,.75); bot=mixHex(base,c,.55); }
    else if(tech==='split'){ top=c; mid=c; bot=c; }
    else if(tech==='front'){ top=c; mid=c; bot=mixHex(c,base,.35); }
    else if(tech==='hidden'){ top=base; mid=base; bot=c; }
  }
  return [top,mid,bot];
}
function refreshHairGradients(){
  HAIR_DEFS.forEach(function(region){
    var st=regionStops(region);
    var g=$('#grad_'+region, SVG);
    if(!g) return;
    var stops=g.children;
    stops[0].setAttribute('stop-color', shade(st[0],-0.36));
    stops[1].setAttribute('stop-color', shade(st[0],-0.06));
    stops[2].setAttribute('stop-color', mixHex(st[0],st[1],.5));
    stops[3].setAttribute('stop-color', shade(st[1], 0.08));
    stops[4].setAttribute('stop-color', shade(st[2], 0.16));
    stops[5].setAttribute('stop-color', shade(st[2], 0.30));
    var hl=$('#grad_hl_'+region, SVG);
    if(hl){
      hl.children[0].setAttribute('stop-color', shade(st[0], 0.66));
      hl.children[1].setAttribute('stop-color', shade(st[1], 0.74));
      hl.children[2].setAttribute('stop-color', shade(st[2], 0.60));
    }
  });
}

/* ---------- Saç çizimi ---------- */
/* ============================================================
   SAÇ — KÜTLE TABANLI ÇİZİM (anime stili)
   Saç ayrı ayrı teller değil; büyük dolu siluet kütleleri +
   içeride koyu ayrım kamaları + keskin parlaklık bandı olarak
   çizilir. Uçlar sivri tutam (clump) şeklindedir.
   ============================================================ */

var STYLE_WAVES = 1.7;          // seçili şekillendirme modelinin dalga sıklığı

/* Yalnızca kenarlardaki ince uçuşan teller için ince model */
var STRANDS = [];
function buildStrandModel(){
  STRANDS=[];
  var id=0;
  function add(o){ o.key='s'+(id++); STRANDS.push(o); return o; }
  [-1,1].forEach(function(sg){
    for(var j=0;j<3;j++){
      add({layer:'front', region:sg<0?'sideL':'sideR', side:sg<0?'L':'R', wisp:true,
        x:300+sg*(88+j*12), y:262+j*22,
        angle:sg*(0.07+j*0.03), drift:sg*(0.05+j*0.03),
        len:340-j*40, w0:7, w1:2, waves:2.4, wave:0.6, phase:j*1.7+(sg<0?0:2.4), vol:.2});
    }
  });
}

/* --- yardımcılar --- */
function hSide(side){ return side==='R' ? State.hairLengthRight : State.hairLengthLeft; }
function hWave(side){ return clamp((side==='R'?State.styleWave.R:State.styleWave.L),0,1.5); }

/* Dışa doğru şişkin + dalgalı kenar noktaları üretir */
function edgePts(sg, x0,y0, x1,y1, bulge, ripple, waves, phase, steps){
  var out=[];
  for(var i=0;i<=steps;i++){
    var t=i/steps;
    var b=Math.sin(t*Math.PI)*bulge;
    var r=Math.sin(t*waves*Math.PI*2+phase)*ripple*Math.pow(t,0.65);
    out.push([lerp(x0,x1,t)+sg*(b+r), lerp(y0,y1,t)]);
  }
  return out;
}

/* Sivri uçlu tutam dizisi (saç uçları) */
function tipPts(ax,ay,bx,by,n,depth,seed){
  var out=[];
  for(var i=0;i<n;i++){
    var t0=i/n, t1=(i+1)/n;
    var x0=lerp(ax,bx,t0), y0=lerp(ay,by,t0);
    var x1=lerp(ax,bx,t1), y1=lerp(ay,by,t1);
    var mx=lerp(x0,x1,0.5), my=lerp(y0,y1,0.5);
    var dd=depth*(0.55+0.5*(((i*5+seed)%4)/3));
    out.push([x0,y0]);
    out.push([lerp(x0,mx,0.55), my+dd*0.42]);   // içbükey kenar
    out.push([lerp(x0,mx,0.93), my+dd*0.86]);
    out.push([mx, my+dd]);                       // sivri uç
    out.push([lerp(mx,x1,0.07), my+dd*0.86]);
    out.push([lerp(mx,x1,0.45), my+dd*0.42]);
  }
  out.push([bx,by]);
  return out;
}

/* Kütle içi koyu ayrım kaması / parlak tutam */
function sliver(x0,y0,x1,y1,w0,w1){
  var mx=lerp(x0,x1,0.5)+ (x1-x0)*0.06, my=lerp(y0,y1,0.5);
  var pts=[[x0-w0,y0],[mx-w1,my],[x1,y1],[mx+w1,my],[x0+w0,y0]];
  return smoothPath(pts,true);
}

/* ---------- ARKA KÜTLE (baş arkası, omuzları aşan saç) ---------- */
function backMass(sg, side){
  var L = 430*hSide(side), wv=hWave(side), wet=State.hairWetness;
  var flare = (1-0.55*wet);
  var pts=[[300,148]];
  for(var i=1;i<=8;i++){                       // kafatası kavisi
    var t=i/8;
    pts.push([300+sg*124*Math.sin(t*Math.PI/2)*flare, 148+128*(1-Math.cos(t*Math.PI/2))]);
  }
  var topY=276, botY=276+L*0.90;
  var outX=300+sg*(98+wv*20)*flare;
  pts=pts.concat(edgePts(sg, 300+sg*124*flare, topY, outX, botY,
                 (8+wv*14)*flare, (5+wv*18)*flare, 1.2+STYLE_WAVES*0.38, sg<0?0.4:2.6, 16).slice(1));
  pts=pts.concat(tipPts(outX, botY, 300+sg*14, 276+L, 4, 22+wv*8, sg<0?1:3).slice(1));
  pts.push([300+sg*6, 300]);
  return smoothPath(pts,true);
}

/* ---------- ÖN YAN KÜTLE (yüzü çerçeveleyip göğse düşen saç) ---------- */
function frontMass(sg, side){
  var L = 386*hSide(side), wv=hWave(side), wet=State.hairWetness;
  var flare=(1-0.5*wet);
  var pts=[[300+sg*76, 180]];
  pts.push([300+sg*100, 204]);
  pts.push([300+sg*114*flare, 246]);
  var topY=288, botY=288+L*0.80;
  var outX=300+sg*(94+wv*16)*flare;
  pts=pts.concat(edgePts(sg, 300+sg*118*flare, topY, outX, botY,
                 (7+wv*12)*flare, (4+wv*14)*flare, 1.2+STYLE_WAVES*0.34, sg<0?1.9:0.7, 14).slice(1));
  pts=pts.concat(tipPts(outX, botY, 300+sg*52, 288+L*0.66, 3, 20+wv*6, sg<0?2:0).slice(1));
  /* iç kenar — yanağı takip eder */
  pts.push([300+sg*62, 430]);
  pts.push([300+sg*78, 372]);
  pts.push([300+sg*88, 306]);
  pts.push([300+sg*86, 240]);
  return smoothPath(pts,true);
}

/* ---------- TEPE KEPİ (saç çizgisi + orta ayrım) ---------- */
function capMass(sg){
  var pts=[[300,146]];
  pts.push([300+sg*56, 152]);
  pts.push([300+sg*98, 190]);
  pts.push([300+sg*118, 244]);
  pts.push([300+sg*124, 288]);
  /* saç çizgisi (içeri dönüş) */
  pts.push([300+sg*104, 270]);
  pts.push([300+sg*96, 222]);

/* ---------- Örgü çizimi ---------- */
function braidCenterline(side, progress){
  var sg = side==='L'?-1:1;
  var startX = 300 + sg*104, startY = 250;
  if(State.braidStyle==='crown'){ startX=300+sg*88; startY=214; }
  if(State.braidStyle==='half'){ startX=300+sg*96; startY=268; }
  var len = 330*progress*((side==='L')?State.hairLengthLeft:State.hairLengthRight);
  var steps=18, seg=len/steps, x=startX, y=startY, pts=[[x,y]];
  for(var i=1;i<=steps;i++){
    var t=i/steps;
    var a = sg*(0.30*(1-t)*(1-t)) + Math.sin(t*3.1)*0.04*sg;
    x += Math.sin(a)*seg; y += Math.cos(a)*seg;
    pts.push([x,y]);
  }
  return pts;
}
function renderBraids(){
  var g=G.braids; g.innerHTML='';
  if(!State.braidStyle) return;
  ['L','R'].forEach(function(side){
    var p=State.braidSide[side];
    if(p<=0.02) return;
    var pts=braidCenterline(side, p);
    var st=regionStops(side==='L'?'sideL':'sideR');
    var main=st[1], dark=shade(st[2],-0.42), light=shade(st[1],0.34);
    var gg=svgEl('g');
    /* örgü gövdesi: dönüşümlü eğik baklalar */
    var n=pts.length;
    var wBase = (State.braidStyle==='fish'?22:30);
    for(var i=1;i<n;i++){
      var t=i/(n-1);

      var ang=dir*26;
      var e=svgEl('ellipse',{cx:pt[0], cy:pt[1], rx:w*0.72, ry:w*0.50,
        transform:'rotate('+ang+' '+pt[0].toFixed(1)+' '+pt[1].toFixed(1)+')',

      gg.appendChild(svgEl('path',{d:ribbonPath(tail,20,6,0), fill:main, opacity:'.92'}));
    }

  });

/* ============================================================
   Bölüm 3: Efekt katmanı · Animasyon · Giriş (fare + dokunma)
   ============================================================ */
var FX = {c:null, ctx:null, w:0, h:0, s:1, ox:0, oy:0, dpr:1};
var particles=[];
var VIEW_X=76, VIEW_Y=104, VIEW_W=448, VIEW_H=616;

/* --- Saç kapsama ızgarası --- */
var GRID={cols:15, rows:20, x0:145, y0:158, x1:455, y1:650, cells:[]};
function inHairArea(x,y){
  if(y<GRID.y0||y>GRID.y1) return false;
  if(Math.abs(x-300)>168) return false;
  /* yüz ovalini çıkar */
  var fx=(x-300)/74, fy=(y-312)/116;
  if(fx*fx+fy*fy<1) return false;
  /* baş üstü kubbe */
  var hx=(x-300)/152, hy=(y-272)/158;
  if(hx*hx+hy*hy<1) return true;
  /* omuzlara inen yan saç bantları */
  if(y>250 && Math.abs(x-300)<160) return true;
  return false;
}
function buildGrid(){
  GRID.cells=[];
  var cw=(GRID.x1-GRID.x0)/GRID.cols, ch=(GRID.y1-GRID.y0)/GRID.rows;
  GRID.cw=cw; GRID.ch=ch;
  for(var r=0;r<GRID.rows;r++){
    for(var c=0;c<GRID.cols;c++){
      var x=GRID.x0+cw*(c+0.5), y=GRID.y0+ch*(r+0.5);
      GRID.cells.push({x:x,y:y,on:inHairArea(x,y),wet:0,foam:0,seed:Math.random()*6.28});
    }
  }
  GRID.total=GRID.cells.filter(function(c){return c.on;}).length||1;
}
function gridPct(prop, thr){
  var n=0, t=0;
  for(var i=0;i<GRID.cells.length;i++){
    var c=GRID.cells[i]; if(!c.on) continue;
    t++; if(c[prop]>=thr) n++;
  }
  return t? n/t : 0;
}
function paintGrid(prop, x, y, radius, amount, max, min){
  var changed=false;
  for(var i=0;i<GRID.cells.length;i++){
    var c=GRID.cells[i]; if(!c.on) continue;
    var dx=c.x-x, dy=c.y-y, d=Math.sqrt(dx*dx+dy*dy);
    if(d>radius) continue;
    var f=1-d/radius;
    var v=c[prop]+amount*f;
    if(max!=null) v=Math.min(max,v);
    if(min!=null) v=Math.max(min,v);
    if(v!==c[prop]){ c[prop]=clamp(v,0,1); changed=true; }
  }
  return changed;
}
function resetGrid(){
  buildGrid();
}

/* --- Canvas ölçekleme --- */
function resizeFX(){
  var box=$('#sceneBox');
  if(!box) return;
  var r=box.getBoundingClientRect();
  if(r.width<2||r.height<2) return;
  FX.dpr=Math.min(window.devicePixelRatio||1, 2);
  FX.c=$('#fx');
  FX.c.width=Math.round(r.width*FX.dpr);
  FX.c.height=Math.round(r.height*FX.dpr);
  FX.w=r.width; FX.h=r.height;
  FX.s=Math.min(r.width/VIEW_W, r.height/VIEW_H);
  FX.ox=(r.width-VIEW_W*FX.s)/2;
  FX.oy=(r.height-VIEW_H*FX.s)/2;
  FX.ctx=FX.c.getContext('2d');
}
function toView(clientX, clientY){
  var box=$('#sceneBox').getBoundingClientRect();
  return {
    x:(clientX-box.left-FX.ox)/FX.s + VIEW_X,
    y:(clientY-box.top -FX.oy)/FX.s + VIEW_Y
  };
}

/* --- Parmağın etkilediği alanı gösteren halka --- */
function showRing(p, active){
  var el=$('#brushRing'); if(!el) return;
  var r=(typeof brushRadius==='function' ? brushRadius() : 0);
  if(!r){ el.classList.add('hidden'); return; }
  var s=toScreen(p.x,p.y), rr=r*FX.s;
  el.style.left=Math.round(s.x)+'px'; el.style.top=Math.round(s.y)+'px';
  el.style.width=Math.round(rr*2)+'px'; el.style.height=Math.round(rr*2)+'px';
  el.style.margin=Math.round(-rr)+'px 0 0 '+Math.round(-rr)+'px';
  el.classList.remove('hidden');
  el.classList.toggle('on', !!active);
}

/* --- SVG koordinatını ekran (sahne kutusu içi) koordinatına çevirir --- */
function toScreen(vx, vy){
  return { x:(vx-VIEW_X)*FX.s + FX.ox, y:(vy-VIEW_Y)*FX.s + FX.oy };
}

/* --- Parçacıklar --- */
function spawn(type,x,y,opt){
  opt=opt||{};
  particles.push({
    type:type, x:x, y:y,
    vx:opt.vx!=null?opt.vx:rnd(-0.6,0.6),
    vy:opt.vy!=null?opt.vy:rnd(-0.4,0.6),
    r:opt.r||rnd(3,8), life:1, decay:opt.decay||rnd(0.008,0.02),
    col:opt.col||'#fff', rot:rnd(0,6.28), spin:rnd(-0.1,0.1),
    len:opt.len||0
  });
  if(particles.length>420) particles.splice(0,60);
}
function sparkleBurst(x,y,n){
  for(var i=0;i<(n||6);i++) spawn('spark',x+rnd(-18,18),y+rnd(-18,18),{col:'#ffe9b8',r:rnd(2,5),vy:rnd(-1.2,-.2),decay:.022});
}

/* --- Kamera / saç sallanma durumu --- */
var Anim = {
  blinkT:0, blinkPhase:0, nextBlink:2.4,
  eyeX:0, eyeY:0, eyeTX:0, eyeTY:0, eyeT:0,
  swayL:{a:0,v:0}, swayR:{a:0,v:0}, swayB:{a:0,v:0},
  exprT:0, pose:0, poseTarget:0,
  last:0
};
function setExpression(name, dur){
  State.expression=name;
  var m=$('#mouth', SVG);
  if(m) m.setAttribute('d', MOUTH[name]||MOUTH.neutral);
  var bl=$('#browL',SVG), br=$('#browR',SVG);
  var tilt = (name==='uneasy')?1:0;
  if(bl) bl.setAttribute('transform','rotate('+(tilt*10)+' 258 278)');
  if(br) br.setAttribute('transform','rotate('+(-tilt*10)+' 342 278)');
  if(dur) Anim.exprT=dur;
}
function nudgeSway(side, amount){
  if(side==='L'||side==='C') Anim.swayL.v += amount;
  if(side==='R'||side==='C') Anim.swayR.v += amount;
  Anim.swayB.v += amount*0.45;
}

/* --- Ana döngü --- */
function tick(ts){
  var dt=Math.min(0.05,(ts-Anim.last)/1000)||0.016;
  Anim.last=ts;

  /* göz kırpma */
  Anim.blinkT+=dt;
  if(Anim.blinkT>Anim.nextBlink){
    Anim.blinkPhase+=dt*9;
    var k=Math.abs(Math.cos(Anim.blinkPhase*Math.PI));
    if(Anim.blinkPhase>=1){ Anim.blinkPhase=0; Anim.blinkT=0; Anim.nextBlink=rnd(2.2,5.4); k=1; }
    setEyeScale(k);
  }
  /* göz gezinmesi */
  Anim.eyeT-=dt;
  if(Anim.eyeT<=0){ Anim.eyeT=rnd(1.4,3.6); Anim.eyeTX=rnd(-2.6,2.6); Anim.eyeTY=rnd(-1.6,1.6); }
  Anim.eyeX=lerp(Anim.eyeX,Anim.eyeTX,dt*3);
  Anim.eyeY=lerp(Anim.eyeY,Anim.eyeTY,dt*3);
  var pl=$('#pupilL',SVG), pr=$('#pupilR',SVG);
  if(pl) pl.setAttribute('transform','translate('+Anim.eyeX.toFixed(2)+','+Anim.eyeY.toFixed(2)+')');
  if(pr) pr.setAttribute('transform','translate('+Anim.eyeX.toFixed(2)+','+Anim.eyeY.toFixed(2)+')');

  /* saç yayı (spring) */
  [['swayL',G.hairFrontL,300,220],['swayR',G.hairFrontR,300,220],['swayB',G.hairBack,300,210]].forEach(function(e){
    var s=Anim[e[0]];
    s.v += -s.a*26*dt;            // geri çekme
    s.v *= Math.pow(0.02, dt);    // sönümleme
    s.a += s.v*dt;
    s.a = clamp(s.a,-4.5,4.5);
    if(e[1]) e[1].setAttribute('transform','rotate('+s.a.toFixed(3)+' '+e[2]+' '+e[3]+')');
  });
  if(G.braids) G.braids.setAttribute('transform','rotate('+((Anim.swayL.a+Anim.swayR.a)/2).toFixed(3)+' 300 240)');

  /* ifade zamanlayıcı */
  if(Anim.exprT>0){
    Anim.exprT-=dt;
    if(Anim.exprT<=0) setExpression(State.hairShine>66?'smile':'neutral');
  }

  /* poz (fotoğraf aşaması) */
  Anim.pose=lerp(Anim.pose,Anim.poseTarget,dt*3);
  if(SVG) SVG.style.transform = Anim.pose>0.001
    ? 'rotate('+(Anim.pose*-3).toFixed(2)+'deg) scale('+(1+Anim.pose*0.04).toFixed(3)+')' : '';

  /* ısı sönümü */
  if(State.heat>0 && !Input.down){
    State.heat=Math.max(0,State.heat-dt*18);
    var hb=$('#heatBar'); if(hb) hb.style.height=State.heat+'%';
  }

  drawFX(dt);
  requestAnimationFrame(tick);
}
function setEyeScale(k){
  ['L','R'].forEach(function(s){
    var e=$('#eyeInner'+s,SVG);
    if(e) e.setAttribute('transform','translate(0,'+((1-k)*4).toFixed(2)+') scale(1,'+Math.max(0.05,k).toFixed(3)+')');
  });
}

/* --- Efekt çizimi --- */
function drawFX(dt){
  if(!FX.ctx) return;
  var ctx=FX.ctx;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,FX.c.width,FX.c.height);
  ctx.setTransform(FX.s*FX.dpr,0,0,FX.s*FX.dpr, (FX.ox-VIEW_X*FX.s)*FX.dpr, (FX.oy-VIEW_Y*FX.s)*FX.dpr);

  var stage=STAGES[State.currentStage].id;

  /* --- su parlaması --- */
  if(State.hairWetness>0.02 && (stage==='wash'||stage==='dry')){
    ctx.save();
    for(var i=0;i<GRID.cells.length;i++){
      var c=GRID.cells[i];
      if(!c.on||c.wet<0.25) continue;
      ctx.globalAlpha=c.wet*0.30;
      ctx.fillStyle='#bfe0f2';
      ctx.beginPath();
      ctx.ellipse(c.x+Math.sin(c.seed)*3, c.y+Math.cos(c.seed)*3, GRID.cw*0.30, GRID.ch*0.22, 0,0,6.283);
      ctx.fill();
    }
    ctx.restore();
  }
  /* --- köpük --- */
  if(stage==='wash'){
    ctx.save();
    for(i=0;i<GRID.cells.length;i++){
      c=GRID.cells[i];
      if(!c.on||c.foam<0.08) continue;
      var a=c.foam;
      for(var b=0;b<3;b++){
        var ang=c.seed+b*2.1;
        var bx=c.x+Math.cos(ang)*GRID.cw*0.30, by=c.y+Math.sin(ang)*GRID.ch*0.30;
        var rr=(GRID.cw*0.26)*(0.6+0.5*Math.sin(c.seed+b));
        ctx.globalAlpha=a*0.55;
        ctx.fillStyle='#ffffff';
        ctx.beginPath(); ctx.arc(bx,by,rr*a+2,0,6.283); ctx.fill();
        ctx.globalAlpha=a*0.85;
        ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(bx,by,rr*a+2,0,6.283); ctx.stroke();
        ctx.globalAlpha=a*0.6;
        ctx.beginPath(); ctx.arc(bx-rr*0.3, by-rr*0.3, Math.max(0.8,rr*0.22),0,6.283); ctx.fill();
      }
    }
    ctx.restore();
  }
  /* --- kesim kılavuzu --- */
  if(stage==='cut' && Input.pos && State.selectedTool && State.selectedTool!=='guide'){
    ctx.save();
    ctx.strokeStyle='rgba(216,180,115,.95)'; ctx.lineWidth=1.6; ctx.setLineDash([9,7]);
    ctx.beginPath(); ctx.moveTo(150, Input.pos.y); ctx.lineTo(450, Input.pos.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(216,180,115,.95)';
    ctx.beginPath(); ctx.arc(150, Input.pos.y, 4,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(450, Input.pos.y, 4,0,6.283); ctx.fill();
    ctx.restore();
  }
  /* --- fön rüzgârı --- */
  if(stage==='dry' && Input.down && State.selectedTool==='dryer' && Input.pos){
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=2; ctx.lineCap='round';
    var t=performance.now()/220;
    for(i=0;i<7;i++){
      var off=(i-3)*13;
      var ph=(t+i*0.7)%1;
      var sx=Input.pos.x-70+ph*40, sy=Input.pos.y+off;
      ctx.globalAlpha=0.65*(1-ph);
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+34,sy+off*0.14); ctx.stroke();
    }
    ctx.restore();
  }
  /* --- örgü hedef işaretleri --- */
  if(stage==='braid' && State.braidActive){
    var side=State.braidActive;
    var pts=braidCenterline(side, Math.max(0.12,State.braidSide[side]));
    var tip=pts[pts.length-1];
    ctx.save();
    ctx.globalAlpha=0.5+0.35*Math.sin(performance.now()/260);
    ctx.strokeStyle='#d8b473'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.arc(tip[0],tip[1],26,0,6.283); ctx.stroke();
    ctx.restore();
  }

  /* --- parçacıklar --- */
  for(i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.life-=p.decay; p.rot+=p.spin;
    if(p.type==='cut') p.vy+=0.16;
    if(p.type==='bubble') p.vy-=0.02;
    if(p.type==='coin') p.vy+=0.08;
    if(p.life<=0){ particles.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
    if(p.type==='spark'){
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.col;
      ctx.beginPath();
      for(var k=0;k<4;k++){
        var a2=k/4*Math.PI*2;
        ctx.lineTo(Math.cos(a2)*p.r, Math.sin(a2)*p.r);
        ctx.lineTo(Math.cos(a2+0.785)*p.r*0.3, Math.sin(a2+0.785)*p.r*0.3);
      }
      ctx.closePath(); ctx.fill();
    } else if(p.type==='drop'){
      ctx.fillStyle='rgba(178,214,236,.85)';
      ctx.beginPath(); ctx.ellipse(p.x,p.y,p.r*0.5,p.r,0,0,6.283); ctx.fill();
    } else if(p.type==='bubble'){
      ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1;
      ctx.fillStyle='rgba(255,255,255,.5)';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill(); ctx.stroke();
    } else if(p.type==='cut'){
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.strokeStyle=p.col; ctx.lineWidth=2.4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-p.len/2,0); ctx.quadraticCurveTo(0,3,p.len/2,0); ctx.stroke();
    } else if(p.type==='dye'){
      ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    } else if(p.type==='coin'){
      ctx.fillStyle='#d8b473'; ctx.strokeStyle='#a9813f'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.ellipse(p.x,p.y,p.r,p.r*0.82,0,0,6.283); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
}

/* ============================================================
   Giriş yönetimi — hem fare hem dokunma
   ============================================================ */
var Input = {down:false, pos:null, last:null, dist:0, circle:0, id:null, t0:0};

function bindInput(){
  var layer=$('#hitLayer');
  function start(e){
    if(e.button!=null && e.button!==0) return;
    Input.down=true; Input.id=e.pointerId;
    var p=toView(e.clientX,e.clientY);
    Input.pos=p; Input.last=p; Input.dist=0; Input.circle=0; Input.t0=performance.now();
    if(layer.setPointerCapture && e.pointerId!=null){ try{ layer.setPointerCapture(e.pointerId); }catch(err){} }
    Audio_.init();
    Stage.onDown(p);
    showRing(p, true);
    /* basılı tutunca uygulamaya devam etsin — küçük çocuklar için */
    if(Input.hold) clearInterval(Input.hold);
    Input.hold=setInterval(function(){
      if(!Input.down || !Input.pos){ clearInterval(Input.hold); Input.hold=null; return; }
      if(performance.now()-(Input.tMove||0) < 90) return;   // parmak zaten hareket ediyor
      Stage.onDrag(Input.pos,{dx:0,dy:1.6,d:1.6});
    }, 70);
    e.preventDefault();
  }
  function move(e){
    var p=toView(e.clientX,e.clientY);
    Input.pos=p; Input.tMove=performance.now();
    showRing(p, Input.down);
    if(!Input.down){ Stage.onHover(p); return; }
    var dx=p.x-Input.last.x, dy=p.y-Input.last.y;
    var d=Math.sqrt(dx*dx+dy*dy);
    Input.dist+=d;
    /* dairesel hareket tespiti (şampuan için) */
    if(Input.lastDir){
      var cross=Input.lastDir.x*dy-Input.lastDir.y*dx;
      Input.circle=clamp(Input.circle+Math.abs(cross)*0.02,0,3);
    }
    if(d>0.6) Input.lastDir={x:dx/d,y:dy/d};
    Stage.onDrag(p,{dx:dx,dy:dy,d:d});
    Input.last=p;
    e.preventDefault();
  }
  function end(e){
    if(!Input.down) return;
    Input.down=false;
    var p=Input.pos||toView(e.clientX,e.clientY);
    Stage.onUp(p);
    Input.lastDir=null;
    if(Input.hold){ clearInterval(Input.hold); Input.hold=null; }
    var br=$('#brushRing');
    if(br){ br.classList.remove('on'); if(e && e.pointerType!=='mouse') br.classList.add('hidden'); }
  }
  if(window.PointerEvent){
    layer.addEventListener('pointerdown',start);
    layer.addEventListener('pointermove',move);
    layer.addEventListener('pointerup',end);
    layer.addEventListener('pointercancel',end);
    layer.addEventListener('pointerleave',function(){
      if(!Input.down){ Input.pos=null; var b=$('#brushRing'); if(b) b.classList.add('hidden'); }
    });
  } else {
    layer.addEventListener('mousedown',start);
    window.addEventListener('mousemove',move);
    window.addEventListener('mouseup',end);
    layer.addEventListener('touchstart',function(e){ var t=e.touches[0]; start({clientX:t.clientX,clientY:t.clientY,preventDefault:function(){e.preventDefault();}}); },{passive:false});
    layer.addEventListener('touchmove',function(e){ var t=e.touches[0]; move({clientX:t.clientX,clientY:t.clientY,preventDefault:function(){e.preventDefault();}}); },{passive:false});
    layer.addEventListener('touchend',function(e){ end({clientX:0,clientY:0}); });
  }
}

/* ---------- Geri al / yeniden yap ---------- */
function snapshot(){
  return JSON.stringify({
    L:State.hairLengthLeft, R:State.hairLengthRight,
    d:State.dyedRegions, a:State.accessories, w:State.styleWave,
    b:State.braidSide, bs:State.braidStyle, bu:State.bunStyle,
    hc:State.hairColor, hs:State.hairStyle
  });
}
function applySnapshot(str){
  try{
    var s=JSON.parse(str);
    State.hairLengthLeft=s.L; State.hairLengthRight=s.R;
    State.dyedRegions=s.d||{}; State.accessories=s.a||[];
    State.styleWave=s.w||{L:.5,R:.5}; State.braidSide=s.b||{L:0,R:0};
    State.braidStyle=s.bs||null; State.bunStyle=s.bu||null;
    State.hairColor=s.hc; State.hairStyle=s.hs;
    refreshHairGradients(); renderHair(); updateMeters(); updateProgress();
  }catch(e){}
}
function pushUndo(){
  State.cutHistory.push(snapshot());
  if(State.cutHistory.length>40) State.cutHistory.shift();
  State.cutFuture.length=0;
  updateUndoBtns();
}
function doUndo(){
  if(!State.cutHistory.length){ toast('Geri alınacak işlem yok.'); return; }
  State.cutFuture.push(snapshot());
  applySnapshot(State.cutHistory.pop());
  updateUndoBtns(); Audio_.click();
}
function doRedo(){
  if(!State.cutFuture.length){ toast('Yeniden yapılacak işlem yok.'); return; }
  State.cutHistory.push(snapshot());
  applySnapshot(State.cutFuture.pop());
  updateUndoBtns(); Audio_.click();
}
function updateUndoBtns(){
  $('#btnUndo').style.opacity = State.cutHistory.length? '1':'.4';
  $('#btnRedo').style.opacity = State.cutFuture.length? '1':'.4';
}

/* ---------- Ölçüm göstergeleri ---------- */
function updateMeters(){
  var m=$('#meters');
  if(!m.dataset.built){
    m.innerHTML=
      '<div class="meter m-health"><span>Sağlık</span><div class="bar"><i id="mH"></i></div></div>'+
      '<div class="meter m-shine"><span>Parlaklık</span><div class="bar"><i id="mS"></i></div></div>'+
      '<div class="meter m-soft"><span>Yumuşaklık</span><div class="bar"><i id="mF"></i></div></div>';
    m.dataset.built='1';
  }
  $('#mH').style.width=clamp(State.hairHealth,0,100)+'%';
  $('#mS').style.width=clamp(State.hairShine,0,100)+'%';
  $('#mF').style.width=clamp(State.hairSoftness,0,100)+'%';
}
function updateSceneBadges(){
  var t=$('#sceneTop'), html='';
  var st=STAGES[State.currentStage].id;
  if(st==='cut'){
    var diff=Math.abs(State.hairLengthLeft-State.hairLengthRight);
    var sym=Math.round(clamp(100-diff*420,0,100));
    html='<div class="badge">Simetri %'+sym+'</div>'+
         '<div class="badge">Sol '+Math.round(State.hairLengthLeft*100)+' · Sağ '+Math.round(State.hairLengthRight*100)+'</div>';
  } else if(st==='wash'){
    html='<div class="badge">Islaklık %'+Math.round(gridPct('wet',.5)*100)+'</div>'+
         '<div class="badge">Köpük %'+Math.round(gridPct('foam',.5)*100)+'</div>';
  } else if(st==='dry'){
    html='<div class="badge">Kuruluk %'+Math.round((1-State.hairWetness)*100)+'</div>';
  } else if(st==='comb'){
    var left=State.tangles.filter(function(x){return !x.done;}).length;
    html='<div class="badge">'+(left? left+' dolaşık kaldı' : 'Saç tamamen açıldı')+'</div>';
  } else if(st==='braid' && State.braidStyle){
    html='<div class="badge">Sol %'+Math.round(State.braidSide.L*100)+' · Sağ %'+Math.round(State.braidSide.R*100)+'</div>';
  }
  t.innerHTML=html;
}

/* ---------- Aşama ilerleme hesapları ---------- */
function stageProgress(){
  var id=STAGES[State.currentStage].id;
  if(id==='wash'){
    var w=gridPct('wet',.5), f=gridPct('foam',.5);
    var peak=State.foamPeak||0;
    var rinse=0;
    if(peak>=0.7) rinse=clamp(1-f/Math.max(0.001,peak),0,1);
    return clamp(w*0.3 + Math.min(peak,0.85)/0.85*0.4 + rinse*0.3, 0, 1);
  }
  if(id==='care')  return clamp(State.strokesCare/5,0,1);
  if(id==='dry')   return clamp((1-State.hairWetness/0.9)/0.7,0,1);
  if(id==='comb'){
    var total=State.tangles.length||1;
    var done=State.tangles.filter(function(t){return t.done;}).length;
    return done/total;
  }
  if(id==='cut')   return State.usedTools.cut?1:0;
  if(id==='dye')   return Object.keys(State.dyedRegions).length? 1:0;
  if(id==='style') return State.usedTools.style?1:0;
  if(id==='braid'){
    if(!State.braidStyle) return 0;
    var sides=braidSidesFor(State.braidStyle);
    var s=0; sides.forEach(function(x){ s+=State.braidSide[x]; });
    return s/sides.length;
  }
  if(id==='acc')   return State.accessories.length?1:0;
  if(id==='photo') return State.usedTools.photo?1:0;
  return 0;
}
function braidSidesFor(id){
  for(var i=0;i<BRAID_MODELS.length;i++) if(BRAID_MODELS[i].id===id) return BRAID_MODELS[i].sides;
  return ['L'];
}
function stageOptional(){
  return ['cut','dye','style','braid','acc'].indexOf(STAGES[State.currentStage].id)>=0;
}
function canAdvance(){
  var id=STAGES[State.currentStage].id;
  if(id==='wash') return stageProgress()>=0.72;
  if(id==='care') return State.strokesCare>=3;
  if(id==='dry')  return State.hairWetness<=0.30;
  if(id==='comb'){ var td=State.tangles.filter(function(t){return t.done;}).length; return td>=Math.ceil(State.tangles.length*0.6); }
  if(id==='photo') return false;
  return true;
}
function stageHint(){
  var id=STAGES[State.currentStage].id;
  var H={
    wash:'Duş başlığıyla saçı ıslat, şampuanı dairesel hareketle köpürt, sonra durula.',
    care:'Ürünü seç ve saç boyunca yukarıdan aşağı sürükle.',
    dry:'Havlu ile fazla suyu al, fönü gezdirerek kurut. Aynı noktada bekletme.',
    comb:'Taramayı yukarıdan aşağı yap. Dolaşık noktaların üzerinden geç.',
    cut:'Makasla saç ucunda istediğin yüksekliğe dokun. İki tarafı ayrı takip edilir.',
    dye:'Rengi ve tekniği seç, fırçayı saçta gezdir. Parlaklık çizgileri korunur.',
    style:'Aracı saçta gezdir. Isı göstergesini yükseltme; ısı koruyucu hasarı azaltır.',
    braid:'Modeli seç, sonra sırayla doğru tutama dokun. Örgü adım adım uzar.',
    acc:'Aksesuarı seç, saçın üzerine dokunarak yerleştir. Boyut ve açıyı ayarla.',
    photo:'Pelerini kaldır ve fotoğrafı çek.'
  };
  return H[id]||'';
}
/* ---------- Ekran içi rehber (nereye dokunacağını gösterir) ---------- */
var COACH_POS={
  wash:[300,320,'move'], care:[262,320,'move'], dry:[300,290,'move'],
  cut:[300,560,'side'],  dye:[300,380,'move'], style:[300,400,'move']
};
function brushRadius(){
  if($('#screen-game') && $('#screen-game').hidden) return 0;
  var id=STAGES[State.currentStage].id, t=State.selectedTool;
  if(id==='wash')  return (t==='shampoo'||t==='towel')? 80 : 86;
  if(id==='care')  return 62;
  if(id==='dry')   return (t==='towel')? 84 : 90;
  if(id==='comb')  return 46;
  if(id==='dye')   return 72;
  if(id==='style') return 60;
  return 0;
}
function updateCoach(){
  var el=$('#coach'); if(!el) return;
  var scr=$('#screen-game');
  var id=STAGES[State.currentStage].id;
  var spec=COACH_POS[id]||null;
  if(id==='comb'){
    var t=null;
    for(var i=0;i<State.tangles.length;i++){ if(!State.tangles[i].done){ t=State.tangles[i]; break; } }
    spec = t ? [t.x, t.y, 'tap'] : null;
  }
  var hidden = !spec || (scr && scr.hidden) || stageProgress()>=0.34 || State.coachOff;
  if(hidden){ el.classList.add('hidden'); return; }
  var s=toScreen(spec[0], spec[1]);
  el.style.left=Math.round(s.x)+'px';
  el.style.top =Math.round(s.y)+'px';
  document.body.setAttribute('data-coach', spec[2]);
  el.classList.remove('hidden');
}

function updateProgress(){
  var p=stageProgress();
  $('#progBar').firstElementChild.style.width=Math.round(p*100)+'%';
  $('#progPct').textContent='%'+Math.round(p*100);
  $('#progLabel').textContent=STAGES[State.currentStage].name+(stageOptional()?' · isteğe bağlı':'');
  var nb=$('#btnNext');
  var last=State.currentStage>=STAGES.length-1;
  nb.textContent = last? 'Bitir' : 'İleri';
  nb.disabled = last ? true : !canAdvance();
  updateSceneBadges();
  renderStageRail();
  updateCoach();
}

/* ---------- Aşama rayı ---------- */
function renderStageRail(){
  var r=$('#stageRail');
  var html='';
  STAGES.forEach(function(s,i){
    var cls='stg'+(i===State.currentStage?' cur':'')+(State.stageDone[s.id]?' done':'');
    html+='<button class="'+cls+'" data-stage="'+i+'">'+
          '<span class="num">'+(i+1)+'</span>'+icon(State.stageDone[s.id]?'check':s.icon)+
          '<span class="lab">'+s.name+'</span></button>';
  });
  r.innerHTML=html;
}

/* ============================================================
   Aşama etkileşim yönlendiricisi
   ============================================================ */
var Stage = {
  onDown:function(p){
    var id=STAGES[State.currentStage].id;
    if(id==='braid'){ return; }
    if(id==='acc'){ this.accDown(p); return; }
    if(id==='cut'){ this.cutAt(p); return; }
    this.onDrag(p,{dx:0,dy:0,d:0});
  },
  onHover:function(){},
  onUp:function(){
    var id=STAGES[State.currentStage].id;
    if(id==='acc'){ State.accDragging=false; }
    if(id==='care'){ State.careStroke=0; }
    updateProgress();
  },
  onDrag:function(p,mv){
    var id=STAGES[State.currentStage].id;
    if(!inHairArea(p.x,p.y) && id!=='acc' && id!=='cut') { return; }
    switch(id){
      case 'wash':  this.wash(p,mv); break;
      case 'care':  this.care(p,mv); break;
      case 'dry':   this.dry(p,mv); break;
      case 'comb':  this.comb(p,mv); break;
      case 'cut':   break;
      case 'dye':   this.dye(p,mv); break;
      case 'style': this.style(p,mv); break;
      case 'acc':   this.accDrag(p,mv); break;
    }
    if(mv.d>1.4) nudgeSway(p.x<300?'L':'R', (p.x<300?-1:1)*mv.d*0.006);
  },

  /* ---------- 1. YIKAMA ---------- */
  wash:function(p,mv){
    var t=State.selectedTool;
    if(t==='water'||t==='rinse'){
      paintGrid('wet',p.x,p.y,86,0.17,1);
      if(t==='rinse') paintGrid('foam',p.x,p.y,86,-0.20,1,0);
      if(Math.random()<0.4) spawn('drop',p.x+rnd(-20,20),p.y+rnd(-10,10),{vy:rnd(1.4,2.6),vx:rnd(-.2,.2),r:rnd(2,4),decay:.02});
      if(Math.random()<0.10) Audio_.water();
      State.hairWetness=clamp(State.hairWetness+0.012,0,1);
    } else if(t==='shampoo'){
      var cellWet=0, i;
      for(i=0;i<GRID.cells.length;i++){
        var c=GRID.cells[i];
        if(!c.on) continue;
        if(Math.abs(c.x-p.x)<30 && Math.abs(c.y-p.y)<30) cellWet=Math.max(cellWet,c.wet);
      }
      if(cellWet<0.25){ if(Math.random()<0.04) toast('Önce saçı ıslatmalısın.'); return; }
      var boost=0.055*(1+Math.min(1,Input.circle));
      paintGrid('foam',p.x,p.y,80,boost*2.1,1);
      State.foamPeak=Math.max(State.foamPeak||0, gridPct('foam',.5));
      if(Math.random()<0.45) spawn('bubble',p.x+rnd(-26,26),p.y+rnd(-22,22),{r:rnd(3,9),vy:rnd(-.5,-.1),decay:.012});
      State.hairSoftness=clamp(State.hairSoftness+0.05,0,100);
    } else if(t==='towel'){
      paintGrid('wet',p.x,p.y,80,-0.10,1,0);
      paintGrid('foam',p.x,p.y,80,-0.08,1,0);
    }
    State.hairWetness=gridPct('wet',0.35);
    State.hairFoam=gridPct('foam',0.5);
    if(Math.random()<0.06) renderHair();
    if(stageProgress()>0.99 && !State.stageDone.wash){
      State.stageDone.wash=true; sparkleBurst(300,320,14); Audio_.good();
      setExpression('smile',2.2); bumpTask('wash1',1);
    }
    updateProgress();
  },

  /* ---------- 2. BAKIM ---------- */
  care:function(p,mv){
    if(mv.dy<0.4) return;                    // yalnızca aşağı yönlü sürükleme
    State.careAcc=(State.careAcc||0)+mv.d;
    if(State.careAcc>52){
      State.careAcc=0; State.strokesCare++;
      var t=State.selectedTool;
      if(t==='conditioner'){ State.hairSoftness+=5.5; State.hairShine+=2.2; State.hairHealth+=1.4; }
      else if(t==='hairmask'){ State.hairHealth+=6.0; State.hairSoftness+=2.4; State.hairShine+=1.6; }
      else if(t==='serum'){ State.hairShine+=6.2; State.hairSoftness+=1.6; State.hairHealth+=1.0; }
      State.hairHealth=clamp(State.hairHealth,0,100);
      State.hairShine=clamp(State.hairShine,0,100);
      State.hairSoftness=clamp(State.hairSoftness,0,100);
      sparkleBurst(p.x,p.y,4); Audio_.tone(720+State.strokesCare*24,0.09,'sine',0.05);
      updateMeters(); renderHair();
      if(State.strokesCare===10){ setExpression('happy',2.4); Audio_.good(); State.stageDone.care=true; }
    }
    updateProgress();
  },

  /* ---------- 3. KURUTMA ---------- */
  dry:function(p,mv){
    var t=State.selectedTool;
    if(t==='towel'){
      paintGrid('wet',p.x,p.y,84,-0.100,1,0);
      State.hairSoftness=clamp(State.hairSoftness-0.02,0,100);
    } else if(t==='dryer'){
      paintGrid('wet',p.x,p.y,90,-0.070,1,0);
      if(mv.d<0.9){
        State.dryHold+=1;
        State.heat=clamp(State.heat+1.4,0,100);
        if(State.dryHold>52){
          State.dryHold=0; State.hairHealth=clamp(State.hairHealth-2.2,0,100);
          State.mistakes++; setExpression('uneasy',1.1); Audio_.bad();
          toast('Fönü aynı noktada tutma, saç yıpranıyor.');
          updateMeters();
        }
      } else { State.dryHold=Math.max(0,State.dryHold-2); State.heat=clamp(State.heat-0.4,0,100); }
      $('#heatBar').style.height=State.heat+'%';
      if(Math.random()<0.12) Audio_.dryer();
      nudgeSway(p.x<300?'L':'R',(p.x<300?-1:1)*0.06);
    }
    var w=gridPct('wet',0.35);
    if(Math.abs(w-State.hairWetness)>0.03){ State.hairWetness=w; renderHair(); }
    else State.hairWetness=w;
    if(State.hairWetness<=0.10 && !State.stageDone.dry){
      State.stageDone.dry=true; State.hairShine=clamp(State.hairShine+6,0,100);
      updateMeters(); renderHair(); sparkleBurst(300,300,12); Audio_.good(); setExpression('smile',2);
    }
    updateProgress();
  },

  /* ---------- 4. TARAMA ---------- */
  comb:function(p,mv){
    if(mv.d<0.8) return;
    if(mv.dy<-2.5 && mv.d>4){          // saçı yukarı doğru sert çekmek
      State.combWrong=(State.combWrong||0)+1;
      if(State.combWrong>16){
        State.combWrong=0; State.mistakes++;
        State.hairHealth=clamp(State.hairHealth-1.2,0,100);
        setExpression('uneasy',1.0); Audio_.bad(); toast('Saçı ters yönde çekme.');
        updateMeters(); nudgeSway('C',0.5);
      }
      return;
    }
    if(mv.dy<=0.2) return;             // tarama yukarıdan aşağı yapılır
    var eff = State.selectedTool==='combWide'?1.0 : State.selectedTool==='combFine'?0.75 : 0.9;
    var any=false;
    State.tangles.forEach(function(t){
      if(t.done) return;
      var d=Math.hypot(t.x-p.x, t.y-p.y);
      if(d<34){
        t.life-=0.035*eff*Math.min(3,mv.d);
        any=true;
        if(t.life<=0){
          t.done=true; sparkleBurst(t.x,t.y,8); Audio_.good();
          State.hairSoftness=clamp(State.hairSoftness+2.5,0,100);
          State.hairShine=clamp(State.hairShine+2.0,0,100);
          updateMeters();
        }
      }
    });
    if(any){ renderTangles(); }
    State.combProgress=clamp(State.combProgress+mv.d*0.002,0,1);
    if(State.selectedTool==='roundBrush'){ State.hairShine=clamp(State.hairShine+0.05,0,100); }
    if(State.tangles.every(function(t){return t.done;}) && !State.stageDone.comb){
      State.stageDone.comb=true; setExpression('happy',2.2); Audio_.reward();
      State.hairShine=clamp(State.hairShine+5,0,100); updateMeters(); renderHair();
    }
    updateProgress();
  },

  /* ---------- 5. KESİM ---------- */
  cutAt:function(p){
    if(State.selectedTool==='guide'){ toast('Uzunluk kılavuzu açık: kesim çizgisi göründü.'); return; }
    if(p.y<330){ toast('Kesim yalnızca saç uçlarında yapılabilir.'); return; }
    var side = p.x<300 ? 'L':'R';
    var baseTip = 206+430;                     // yaklaşık uç yüksekliği (tam uzunlukta)
    var target = clamp((p.y-206)/430, 0.34, 1);
    var cur = side==='L'?State.hairLengthLeft:State.hairLengthRight;
    if(target>=cur-0.005){ toast('Bu noktada kesilecek saç yok.'); return; }
    pushUndo();
    var trim = State.selectedTool==='thinning' ? cur-(cur-target)*0.5 : target;
    if(State.selectedTool==='razor') trim = cur-(cur-target)*0.8;
    if(side==='L') State.hairLengthLeft=trim; else State.hairLengthRight=trim;
    State.usedTools.cut=true;
    /* düşen saç parçacıkları */
    var col=colorById(State.hairColor).hex;
    for(var i=0;i<10;i++)
      spawn('cut', p.x+rnd(-46,46), p.y+rnd(-12,12), {col:col, len:rnd(14,30), vy:rnd(.6,1.6), vx:rnd(-.5,.5), decay:.012});
    if(State.selectedTool==='thinning') State.hairSoftness=clamp(State.hairSoftness+1.5,0,100);
    if(State.selectedTool==='razor') State.hairHealth=clamp(State.hairHealth-1.2,0,100);
    Audio_.snip(); nudgeSway(side, side==='L'?-0.7:0.7);
    renderHair(); updateMeters(); updateProgress();
  },
  evenSides:function(){
    pushUndo();
    var m=Math.min(State.hairLengthLeft,State.hairLengthRight);
    State.hairLengthLeft=m; State.hairLengthRight=m;
    State.usedTools.cut=true;
    Audio_.snip(); renderHair(); updateProgress(); toast('İki taraf eşitlendi.');
  },
  resetCut:function(){
    pushUndo();
    State.hairLengthLeft=1; State.hairLengthRight=1;
    renderHair(); updateProgress(); toast('Kesim sıfırlandı.');
  },

  /* ---------- 6. BOYAMA ---------- */
  dye:function(p,mv){
    if(!State.dyeColor){ if(Math.random()<0.05) toast('Önce bir renk seç.'); return; }
    var region=regionAt(p.x,p.y);
    if(!region) return;
    if(!State._dyeUndoDone){ pushUndo(); State._dyeUndoDone=true; }
    var tech=State.dyeTechnique;
    var targets=[region];
    if(tech==='full') targets=HAIR_DEFS.slice();
    if(tech==='front') targets=['faceL','faceR','bangs'];
    if(tech==='hidden') targets=['back'];
    if(tech==='split') targets=[p.x<300?'sideL':'sideR'];
    var changed=false;
    targets.forEach(function(r){
      var cur=State.dyedRegions[r];
      if(!cur||cur.color!==State.dyeColor||cur.tech!==tech){
        State.dyedRegions[r]={color:State.dyeColor, tech:tech};
        changed=true;
      }
    });
    if(tech==='full' && changed){
      var cid=null;
      HAIR_COLORS.forEach(function(c){ if(c.hex===State.dyeColor) cid=c.id; });
      if(cid) State.hairColor=cid;
    }
    if(Math.random()<0.5) spawn('dye',p.x+rnd(-16,16),p.y+rnd(-16,16),{col:State.dyeColor,r:rnd(3,7),decay:.03,vy:rnd(-.3,.3),vx:rnd(-.3,.3)});
    if(changed){
      refreshHairGradients(); renderHair();
      Audio_.tone(560,0.07,'sine',0.04);
      sparkleBurst(p.x,p.y,3);
      updateProgress();
    }
  },

  /* ---------- 7. ŞEKİLLENDİRME ---------- */
  style:function(p,mv){
    var t=State.selectedTool;
    if(!t) return;
    var model=null;
    STYLE_MODELS.forEach(function(m){ if(m.id===State.hairStyle) model=m; });
    if(!model) model=STYLE_MODELS[1];
    var side=p.x<300?'L':'R';
    var target=model.wave;
    State.styleWave[side]=lerp(State.styleWave[side], target, 0.06);
    applyStyleWaves(model);
    State.usedTools.style=true;
    /* ısı */
    var heatUp = (t==='flatiron'?1.5 : t==='curlerBig'?1.3 : t==='curlerSmall'?1.5 : t==='waver'?1.2 : 0.4);
    State.heat=clamp(State.heat+heatUp,0,100);
    $('#heatBar').style.height=State.heat+'%';
    if(State.heat>78){
      var dmg=State.heatProtect?0.10:0.30;
      State.hairHealth=clamp(State.hairHealth-dmg,0,100);
      if(Math.random()<0.03){ setExpression('uneasy',0.9); if(!State.heatProtect) toast('Isı çok yüksek — ısı koruyucu kullan.'); }
      updateMeters();
    } else if(State.heat>30){
      State.hairShine=clamp(State.hairShine+0.05,0,100); updateMeters();
    }
    if(Math.random()<0.08){ renderHair(); }
    if(Math.random()<0.06) sparkleBurst(p.x,p.y,2);
    updateProgress();
  },

  /* ---------- 9. AKSESUAR ---------- */
  accDown:function(p){
    /* mevcut aksesuara dokunulduysa taşı */
    for(var i=State.accessories.length-1;i>=0;i--){
      var a=State.accessories[i];
      if(Math.hypot(a.x-p.x,a.y-p.y)<30){
        State.accSelected=i; State.accDragging=true;
        renderAccessories(); buildToolPanel(); return;
      }
    }
    if(!State.accPending){ toast('Önce tepsiden bir aksesuar seç.'); return; }
    if(!inHairArea(p.x,p.y)){
      toast('Aksesuarı saçın üzerine bırakmalısın.'); Audio_.bad(); return;
    }
    pushUndo();
    State.accessories.push({type:State.accPending, x:p.x, y:p.y, rot:0, scale:1, color:State.accColor||null});
    State.accSelected=State.accessories.length-1;
    State.accDragging=true;
    State.accPending=null;
    Audio_.good(); sparkleBurst(p.x,p.y,6);
    renderAccessories(); buildToolPanel(); updateProgress();
    bumpTask('acc3',1);
  },
  accDrag:function(p){
    if(!State.accDragging||State.accSelected==null) return;
    var a=State.accessories[State.accSelected];
    if(!a) return;
    a.x=p.x; a.y=p.y;
    renderAccessories();
  }
};

/* --- Boyama için bölge tespiti --- */
function regionAt(x,y){
  if(!inHairArea(x,y)) return null;
  if(y<205 && Math.abs(x-300)<70) return 'bangs';
  if(y<240 && Math.abs(x-300)<110) return 'top';
  if(Math.abs(x-300)<86 && y>240) return 'back';
  if(x<300) return (y<330? 'faceL' : 'sideL');
  return (y<330? 'faceR' : 'sideR');
}
/* --- Model dalga değerlerini tutamlara uygula --- */
function applyStyleWaves(model){
  STYLE_WAVES = model.waves;
  for(var i=0;i<STRANDS.length;i++){
    var s=STRANDS[i];
    if(model.id==='tipcurl'){ s.waves=1.05; }
    else s.waves = (s.baseWaves||s.waves);
    if(!s.baseWaves) s.baseWaves=s.waves;
    s.waves = model.waves * (s.bang?0.7:1) * (0.85+((i%5)*0.07));
  }
}

function accGlyphMarkup(type){
