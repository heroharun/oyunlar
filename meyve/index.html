<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<title>MEYVE DİLİMLE — Kes, Kes, Kes!</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  :root{ --bg:#2a1a0c; --ink:#fdf6e8; --dim:#e6d2ab; --gold:#ffd166; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Avenir Next","Futura","Trebuchet MS",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));pointer-events:none}
  #hud>div{background:linear-gradient(180deg,rgba(48,27,10,.6),rgba(30,16,6,.42));
    border:1px solid rgba(255,225,170,.22);border-radius:16px;padding:6px 14px 8px;
    box-shadow:0 4px 12px rgba(30,10,0,.28),inset 0 1px 0 rgba(255,255,255,.12);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .value{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 2px 4px rgba(0,0,0,.35)}
  #combo{position:fixed;top:16%;left:50%;transform:translateX(-50%);font-size:32px;font-weight:900;
    color:var(--gold);opacity:0;pointer-events:none;white-space:nowrap;
    text-shadow:0 2px 0 #a34d00,0 5px 12px rgba(0,0,0,.45),0 0 26px rgba(255,180,70,.85)}
  #combo.pop{animation:cpop .8s cubic-bezier(.22,1.35,.36,1)}
  @keyframes cpop{0%{opacity:0;transform:translateX(-50%) scale(.3) rotate(-9deg)}
    22%{opacity:1;transform:translateX(-50%) scale(1.28) rotate(3deg)}
    40%{transform:translateX(-50%) scale(.94) rotate(-2deg)}
    55%{transform:translateX(-50%) scale(1.05) rotate(0deg)}
    80%{opacity:1;transform:translateX(-50%) scale(1)}
    100%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(1)}}
  .card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;
    background:radial-gradient(130% 100% at 50% 0%,rgba(74,42,14,.42) 0%,rgba(42,23,8,.66) 55%,rgba(22,12,4,.82) 100%);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    transition:opacity .3s;padding:24px;z-index:10}
  .card.hidden{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
  .card.hidden .btn{pointer-events:none}
  .card h1{font-size:clamp(36px,10vw,76px);font-weight:900;line-height:.96;
    background:linear-gradient(180deg,#ffe98a 0%,#ffb03a 34%,#ff5f6d 68%,#d42a52 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;transform:rotate(-2deg);
    filter:drop-shadow(0 3px 0 rgba(74,26,4,.55)) drop-shadow(0 10px 22px rgba(0,0,0,.45))}
  .card p{max-width:34ch;color:var(--dim);font-size:15px;line-height:1.5;text-shadow:0 1px 3px rgba(0,0,0,.4)}
  .card .big{font-size:34px;font-weight:800;color:var(--gold);
    background:linear-gradient(180deg,rgba(255,209,102,.16),rgba(255,209,102,.05));
    border:1px solid rgba(255,209,102,.4);border-radius:999px;padding:10px 28px;
    box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);
    text-shadow:0 2px 6px rgba(0,0,0,.4)}
  .btn{font:inherit;font-weight:900;font-size:18px;letter-spacing:.08em;text-transform:uppercase;
    color:#1d3a0c;background:linear-gradient(180deg,#c9f280 0%,#8fd455 45%,#63b232 100%);
    border:none;border-radius:999px;padding:16px 44px;cursor:pointer;
    box-shadow:0 6px 0 #3c7a1e,0 14px 28px rgba(20,40,5,.45),inset 0 2px 0 rgba(255,255,255,.6);
    text-shadow:0 1px 0 rgba(255,255,255,.35);animation:btnPulse 2.4s ease-in-out infinite}
  @keyframes btnPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3c7a1e,0 6px 14px rgba(20,40,5,.4),
    inset 0 2px 0 rgba(255,255,255,.6);animation:none}
  .btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .hint{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  #bestIntro{background:linear-gradient(180deg,rgba(255,209,102,.16),rgba(255,209,102,.04));
    border:1px solid rgba(255,209,102,.38);color:var(--gold);border-radius:999px;
    padding:8px 18px;box-shadow:0 3px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.15)}
  #bestIntro:empty{display:none}
  .pick{box-shadow:0 3px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.15)!important;
    background:linear-gradient(180deg,rgba(255,240,210,.16),rgba(255,240,210,.05))!important}
</style>

<canvas id="cv"></canvas>
<div id="hud">
  <div><div class="label">Skor</div><div class="value" id="scoreEl">0</div></div>
  <div style="text-align:right"><div class="label">Can</div><div class="value" id="lifeEl">❤️❤️❤️</div></div>
</div>
<div id="combo"></div>

<div class="card" id="intro">
  <h1>MEYVE DİLİMLE</h1>
  <p>Parmağını hızla sürükleyerek havadaki meyveleri dilimle! Bombalara sakın dokunma 💣. Aynı çizgide 2-3 meyve kesersen kombo puanı!</p>
  <div style="display:flex;gap:8px;align-items:center">
    <span class="hint">Tahta:</span>
    <button class="pick" id="bgBtn" style="font:inherit;font-size:13px;font-weight:800;color:var(--ink);background:rgba(242,247,234,.08);border:2px solid rgba(242,247,234,.3);border-radius:10px;padding:8px 14px;cursor:pointer">🪵 Ahşap</button>
    <span class="hint">Bıçak:</span>
    <button class="pick" id="knifeBtn" style="font:inherit;font-size:13px;font-weight:800;color:var(--ink);background:rgba(242,247,234,.08);border:2px solid rgba(242,247,234,.3);border-radius:10px;padding:8px 14px;cursor:pointer">🔪 Klasik</button>
  </div>
  <button class="btn" id="startBtn">Kes Biçim!</button>
  <span class="hint" id="bestIntro"></span>
</div>

<div class="card hidden" id="endcard">
  <h1 style="background:linear-gradient(180deg,#ff8f7a,#e84a5f);-webkit-background-clip:text;background-clip:text" id="endTitle">Oyun Bitti</h1>
  <div class="big" id="endScore"></div>
  <p id="endMsg"></p>
  <button class="btn" id="retryBtn">Tekrar</button>
</div>

<script>
'use strict';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  try{ bgDirty=true; }catch(e){} }
addEventListener('resize',resize); resize();

let AC=null;
const audio=()=>{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; };
function slice_(f=600){ try{ const a=audio(),t=a.currentTime;
  const buf=a.createBuffer(1,a.sampleRate*0.1,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const n=a.createBufferSource(); n.buffer=buf;
  const flt=a.createBiquadFilter(); flt.type='bandpass'; flt.frequency.value=f;
  const g=a.createGain(); g.gain.value=0.25;
  n.connect(flt).connect(g).connect(a.destination); n.start(t); }catch(e){} }
function boom(){ try{ const a=audio(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(30,t+0.5);
  g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+0.55);}catch(e){} }
const buzz=ms=>{ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} };

const FRUITS=[
  {t:'karpuz',c:'#ff5f7a'},{t:'portakal',c:'#ff9f1c'},{t:'elma',c:'#e84a5f'},
  {t:'limon',c:'#ffd166'},{t:'kivi',c:'#8bc34a'},{t:'cilek',c:'#ff6b8a'},{t:'seftali',c:'#ffb08a'}];
let fruits=[], halves=[], juices=[], trail=[], stains=[], score=0, lives=3, state='intro', tick=0, spawnT=60, comboArr=[];
let best=0; try{ best=+localStorage.getItem('meyve_best')||0; }catch(e){}
document.getElementById('bestIntro').textContent=best>0?'REKORUN: '+best:'';

function reset(){ fruits=[]; halves=[]; juices=[]; trail=[]; stains=[]; score=0; lives=3; spawnT=40; comboArr=[]; updHud(); }
function updHud(){
  document.getElementById('scoreEl').textContent=score;
  document.getElementById('lifeEl').textContent='❤️'.repeat(Math.max(0,lives));
}
function spawn(){
  const n=1+Math.floor(Math.random()*Math.min(3,1+score/150));
  for(let i=0;i<n;i++){
    const isBomb=Math.random()<0.12&&score>30;
    const x=W*0.15+Math.random()*W*0.7;
    fruits.push({
      x, y:H+40,
      vx:(W/2-x)*0.004+(Math.random()-.5)*2.5,
      vy:-(H*0.021+Math.random()*H*0.004),
      r:Math.min(42,W*0.078), rot:Math.random()*6.28, vr:(Math.random()-.5)*0.1,
      f: isBomb?null:FRUITS[Math.floor(Math.random()*FRUITS.length)],
      bomb:isBomb
    });
  }
}
function physics(){
  tick++;
  spawnT--;
  if(spawnT<=0){ spawn(); spawnT=70+Math.random()*60-Math.min(30,score/20); }
  const G=H*0.00037;
  for(const f of fruits){ f.vy+=G; f.x+=f.vx; f.y+=f.vy; f.rot+=f.vr; }
  // düşen meyveler
  for(const f of fruits){
    if(f.y>H+60&&f.vy>0&&!f.dead){
      f.dead=true;
      if(!f.bomb){ lives--; updHud(); buzz(50);
        if(lives<=0){ gameOver('Meyveler yere düştü!'); return; } }
    }
  }
  fruits=fruits.filter(f=>!f.dead);
  for(const h of halves){ h.vy+=G*1.4; h.x+=h.vx; h.y+=h.vy; h.rot+=h.vr; }
  halves=halves.filter(h=>h.y<H+80);
  for(const j of juices){ j.x+=j.vx; j.y+=j.vy; j.vy+=0.25; j.life-=0.03; }
  juices=juices.filter(j=>j.life>0);
  trail=trail.filter(t=>tick-t.t<8);
  if(comboArr.length&&tick-comboArr[0]>18){
    if(comboArr.length>=2){
      const bonus=comboArr.length*comboArr.length*5;   // 2'li +20, 3'lü +45, 4'lü +80
      score+=bonus; updHud();
      const c=document.getElementById('combo');
      c.textContent=comboArr.length+"'Lİ KESİM! +"+bonus;
      c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
      buzz(20);
    }
    comboArr=[];
  }
}
function cut(f){
  if(f.bomb){
    boom(); buzz([80,50,120]);
    for(let i=0;i<24;i++) juices.push({x:f.x,y:f.y,vx:(Math.random()-.5)*10,
      vy:(Math.random()-.5)*10,life:1,col:i%2?'#ffd166':'#e84a5f',size:Math.random()*6+3});
    gameOver('Bombaya dokundun! 💣'); return;
  }
  f.dead=true; score+=10; comboArr.push(tick); updHud();
  slice_(400+Math.random()*400); buzz(8);
  for(const s of [-1,1]) halves.push({x:f.x,y:f.y,vx:f.vx+s*2.5,vy:f.vy-1,
    rot:f.rot,vr:s*0.15,f:f.f,side:s,r:f.r});
  for(let i=0;i<14;i++) juices.push({x:f.x,y:f.y,vx:(Math.random()-.5)*7,
    vy:(Math.random()-.5)*7-1,life:1,col:f.f.c,size:Math.random()*5+2});
  for(let i=0;i<4;i++) juices.push({x:f.x,y:f.y,vx:(Math.random()-.5)*9,
    vy:(Math.random()-.5)*9-2,life:.8,col:'#fff8e8',size:Math.random()*3+1.5});
  stains.push({x:f.x,y:f.y,col:f.f.c,life:1,seed:Math.random()*100});
}
function gameOver(msg){
  state='over';
  const nb=score>best; if(nb){ best=score; try{localStorage.setItem('meyve_best',best);}catch(e){} }
  document.getElementById('endScore').textContent=score+' puan';
  document.getElementById('endMsg').textContent=(nb?'YENİ REKOR! 🏆 ':'Rekor: '+best+' · ')+msg;
  document.getElementById('endcard').classList.remove('hidden');
}

/* kesme girdisi */
let cutting=false, lastP=null;
function pt(e){ const t=e.touches?e.touches[0]:e; return {x:t.clientX,y:t.clientY}; }
function down(e){ if(e.target.closest('.card'))return; cutting=true; lastP=pt(e); audio(); }
function moveH(e){
  if(!cutting||state!=='play') return;
  const p=pt(e);
  trail.push({x:p.x,y:p.y,t:tick});
  if(lastP){
    const steps=Math.ceil(Math.hypot(p.x-lastP.x,p.y-lastP.y)/8);
    for(let i=0;i<=steps;i++){
      const ix=lastP.x+(p.x-lastP.x)*i/steps, iy=lastP.y+(p.y-lastP.y)*i/steps;
      for(const f of fruits){ if(!f.dead&&Math.hypot(ix-f.x,iy-f.y)<f.r+8){ cut(f); if(state!=='play')return; } }
    }
  }
  lastP=p;
  fruits=fruits.filter(f=>!f.dead);
}
addEventListener('touchstart',down,{passive:true});
addEventListener('touchmove',moveH,{passive:true});
addEventListener('touchend',()=>{ cutting=false; lastP=null; });
addEventListener('mousedown',down);
addEventListener('mousemove',moveH);
addEventListener('mouseup',()=>{ cutting=false; lastP=null; });

/* arka planlar */
const TAU=Math.PI*2;
function prnd(i){ const x=Math.sin(i*127.1+13.7)*43758.5453; return x-Math.floor(x); }
function woodPlank(c,wy){ // dokulu ahşap tezgâh (damar + budak + kenar highlight)
  let g=c.createLinearGradient(0,wy,0,H);
  g.addColorStop(0,'#b07a42'); g.addColorStop(.5,'#8a5a2e'); g.addColorStop(1,'#5f3d1c');
  c.fillStyle=g; c.fillRect(0,wy,W,H-wy);
  for(let i=0;i<12;i++){ const y0=wy+prnd(i*7+30)*(H-wy);
    c.strokeStyle='rgba(58,32,12,'+(0.12+prnd(i+60)*0.15).toFixed(3)+')';
    c.lineWidth=1+prnd(i+70)*2.4;
    c.beginPath(); c.moveTo(0,y0);
    c.bezierCurveTo(W*.3,y0+prnd(i+80)*24-12, W*.6,y0-prnd(i+90)*24+12, W,y0+prnd(i+95)*16-8);
    c.stroke(); }
  c.strokeStyle='rgba(255,224,172,.1)'; c.lineWidth=1;
  for(let i=0;i<7;i++){ const y0=wy+8+((H-wy)/7)*i;
    c.beginPath(); c.moveTo(0,y0); c.quadraticCurveTo(W/2,y0+9,W,y0-4); c.stroke(); }
  for(let i=0;i<3;i++){ const kx=prnd(i*31+7)*W, ky=wy+22+prnd(i*37+9)*Math.max(10,H-wy-44);
    c.strokeStyle='rgba(50,28,10,.3)';
    for(let k=1;k<=3;k++){ c.lineWidth=1.4;
      c.beginPath(); c.ellipse(kx,ky,7*k,3.4*k,0.15,0,TAU); c.stroke(); } }
  c.fillStyle='rgba(0,0,0,.24)'; c.fillRect(0,wy,W,5);
  c.fillStyle='rgba(255,236,190,.5)'; c.fillRect(0,wy-2.5,W,2.5);
}
function leafSil(c,n,ymax,alpha){ // bokeh yaprak silüetleri
  for(let i=0;i<n;i++){ const x=prnd(i*11+4)*W, y=prnd(i*13+6)*ymax,
      r=prnd(i*17+8)*26+14, a=prnd(i)*TAU;
    c.save(); c.translate(x,y); c.rotate(a); c.fillStyle='rgba(34,66,24,'+alpha+')';
    c.beginPath(); c.ellipse(0,0,r,r*.42,0,0,TAU); c.fill();
    c.strokeStyle='rgba(34,66,24,'+(alpha*1.2).toFixed(3)+')'; c.lineWidth=1.5;
    c.beginPath(); c.moveTo(-r,0); c.lineTo(r,0); c.stroke(); c.restore(); }
}
const BGS=[
  {name:'🪵 Ahşap', draw(c){ // gün ışıklı meyve bahçesi mutfağı
    let g=c.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#ffeec2'); g.addColorStop(.3,'#ffd98e');
    g.addColorStop(.52,'#c3d67e'); g.addColorStop(.66,'#7fa64e'); g.addColorStop(1,'#54793a');
    c.fillStyle=g; c.fillRect(0,0,W,H);
    g=c.createRadialGradient(W*.75,H*.1,0,W*.75,H*.1,W*.65);
    g.addColorStop(0,'rgba(255,250,220,.6)'); g.addColorStop(1,'rgba(255,250,220,0)');
    c.fillStyle=g; c.fillRect(0,0,W,H);
    for(let i=0;i<16;i++){ const x=prnd(i*3)*W, y=prnd(i*5+1)*H*.6, r=prnd(i*7+2)*38+10;
      c.fillStyle='rgba(255,246,204,'+(0.05+prnd(i)*0.09).toFixed(3)+')';
      c.beginPath(); c.arc(x,y,r,0,TAU); c.fill(); }
    leafSil(c,10,H*.55,0.16);
    woodPlank(c,H*.66); }},
  {name:'🥩 Kasap', draw(c){ // sıcak kasap bloğu
    let g=c.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#c08850'); g.addColorStop(1,'#84542a');
    c.fillStyle=g; c.fillRect(0,0,W,H);
    const s=Math.max(56,W/6);
    let row=0;
    for(let y=0;y<H;y+=s,row++){
      const off=(row%2)*s/2;
      for(let x=-s;x<W;x+=s){
        const i=Math.round((x+off)/s)+row*13;
        c.fillStyle='rgba('+(prnd(i)>.5?'255,220,170':'40,18,4')+','+(0.04+prnd(i+3)*0.1).toFixed(3)+')';
        c.fillRect(x+off,y,s,s);
        c.strokeStyle='rgba(40,16,2,.28)'; c.lineWidth=2; c.strokeRect(x+off,y,s,s);
        c.strokeStyle='rgba(255,230,180,.12)'; c.lineWidth=1;
        c.strokeRect(x+off+1.5,y+1.5,s-3,s-3);
        c.strokeStyle='rgba(60,30,8,'+(0.1+prnd(i+7)*0.1).toFixed(3)+')';
        for(let k=1;k<=2;k++){ c.beginPath();
          c.ellipse(x+off+s/2,y+s/2,s*.14*k+prnd(i+k)*6,s*.1*k,prnd(i+k*5)*3,0,TAU); c.stroke(); }
      } }
    g=c.createRadialGradient(W/2,0,0,W/2,0,H);
    g.addColorStop(0,'rgba(255,240,200,.14)'); g.addColorStop(1,'rgba(255,240,200,0)');
    c.fillStyle=g; c.fillRect(0,0,W,H); }},
  {name:'⬜ Mermer', draw(c){ // ışıltılı mermer tezgâh
    let g=c.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#f4f3f6'); g.addColorStop(0.5,'#dcdbe4'); g.addColorStop(1,'#ecebf1');
    c.fillStyle=g; c.fillRect(0,0,W,H);
    for(let i=0;i<9;i++){ const x0=prnd(i*5)*W*1.2-W*.1;
      c.strokeStyle='rgba(128,128,150,'+(0.12+prnd(i+20)*0.22).toFixed(3)+')';
      c.lineWidth=0.8+prnd(i+30)*2.4;
      c.beginPath(); c.moveTo(x0,0);
      c.bezierCurveTo(x0+prnd(i+1)*160-80,H*0.33,x0-prnd(i+2)*140+70,H*0.66,x0+prnd(i+3)*120-60,H);
      c.stroke();
      c.strokeStyle='rgba(160,150,120,.14)'; c.lineWidth=0.7;
      c.beginPath(); c.moveTo(x0+8,H*prnd(i+4)*.4);
      c.quadraticCurveTo(x0+prnd(i+5)*90-30,H*.5,x0+prnd(i+6)*60-30,H*.8); c.stroke(); }
    for(let i=0;i<40;i++){ c.fillStyle='rgba(190,164,92,'+(0.08+prnd(i)*0.16).toFixed(3)+')';
      c.fillRect(prnd(i*7)*W,prnd(i*11+2)*H,1.6,1.6); }
    g=c.createLinearGradient(0,0,W,H*.7);
    g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(.45,'rgba(255,255,255,.3)');
    g.addColorStop(.55,'rgba(255,255,255,.3)'); g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=g; c.fillRect(0,0,W,H); }},
  {name:'🌙 Gece', draw(c){ // yıldızlı gece bahçesi
    let g=c.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#2b2554'); g.addColorStop(.55,'#161234'); g.addColorStop(1,'#0a0918');
    c.fillStyle=g; c.fillRect(0,0,W,H);
    for(let i=0;i<55;i++){ const x=prnd(i*3+1)*W, y=prnd(i*7+2)*H*.7, r=.6+prnd(i)*1.6;
      c.save(); c.shadowColor='rgba(255,255,255,.8)'; c.shadowBlur=4+prnd(i+9)*5;
      c.fillStyle='rgba(255,255,240,'+(0.35+prnd(i+5)*0.6).toFixed(3)+')';
      c.beginPath(); c.arc(x,y,r,0,TAU); c.fill(); c.restore(); }
    const mx=W*.78,my=H*.16,mr=Math.min(W,H)*.085;
    g=c.createRadialGradient(mx,my,mr*.4,mx,my,mr*3.2);
    g.addColorStop(0,'rgba(244,238,214,.5)'); g.addColorStop(1,'rgba(244,238,214,0)');
    c.fillStyle=g; c.beginPath(); c.arc(mx,my,mr*3.2,0,TAU); c.fill();
    g=c.createRadialGradient(mx-mr*.3,my-mr*.3,mr*.2,mx,my,mr);
    g.addColorStop(0,'#fbf6e4'); g.addColorStop(1,'#d9d0ae');
    c.fillStyle=g; c.beginPath(); c.arc(mx,my,mr,0,TAU); c.fill();
    c.fillStyle='rgba(120,110,80,.16)';
    for(let i=0;i<4;i++){ c.beginPath();
      c.arc(mx+(prnd(i*5)-.5)*mr*1.2,my+(prnd(i*9+1)-.5)*mr*1.2,mr*(0.1+prnd(i)*0.16),0,TAU); c.fill(); }
    leafSil(c,7,H*.4,0.3);
    const wy=H*.74;
    g=c.createLinearGradient(0,wy,0,H);
    g.addColorStop(0,'#2c2440'); g.addColorStop(1,'#141020');
    c.fillStyle=g; c.fillRect(0,wy,W,H-wy);
    c.strokeStyle='rgba(255,255,255,.05)'; c.lineWidth=1;
    for(let i=0;i<6;i++){ const y0=wy+8+((H-wy)/6)*i;
      c.beginPath(); c.moveTo(0,y0); c.quadraticCurveTo(W/2,y0+7,W,y0-3); c.stroke(); }
    c.fillStyle='rgba(180,170,255,.28)'; c.fillRect(0,wy-2,W,2); }},
];

/* --- çizilmiş meyveler --- */
function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); }
function stemLeaf(r,col){
  ctx.strokeStyle='#6b4a26'; ctx.lineWidth=r*.09; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-r*.9); ctx.lineTo(r*.05,-r*1.14); ctx.stroke();
  ctx.save(); ctx.translate(r*.24,-r*1.02); ctx.rotate(.6); ctx.fillStyle=col;
  ctx.beginPath(); ctx.ellipse(0,0,r*.3,r*.13,0,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(30,60,15,.4)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-r*.28,0); ctx.lineTo(r*.28,0); ctx.stroke(); ctx.restore();
}
function gloss(r,ox,oy){
  const g=ctx.createRadialGradient(ox,oy,0,ox,oy,r*.55);
  g.addColorStop(0,'rgba(255,255,255,.55)'); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; circ(ox,oy,r*.55); ctx.fill();
}
function fruitWhole(t,r){
  // havada süzülürken yumuşak gölge
  ctx.save();
  ctx.shadowColor='rgba(25,14,4,.35)'; ctx.shadowBlur=r*.4; ctx.shadowOffsetY=r*.25;
  ctx.fillStyle='rgba(0,0,0,.02)'; circ(0,0,r*.95); ctx.fill();
  ctx.restore();
  let g;
  if(t==='karpuz'){
    g=ctx.createRadialGradient(-r*.3,-r*.35,r*.15,0,0,r);
    g.addColorStop(0,'#8fe06a'); g.addColorStop(.55,'#3f9e3f'); g.addColorStop(1,'#1c6329');
    ctx.fillStyle=g; circ(0,0,r); ctx.fill();
    ctx.save(); circ(0,0,r); ctx.clip();
    ctx.strokeStyle='rgba(15,70,24,.85)'; ctx.lineWidth=r*.18; ctx.lineCap='round';
    for(let i=-2;i<=2;i++){ ctx.beginPath();
      ctx.moveTo(i*r*.42,-r*1.05);
      ctx.quadraticCurveTo(i*r*.42+r*.24,0,i*r*.42,r*1.05); ctx.stroke(); }
    ctx.restore();
  }else if(t==='portakal'){
    g=ctx.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);
    g.addColorStop(0,'#ffd27a'); g.addColorStop(.55,'#ff9b1c'); g.addColorStop(1,'#d96b00');
    ctx.fillStyle=g; circ(0,0,r); ctx.fill();
    ctx.fillStyle='rgba(150,70,0,.16)';
    for(let i=0;i<24;i++){ const a=prnd(i)*TAU, rr=Math.sqrt(prnd(i+40))*r*.82;
      circ(Math.cos(a)*rr,Math.sin(a)*rr,r*.035); ctx.fill(); }
    stemLeaf(r,'#5f9432');
  }else if(t==='elma'){
    g=ctx.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);
    g.addColorStop(0,'#ff9c8a'); g.addColorStop(.55,'#e6394f'); g.addColorStop(1,'#9c1030');
    ctx.fillStyle=g; circ(0,0,r); ctx.fill();
    ctx.fillStyle='rgba(255,220,150,.18)'; // benekler
    for(let i=0;i<10;i++){ const a=prnd(i+3)*TAU, rr=Math.sqrt(prnd(i+50))*r*.75;
      circ(Math.cos(a)*rr,Math.sin(a)*rr,r*.03); ctx.fill(); }
    stemLeaf(r,'#4f8f2f');
  }else if(t==='limon'){
    ctx.save(); ctx.scale(1.22,.92);
    g=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);
    g.addColorStop(0,'#fff6b0'); g.addColorStop(.55,'#ffd23e'); g.addColorStop(1,'#dfa400');
    ctx.fillStyle=g;
    circ(0,0,r); ctx.fill();
    circ(r*.98,0,r*.14); ctx.fill(); circ(-r*.98,0,r*.14); ctx.fill();
    ctx.fillStyle='rgba(160,110,0,.14)';
    for(let i=0;i<14;i++){ const a=prnd(i+9)*TAU, rr=Math.sqrt(prnd(i+60))*r*.8;
      circ(Math.cos(a)*rr,Math.sin(a)*rr,r*.03); ctx.fill(); }
    ctx.restore();
  }else if(t==='kivi'){
    // tüylü kabuk
    ctx.strokeStyle='rgba(80,58,30,.55)'; ctx.lineWidth=1;
    for(let i=0;i<36;i++){ const a=i/36*TAU;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
      ctx.lineTo(Math.cos(a)*r*1.07,Math.sin(a)*r*1.07); ctx.stroke(); }
    g=ctx.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);
    g.addColorStop(0,'#b28e5b'); g.addColorStop(.6,'#8a6a3e'); g.addColorStop(1,'#5d4426');
    ctx.fillStyle=g; circ(0,0,r); ctx.fill();
    ctx.fillStyle='rgba(60,42,20,.25)';
    for(let i=0;i<18;i++){ const a=prnd(i+5)*TAU, rr=Math.sqrt(prnd(i+70))*r*.85;
      circ(Math.cos(a)*rr,Math.sin(a)*rr,r*.028); ctx.fill(); }
  }else if(t==='cilek'){
    ctx.beginPath();
    ctx.moveTo(0,-r*.8);
    ctx.bezierCurveTo(r*.98,-r*.95, r*.85,r*.35, 0,r*.95);
    ctx.bezierCurveTo(-r*.85,r*.35, -r*.98,-r*.95, 0,-r*.8);
    g=ctx.createRadialGradient(-r*.25,-r*.3,r*.1,0,0,r);
    g.addColorStop(0,'#ff9aa8'); g.addColorStop(.55,'#ee3a55'); g.addColorStop(1,'#b31234');
    ctx.fillStyle=g; ctx.fill();
    ctx.fillStyle='#ffe9a8'; // çekirdekler
    for(let i=0;i<12;i++){ const x=(prnd(i*3+2)-.5)*r*1.15, y=(prnd(i*7+4)-.42)*r*1.2;
      if(x*x+y*y<r*r*.5){ ctx.save(); ctx.translate(x,y); ctx.rotate(prnd(i)*1.2-.6);
        ctx.beginPath(); ctx.ellipse(0,0,r*.045,r*.07,0,0,TAU); ctx.fill(); ctx.restore(); } }
    ctx.fillStyle='#4f9435'; // sap yaprakları
    for(let i=0;i<5;i++){ const a=-Math.PI/2+(i-2)*.5;
      ctx.save(); ctx.translate(Math.cos(a)*r*.35,-r*.72+Math.sin(a)*r*.12); ctx.rotate(a);
      ctx.beginPath(); ctx.ellipse(0,0,r*.26,r*.09,0,0,TAU); ctx.fill(); ctx.restore(); }
  }else{ // seftali
    g=ctx.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);
    g.addColorStop(0,'#ffe0a8'); g.addColorStop(.55,'#ffab6b'); g.addColorStop(1,'#e05a4e');
    ctx.fillStyle=g; circ(0,0,r); ctx.fill();
    ctx.strokeStyle='rgba(190,70,45,.4)'; ctx.lineWidth=r*.05;
    ctx.beginPath(); ctx.moveTo(r*.1,-r*.9);
    ctx.quadraticCurveTo(r*.45,0,r*.12,r*.9); ctx.stroke();
    stemLeaf(r,'#5f9432');
  }
  gloss(r,-r*.38,-r*.42);
}
function crossSection(t,r){
  let g;
  if(t==='karpuz'){
    ctx.fillStyle='#2f8f3a'; circ(0,0,r); ctx.fill();
    ctx.fillStyle='#eaf7cf'; circ(0,0,r*.9); ctx.fill();
    g=ctx.createRadialGradient(0,0,r*.1,0,0,r*.82);
    g.addColorStop(0,'#ff8f8f'); g.addColorStop(.6,'#f5455c'); g.addColorStop(1,'#d92742');
    ctx.fillStyle=g; circ(0,0,r*.82); ctx.fill();
    ctx.fillStyle='#241812';
    for(let i=0;i<8;i++){ const a=i/8*TAU+.35, rr=r*.5;
      ctx.save(); ctx.translate(Math.cos(a)*rr,Math.sin(a)*rr); ctx.rotate(a+Math.PI/2);
      ctx.beginPath(); ctx.ellipse(0,0,r*.05,r*.08,0,0,TAU); ctx.fill(); ctx.restore(); }
  }else if(t==='portakal'||t==='limon'){
    const rind=t==='limon'?'#ffd23e':'#ff9b1c',
          pith=t==='limon'?'#fff6cf':'#ffe9c2',
          flesh0=t==='limon'?'#fff1a0':'#ffc85e', flesh1=t==='limon'?'#ffdf5e':'#ff9f2a';
    ctx.fillStyle=rind; circ(0,0,r); ctx.fill();
    ctx.fillStyle=pith; circ(0,0,r*.9); ctx.fill();
    g=ctx.createRadialGradient(0,0,0,0,0,r*.84);
    g.addColorStop(0,flesh0); g.addColorStop(1,flesh1);
    ctx.fillStyle=g; circ(0,0,r*.84); ctx.fill();
    ctx.strokeStyle=pith; ctx.lineWidth=r*.07; // dilim yıldızı
    for(let i=0;i<8;i++){ const a=i/8*TAU;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*r*.12,Math.sin(a)*r*.12);
      ctx.lineTo(Math.cos(a)*r*.8,Math.sin(a)*r*.8); ctx.stroke(); }
    ctx.fillStyle=pith; circ(0,0,r*.1); ctx.fill();
  }else if(t==='elma'){
    ctx.fillStyle='#d43048'; circ(0,0,r); ctx.fill();
    g=ctx.createRadialGradient(0,0,r*.1,0,0,r*.92);
    g.addColorStop(0,'#fff8e0'); g.addColorStop(1,'#ffedbf');
    ctx.fillStyle=g; circ(0,0,r*.92); ctx.fill();
    ctx.strokeStyle='rgba(214,178,110,.6)'; ctx.lineWidth=1.5;
    circ(0,0,r*.32); ctx.stroke();
    ctx.fillStyle='#6b4423';
    for(const s of[-1,1]){ ctx.save(); ctx.translate(s*r*.12,0); ctx.rotate(s*.5);
      ctx.beginPath(); ctx.ellipse(0,0,r*.05,r*.1,0,0,TAU); ctx.fill(); ctx.restore(); }
  }else if(t==='kivi'){
    ctx.fillStyle='#6e522f'; circ(0,0,r); ctx.fill();
    g=ctx.createRadialGradient(0,0,r*.1,0,0,r*.93);
    g.addColorStop(0,'#d6ee8e'); g.addColorStop(.75,'#9ecb4c'); g.addColorStop(1,'#7fb032');
    ctx.fillStyle=g; circ(0,0,r*.93); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1; // ışınsal çizgiler
    for(let i=0;i<20;i++){ const a=i/20*TAU;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*r*.35,Math.sin(a)*r*.35);
      ctx.lineTo(Math.cos(a)*r*.85,Math.sin(a)*r*.85); ctx.stroke(); }
    ctx.fillStyle='#f3f7d9'; ctx.beginPath(); ctx.ellipse(0,0,r*.32,r*.28,0,0,TAU); ctx.fill();
    ctx.fillStyle='#241c10';
    for(let i=0;i<14;i++){ const a=i/14*TAU, rr=r*.48;
      ctx.save(); ctx.translate(Math.cos(a)*rr,Math.sin(a)*rr); ctx.rotate(a+Math.PI/2);
      ctx.beginPath(); ctx.ellipse(0,0,r*.03,r*.055,0,0,TAU); ctx.fill(); ctx.restore(); }
  }else if(t==='cilek'){
    ctx.fillStyle='#ee3a55'; circ(0,0,r); ctx.fill();
    g=ctx.createRadialGradient(0,0,0,0,0,r*.9);
    g.addColorStop(0,'#ffe4e8'); g.addColorStop(.55,'#ffb0bc'); g.addColorStop(1,'#ff8298');
    ctx.fillStyle=g; circ(0,0,r*.9); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=r*.045;
    for(let i=0;i<9;i++){ const a=i/9*TAU;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*r*.18,Math.sin(a)*r*.18);
      ctx.lineTo(Math.cos(a)*r*.72,Math.sin(a)*r*.72); ctx.stroke(); }
  }else{ // seftali
    ctx.fillStyle='#e87a52'; circ(0,0,r); ctx.fill();
    g=ctx.createRadialGradient(0,0,r*.1,0,0,r*.9);
    g.addColorStop(0,'#ffe9b8'); g.addColorStop(1,'#ffc978');
    ctx.fillStyle=g; circ(0,0,r*.9); ctx.fill();
    g=ctx.createRadialGradient(-r*.08,-r*.08,0,0,0,r*.32);
    g.addColorStop(0,'#a5613a'); g.addColorStop(1,'#7a3f22');
    ctx.fillStyle=g; circ(0,0,r*.3); ctx.fill();
    ctx.strokeStyle='rgba(90,44,20,.6)'; ctx.lineWidth=1.2;
    for(let i=0;i<5;i++){ ctx.beginPath();
      ctx.arc(0,0,r*(.1+i*.05),prnd(i)*TAU,prnd(i)*TAU+2.2); ctx.stroke(); }
  }
  // kesit üst parlaklığı
  g=ctx.createLinearGradient(0,-r,0,r);
  g.addColorStop(0,'rgba(255,255,255,.22)'); g.addColorStop(.4,'rgba(255,255,255,0)');
  ctx.fillStyle=g; circ(0,0,r); ctx.fill();
}
function drawHalf(h){
  ctx.save(); ctx.translate(h.x,h.y); ctx.rotate(h.rot);
  const a0=h.side>0?-Math.PI/2:Math.PI/2, a1=a0+Math.PI;
  ctx.save();
  ctx.shadowColor='rgba(25,14,4,.3)'; ctx.shadowBlur=h.r*.3; ctx.shadowOffsetY=h.r*.2;
  ctx.beginPath(); ctx.arc(0,0,h.r,a0,a1); ctx.closePath();
  ctx.fillStyle='rgba(0,0,0,.05)'; ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(0,0,h.r,a0,a1); ctx.closePath(); ctx.clip();
  crossSection(h.f.t,h.r);
  ctx.restore();
  // kesik kenar ışıltısı
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,-h.r); ctx.lineTo(0,h.r); ctx.stroke();
  ctx.restore();
}
function drawBomb(r){
  const g=ctx.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);
  g.addColorStop(0,'#6f6f80'); g.addColorStop(.55,'#33333d'); g.addColorStop(1,'#0d0d14');
  ctx.fillStyle=g; circ(0,0,r); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=1.5; circ(0,0,r); ctx.stroke();
  gloss(r,-r*.35,-r*.4);
  // kapak
  ctx.fillStyle='#5a5a68';
  ctx.beginPath(); ctx.roundRect?ctx.roundRect(-r*.2,-r*1.08,r*.4,r*.3,r*.06):ctx.rect(-r*.2,-r*1.08,r*.4,r*.3); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.2)'; ctx.fillRect(-r*.2,-r*1.08,r*.4,r*.08);
  // fitil
  ctx.strokeStyle='#c9a26a'; ctx.lineWidth=r*.09; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-r*1.02);
  ctx.quadraticCurveTo(r*.28,-r*1.32,r*.44,-r*1.22); ctx.stroke();
  // kıvılcım
  const sx=r*.44, sy=-r*1.22, sp=1+Math.sin(tick*.55)*.5;
  ctx.strokeStyle='rgba(255,220,90,.95)'; ctx.lineWidth=1.6;
  for(let i=0;i<6;i++){ const a=i/6*TAU+tick*.3;
    ctx.beginPath(); ctx.moveTo(sx+Math.cos(a)*r*.08,sy+Math.sin(a)*r*.08);
    ctx.lineTo(sx+Math.cos(a)*r*.22*sp,sy+Math.sin(a)*r*.22*sp); ctx.stroke(); }
  ctx.fillStyle='#fff1b0'; circ(sx,sy,r*.09*sp+r*.04); ctx.fill();
  ctx.fillStyle='rgba(255,150,50,.75)'; circ(sx,sy,r*.16*sp); ctx.fill();
}
/* menü arkasında süzülen meyveler */
const DECO=[0,1,2,3,4,5,6,0].map((fi,i)=>({t:FRUITS[fi].t,
  fx:.1+prnd(i*3+1)*.8, fy:.08+prnd(i*7+2)*.62,
  rs:.045+prnd(i*5+3)*.035, rot:prnd(i)*TAU, vr:(prnd(i+9)-.5), ph:prnd(i*11)*TAU}));
let menuT=0;
function menuDeco(){
  menuT+=0.016;
  for(const d of DECO){
    const x=d.fx*W+Math.sin(menuT*.5+d.ph)*18,
          y=d.fy*H+Math.cos(menuT*.4+d.ph)*24,
          r=Math.min(46,W*d.rs+12);
    ctx.save(); ctx.translate(x,y); ctx.rotate(d.rot+menuT*d.vr*.6);
    fruitWhole(d.t,r); ctx.restore();
  }
}
function draw(){
  if(bgDirty) renderBG();
  ctx.drawImage(bgCv,0,0,W,H);
  // meyve suyu lekeleri (arka planda kısa süreli renk)
  for(const s of stains){
    s.life-=0.006; if(s.life<=0) continue;
    ctx.globalAlpha=Math.min(.32,s.life*.32); ctx.fillStyle=s.col;
    for(let i=0;i<6;i++){ const a=prnd(s.seed+i)*TAU, d=prnd(s.seed+i+7)*30+6;
      circ(s.x+Math.cos(a)*d,s.y+Math.sin(a)*d,prnd(s.seed+i+3)*13+4); ctx.fill(); }
    circ(s.x,s.y,16); ctx.fill();
  }
  stains=stains.filter(s=>s.life>0);
  ctx.globalAlpha=1;
  if(state!=='play') menuDeco();
  // yarımlar (kesit görünür, dönerek savrulur)
  for(const h of halves) drawHalf(h);
  // meyveler
  for(const f of fruits){
    ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot);
    if(f.bomb) drawBomb(f.r); else fruitWhole(f.f.t,f.r);
    ctx.restore();
  }
  // meyve suyu damlaları
  for(const j of juices){ ctx.globalAlpha=Math.max(0,j.life); ctx.fillStyle=j.col;
    ctx.beginPath(); ctx.arc(j.x,j.y,j.size*j.life,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  // bıçak izi (seçili stile göre) + ışıltılı beyaz çekirdek
  if(trail.length>1){
    const kn=KNIVES[knifeI];
    ctx.lineCap='round'; ctx.lineJoin='round';
    if(kn.glow){ ctx.strokeStyle=kn.glow;
      for(let i=1;i<trail.length;i++){
        ctx.lineWidth=(i/trail.length)*16;
        ctx.beginPath(); ctx.moveTo(trail[i-1].x,trail[i-1].y);
        ctx.lineTo(trail[i].x,trail[i].y); ctx.stroke(); } }
    ctx.strokeStyle=kn.col;
    for(let i=1;i<trail.length;i++){
      ctx.lineWidth=(i/trail.length)*7;
      ctx.beginPath(); ctx.moveTo(trail[i-1].x,trail[i-1].y);
      ctx.lineTo(trail[i].x,trail[i].y); ctx.stroke();
    }
    ctx.strokeStyle='rgba(255,255,255,.9)';
    for(let i=1;i<trail.length;i++){
      ctx.lineWidth=(i/trail.length)*2.5;
      ctx.beginPath(); ctx.moveTo(trail[i-1].x,trail[i-1].y);
      ctx.lineTo(trail[i].x,trail[i].y); ctx.stroke();
    }
    // uç ışıltısı
    const tp=trail[trail.length-1];
    ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=1.4;
    for(let i=0;i<4;i++){ const a=i/4*TAU+tick*.4;
      ctx.beginPath(); ctx.moveTo(tp.x+Math.cos(a)*3,tp.y+Math.sin(a)*3);
      ctx.lineTo(tp.x+Math.cos(a)*9,tp.y+Math.sin(a)*9); ctx.stroke(); }
  }
}
function bindPick(id,fn){
  const el=document.getElementById(id);
  const h=e=>{ e.preventDefault(); e.stopPropagation(); fn(); };
  el.addEventListener('click',h); el.addEventListener('touchend',h);
}
bindPick('bgBtn',()=>{ bgI=(bgI+1)%BGS.length; bgDirty=true;
  document.getElementById('bgBtn').textContent=BGS[bgI].name; saveStyle(); });
bindPick('knifeBtn',()=>{ knifeI=(knifeI+1)%KNIVES.length;
  document.getElementById('knifeBtn').textContent=KNIVES[knifeI].name; saveStyle(); });
document.getElementById('bgBtn').textContent=BGS[bgI].name;
document.getElementById('knifeBtn').textContent=KNIVES[knifeI].name;
function loop(){ if(state==='play') physics(); draw(); requestAnimationFrame(loop); }
function tap(el,fn){ el._fn=fn;
  const fire=e=>{ e.preventDefault(); e.stopPropagation(); if(el._fn)el._fn(); };
  el.addEventListener('click',fire); el.addEventListener('touchend',fire); }
tap(document.getElementById('startBtn'),()=>{ try{audio();}catch(e){}
  reset(); state='play';
  document.getElementById('intro').classList.add('hidden'); });
tap(document.getElementById('retryBtn'),()=>{ reset(); state='play';
  document.getElementById('endcard').classList.add('hidden'); });
reset(); loop();
</script>
