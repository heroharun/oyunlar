<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0d2137">
<meta name="description" content="Bereket: Bereket Yolculugu - Islami temali strateji masa oyunu">
<title>BEREKET — Bereket Yolculuğu</title>
<style>
/* ==========================================================================
   BEREKET — Bereket Yolculuğu · AÇIK TEMA
   Görsel dil: fildişi parşömen, altın tezhip hatları, mürekkep yazı.
   Karanlık arayüz yerine gündüz ışığı: okunabilirlik önce gelir.
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
:root{
  /* yüzeyler */
  --fildisi:#FBF6EA; --kagit:#FFFDF7; --kagit2:#F6EDD8; --kagit3:#EFE2C4;
  --cizgi:#E0CFA6; --cizgi2:#C9B487;
  /* mürekkep */
  --murekkep:#2A2115; --murekkep2:#5A4A31; --murekkep3:#8B7A5C;
  /* vurgular */
  --zumrut:#0E6B49; --zumrut2:#14926A; --zumrut3:#E4F2EA;
  --bordo:#8C2B37; --bordo2:#B23F4D; --bordo3:#FAE9EB;
  --altin:#B98C1F; --altin2:#E5BB4A; --altin3:#7A5C11; --altin4:#FBF0D2;
  --lacivert:#1D4E7A; --lacivert2:#2E75AF; --lacivert3:#E6F0F8;
  --mor:#6B4E9E;
  --r:16px; --r2:11px;
  --disp:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --board:640px;
  --f:calc(var(--board)/56);
  --gap:12px;
  --sb:env(safe-area-inset-bottom,0px);
  --golge:0 2px 4px rgba(90,74,49,.06), 0 8px 22px rgba(90,74,49,.10);
  --golge2:0 4px 10px rgba(90,74,49,.10), 0 18px 40px rgba(90,74,49,.16);
}
html[dir="rtl"]{--disp:"Segoe UI",Tahoma,"Traditional Arabic",serif}
html,body{height:100%}
body{
  margin:0;font-family:var(--body);font-size:16px;color:var(--murekkep);
  background:var(--fildisi);
  -webkit-text-size-adjust:100%;overflow:hidden;
}
/* zemin dokusu: Selçuklu kafesi, düşük yoğunlukta */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    repeating-linear-gradient(45deg,rgba(185,140,31,.07) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(-45deg,rgba(185,140,31,.07) 0 1px,transparent 1px 26px),
    radial-gradient(900px 600px at 50% -10%, rgba(229,187,74,.16), transparent 65%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--lacivert2);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--kagit2);border-radius:8px}
::-webkit-scrollbar-thumb{background:var(--cizgi2);border-radius:8px;border:2px solid var(--kagit2)}
h1,h2,h3,h4{font-family:var(--disp);margin:0;font-weight:700;letter-spacing:.01em;color:var(--murekkep)}

/* ------------------------------- ekranlar ------------------------------- */
#app{position:fixed;inset:0;z-index:1}
@supports (height:100dvh){ #app{bottom:auto;height:100dvh} }
.screen{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.screen.on{display:block}

/* ---------------------------- ortak bileşenler --------------------------- */
.tugra{
  background:linear-gradient(170deg,var(--kagit) 0%,var(--kagit2) 100%);
  color:var(--murekkep);border-radius:var(--r);
  border:1px solid var(--cizgi);
  box-shadow:0 0 0 4px rgba(255,255,255,.6), var(--golge2);
  position:relative;
}
.tugra::after{
  content:"";position:absolute;inset:7px;border:1px solid rgba(185,140,31,.28);
  border-radius:calc(var(--r) - 7px);pointer-events:none;
}
.cam{background:var(--kagit);border:1px solid var(--cizgi);border-radius:var(--r2);box-shadow:var(--golge)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  min-height:50px;padding:12px 20px;border-radius:12px;
  font-family:var(--body);font-size:1.02rem;font-weight:700;
  background:var(--kagit);color:var(--murekkep);
  border:1.5px solid var(--cizgi2);
  box-shadow:0 2px 0 rgba(185,140,31,.22), var(--golge);
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  text-align:center;
}
.btn:hover{background:#fff;transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(185,140,31,.25)}
.btn[disabled],.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.altin{background:linear-gradient(180deg,#F2CE62,#D9A62C);color:#3A2C08;border-color:#B98C1F;
  box-shadow:0 3px 0 #9A731A, var(--golge)}
.btn.altin:hover{background:linear-gradient(180deg,#F7D879,#E0AE33)}
.btn.yesil{background:linear-gradient(180deg,#17A375,#0E6B49);color:#fff;border-color:#0B573B;
  box-shadow:0 3px 0 #0A4D35, var(--golge)}
.btn.yesil:hover{background:linear-gradient(180deg,#1CB582,#117A54)}
.btn.bordo{background:linear-gradient(180deg,#B23F4D,#8C2B37);color:#fff;border-color:#75222C;
  box-shadow:0 3px 0 #6A1F28, var(--golge)}
.btn.lacivert{background:linear-gradient(180deg,#2E75AF,#1D4E7A);color:#fff;border-color:#194266;
  box-shadow:0 3px 0 #163B5C, var(--golge)}
.btn.sade{background:transparent;border-color:var(--cizgi);box-shadow:none}
.btn.kucuk{min-height:42px;padding:8px 13px;font-size:.9rem;border-radius:10px}
.btn.blok{width:100%}
.btn.buyuk{min-height:64px;font-size:1.2rem;font-family:var(--disp)}
.satir{display:flex;gap:10px;flex-wrap:wrap}
.rozet{display:inline-flex;align-items:center;gap:.35em;padding:4px 11px;border-radius:999px;
  font-size:.8rem;font-weight:700;background:var(--altin4);border:1px solid var(--altin);color:var(--altin3)}

/* --------------------------- kaynak göstergeleri ------------------------- */
.k{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.k svg{width:1.15em;height:1.15em;flex:none}
.k-gold{color:#8A6510}.k-rep{color:#A5303F}.k-know{color:#17567F}.k-bless{color:#0E6B49}

/* ================================ ANA MENÜ =============================== */
.menu-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 18px calc(28px + var(--sb));gap:22px}
.marka{text-align:center;max-width:640px;width:100%}
.marka .hilal{width:60px;height:60px;margin:0 auto 8px;display:block}
.marka h1{font-size:clamp(3rem,13vw,5.4rem);line-height:.95;letter-spacing:.1em;color:var(--altin3);
  text-shadow:0 1px 0 #fff, 0 3px 0 rgba(185,140,31,.25)}
.marka .alt{margin-top:12px;display:inline-block;padding:8px 26px;border-radius:999px;
  font-family:var(--disp);font-size:clamp(.9rem,3.6vw,1.1rem);letter-spacing:.2em;text-transform:uppercase;
  color:#fff;background:linear-gradient(180deg,#17A375,#0E6B49);box-shadow:var(--golge)}
.marka .sozu{margin:18px auto 0;max-width:520px;font-size:1.02rem;line-height:1.65;color:var(--murekkep2)}
.menu-liste{display:grid;gap:12px;width:min(440px,100%)}
.menu-liste .btn{justify-content:flex-start;font-size:1.1rem;padding:15px 22px;min-height:60px}
.menu-liste .btn i{width:30px;display:inline-flex;justify-content:center;font-style:normal;font-size:1.15em;color:var(--altin3)}
.menu-liste .btn.altin i{color:#3A2C08}
.dil-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dil{min-height:44px;padding:9px 16px;border-radius:11px;font-weight:700;font-size:.92rem;
  background:var(--kagit);border:1.5px solid var(--cizgi2);color:var(--murekkep2)}
.dil[aria-pressed="true"]{background:linear-gradient(180deg,#F2CE62,#D9A62C);color:#3A2C08;border-color:#B98C1F}
.menu-alt{font-size:.86rem;color:var(--murekkep3);text-align:center;max-width:560px;line-height:1.6}
/* Kısa ekranlar: menü sütununu sıkıştır ki tüm düğmeler görünür kalsın */
@media (max-height:640px) and (max-width:940px){
  .ust{min-height:44px;padding:5px 8px;gap:6px}
  .ust .tur{font-size:.8rem;padding:3px 8px}
  .mevsim{font-size:.78rem;padding:3px 8px}
  .ust .araclar .btn{min-height:34px;padding:4px 8px;font-size:.82rem}
  .mobil-bar{gap:5px;padding-top:6px}
  .mb-kaynak .k{padding:5px 3px;font-size:.84rem}
  .mb-butonlar .btn{min-height:46px;font-size:.94rem}
  .mb-kim{font-size:.88rem}
}
@media (max-height:700px){
  .menu-wrap{gap:14px;padding:16px 18px calc(16px + var(--sb))}
  .marka .hilal{width:44px;height:44px;margin-bottom:4px}
  .marka h1{font-size:clamp(2.2rem,10vw,3.6rem)}
  .marka .alt{margin-top:8px;padding:6px 20px}
  .marka .sozu{margin-top:10px;font-size:.94rem}
  .menu-liste{gap:8px}
  .menu-liste .btn{min-height:48px;padding:10px 18px;font-size:1rem}
}

/* ================================ KURULUM ================================ */
.kurulum{max-width:980px;margin:0 auto;padding:20px 16px calc(34px + var(--sb))}
.blok-basl{display:flex;align-items:center;gap:12px;margin:26px 0 12px;font-family:var(--disp);
  font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;color:var(--altin3)}
.blok-basl::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--cizgi),transparent)}
.alan{display:grid;gap:9px;margin-bottom:16px}
.alan>label{font-size:.95rem;color:var(--murekkep2);font-weight:600}
.secim{display:flex;gap:9px;flex-wrap:wrap}
.secim button{min-height:48px;min-width:52px;padding:9px 16px;border-radius:11px;font-weight:700;font-size:.98rem;
  background:var(--kagit);border:1.5px solid var(--cizgi2);color:var(--murekkep2);box-shadow:0 2px 0 rgba(185,140,31,.16)}
.secim button[aria-pressed="true"]{background:linear-gradient(180deg,#17A375,#0E6B49);border-color:#0B573B;color:#fff;box-shadow:0 2px 0 #0A4D35}
.oyuncu-kart{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:12px;border-radius:13px;background:var(--kagit);border:1.5px solid var(--cizgi);margin-bottom:10px;box-shadow:var(--golge)}
.oyuncu-kart input{min-height:46px;padding:9px 13px;border-radius:10px;background:#fff;
  border:1.5px solid var(--cizgi2);color:var(--murekkep);width:100%;font-size:1rem}
.avatar-btn{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:1.7rem;
  border:2px solid var(--cizgi2);background:var(--kagit2)}
.tip-etiket{font-size:.78rem;padding:5px 11px;border-radius:999px;white-space:nowrap;font-weight:700}
.tip-insan{background:var(--zumrut3);border:1px solid var(--zumrut2);color:var(--zumrut)}
.tip-bot{background:var(--bordo3);border:1px solid var(--bordo2);color:var(--bordo)}
.anahtar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 15px;border-radius:12px;
  background:var(--kagit);border:1.5px solid var(--cizgi);margin-bottom:10px;min-height:58px;box-shadow:var(--golge)}
.anahtar span{font-size:1rem}
.sw{width:60px;height:34px;border-radius:999px;background:#D8CBAE;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;
  background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.22);transition:transform .2s}
.sw[aria-checked="true"]{background:linear-gradient(90deg,#0E6B49,#17A375)}
.sw[aria-checked="true"]::after{transform:translateX(26px)}
html[dir="rtl"] .sw::after{left:auto;right:3px}
html[dir="rtl"] .sw[aria-checked="true"]::after{transform:translateX(-26px)}
.avatar-sec{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:10px}
.avatar-sec button{aspect-ratio:1;border-radius:13px;font-size:1.8rem;background:var(--kagit2);border:2px solid var(--cizgi)}
.avatar-sec button[aria-pressed="true"]{border-color:var(--altin);background:var(--altin4)}

/* ================================ OYUN =================================== */
#ekran-oyun{overflow:hidden}
.oyun{position:absolute;inset:0;display:grid;
  grid-template-columns:270px minmax(0,1fr) 330px;
  grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"ust ust ust" "sol orta sag";
  gap:var(--gap);padding:var(--gap);padding-bottom:calc(var(--gap) + var(--sb));
}
.ust{grid-area:ust;display:flex;align-items:center;gap:12px;padding:9px 14px;flex-wrap:wrap;min-height:58px}
.ust .logo{font-family:var(--disp);font-size:1.35rem;letter-spacing:.14em;color:var(--altin3);white-space:nowrap}
.ust .tur{font-size:.98rem;font-weight:700;color:var(--murekkep2);white-space:nowrap;
  background:var(--kagit2);border:1px solid var(--cizgi);padding:5px 12px;border-radius:999px}
.mevsim{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;font-size:.92rem;font-weight:700;
  background:var(--altin4);border:1.5px solid var(--altin);color:var(--altin3);max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mevsim.ramazan{background:var(--lacivert3);border-color:var(--lacivert2);color:var(--lacivert)}
.mevsim.hac{background:var(--zumrut3);border-color:var(--zumrut2);color:var(--zumrut)}
.mevsim.kurban{background:var(--bordo3);border-color:var(--bordo2);color:var(--bordo)}
.ust .bos{flex:1;min-width:0}
.ust .araclar{display:flex;gap:7px;flex-wrap:wrap}

.sol{grid-area:sol;overflow:auto;padding:11px;display:flex;flex-direction:column;gap:10px}
.o-kart{padding:11px 12px;border-radius:13px;position:relative;overflow:hidden;
  background:var(--kagit);border:1.5px solid var(--cizgi);transition:.2s}
.o-kart .ust-satir{display:flex;align-items:center;gap:9px;min-width:0}
.o-kart .piyon-ikon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.15rem;flex:none;
  border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);color:#231a0c;font-weight:700}
.o-kart .ad{font-weight:700;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.o-kart .kaynaklar{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-top:9px;font-size:.92rem}
.o-kart .alt-bilgi{font-size:.82rem;color:var(--murekkep3);margin-top:7px}
.o-kart.aktif{border-color:var(--altin);background:linear-gradient(170deg,#FFFBEF,var(--altin4));
  box-shadow:0 0 0 3px rgba(229,187,74,.35), var(--golge)}
.o-kart.aktif::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#E5BB4A,#B98C1F)}
html[dir="rtl"] .o-kart.aktif::before{left:auto;right:0}
.o-kart.elendi{opacity:.5}
.o-kart .mini-rozet{position:absolute;top:9px;inset-inline-end:10px;font-size:.95rem}
.unvan-serit{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.unvan{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;
  background:var(--lacivert3);border:1px solid var(--lacivert2);color:var(--lacivert)}

.orta{grid-area:orta;display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:auto;position:relative;padding:2px}
.tahta-kutu{direction:ltr;position:relative;width:var(--board);height:var(--board);flex:none}
.tahta{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);
  gap:calc(var(--board)*.005);padding:calc(var(--board)*.016);border-radius:calc(var(--board)*.03);
  background:linear-gradient(150deg,#F3E6C6,#E8D6AC 60%,#DFC896);
  box-shadow:0 0 0 3px var(--altin),0 0 0 6px #fff,0 0 0 8px rgba(185,140,31,.45), var(--golge2)}
.kutu{
  position:relative;border-radius:calc(var(--board)*.012);overflow:hidden;cursor:pointer;
  background:linear-gradient(170deg,#FFFDF6 0%,#FBF3DE 100%);
  border:1px solid #D8C69A;
  box-shadow:0 1px 2px rgba(90,74,49,.14);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:calc(var(--f)*.78) calc(var(--f)*.22) calc(var(--f)*.2);
  text-align:center;color:var(--murekkep);
  transition:transform .15s ease, box-shadow .15s ease;
  font-size:calc(var(--f)*.9);line-height:1.05;
}
.kutu:hover,.kutu:focus-visible{transform:scale(1.07);z-index:20;box-shadow:0 0 0 2px var(--altin),0 8px 18px rgba(90,74,49,.3)}
.kutu .ad{font-family:var(--disp);font-weight:700;font-size:calc(var(--f)*1.0);
  text-transform:uppercase;word-break:break-word;hyphens:auto;width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:2.2em}
.kutu .ikon{width:calc(var(--f)*2.3);height:calc(var(--f)*2.3);margin:calc(var(--f)*.2) 0;flex:none}
.kutu .fiy{font-size:calc(var(--f)*.86);font-weight:800;color:var(--altin3);font-variant-numeric:tabular-nums}
.kutu .serit{height:calc(var(--board)*.0165);width:100%;position:absolute;top:0;left:0}
.kutu.kose{background:linear-gradient(170deg,#FFF9E6,#F2E3BC)}
.kutu.sehir .serit{background:var(--zumrut)}
.kutu.hizmet .serit{background:var(--lacivert)}
.kutu.kart-takdir .serit{background:var(--lacivert2)}
.kutu.kart-imtihan .serit{background:var(--bordo)}
.kutu.kart-ticaret .serit{background:var(--altin)}
.kutu.kart-ilim .serit{background:var(--zumrut2)}
.kutu.hayir .serit{background:var(--bordo2)}
.kutu.olay .serit{background:var(--mor)}
.kutu.sahipli{box-shadow:inset 0 0 0 2px var(--sahip,#fff),0 1px 3px rgba(90,74,49,.2)}
.kutu .pipler{display:flex;gap:calc(var(--f)*.16);margin-top:auto;padding-bottom:calc(var(--f)*.55)}
.kutu .pip{width:calc(var(--f)*.46);height:calc(var(--f)*.46);border-radius:50%;background:var(--sahip,#8A6510);
  box-shadow:0 0 0 1px rgba(255,255,255,.8)}
.kutu .sahip-adi{position:absolute;bottom:0;left:0;right:0;font-size:calc(var(--f)*.72);font-weight:700;
  background:var(--sahip,#333);color:#fff;padding:1px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35}
.kutu.vurgu{animation:vurgula 1.2s ease}
@keyframes vurgula{0%{box-shadow:0 0 0 0 rgba(185,140,31,.85)}70%{box-shadow:0 0 0 10px rgba(185,140,31,0)}100%{box-shadow:0 0 0 0 rgba(185,140,31,0)}}

.piyon{position:absolute;width:calc(var(--board)*.036);height:calc(var(--board)*.036);border-radius:50%;
  display:grid;place-items:center;font-size:calc(var(--board)*.021);font-weight:800;z-index:30;
  border:calc(var(--board)*.0035) solid #fff;box-shadow:0 2px 7px rgba(42,33,21,.45);
  transition:left .26s cubic-bezier(.34,1.25,.64,1), top .26s cubic-bezier(.34,1.25,.64,1);will-change:left,top}
.piyon.sira{box-shadow:0 0 0 3px var(--altin),0 3px 10px rgba(42,33,21,.4)}

.merkez{grid-column:2/9;grid-row:2/9;position:relative;border-radius:calc(var(--board)*.016);overflow:hidden;
  box-shadow:inset 0 0 0 2px var(--altin)}
.merkez .art{position:absolute;inset:0;background-size:cover;background-position:center 74%}
.merkez .gok{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(255,253,247,.94) 0%,rgba(255,253,247,.55) 22%,rgba(255,253,247,.05) 44%,rgba(42,33,21,.35) 84%,rgba(42,33,21,.62) 100%)}
.merkez .icerik{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(var(--board)*.024);gap:calc(var(--board)*.01)}
.merkez .mbaslik{text-align:center}
.merkez .mbaslik .ad{font-family:var(--disp);font-size:calc(var(--board)*.068);letter-spacing:.14em;line-height:1;

/* ================================= MODAL ================================= */
.perde{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:14px;

.modal .m-ust{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}

.modal h2{font-size:1.5rem;line-height:1.18}

.secenekler{display:grid;gap:11px;margin-top:16px}
.secenek{display:flex;align-items:center;gap:13px;text-align:start;padding:15px 17px;border-radius:13px;min-height:62px;

.secenek .s-ad{font-family:var(--disp);font-weight:700;font-size:1.1rem}
.secenek .s-alt{font-size:.9rem;color:var(--murekkep3);margin-top:3px}
.secenek .s-govde{flex:1;min-width:0}
.secenek.iyi{background:linear-gradient(180deg,#17A375,#0E6B49);color:#fff;border-color:#0B573B;box-shadow:0 3px 0 #0A4D35}

.secenek.dikkat{background:linear-gradient(180deg,#B23F4D,#8C2B37);color:#fff;border-color:#75222C;box-shadow:0 3px 0 #6A1F28}
.secenek.dikkat .s-alt{color:rgba(255,255,255,.88)}
.secenek.altin{background:linear-gradient(180deg,#F2CE62,#D9A62C);color:#3A2C08;border-color:#B98C1F;box-shadow:0 3px 0 #9A731A}

.secenek[disabled]{opacity:.45;cursor:not-allowed}
.modal .not{font-size:.94rem;color:var(--altin3);background:var(--altin4);padding:11px 14px;border-radius:11px;
  border-inline-start:4px solid var(--altin);margin-top:12px;line-height:1.5}
.kapat{position:absolute;top:11px;inset-inline-end:11px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:var(--kagit2);color:var(--murekkep2);font-size:1.3rem;font-weight:700;border:1px solid var(--cizgi)}
.kapat:hover{background:#fff}
.kart-cek{animation:kartcek .45s cubic-bezier(.2,.9,.3,1)}
@keyframes kartcek{0%{transform:rotateY(80deg) scale(.92);opacity:0}100%{transform:none;opacity:1}}

.quiz-secenek{display:flex;align-items:center;width:100%;text-align:start;padding:15px 17px;border-radius:12px;min-height:60px;
  background:var(--kagit);border:1.5px solid var(--cizgi2);color:var(--murekkep);font-weight:600;font-size:1.02rem;
  margin-bottom:10px;transition:.14s;box-shadow:0 3px 0 rgba(185,140,31,.18)}

.quiz-secenek.dogru{background:linear-gradient(180deg,#17A375,#0E6B49);color:#fff;border-color:#0B573B}
.quiz-secenek.yanlis{background:linear-gradient(180deg,#B23F4D,#8C2B37);color:#fff;border-color:#75222C}
.quiz-secenek .harf{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;margin-inline-end:12px;
  background:var(--altin4);color:var(--altin3);font-weight:800;font-size:.95rem;flex:none}
.quiz-secenek.dogru .harf,.quiz-secenek.yanlis .harf{background:rgba(255,255,255,.28);color:#fff}

.mg-alan{display:grid;gap:10px;margin:14px 0}
.mg-oge{padding:14px 16px;border-radius:12px;background:var(--kagit);border:1.5px solid var(--cizgi2);
  color:var(--murekkep);font-weight:600;text-align:start;min-height:56px;display:flex;align-items:center;gap:11px;
  font-size:1rem;transition:.14s;box-shadow:0 3px 0 rgba(185,140,31,.18)}
.mg-oge:hover{background:#fff}
.mg-oge.secili{background:linear-gradient(180deg,#17A375,#0E6B49);color:#fff;border-color:#0B573B}

  color:var(--altin3);font-size:.9rem;font-weight:800;flex:none}

  background:linear-gradient(170deg,#F2CE62,#D9A62C);border:1.5px solid var(--altin);color:transparent;transition:.2s}
.mg-kart.acik{background:var(--kagit);color:var(--murekkep);border-color:var(--cizgi2)}
.mg-kart.eslesti{background:linear-gradient(170deg,#17A375,#0E6B49);color:#fff;border-color:#0B573B}
.mg-eslestir{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mg-sut{display:grid;gap:8px;align-content:start}

.rehber{display:grid;gap:14px}
.rehber .adim{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:15px;border-radius:13px;
  background:var(--kagit);border:1.5px solid var(--cizgi)}
.rehber .adim .no{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);
  font-weight:800;font-size:1.15rem;background:linear-gradient(180deg,#F2CE62,#D9A62C);color:#3A2C08;flex:none}
.rehber .adim h4{font-size:1.12rem;margin-bottom:5px}
.rehber .adim p{font-size:1rem;margin:0;color:var(--murekkep2);line-height:1.6}
.rehber .kaynak-kart{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:center;padding:14px;border-radius:13px;
  background:var(--kagit);border:1.5px solid var(--cizgi)}

.sekmeler{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sekme{min-height:46px;padding:10px 18px;border-radius:999px;font-weight:700;font-size:.98rem;
  background:var(--kagit);color:var(--murekkep2);border:1.5px solid var(--cizgi2)}
.sekme[aria-selected="true"]{background:linear-gradient(180deg,#17A375,#0E6B49);color:#fff;border-color:#0B573B}
.sekme-icerik{display:none}
.sekme-icerik.on{display:block;animation:fade .22s}

.sonuc{max-width:940px;margin:0 auto;padding:22px 16px calc(34px + var(--sb))}
.podyum{display:grid;gap:11px;margin:18px 0}
.sira-satir{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:13px;align-items:center;padding:14px 16px;
  border-radius:14px;background:var(--kagit);border:1.5px solid var(--cizgi);box-shadow:var(--golge)}
.sira-satir.bir{background:linear-gradient(170deg,#FFFBEF,var(--altin4));border-color:var(--altin);
  box-shadow:0 0 0 3px rgba(229,187,74,.3), var(--golge2)}
.sira-satir .yer{font-family:var(--disp);font-size:1.8rem;width:44px;text-align:center;color:var(--altin3)}
.sira-satir .puan{font-family:var(--disp);font-size:1.55rem;color:var(--zumrut);font-variant-numeric:tabular-nums}
.sira-satir .detay{font-size:.88rem;color:var(--murekkep3);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.oduller{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px;margin:14px 0}
.odul{padding:14px;border-radius:13px;background:var(--kagit);border:1.5px solid var(--cizgi)}
.odul .baslik{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--altin3);font-weight:700}
.odul .kisi{font-family:var(--disp);font-size:1.15rem;margin-top:4px}

.koleksiyon{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.kol-kart{padding:15px;border-radius:13px;text-align:center;background:var(--kagit);border:1.5px solid var(--cizgi)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--sb));z-index:200;display:flex;
  flex-direction:column;gap:9px;align-items:center;pointer-events:none;width:min(94vw,520px)}

.toast.iyi{border-color:var(--zumrut2);background:var(--zumrut3);color:var(--zumrut)}

.toast .t-etki{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:8px}

@keyframes toastin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .merkez .mbaslik .ad{font-size:calc(var(--board)*.085)}

}
@media (max-width:520px){
  body{font-size:15px}

}

/* Aktif dil ve çeviri yardımcısı ------------------------------------------ */
let DIL = "tr";
function t(anahtar){
  const d = T[DIL] || T.tr;
  return (anahtar in d) ? d[anahtar] : (T.tr[anahtar] !== undefined ? T.tr[anahtar] : anahtar);
}
/* Veri nesnelerindeki çok dilli alanı çözer: {tr:"...", en:"..."} */
function c(nesne){
  if(nesne === null || nesne === undefined) return "";
  if(typeof nesne === "string") return nesne;
  return nesne[DIL] || nesne.tr || nesne.en || "";
}
/* Sayıları aktif dile göre biçimlendirir */
const YEREL = {tr:"tr-TR", en:"en-GB", de:"de-DE", fr:"fr-FR", ar:"ar-SA"};
function n(sayi){
  try{ return new Intl.NumberFormat(YEREL[DIL] || "tr-TR").format(Math.round(sayi)); }
  catch(e){ return String(Math.round(sayi)); }
}

/* Kutunun 9x9 ızgaradaki satır/sütun konumunu döndürür ------------------- */
function kutuKonumu(i){
  if(i === 0)  return {r:9, c:1};
  if(i <= 7)   return {r:9 - i, c:1};
  if(i === 8)  return {r:1, c:1};
  if(i <= 15)  return {r:1, c:i - 7};
  if(i === 16) return {r:1, c:9};
  if(i <= 23)  return {r:i - 15, c:9};
  if(i === 24) return {r:9, c:9};
  return {r:9, c:9 - (i - 24)};
}

/* ------------------------- Derinlik yardımcıları ------------------------- */
function unvanVar(p, id){ return !!(p.unvanlar && p.unvanlar.indexOf(id) >= 0); }

/* Kaynak eşiklerini geçen oyuncuya kalıcı unvan verir */
function unvanKontrol(p){
  if(!p.unvanlar) p.unvanlar = [];
  UNVANLAR.forEach(u => {
    if(p.unvanlar.indexOf(u.id) >= 0) return;
    if(p[u.kaynak] >= u.esik){
      p.unvanlar.push(u.id);
      kayit(`<b>${p.ad}</b> — ${t("unvanKazandin")}: <b>${c(u.ad)}</b>`, "iyi");
      an(`${p.ad} · ${u.em} ${c(u.ad)}`);
      if(!p.bot){ Ses.basari(); ui_toast(`${u.em} ${c(u.ad)} — ${c(u.ac)}`, "iyi"); }
    }
  });
}

/* Aynı yoldaki yatırım sayısına göre gelir çarpanı */
function kusakSayisi(p, yol){ return p.mulkler.filter(kid => TAHTA[kid].yol === yol).length; }
function kusakCarpani(p, yol){
  const s = kusakSayisi(p, yol);
  for(const e of KUSAK_ESIK){ if(s >= e.sayi) return e.carpan; }
  return 1;
}
/* Oyuncunun aktif kuşakları: [{yol, sayi, carpan}] */
function kusaklar(p){
  const sonuc = [];
  Object.keys(YOLLAR).forEach(yol => {
    const s = kusakSayisi(p, yol);
    const carpan = kusakCarpani(p, yol);
    if(carpan > 1) sonuc.push({yol, sayi:s, carpan});
  });
  return sonuc;
}

/* Dönem görev puanı ekle */
function donemPuanEkle(p, olcu, miktar){
  if(!S.donemPuan) S.donemPuan = {};
  const gorev = DONEM_GOREV[mevsim().id];
  if(!gorev || gorev.olcu !== olcu) return;
  S.donemPuan[p.id] = (S.donemPuan[p.id] || 0) + miktar;
}
function donemOnde(){
  if(!S.donemPuan) return null;
  let enIyi = null, enPuan = 0;
  Object.keys(S.donemPuan).forEach(id => {
    if(S.donemPuan[id] > enPuan){ enPuan = S.donemPuan[id]; enIyi = S.oyuncular[id]; }
  });
  return enPuan > 0 ? enIyi : null;
}
function donemGoreviBitir(){
  const kazanan = donemOnde();
  if(kazanan){
    kaynakUygula(kazanan, DONEM_ODUL, "hayir");
    kayit(`<b>${t("donemOdul")}</b> — ${kazanan.ad}: ${ozetMetin(DONEM_ODUL)}`, "iyi");
    an(`${t("donemOdul")} · ${kazanan.ad}`);
    if(!kazanan.bot) ui_toast(`${t("donemOdul")}: ${ozetMetin(DONEM_ODUL)}`, "iyi");
  }
  S.donemPuan = {};
}

/* ----------------------------- Yardımcılar ------------------------------ */
function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function sec(dizi){ return dizi[Math.floor(Math.random() * dizi.length)]; }
function karistir(dizi){
  const d = dizi.slice();
  for(let i = d.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}
function kelepce(v, alt, ust){ return Math.max(alt, Math.min(ust, v)); }
function guvenli(fn, etiket){
  try{ return fn(); }
  catch(e){ console.error("[bereket]", etiket || "", e); return null; }
}

/* ------------------------------ Ses katmanı ------------------------------ */
const Ses = {
  ctx:null, acik:true,
  baslat(){
    if(this.ctx) return;
    guvenli(()=>{ const AC = window.AudioContext || window.webkitAudioContext; if(AC) this.ctx = new AC(); }, "ses-baslat");
  },
  ton(frek, sure, tip, ses){
    if(!this.acik || !this.ctx) return;
    guvenli(()=>{
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = tip || "sine"; o.frequency.value = frek;
      g.gain.setValueAtTime(0.0001, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(ses || 0.09, this.ctx.currentTime + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + sure);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(); o.stop(this.ctx.currentTime + sure + 0.02);
    }, "ses-ton");
  },
  dizi(notalar, aralik, tip, ses){
    notalar.forEach((f, i) => setTimeout(() => this.ton(f, 0.16, tip, ses), i * (aralik || 90)));
  },
  zar(){ for(let i = 0; i < 5; i++) setTimeout(()=> this.ton(120 + rnd(0,180), 0.05, "triangle", 0.05), i * 55); },
  adim(){ this.ton(420, 0.05, "triangle", 0.045); },
  kart(){ this.dizi([520, 700], 70, "sine", 0.07); },
  altin(){ this.dizi([680, 880, 1180], 75, "sine", 0.07); },
  yatirim(){ this.dizi([330, 440, 660], 95, "triangle", 0.07); },
  basari(){ this.dizi([523, 659, 784, 1046], 110, "sine", 0.08); },
  hata(){ this.dizi([300, 220], 110, "sine", 0.06); },
  tur(){ this.dizi([440, 587], 110, "sine", 0.055); },
  tik(){ this.ton(760, 0.04, "square", 0.035); }
};

/* ------------------------------ Oyun durumu ------------------------------ */
let S = null;
let NESIL = 0;
/* Yeni oyun kurulduğunda eski turlardan kalan zamanlayıcılar iptal olur */
function zamanla(fn, ms){
  const g = S ? S.nesil : -1;
  return setTimeout(()=>{
    if(!S || S.nesil !== g) return;
    guvenli(fn, "zamanla");
  }, ms);
}

function yeniDurum(ayar){
  const oyuncular = [];
  const niyetler = karistir(NIYETLER).slice(0, Math.max(ayar.oyuncular.length, 1));
  ayar.oyuncular.forEach((o, i) => {
    oyuncular.push({
      id:i, ad:o.ad, avatar:o.avatar, renk:RENKLER[i % RENKLER.length],
      bot:!!o.bot, botTip:o.botTip || "dengeli",
      konum:0,
      altin:ayar.baslangicAltini, itibar:GAME_CONFIG.baslangic.itibar,
      ilim:GAME_CONFIG.baslangic.ilim, bereket:GAME_CONFIG.baslangic.bereket,
      mulkler:[], niyet:(niyetler[i] || NIYETLER[0]).id, niyetTamam:false,
      hac:false, hacBonus:false, umre:0,
      dinlen:0, yorgun:false, gelirAzalt:0,
      sadakaSayi:0, projeKatki:0, projeSayi:0, ticaretKar:0, dogruCevap:0,
      borc:0, elendi:false, rozetler:[], unvanlar:[], azik:false
    });
  });
  return {
    nesil:++NESIL,
    surum:GAME_CONFIG.surum, dil:DIL,
    ayar:{
      ses:ayar.ses, quiz:ayar.quiz, mini:ayar.mini, azHareket:ayar.azHareket,
      botZor:ayar.botZor, turSayisi:ayar.turSayisi, baslangicAltini:ayar.baslangicAltini,
      sureTipi:ayar.sureTipi
    },
    kurulum:ayar,
    oyuncular, sira:0, tur:1, mevsimIdx:0,
    mulkler:{},                   // kutuId -> {sahip, seviye}
    proje:{aktif:true, hedef:GAME_CONFIG.projeHedef, toplanan:0, katkilar:{}, sehir:sec([1,4,9,12,17,20,25,28])},
    log:[], desteler:{takdir:[], imtihan:[], ticaret:[], soru:[]},
    bitti:false, kilit:false, zarAtildi:false, ciftSayaci:0, sonZar:[0,0],
    projeYapildi:false, yardimYapildi:false, gelirAlindi:false, gelistirmeYapildi:false,
    azikKullanildi:false, donemPuan:{}, anlar:[]
  };
}

let bekciId = null;
function bekciKur(){
  if(bekciId) clearTimeout(bekciId);
  const g = S ? S.nesil : -1;
  bekciId = setTimeout(()=>{
    if(!S || S.nesil !== g || S.bitti) return;
    if(S.kilit){                       // beklenmedik bir takılma olduysa turu ilerlet
      S.kilit = false;
      guvenli(()=>{ ui_modalKapat(); turBitir(); }, "bekci");
    }
  }, 30000);
}
function botBekle(){ return rnd(GAME_CONFIG.botGecikme[0], GAME_CONFIG.botGecikme[1]); }
function aktif(){ return S.oyuncular[S.sira]; }
function mevsim(){ return MEVSIMLER[S.mevsimIdx] || MEVSIMLER[0]; }

/* Desteleri karıştırır; deste bitince yeniden doldurulur */
function desteCek(tip){
  const kaynak = tip === "takdir" ? KART_TAKDIR : tip === "imtihan" ? KART_IMTIHAN
               : tip === "ticaret" ? KART_TICARET : SORULAR;
  if(!S.desteler[tip] || S.desteler[tip].length === 0){
    S.desteler[tip] = karistir(kaynak.map(k => k.id));
  }
  const id = S.desteler[tip].pop();
  return kaynak.find(k => k.id === id) || kaynak[0];
}

/* ------------------------------ Günlük kaydı ----------------------------- */
function kayit(metin, sinif){
  S.log.push({m:metin, s:sinif || ""});
  if(S.log.length > 120) S.log.shift();
  guvenli(()=> ui_logCiz(), "log");
}
function an(metin){ S.anlar.push(metin); if(S.anlar.length > 12) S.anlar.shift(); }

/* --------------------------- Kaynak uygulaması --------------------------- */
/* baglam: "hayir" (sadaka/vakıf) → Ramazan ve hacı bonusu uygulanır */
function kaynakUygula(p, etki, baglam){
  if(!etki) return {};
  const uyg = {};
  let bereket = etki.bereket || 0;
  if(bereket > 0 && baglam === "hayir"){
    if(mevsim().id === "ramazan") bereket *= 2;
    if(p.hacBonus) bereket *= (1 + GAME_CONFIG.hac.bonusOran);
    if(unvanVar(p, "muhsin")) bereket *= 1.25;      // Muhsin unvanı
  }
  bereket = Math.round(bereket);

  if(etki.altin){
    if(etki.altin < 0) odemeYap(p, -etki.altin);
    else p.altin += etki.altin;
    uyg.altin = etki.altin;
  }
  if(etki.itibar){ p.itibar = Math.max(0, p.itibar + etki.itibar); uyg.itibar = etki.itibar; }
  if(etki.ilim){ p.ilim = Math.max(0, p.ilim + etki.ilim); uyg.ilim = etki.ilim; }
  if(bereket){
    p.bereket = Math.max(0, p.bereket + bereket); uyg.bereket = bereket;
    if(bereket > 0 && S && S.donemPuan) donemPuanEkle(p, "bereket", bereket);
  }
  return uyg;
}

/* Ödeme: altın yetmezse önce yatırım bozdurulur, kalan borç sayılır */
function odemeYap(p, tutar){
  tutar = Math.max(0, Math.round(tutar));
  if(p.altin >= tutar){ p.altin -= tutar; return tutar; }
  let kalan = tutar - p.altin; p.altin = 0;
  // en düşük değerli yatırımdan başlayarak seviye düşür (yarı bedelle)
  const sirali = p.mulkler.slice().sort((a,b) => (TAHTA[a].maliyet||0) - (TAHTA[b].maliyet||0));
  for(const kid of sirali){
    if(kalan <= 0) break;
    const m = S.mulkler[kid];
    while(m && m.seviye > 0 && kalan > 0){
      const geri = Math.round((TAHTA[kid].maliyet || 200) * 0.5);
      m.seviye--;
      kalan -= geri;
      if(m.seviye === 0){
        delete S.mulkler[kid];
        p.mulkler = p.mulkler.filter(x => x !== kid);
        break;
      }
    }
  }
  if(kalan > 0){ p.borc += kalan; }
  else if(kalan < 0){ p.altin += -kalan; }
  return tutar;
}

/* -------------------------- Yatırım hesaplamaları ------------------------ */
function mulkSeviye(kid){ return S.mulkler[kid] ? S.mulkler[kid].seviye : 0; }
function mulkSahibi(kid){ return S.mulkler[kid] ? S.oyuncular[S.mulkler[kid].sahip] : null; }
function gelistirmeMaliyeti(kid){
  const k = TAHTA[kid], sv = mulkSeviye(kid);
  if(sv === 0) return k.maliyet;
  return Math.round(k.maliyet * GAME_CONFIG.gelistirmeMaliyetOrani * sv);
}
function mulkGeliri(kid){
  const k = TAHTA[kid], sv = mulkSeviye(kid);
  if(sv === 0) return 0;
  let g = k.gelir * GAME_CONFIG.yatirimSeviyeCarpani[sv - 1];
  const sahip = mulkSahibi(kid);
  if(sahip) g *= kusakCarpani(sahip, k.yol);        // aynı yoldan set bonusu
  if(mevsim().id === "hasat") g *= 1.25;
  return Math.round(g);
}
function hizmetBedeli(kid){ return Math.round(mulkGeliri(kid) * GAME_CONFIG.hizmetBedeliOrani); }
function mulkDegeri(kid){ return Math.round((TAHTA[kid].maliyet || 0) * mulkSeviye(kid) * 0.9); }

/* Ödemenin tema başlığı yola göre değişir */
function odemeBasligi(yol){
  if(yol === "ticaret") return t("ticaretKatkisi");
  if(yol === "ilim") return t("egitimKatkisi");
  if(yol === "sosyal") return t("hizmetBedeli");
  return t("misafirlikKatkisi");
}

/* =========================================================================
   TUR YÖNETİMİ
   ========================================================================= */
function oyunKur(ayar){
  S = yeniDurum(ayar);
  Ses.acik = !!ayar.ses;
  document.body.classList.toggle("az-hareket", !!ayar.azHareket);
  kayit(`<b>${c({tr:"Yolculuk başladı.",en:"The journey has begun.",de:"Die Reise hat begonnen.",fr:"Le voyage commence.",ar:"بدأت الرحلة."})}</b>`, "bilgi");
  ui_ekran("ekran-oyun");
  ui_tahtaCiz();
  ui_hepsiniGuncelle();
  kaydet();
  // İlk insan oyuncuya gizli niyeti gösterelim
  const ilk = S.oyuncular.find(o => !o.bot);
  if(ilk) niyetGoster(ilk, ()=> turBasla());
  else turBasla();
}

function niyetGoster(p, bitince){
  const nyt = NIYETLER.find(x => x.id === p.niyet) || NIYETLER[0];
  ui_modal({
    tip:t("niyetBaslik"), baslik:c(nyt.ad), ikon:"i-star",
    metin:`${c(nyt.ac)}<br><br><span style="opacity:.8">${t("niyetMetin")}</span>`,
    secenekler:[{ad:t("niyetTamam"), sinif:"altin", is:()=>{ ui_modalKapat(); if(bitince) bitince(); }}],
    kapatilabilir:false
  });
}

function turBasla(){
  if(S.bitti) return;
  const p = aktif();
  S.kilit = false;

  if(p.elendi){ zamanla(siradakine, 200); return; }

  // Gelir tur başına bir kez alınır (sayfa yenilense de tekrarlanmaz)
  if(!S.gelirAlindi){ gelirTopla(p); S.gelirAlindi = true; kaydet(); }
  bekciKur();
  ui_hepsiniGuncelle();

  if(p.dinlen > 0){
    p.dinlen--;
    kayit(`<b>${p.ad}</b> — ${t("hacYolda")}`, "bilgi");
    ui_toast(`${p.ad}: ${t("hacYolda")}`);
    zamanla(()=> turBitir(), 1100);
    return;
  }
  if(p.bot){
    S.kilit = true;
    zamanla(()=>{ S.kilit = false; zarAt(); }, botBekle());
  }
}

function gelirTopla(p){
  if(!p.mulkler.length) return;
  let altin = 0, ilim = 0, bereket = 0;
  p.mulkler.forEach(kid => {
    altin += mulkGeliri(kid);
    const yol = TAHTA[kid].yol;
    const sv = mulkSeviye(kid);
    // İlim yatırımları her tur bilgi üretir; hayır yatırımları bereket
    if(yol === "ilim") ilim += (sv >= 3 ? 2 : 1);
    if((yol === "sosyal" || yol === "ibadet") && sv >= 2) bereket += 1;
  });
  if(p.gelirAzalt > 0){ altin = Math.round(altin * 0.5); p.gelirAzalt--; }
  if(mevsim().id === "hac" && p.hac) bereket += 2;
  if(altin || ilim || bereket){
    kaynakUygula(p, {altin, ilim, bereket});
    donemPuanEkle(p, "gelir", altin);
    kayit(`<b>${p.ad}</b> ${c({tr:"yatırım geliri aldı",en:"collected investment income",de:"erhielt Erträge",fr:"a perçu ses revenus",ar:"قبض دخل استثماراته"})}: +${n(altin)} ${t("altin")}`, "iyi");
  }
}

function zarAt(){
  if(S.bitti || S.kilit || S.zarAtildi) return;
  const p = aktif();
  if(p.elendi) return;
  S.kilit = true;
  S.zarAtildi = true;
  Ses.zar();

  const tekZar = p.yorgun;
  const z1 = rnd(1, 6);
  const z2 = tekZar ? 0 : rnd(1, 6);
  p.yorgun = false;
  S.sonZar = [z1, z2];
  const toplam = z1 + z2;

  ui_zarGoster(z1, z2, true);
  const gecikme = S.ayar.azHareket ? 200 : 700;
  zamanla(()=>{
    kayit(`<b>${p.ad}</b> ${t("zarAt").toLowerCase()}: <b>${toplam}</b>${tekZar ? " ("+t("tekZar")+")" : ""}`, "bilgi");
    azikSor(p, toplam, adim => ilerlet(p, adim, ()=> kutuCoz(p)));
  }, gecikme);
}

/* Yol Azığı: zarı attıktan sonra bir kutu ileri/geri kayma hakkı.
   İnsan oyuncuda ancak açıksa sorulur; botlarda zor seviye kendi hesaplar. */
function azikSor(p, toplam, devam){
  if(S.azikKullanildi || toplam < 2){ devam(toplam); return; }
  if(p.bot){
    const kaydirma = botAzikKarari(p, toplam);
    if(kaydirma !== 0){
      odemeYap(p, AZIK_MALIYET); S.azikKullanildi = true;
      kayit(`<b>${p.ad}</b> — ${t("yolAzigi")}: ${kaydirma > 0 ? "+1" : "-1"}`, "bilgi");
    }
    devam(toplam + kaydirma);
    return;
  }
  if(!p.azik || p.altin < AZIK_MALIYET){ devam(toplam); return; }
  const kutuAdi = k => c(TAHTA[(p.konum + k + TAHTA.length) % TAHTA.length].ad);
  const uygula = (kaydirma)=>{
    if(kaydirma !== 0){
      odemeYap(p, AZIK_MALIYET); S.azikKullanildi = true;
      kayit(`<b>${p.ad}</b> — ${t("yolAzigi")}: ${kaydirma > 0 ? "+1" : "-1"} (${n(AZIK_MALIYET)} ${t("altin")})`, "bilgi");
    }
    ui_modalKapat(); ui_hepsiniGuncelle();
    devam(toplam + kaydirma);
  };
  ui_modal({
    tip:t("yolAzigi"), baslik:t("azikSoru").replace("{z}", toplam), ikon:"i-caravan",
    metin:t("yolAzigiAc"),
    secenekler:[
      {ad:kutuAdi(toplam - 1), alt:t("azikGeri") + " · " + n(AZIK_MALIYET) + " " + t("altin"), sinif:"", is:()=> uygula(-1)},
      {ad:kutuAdi(toplam), alt:t("azikAyni") + " · " + t("azikBedel"), sinif:"altin", is:()=> uygula(0)},
      {ad:kutuAdi(toplam + 1), alt:t("azikIleri") + " · " + n(AZIK_MALIYET) + " " + t("altin"), sinif:"", is:()=> uygula(1)}
    ]
  });
}

/* Bot, azığı yalnızca hedef kutu belirgin biçimde daha iyiyse kullanır */
function botAzikKarari(p, toplam){
  if(S.ayar.botZor === "kolay") return 0;
  if(p.altin < AZIK_MALIYET * 4) return 0;
  const deger = (k)=>{
    const kutu = TAHTA[(p.konum + k + TAHTA.length) % TAHTA.length];
    const sahip = mulkSahibi(kutu.id);
    if(kutu.tur === "sehir" || kutu.tur === "hizmet"){
      if(sahip && sahip.id !== p.id) return -mulkGeliri(kutu.id) / 12;
      if(!sahip && p.altin > kutu.maliyet * 1.4) return kutu.gelir / 8;
      if(sahip && sahip.id === p.id && mulkSeviye(kutu.id) < 4) return 2.5;
      return 0;
    }
    if(kutu.tur === "takdir") return 2.2;
    if(kutu.tur === "hac") return (!p.hac && p.altin > GAME_CONFIG.hac.maliyet * 1.5) ? 5 : 0;
    if(kutu.tur === "imtihan") return -1.4;
    if(kutu.tur === "zekat") return -1;
    if(kutu.tur === "ilim") return p.botTip === "alim" ? 2 : 1;
    return .5;
  };
  const simdi = deger(toplam);
  const ileri = deger(toplam + 1), geri = deger(toplam - 1);
  const esik = 2.2;                       // kayma ancak kayda değer farkta yapılır
  if(ileri > simdi + esik && ileri >= geri) return 1;
  if(geri > simdi + esik) return -1;
  return 0;
}

function ilerlet(p, adim, bitince){
  const hiz = S.ayar.azHareket ? 40 : 200;
  let kalan = adim;
  const yuru = () => {
    if(kalan <= 0){ if(bitince) bitince(); return; }
    p.konum = (p.konum + 1) % TAHTA.length;
    if(p.konum === 0){
      const b = GAME_CONFIG.baslangictanGecme;
      kaynakUygula(p, {altin:b.altin, bereket:b.bereket}, "hayir");
      kayit(`<b>${p.ad}</b> — ${t("gecerkenAl")}: +${n(b.altin)} ${t("altin")}, +${b.bereket} ${t("bereket")}`, "iyi");
      Ses.altin();
    }
    Ses.adim();
    ui_piyonlariGuncelle(p.id);
    kalan--;
    zamanla(yuru, hiz);
  };
  yuru();
}

/* --------------------------- Kutu çözümlemesi ---------------------------- */
function kutuCoz(p){
  const k = TAHTA[p.konum];
  ui_kutuVurgula(p.konum);
  ui_hepsiniGuncelle();
  switch(k.tur){
    case "start":   olayBaslangic(p); break;
    case "sehir":
    case "hizmet":  yatirimEkrani(p, k); break;
    case "takdir":  kartTakdir(p); break;
    case "imtihan": kartImtihan(p); break;
    case "ticaret": kartTicaret(p); break;
    case "ilim":    ilimSorusu(p); break;
    case "sadaka":  sadakaEkrani(p, false); break;
    case "hayir":   sadakaEkrani(p, true); break;
    case "hac":     hacEkrani(p); break;
    case "umre":    umreEkrani(p); break;
    case "zekat":   zekatEkrani(p); break;
    case "olay":    olayKutusu(p, k); break;
    default:        eylemBitti();
  }
}

function olayBaslangic(p){

/* Bot için basit bilgilendirme, insan için pencere */
/* Karar gerektirmeyen olaylar pencere açmaz: kısa bir şerit gösterilir ve
   oyun kendiliğinden devam eder. Böylece tur akışı tıklamayla kesilmez. */
function bilgiPenceresi(p, k, ozet, etki){
  kayit(`<b>${p.ad}</b> — ${c(k.ad)}: ${ozet}`, "iyi");
  if(p.bot){ eylemBitti(); return; }
  ui_bildirim({ikon:k.ikon, baslik:c(k.ad), metin:c(k.ac), etkiler:etki, sinif:"iyi", sure:2300},
              ()=> eylemBitti());
}

/* ----------------------------- Yatırım akışı ----------------------------- */
function yatirimEkrani(p, k){
  const kid = k.id, sahip = mulkSahibi(kid), sv = mulkSeviye(kid);
  const yol = YOLLAR[k.yol];

  // Başkasının alanı → katkı öde
  if(sahip && sahip.id !== p.id){
    let bedel = hizmetBedeli(kid);
    if(unvanVar(p, "emin")) bedel = Math.round(bedel * 0.75);   // Emin unvanı
    odemeYap(p, bedel);
    sahip.altin += bedel;
    kaynakUygula(sahip, {bereket:1});
    Ses.tik();
    kayit(`<b>${p.ad}</b> → <b>${sahip.ad}</b> · ${odemeBasligi(k.yol)}: ${n(bedel)} ${t("altin")}`, "kotu");
    if(p.bot){ eylemBitti(); return; }
    ui_bildirim({ikon:k.ikon, baslik:odemeBasligi(k.yol),
      metin:`${c(k.ad)} · ${c(yol.kademeler[sv-1])} — ${t("sahibi")}: ${sahip.ad}`,
      etkiler:{altin:-bedel}, sinif:"kotu", sure:2300}, ()=> eylemBitti());
    return;
  }

  // Boş alan veya kendi alanın → yatırım / geliştirme
  const enUst = sv >= 4;
  const maliyet = enUst ? 0 : gelistirmeMaliyeti(kid);
  const yeniSv = sv + 1;
  const secenekler = [];

  if(!enUst){
    const yeterli = p.altin >= maliyet;
    secenekler.push({
      ad:(sv === 0 ? t("yatirimYap") : t("gelistir")) + " — " + c(yol.kademeler[sv]),
      alt:`${t("maliyet")}: ${n(maliyet)} ${t("altin")} · ${t("gelir")}: ${n(Math.round(k.gelir * GAME_CONFIG.yatirimSeviyeCarpani[sv]))} ${t("altin")}`,
      sinif:"iyi", pasif:!yeterli,
      etki:Object.assign({}, k.odul || {}),
      botEk:(bot)=> yatirimCazibesi(bot, kid, maliyet),
      is:()=>{
        if(p.altin < maliyet){ ui_toast(t("yeterliAltinYok"), "kotu"); return; }
        yatirimYap(p, kid, maliyet, yeniSv);
        ui_modalKapat(); eylemBitti();
      }
    });
  }
  secenekler.push({
    ad:t("gec"), sinif:"", etki:{}, botEk:()=> 0.8,
    is:()=>{ ui_modalKapat(); eylemBitti(); }
  });

  if(p.bot){ botSec(p, secenekler); return; }

  ui_modal({
    tip:enUst ? c(yol.ad) : t("yatirimYap"),
    baslik:c(k.ad), ikon:k.ikon,
    metin:`${c(k.ac)}<br><br>${sv === 0 ? t("bosAlan") : c(yol.kademeler[sv-1]) + " · " + t("seviye") + " " + sv}
           ${enUst ? "<br><b>" + c({tr:"En üst seviye",en:"Highest level",de:"Höchste Stufe",fr:"Niveau maximal",ar:"أعلى مستوى"}) + "</b>" : ""}`,
    secenekler
  });
}

function yatirimYap(p, kid, maliyet, yeniSv){
  odemeYap(p, maliyet);
  if(!S.mulkler[kid]) S.mulkler[kid] = {sahip:p.id, seviye:0};
  S.mulkler[kid].sahip = p.id;
  S.mulkler[kid].seviye = yeniSv;
  if(!p.mulkler.includes(kid)) p.mulkler.push(kid);
  const k = TAHTA[kid];
  kaynakUygula(p, k.odul || {}, (k.yol === "sosyal" || k.yol === "ibadet") ? "hayir" : null);
  donemPuanEkle(p, "yatirim", 1);
  Ses.yatirim();
  const yol = YOLLAR[k.yol];
  kayit(`<b>${p.ad}</b> — ${c(k.ad)}: ${c(yol.kademeler[yeniSv-1])} (${t("seviye")} ${yeniSv})`, "iyi");
  an(`${p.ad} · ${c(k.ad)} → ${c(yol.kademeler[yeniSv-1])}`);
  if(yeniSv === 4) rozetVer(p, "vakif");
}

function kartTicaret(p){
  const kart = desteCek("ticaret");
  Ses.kart();
  const secenekler = [
    {ad:t("yatirimYapma"), sinif:"", etki:{}, botEk:()=> 1.2, is:()=>{ ui_modalKapat(); eylemBitti(); }},
    ...[100, 250].map(tutar => ({
      ad:`${n(tutar)} ${t("altin")} — ${t("yatir")}`,
      alt:ticaretOran(p, kart) + "% " + c({tr:"kazanç ihtimali",en:"chance of profit",de:"Gewinnchance",fr:"chance de gain",ar:"احتمال الربح"}),
      sinif:"altin", pasif:p.altin < tutar,
      botEk:(bot)=> (ticaretOran(bot, kart) / 100) * (tutar / 60) * BOT_TIPLERI.find(x=>x.id===bot.botTip).risk * 2.4 - (tutar/110),
      is:()=>{
        if(p.altin < tutar){ ui_toast(t("yeterliAltinYok"), "kotu"); return; }
        ticaretSonucu(p, kart, tutar);
      }
    }))
  ];
  if(p.bot){ botSec(p, secenekler); return; }
  ui_modal({
    tip:t("ticaretBaslik"), baslik:c(kart.ad), ikon:"i-scale", kartSinif:"kart-cek",
    metin:`${c(kart.metin)}<br><br><span style="opacity:.85">${t("ticaretMetin")}</span>`,
    secenekler
  });
}

function ticaretOran(p, kart){
  let taban = 46 - (kart.zorluk - 1) * 7;
  taban += Math.min(20, p.ilim * 0.35);
  taban += Math.min(12, p.itibar * 0.18);
  taban += p.mulkler.filter(kid => TAHTA[kid].yol === "ticaret").length * 5;
  if(unvanVar(p, "tuccarbasi")) taban += 8;        // Tüccarbaşı unvanı
  return Math.round(kelepce(taban, 20, 92));
}

function ticaretSonucu(p, kart, tutar){
  odemeYap(p, tutar);
  const oran = ticaretOran(p, kart);
  const z = rnd(1, 100);
  let sonucMetin, etki, sinif;
  if(z <= oran * 0.35){ sonucMetin = t("sonucBuyuk"); etki = {altin:Math.round(tutar * 2.1), itibar:3}; sinif = "iyi"; p.ticaretKar++; }
  else if(z <= oran){ sonucMetin = t("sonucNormal"); etki = {altin:Math.round(tutar * 1.45)}; sinif = "iyi"; p.ticaretKar++; }
  else if(z <= oran + 22){ sonucMetin = t("sonucBasabas"); etki = {altin:tutar}; sinif = "bilgi"; }
  else { sonucMetin = t("sonucZarar"); etki = {altin:Math.round(tutar * 0.35), bereket:5}; sinif = "kotu"; }
  const uyg = kaynakUygula(p, etki, null);
  if(p.ticaretKar >= 3) rozetVer(p, "kervan");
  kayit(`<b>${p.ad}</b> — ${c(kart.ad)}: ${sonucMetin} (${ozetMetin(uyg)})`, sinif);
  sinif === "kotu" ? Ses.hata() : Ses.altin();
  if(p.bot){ eylemBitti(); return; }
  ui_modalKapat();
  ui_bildirim({ikon:"i-scale", baslik:sonucMetin, metin:`${c(kart.ad)} · ${n(tutar)} ${t("altin")}`,
    etkiler:uyg, sinif:sinif === "kotu" ? "kotu" : "iyi", sure:2800}, ()=> eylemBitti());
}

/* ------------------------------ İlim sorusu ------------------------------ */
function ilimSorusu(p){
  if(!S.ayar.quiz){
    const uyg = kaynakUygula(p, {ilim:8});
    kayit(`<b>${p.ad}</b> — ${t("ilim")}: +8`, "iyi");
    if(p.bot){ eylemBitti(); return; }
    bilgiPenceresi(p, TAHTA[11], `+8 ${t("ilim")}`, uyg);
    return;
  }
  const q = desteCek("soru");
  const oduller = {1:{ilim:6}, 2:{ilim:12}, 3:{ilim:20, itibar:3}};
  let odul = Object.assign({}, oduller[q.z]);
  if(mevsim().id === "kandil"){ odul.ilim = Math.round(odul.ilim * 1.5); }
  if(unvanVar(p, "muderris")){ odul.ilim = Math.round(odul.ilim * 1.5); }   // Müderris unvanı

  if(p.bot){
    const zorluk = S.ayar.botZor;
    const tabanBasari = zorluk === "zor" ? 0.78 : zorluk === "orta" ? 0.6 : 0.42;
    const bonus = p.botTip === "alim" ? 0.15 : 0;
    const dogru = Math.random() < kelepce(tabanBasari + bonus - (q.z - 1) * 0.12, 0.15, 0.95);
    if(dogru){ kaynakUygula(p, odul); p.dogruCevap++; if(p.ilim >= 60) rozetVer(p, "alim"); }
    kayit(`<b>${p.ad}</b> — ${t("quizBaslik")}: ${dogru ? t("dogruCevap") : "…"}`, dogru ? "iyi" : "bilgi");
    eylemBitti(); return;
  }
  ui_quiz(q, odul, p);
}
function quizCevapla(p, q, odul, dogruMu){
  if(dogruMu){
    const uyg = kaynakUygula(p, odul);
    p.dogruCevap++;
    donemPuanEkle(p, "ilim", 1);
    if(p.ilim >= 60) rozetVer(p, "alim");
    Ses.basari();
    kayit(`<b>${p.ad}</b> — ${t("dogruCevap")} ${ozetMetin(uyg)}`, "iyi");
  }else{
    Ses.hata();
    kayit(`<b>${p.ad}</b> — ${t("quizBaslik")}`, "bilgi");
  }
}

/* ------------------------- Sadaka ve hayır işleri ------------------------ */
function sadakaEkrani(p, hayirMi){
  const secenekler = GAME_CONFIG.sadakaSecenek.map(tutar => ({
    ad:`${n(tutar)} ${t("altin")}`,
    alt:`+${Math.round(tutar / 10)} ${t("bereket")} · +${Math.round(tutar / 18)} ${t("itibar")}`,
    sinif:"iyi", pasif:p.altin < tutar,
    botEk:(bot)=> {
      const w = BOT_TIPLERI.find(x => x.id === bot.botTip);
      return (tutar / 10) * w.agirlik.bereket * 0.16 + (bot.altin > tutar * 4 ? 1.4 : -0.6);
    },
    is:()=>{
      if(p.altin < tutar){ ui_toast(t("yeterliAltinYok"), "kotu"); return; }
      const uyg = kaynakUygula(p, {altin:-tutar, bereket:Math.round(tutar/10), itibar:Math.round(tutar/18)}, "hayir");
      p.sadakaSayi++;
      donemPuanEkle(p, "hayir", 1);
      if(p.sadakaSayi >= 6) rozetVer(p, "muhsin");
      Ses.basari();
      kayit(`<b>${p.ad}</b> — ${hayirMi ? t("hayirBaslik") : t("sadakaBaslik")}: ${ozetMetin(uyg)}`, "iyi");
      an(`${p.ad} · ${hayirMi ? t("hayirBaslik") : t("sadakaBaslik")} ${n(tutar)}`);
      ui_modalKapat(); eylemBitti();
    }
  }));
  secenekler.push({ad:t("vermeyi"), sinif:"", etki:{}, botEk:()=> 0.5, is:()=>{ ui_modalKapat(); eylemBitti(); }});
  if(p.bot){ botSec(p, secenekler); return; }
  ui_modal({
    tip:hayirMi ? t("hayirBaslik") : t("sadakaBaslik"),
    baslik:hayirMi ? t("hayirBaslik") : t("sadakaBaslik"), ikon:"i-hands",
    metin:hayirMi ? t("hayirMetin") : t("sadakaMetin"),
    not:mevsim().id === "ramazan" ? t("mevsimRamazanAc") : "",
    secenekler
  });
}

/* ------------------------------ Hac ve umre ------------------------------ */
function hacEkrani(p, kart){
  const cfg = GAME_CONFIG.hac;
  if(p.hac){
    kayit(`<b>${p.ad}</b> — ${t("hacTamam")}`, "bilgi");
    const uyg = kaynakUygula(p, {bereket:12});
    if(p.bot){ eylemBitti(); return; }
    ui_bildirim({ikon:"i-kaaba", baslik:t("hacBaslik"), metin:t("hacTamam"), etkiler:uyg, sinif:"iyi", sure:2400},
                ()=> eylemBitti());
    return;
  }
  const yeterli = p.altin >= cfg.maliyet;
  const git = ()=>{
    if(p.altin < cfg.maliyet){ ui_toast(t("hacYok"), "kotu"); return; }
    const uyg = kaynakUygula(p, {altin:-cfg.maliyet, bereket:cfg.bereket, itibar:cfg.itibar, ilim:cfg.ilim}, null);
    p.hac = true; p.hacBonus = true; p.dinlen += 1;
    rozetVer(p, "haci");
    Ses.basari();
    kayit(`<b>${p.ad}</b> — ${t("hacBaslik")}: ${ozetMetin(uyg)}`, "iyi");
    an(`${p.ad} · ${t("haciRozeti")} 🕋`);
    ui_modalKapat(); eylemBitti();
  };
  if(p.bot){
    const w = BOT_TIPLERI.find(x => x.id === p.botTip);
    const kalanTur = S.ayar.turSayisi - S.tur;
    const ister = yeterli && (p.altin > cfg.maliyet * 1.6 || kalanTur < 5) && Math.random() < w.hacIstek;
    if(ister) git(); else { kayit(`<b>${p.ad}</b> — ${t("hacSonra")}`, "bilgi"); eylemBitti(); }
    return;
  }
  ui_modal({
    tip:t("hacBaslik"), baslik:kart ? c(kart.ad) : t("hacBaslik"), ikon:"i-kaaba",
    metin:(kart ? c(kart.metin) + "<br><br>" : "") + t("hacMetin"),
    etkiler:{altin:-cfg.maliyet, bereket:cfg.bereket, itibar:cfg.itibar, ilim:cfg.ilim},
    not:yeterli ? t("hacBonus") : t("hacYok"),
    secenekler:[
      {ad:t("hacGit"), sinif:"altin", pasif:!yeterli, is:git},
      {ad:t("hacSonra"), alt:t("hacSonraNot"), sinif:"", is:()=>{ ui_modalKapat(); eylemBitti(); }}
    ]
  });
}

function umreEkrani(p){
  const cfg = GAME_CONFIG.umre;
  const carpan = Math.max(cfg.enAz, 1 - p.umre * cfg.azalma);
  const bereket = Math.round(cfg.bereket * carpan), itibar = Math.round(cfg.itibar * carpan);
  const yeterli = p.altin >= cfg.maliyet;
  const git = ()=>{
    if(p.altin < cfg.maliyet){ ui_toast(t("yeterliAltinYok"), "kotu"); return; }
    const uyg = kaynakUygula(p, {altin:-cfg.maliyet, bereket, itibar}, "hayir");
    p.umre++;
    if(p.umre >= 2) rozetVer(p, "umre");
    Ses.basari();
    kayit(`<b>${p.ad}</b> — ${t("umreBaslik")} (${p.umre}): ${ozetMetin(uyg)}`, "iyi");
    ui_modalKapat(); eylemBitti();
  };
  if(p.bot){
    const w = BOT_TIPLERI.find(x => x.id === p.botTip);
    if(yeterli && p.altin > 400 && Math.random() < w.hacIstek * 0.8) git();
    else eylemBitti();
    return;
  }
  ui_modal({
    tip:t("umreBaslik"), baslik:t("umreBaslik"), ikon:"i-kaaba", metin:t("umreMetin"),
    etkiler:{altin:-cfg.maliyet, bereket, itibar},
    secenekler:[
      {ad:t("umreYap"), sinif:"altin", pasif:!yeterli, is:git},
      {ad:t("umreSonra"), sinif:"", is:()=>{ ui_modalKapat(); eylemBitti(); }}
    ]
  });
}

/* ----------------------------- Olay kutuları ----------------------------- */
function olayKutusu(p, k){
  if(k.olay === "asure"){
    const etki = {bereket:10, itibar:6};
    if(mevsim().id === "kurban") etki.itibar = 12;
    const uyg = kaynakUygula(p, etki, "hayir");
    p.sadakaSayi++;
    kayit(`<b>${p.ad}</b> — ${c(k.ad)}: ${ozetMetin(uyg)}`, "iyi");
    Ses.basari();
    if(p.bot){ eylemBitti(); return; }
    bilgiPenceresi(p, k, ozetMetin(uyg), uyg);
    return;
  }
  // Kandil gecesi → mini oyun ya da ilim ödülü
  if(S.ayar.mini && !p.bot){
    miniOyunBaslat(p, ()=>{ kaynakUygula(p, {bereket:8}, "hayir"); eylemBitti(); });
    return;
  }
  const uyg = kaynakUygula(p, {ilim:12, bereket:6}, "hayir");
  kayit(`<b>${p.ad}</b> — ${c(k.ad)}: ${ozetMetin(uyg)}`, "iyi");
  if(p.bot){ eylemBitti(); return; }
  bilgiPenceresi(p, k, ozetMetin(uyg), uyg);
}

    tip:t("projeBaslik"), baslik:`${sehir} · ${t("projeBaslik")}`, ikon:"i-tree",
    kapatilabilir:true,
    metin:`${t("projeMetin")}<br><br><b>${t("projeHedef")}:</b> ${n(S.proje.hedef)} · <b>${t("projeToplanan")}:</b> ${n(S.proje.toplanan)}<br><b>${t("projeSenin")}:</b> ${n(S.proje.katkilar[p.id] || 0)}`,
    secenekler
  });
}

function projeKatki(p, tutar){
  if(p.altin < tutar){ ui_toast(t("yeterliAltinYok"), "kotu"); return; }
  odemeYap(p, tutar);
  S.proje.toplanan += tutar;
  S.proje.katkilar[p.id] = (S.proje.katkilar[p.id] || 0) + tutar;
  p.projeKatki += tutar; p.projeSayi++;
  donemPuanEkle(p, "proje", tutar);
  S.projeYapildi = true;
  const itibarKazanc = mevsim().id === "kurban" ? 9 : 6;
  kaynakUygula(p, {itibar:itibarKazanc, bereket:6}, "hayir");
  Ses.yatirim();
  kayit(`<b>${p.ad}</b> — ${t("katkiVer")}: ${n(tutar)} ${t("altin")}`, "iyi");
  if(S.proje.toplanan >= S.proje.hedef) projeTamamla();
  ui_hepsiniGuncelle();
}

function projeTamamla(){
  const toplam = S.proje.toplanan;
  Object.keys(S.proje.katkilar).forEach(id => {
    const p = S.oyuncular[id];
    if(!p) return;
    const oran = S.proje.katkilar[id] / toplam;
    kaynakUygula(p, {
      itibar:Math.round(20 * oran) + 4,
      bereket:Math.round(22 * oran) + 4,
      altin:Math.round(toplam * 0.35 * oran)
    }, "hayir");
  });
  Ses.basari();
  kayit(`<b>${t("projeTamamlandi")}</b> — ${c(TAHTA[S.proje.sehir].ad)}`, "iyi");
  an(t("projeTamamlandi"));
  ui_toast(t("projeTamamlandi"), "iyi");
  S.proje = {aktif:true, hedef:Math.round(S.proje.hedef * 1.3), toplanan:0, katkilar:{},
             sehir:sec([1,4,9,12,17,20,25,28])};
}

/* ------------------------------- Yardım et ------------------------------- */
function yardimEkrani(){
  const p = aktif();
  if(p.bot) return;
  if(S.yardimYapildi){ ui_toast(t("hediyeGonderildi")); return; }
  const digerleri = S.oyuncular.filter(o => o.id !== p.id && !o.elendi);
  if(!digerleri.length){ ui_modalKapat(); return; }
  const secenekler = [];
  digerleri.forEach(o => {
    [100, 200].forEach(tutar => {
      secenekler.push({
        ad:`${o.ad} — ${n(tutar)} ${t("altin")}`, sinif:"iyi", pasif:p.altin < tutar,
        is:()=>{
          if(p.altin < tutar){ ui_toast(t("yeterliAltinYok"), "kotu"); return; }
          odemeYap(p, tutar); o.altin += tutar;
          const carpan = mevsim().id === "kurban" ? 1.5 : 1;
          kaynakUygula(p, {itibar:Math.round(tutar / 14 * carpan), bereket:Math.round(tutar / 10)}, "hayir");
          kaynakUygula(o, {bereket:3});
          p.sadakaSayi++; S.yardimYapildi = true;
          Ses.altin();
          kayit(`<b>${p.ad}</b> → <b>${o.ad}</b> · ${t("yardimEt")}: ${n(tutar)} ${t("altin")}`, "iyi");
          ui_toast(t("hediyeGonderildi"), "iyi");
          ui_modalKapat(); ui_hepsiniGuncelle();
        }
      });
    });
  });
  secenekler.push({ad:t("iptal"), sinif:"", is:()=> ui_modalKapat()});
  ui_modal({tip:t("yardimEt"), baslik:t("yardimEt"), ikon:"i-hands", metin:t("yardimMetin"), secenekler, kapatilabilir:true});
}

/* ------------------------------- Bot kararı ------------------------------ */
function yatirimCazibesi(bot, kid, maliyet){
  const w = BOT_TIPLERI.find(x => x.id === bot.botTip);
  const k = TAHTA[kid];
  const kalanTur = Math.max(1, S.ayar.turSayisi - S.tur + 1);
  let p = (k.gelir / 10) * Math.min(kalanTur, 12) * 0.28;
  p -= maliyet / 260;                       // maliyet duyarlılığı
  if(w.yolTercihi.includes(k.yol)) p += 3.4;
  if(w.biriktir && bot.altin < maliyet * 2.4) p -= 5;
  if(bot.altin < maliyet * 1.3) p -= 9;     // parası dar ise yatırım yapmaz
  if(kalanTur <= 2) p -= 4;                 // son turlarda geri dönüşü yok
  // Niyet hedefleri
  if(bot.niyet === "sehir" && k.tur === "sehir") p += 2.2;
  if(bot.niyet === "vakif" && k.yol === "sosyal") p += 2.6;
  if(bot.niyet === "kulliye" && mulkSeviye(kid) === 3) p += 4;
  if(bot.niyet === "hac" && !bot.hac && bot.altin - maliyet < GAME_CONFIG.hac.maliyet) p -= 3.5;
  return p;
}

function secenekPuani(bot, sc){
  const w = BOT_TIPLERI.find(x => x.id === bot.botTip) || BOT_TIPLERI[3];
  const e = sc.etki || {};
  let v = 0;
  v += ((e.altin || 0) / 12) * w.agirlik.altin;
  v += (e.itibar || 0) * 0.55 * w.agirlik.itibar;
  v += (e.ilim || 0) * 0.55 * w.agirlik.ilim;
  v += (e.bereket || 0) * 0.6 * w.agirlik.bereket;
  if(typeof sc.botEk === "function") v += sc.botEk(bot);
  if(sc.pasif) v = -999;
  const zorluk = S.ayar.botZor;
  if(zorluk === "kolay") v += (Math.random() - 0.5) * 8;
  else if(zorluk === "orta") v += (Math.random() - 0.5) * 3;
  else v += (Math.random() - 0.5) * 0.7;
  return v;
}

function botSec(bot, secenekler){
  const uygun = secenekler.filter(s => !s.pasif);
  const liste = uygun.length ? uygun : secenekler;
  let enIyi = liste[0], enPuan = -Infinity;
  liste.forEach(s => { const v = secenekPuani(bot, s); if(v > enPuan){ enPuan = v; enIyi = s; } });
  zamanla(()=> enIyi.is(), botBekle());
}

/* Bot turu içi ek eylemler (proje katkısı / yardım) */
function botEkEylem(bot){
  const w = BOT_TIPLERI.find(x => x.id === bot.botTip);
  // Panelden geliştirme hakkını botlar da kullanır: en verimli yatırımı yükseltir
  if(!S.gelistirmeYapildi && bot.mulkler.length){
    const adaylar = bot.mulkler
      .filter(kid => mulkSeviye(kid) < 4 && bot.altin > gelistirmeMaliyeti(kid) * 1.8)
      .sort((a, b) => TAHTA[b].gelir - TAHTA[a].gelir);
    if(adaylar.length && Math.random() < 0.7){
      const kid = adaylar[0];
      yatirimYap(bot, kid, gelistirmeMaliyeti(kid), mulkSeviye(kid) + 1);
      S.gelistirmeYapildi = true;
    }
  }
  if(S.proje.aktif && !S.projeYapildi && bot.altin > 700 && Math.random() < w.agirlik.bereket * 0.22){
    projeKatki(bot, GAME_CONFIG.projeKatkiSecenek[0]);
  }
  const zayif = S.oyuncular.filter(o => o.id !== bot.id && !o.elendi && o.altin < 150);
  if(zayif.length && bot.altin > 900 && Math.random() < w.agirlik.itibar * 0.18){
    const hedef = sec(zayif);
    odemeYap(bot, 100); hedef.altin += 100;
    kaynakUygula(bot, {itibar:7, bereket:10}, "hayir");
    bot.sadakaSayi++;
    kayit(`<b>${bot.ad}</b> → <b>${hedef.ad}</b> · ${t("yardimEt")}: ${n(100)} ${t("altin")}`, "iyi");
  }
}

/* ------------------------------ Tur bitişi ------------------------------- */
function eylemBitti(){
  S.kilit = false;
  const p = aktif();
  niyetKontrol(p);
  unvanKontrol(p);
  ui_hepsiniGuncelle();
  kaydet();

  const cift = S.sonZar[1] > 0 && S.sonZar[0] === S.sonZar[1];
  if(cift && !S.bitti){
    S.ciftSayaci++;
    if(S.ciftSayaci >= 3){
      p.yorgun = true;
      kayit(`<b>${p.ad}</b> — ${t("yolYorgunlugu")}: ${t("yolYorgunluguAc")}`, "bilgi");
      if(!p.bot) ui_toast(t("yolYorgunlugu"));
    }else{
      if(!p.bot) ui_toast(t("ciftZar"), "iyi");
      kayit(`<b>${p.ad}</b> — ${t("ciftZar")}`, "bilgi");
      S.zarAtildi = false;   // çift atan oyuncu bir kez daha zar atabilir
      if(p.bot) zamanla(()=> zarAt(), botBekle());
      else ui_hepsiniGuncelle();
      return;
    }
  }
  if(p.bot){
    botEkEylem(p);
    zamanla(()=> turBitir(), botBekle());
  }
}

function turBitir(){
  if(S.bitti) return;
  if(bekciId){ clearTimeout(bekciId); bekciId = null; }
  const p = aktif();
  niyetKontrol(p);
  kayit(`<b>${p.ad}</b> ${t("sirasiGecti")}.`, "bilgi");
  Ses.tur();
  siradakine();
}

function siradakine(){
  let sayac = 0;
  do{
    S.sira++;
    if(S.sira >= S.oyuncular.length){
      S.sira = 0;
      S.tur++;
      mevsimGuncelle();
      if(S.tur > S.ayar.turSayisi){ oyunBitir(); return; }
    }
    sayac++;
  } while(aktif().elendi && sayac <= S.oyuncular.length);
  // Tur başı sıfırlamaları burada yapılır ki sayfa yenilemesi turu tazelemesin
  S.zarAtildi = false; S.ciftSayaci = 0; S.gelirAlindi = false;
  S.projeYapildi = false; S.yardimYapildi = false; S.gelistirmeYapildi = false; S.azikKullanildi = false;
  kaydet();
  ui_hepsiniGuncelle();
  turBasla();
}

function mevsimGuncelle(){
  const yeni = Math.floor((S.tur - 1) / GAME_CONFIG.mevsimUzunlugu) % MEVSIMLER.length;
  if(yeni !== S.mevsimIdx){
    donemGoreviBitir();          // biten dönemin görev ödülü dağıtılır
    S.mevsimIdx = yeni;
    const m = mevsim();
    kayit(`<b>${t(m.anahtar)}</b> — ${m.ac ? t(m.ac) : ""}`, "bilgi");
    ui_toast(`${t(m.anahtar)}`, "iyi");
  }
}

/* -------------------------------- Niyetler ------------------------------- */
function niyetKontrol(p){
  if(p.niyetTamam) return;
  const nyt = NIYETLER.find(x => x.id === p.niyet);
  if(!nyt) return;
  let ok = false;
  switch(p.niyet){
    case "vakif":   ok = p.mulkler.filter(k => TAHTA[k].yol === "sosyal").length >= nyt.hedef; break;
    case "ilim":    ok = p.ilim >= nyt.hedef; break;
    case "sehir":   ok = p.mulkler.filter(k => TAHTA[k].tur === "sehir").length >= nyt.hedef; break;
    case "hac":     ok = p.hac; break;
    case "sadaka":  ok = p.sadakaSayi >= nyt.hedef; break;
    case "itibar":  ok = p.itibar >= nyt.hedef; break;
    case "kulliye": ok = p.mulkler.some(k => mulkSeviye(k) >= 4); break;
    case "denge":   ok = p.itibar >= 40 && p.ilim >= 40 && p.bereket >= 40; break;
    case "proje":   ok = p.projeSayi >= nyt.hedef; break;
    case "servet":  ok = p.altin >= nyt.hedef; break;
  }
  if(ok){
    p.niyetTamam = true;
    kayit(`<b>${p.ad}</b> — ${t("niyetBasarili")} (${c(nyt.ad)})`, "iyi");
    if(!p.bot){ Ses.basari(); ui_toast(t("niyetBasarili"), "iyi"); }
    an(`${p.ad} · ${c(nyt.ad)} ✓`);
  }
}

/* -------------------------------- Rozetler ------------------------------- */
function rozetVer(p, id){
  if(p.rozetler.includes(id)) return;
  p.rozetler.push(id);
  if(!p.bot){
    const kayitli = rozetleriOku();
    if(!kayitli.includes(id)){
      kayitli.push(id);
      guvenli(()=> localStorage.setItem(GAME_CONFIG.rozetAnahtari, JSON.stringify(kayitli)), "rozet-yaz");
    }
    const r = ROZETLER.find(x => x.id === id);
    if(r) ui_toast(`${r.em} ${c(r.ad)}`, "iyi");
  }
}
function rozetleriOku(){
  return guvenli(()=>{
    const ham = localStorage.getItem(GAME_CONFIG.rozetAnahtari);
    const d = ham ? JSON.parse(ham) : [];
    return Array.isArray(d) ? d : [];
  }, "rozet-oku") || [];
}

/* -------------------------------- Puanlama ------------------------------- */
function servetHesapla(p){
  let v = p.altin;
  p.mulkler.forEach(kid => v += mulkDegeri(kid));
  return Math.max(0, v - p.borc);
}
function puanla(){
  const ps = S.oyuncular;
  const enB = Math.max(1, ...ps.map(p => p.bereket));
  const enI = Math.max(1, ...ps.map(p => p.ilim));
  const enS = Math.max(1, ...ps.map(p => servetHesapla(p)));
  const enR = Math.max(1, ...ps.map(p => p.itibar));
  const a = GAME_CONFIG.puanAgirlik;
  const sonuc = ps.map(p => {
    const servet = servetHesapla(p);
    const niyetPuan = p.niyetTamam ? 1 : 0;
    const puan = (p.bereket / enB) * a.bereket + (p.ilim / enI) * a.ilim +
                 (servet / enS) * a.servet + (p.itibar / enR) * a.itibar +
                 niyetPuan * a.niyet;
    return {p, servet, puan:Math.round(puan * 1000), detay:{
      bereket:Math.round((p.bereket / enB) * a.bereket * 1000),
      ilim:Math.round((p.ilim / enI) * a.ilim * 1000),
      servet:Math.round((servet / enS) * a.servet * 1000),
      itibar:Math.round((p.itibar / enR) * a.itibar * 1000),
      niyet:Math.round(niyetPuan * a.niyet * 1000)
    }};
  });
  sonuc.sort((x, y) => y.puan - x.puan);
  return sonuc;
}

function oyunBitir(){
  S.bitti = true;
  S.kilit = true;
  const sira = puanla();
  // Rozetler
  S.oyuncular.forEach(p => {
    if(p.bot) return;
    if(p.bereket > 40 && p.ilim > 40 && p.itibar > 40 && p.altin > 40) rozetVer(p, "denge");
  });
  if(sira[0] && !sira[0].p.bot) rozetVer(sira[0].p, "kazanan");
  Ses.basari();
  kaydetSil();
  ui_sonucGoster(sira);
}

/* ------------------------------- Kayıt işleri ---------------------------- */
function kaydet(){
  if(!S) return;
  guvenli(()=>{
    const paket = {version:GAME_CONFIG.surum, savedAt:new Date().toISOString(), gameState:S};
    localStorage.setItem(GAME_CONFIG.kayitAnahtari, JSON.stringify(paket));
  }, "kaydet");
}
function kayitVarMi(){
  return !!guvenli(()=> localStorage.getItem(GAME_CONFIG.kayitAnahtari), "kayit-var");
}
function kaydetSil(){ guvenli(()=> localStorage.removeItem(GAME_CONFIG.kayitAnahtari), "kayit-sil"); }
function kayitYukle(){
  const ham = guvenli(()=> localStorage.getItem(GAME_CONFIG.kayitAnahtari), "kayit-oku");
  if(!ham) return false;
  const paket = guvenli(()=> JSON.parse(ham), "kayit-parse");
  if(!paket || !paket.gameState || !Array.isArray(paket.gameState.oyuncular) || !paket.gameState.oyuncular.length){
    kaydetSil(); return false;
  }
  const d = paket.gameState;
  // Eksik alanları güvenli varsayılanlarla tamamla
  d.mulkler = d.mulkler || {};
  d.log = d.log || [];
  d.desteler = d.desteler || {takdir:[], imtihan:[], ticaret:[], soru:[]};
  d.proje = d.proje || {aktif:true, hedef:GAME_CONFIG.projeHedef, toplanan:0, katkilar:{}, sehir:1};
  d.anlar = d.anlar || [];
  d.kilit = false; d.bitti = false; d.nesil = ++NESIL;
  if(d.gelirAlindi === undefined) d.gelirAlindi = true;
  d.donemPuan = d.donemPuan || {};
  d.oyuncular.forEach(p => { p.mulkler = p.mulkler || []; p.rozetler = p.rozetler || []; p.unvanlar = p.unvanlar || []; });
  S = d;
  Ses.acik = !!S.ayar.ses;
  document.body.classList.toggle("az-hareket", !!S.ayar.azHareket);
  return true;
}

/* --------------------------- Küçük yardımcılar --------------------------- */
function ozetMetin(uyg){
  const p = [];
  if(uyg.altin)   p.push(`${uyg.altin > 0 ? "+" : ""}${n(uyg.altin)} ${t("altin")}`);
  if(uyg.itibar)  p.push(`${uyg.itibar > 0 ? "+" : ""}${uyg.itibar} ${t("itibar")}`);
  if(uyg.ilim)    p.push(`${uyg.ilim > 0 ? "+" : ""}${uyg.ilim} ${t("ilim")}`);
  if(uyg.bereket) p.push(`${uyg.bereket > 0 ? "+" : ""}${uyg.bereket} ${t("bereket")}`);
  return p.join(" · ") || "—";
}
/* =========================================================================
   BÖLÜM 5 — ARAYÜZ (UIManager)
   ========================================================================= */
const $ = (s, k) => (k || document).querySelector(s);
const $$ = (s, k) => Array.prototype.slice.call((k || document).querySelectorAll(s));
function el(etiket, sinif, icerik){
  const e = document.createElement(etiket);
  if(sinif) e.className = sinif;
  if(icerik !== undefined) e.innerHTML = icerik;
  return e;
}
function ikonSvg(id, sinif){
  return `<svg class="${sinif || ""}" viewBox="0 0 24 24" aria-hidden="true"><use href="#${id}"/></svg>`;
}
const KAYNAK_IKON = {altin:"i-gold", itibar:"i-rep", ilim:"i-know", bereket:"i-bless"};
const KAYNAK_SINIF = {altin:"k-gold", itibar:"k-rep", ilim:"k-know", bereket:"k-bless"};
function kaynakRozeti(tip, deger){
  return `<span class="k ${KAYNAK_SINIF[tip]}">${ikonSvg(KAYNAK_IKON[tip])}<b>${n(deger)}</b></span>`;
}

function ui_ekran(id){
  $$(".screen").forEach(s => s.classList.toggle("on", s.id === id));

/* ---------------------------------- Toast -------------------------------- */
function ui_toast(mesaj, tip){

  const e = el("div", "toast " + (tip || ""), mesaj);
  k.appendChild(e);
  setTimeout(()=>{ e.style.opacity = "0"; e.style.transition = "opacity .35s"; }, 2200);

/* --------------------- Şerit bildirimi (pencere açmaz) -------------------
   Karar gerektirmeyen olaylar için: kısa süre görünür, sonra oyun devam eder.
   Böylece her olay için ayrı bir "Devam" tıklaması gerekmez.               */
let bildirimZaman = null;
function ui_bildirim(cfg, bitince){
  const k = $("#toast");
  const e = el("div", "toast " + (cfg.sinif || ""));
  let ic = `<div class="t-ust">${cfg.ikon ? ikonSvg(cfg.ikon) : ""}<span>${cfg.baslik || ""}</span></div>`;
  if(cfg.metin) ic += `<div class="t-alt">${cfg.metin}</div>`;
  if(cfg.etkiler && Object.keys(cfg.etkiler).length){
    let et = "";
    ["altin","itibar","ilim","bereket"].forEach(x => {
      const v = cfg.etkiler[x];
      if(!v) return;
      et += `<span class="etki ${v > 0 ? "arti" : "eksi"}">${ikonSvg(KAYNAK_IKON[x])} ${v > 0 ? "+" : ""}${n(v)}</span>`;
    });
    if(et) ic += `<div class="t-etki">${et}</div>`;
  }
  e.innerHTML = ic;
  k.appendChild(e);
  const sure = cfg.sure || 2400;
  setTimeout(()=>{ e.style.opacity = "0"; e.style.transition = "opacity .3s"; }, sure - 300);
  setTimeout(()=> e.remove(), sure + 60);
  if(bildirimZaman) clearTimeout(bildirimZaman);
  bildirimZaman = setTimeout(()=> guvenli(()=> bitince && bitince(), "bildirim"), sure - 150);
}

/* ---------------------------------- Modal -------------------------------- */
let modalOncekiOdak = null;
let modalKapanabilir = true;
function ui_modal(cfg){
  const perde = $("#perde"), m = $("#modal");
  modalOncekiOdak = document.activeElement;
  m.className = "modal tugra" + (cfg.genis ? " genis" : "") + (cfg.kartSinif ? " " + cfg.kartSinif : "");
  m.innerHTML = "";

  /* Tur akışını kilitleyen pencereler kapatılamaz: oyuncu bir seçenek seçmelidir.
     Yalnızca bilgi amaçlı pencereler kapatilabilir:true ile açılır. */
  modalKapanabilir = cfg.kapatilabilir === true;
  if(modalKapanabilir){
    const kapat = el("button", "kapat", "✕");
    kapat.setAttribute("aria-label", t("kapatModal"));
    kapat.addEventListener("click", ()=>{ if(cfg.kapatOlunca) cfg.kapatOlunca(); else ui_modalKapat(); });
    m.appendChild(kapat);
  }
  const ust = el("div", "m-ust");
  ust.innerHTML = `<div class="m-ikon">${ikonSvg(cfg.ikon || "i-star")}</div>
    <div><div class="m-tip">${cfg.tip || ""}</div><h2 id="modal-baslik">${cfg.baslik || ""}</h2></div>`;
  m.appendChild(ust);

  if(cfg.metin) m.appendChild(el("p", "", cfg.metin));

  if(cfg.etkiler && Object.keys(cfg.etkiler).length){
    const e = el("div", "etkiler");
    ["altin","itibar","ilim","bereket"].forEach(k => {
      const v = cfg.etkiler[k];
      if(!v) return;
      e.innerHTML += `<span class="etki ${v > 0 ? "arti" : "eksi"}">${ikonSvg(KAYNAK_IKON[k])} ${v > 0 ? "+" : ""}${n(v)} ${t(k)}</span>`;
    });
    m.appendChild(e);
  }
  if(cfg.govde) m.appendChild(cfg.govde);
  if(cfg.not) m.appendChild(el("div", "not", cfg.not));

  if(cfg.secenekler && cfg.secenekler.length){
    const kap = el("div", "secenekler");
    cfg.secenekler.forEach(sc => {
      const b = el("button", "secenek " + (sc.sinif || ""));
      b.innerHTML = `<div class="s-govde"><div class="s-ad">${sc.ad}</div>${sc.alt ? `<div class="s-alt">${sc.alt}</div>` : ""}</div>`;
      if(sc.pasif) b.setAttribute("disabled", "disabled");
      b.addEventListener("click", ()=>{ Ses.tik(); guvenli(()=> sc.is(), "secenek"); });
      kap.appendChild(b);
    });
    m.appendChild(kap);
  }
  perde.classList.add("on");
  const ilk = $(".secenek:not([disabled]), .kapat", m);
  if(ilk) setTimeout(()=> ilk.focus(), 60);
}

function dilAyarla(kod){
  DIL = kod;
  const d = DILLER.find(x => x.kod === kod);
  document.documentElement.lang = kod;
  document.documentElement.dir = d && d.rtl ? "rtl" : "ltr";
  guvenli(()=> localStorage.setItem("bereket_dil", kod), "dil-yaz");
  menuCiz();
  if($("#ekran-kurulum").classList.contains("on")) kurulumCiz();
  if($("#ekran-oyun").classList.contains("on")) { ui_tahtaCiz(); ui_hepsiniGuncelle(); }
  ui_modalKapat();
}

function devamEt(){
  if(!kayitYukle()){ ui_toast(t("bozukKayit"), "kotu"); menuCiz(); return; }
  DIL = S.dil || DIL;
  dilUygula();
  ui_ekran("ekran-oyun");
  ui_tahtaCiz();
  ui_hepsiniGuncelle();
  ui_toast(t("yeniKayit"), "iyi");
  turBasla();
