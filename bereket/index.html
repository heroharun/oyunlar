function dilUygula(){
  const d = DILLER.find(x => x.kod === DIL);
  document.documentElement.lang = DIL;
  document.documentElement.dir = d && d.rtl ? "rtl" : "ltr";
}

/* ================================ KURULUM ================================ */
let kurulumAyar = null;
function varsayilanAyar(){
  return {
    toplam:4, insan:1, botZor:"orta", sureTipi:"standart",
    turSayisi:GAME_CONFIG.turSecenekleri.standart,
    baslangicAltini:GAME_CONFIG.baslangic.altin,
    quiz:true, mini:true, ses:true, azHareket:false,
    oyuncular:[]
  };
}
function oyuncuListesiKur(a){
  const eskisi = a.oyuncular.slice();
  a.oyuncular = [];
  for(let i = 0; i < a.toplam; i++){
    const bot = i >= a.insan;
    const eski = eskisi[i];
    a.oyuncular.push({
      ad:(eski && eski.botDurum === bot && eski.ad) ? eski.ad
         : (bot ? BOT_ISIMLERI[DIL] ? BOT_ISIMLERI[DIL][i % 8] : BOT_ISIMLERI.tr[i % 8]
                : c({tr:"Oyuncu",en:"Player",de:"Spieler",fr:"Joueur",ar:"لاعب"}) + " " + (i + 1)),
      avatar:(eski && eski.avatar) || AVATARLAR[i % AVATARLAR.length],
      bot, botDurum:bot,
      botTip:(eski && eski.botTip) || BOT_TIPLERI[i % BOT_TIPLERI.length].id
    });
  }
}

function kurulumCiz(){
  if(!kurulumAyar) kurulumAyar = varsayilanAyar();
  const a = kurulumAyar;
  a.insan = kelepce(a.insan, 0, a.toplam);
  oyuncuListesiKur(a);

  const g = $("#kurulum-govde");
  g.innerHTML = "";

  const ust = el("div", "satir");
  const geri = el("button", "btn kucuk sade", "← " + t("geri"));
  geri.addEventListener("click", ()=>{ ui_ekran("ekran-menu"); });
  ust.appendChild(geri);
  g.appendChild(ust);
  g.appendChild(el("h2", "", `<span style="font-size:1.6rem">${t("kurulumBaslik")}</span>`));

  /* — oyuncular — */
  g.appendChild(el("div", "blok-basl", t("bolumOyuncular")));
  g.appendChild(sayiSecici(t("oyuncuSayisi"), [2,3,4,5,6,7,8], a.toplam, v => { a.toplam = v; a.insan = kelepce(a.insan, 0, v); kurulumCiz(); }));
  const insanSec = [];
  for(let i = 0; i <= a.toplam; i++) insanSec.push(i);
  g.appendChild(sayiSecici(t("insanSayisi"), insanSec, a.insan, v => { a.insan = v; kurulumCiz(); }));
  g.appendChild(el("div", "alan", `<label>${t("botSayisi")}: <b>${a.toplam - a.insan}</b></label>`));

  a.oyuncular.forEach((o, i) => {
    const k = el("div", "oyuncu-kart");
    const av = el("button", "avatar-btn", o.avatar);
    av.style.color = RENKLER[i % RENKLER.length];
    av.setAttribute("aria-label", t("avatar"));
    av.addEventListener("click", ()=> avatarSec(i));
    k.appendChild(av);

    const orta = el("div");
    const inp = el("input");
    inp.value = o.ad; inp.maxLength = 16;
    inp.setAttribute("aria-label", t("isim"));
    inp.addEventListener("input", e => { o.ad = e.target.value.slice(0, 16); });
    orta.appendChild(inp);
    if(o.bot){
      const tipSec = el("div", "secim");
      tipSec.style.marginTop = "6px";
      BOT_TIPLERI.forEach(bt => {
        const b = el("button", "", c(bt.ad));
        b.style.fontSize = ".78rem"; b.style.minHeight = "34px"; b.style.padding = "5px 9px";
        b.setAttribute("aria-pressed", o.botTip === bt.id ? "true" : "false");
        b.addEventListener("click", ()=>{ o.botTip = bt.id; kurulumCiz(); });
        tipSec.appendChild(b);
      });
      orta.appendChild(tipSec);
    }
    k.appendChild(orta);
    k.appendChild(el("span", "tip-etiket " + (o.bot ? "tip-bot" : "tip-insan"), o.bot ? t("bot") : t("insan")));
    g.appendChild(k);
  });

  /* — kurallar — */
  g.appendChild(el("div", "blok-basl", t("bolumKurallar")));
  g.appendChild(dugmeSecici(t("botZorluk"), [
    {v:"kolay", ad:t("kolay")}, {v:"orta", ad:t("orta")}, {v:"zor", ad:t("zor")}
  ], a.botZor, v => { a.botZor = v; kurulumCiz(); }));
  g.appendChild(dugmeSecici(t("oyunSuresi"), [
    {v:"hizli", ad:t("hizli")}, {v:"standart", ad:t("standart")}, {v:"uzun", ad:t("uzun")}
  ], a.sureTipi, v => { a.sureTipi = v; a.turSayisi = GAME_CONFIG.turSecenekleri[v]; kurulumCiz(); }));
  g.appendChild(sayiSecici(t("turSayisi"), [8,10,14,18,22,28,36], a.turSayisi, v => { a.turSayisi = v; kurulumCiz(); }));
  g.appendChild(sayiSecici(t("baslangicAltini"), [1000,1500,2000,3000], a.baslangicAltini, v => { a.baslangicAltini = v; kurulumCiz(); }));

  /* — tercihler — */
  g.appendChild(el("div", "blok-basl", t("bolumTercih")));
  g.appendChild(anahtar(t("sorularAcik"), a.quiz, v => a.quiz = v));
  g.appendChild(anahtar(t("miniAcik"), a.mini, v => a.mini = v));
  g.appendChild(anahtar(t("sesAcik"), a.ses, v => { a.ses = v; Ses.acik = v; }));
  g.appendChild(anahtar(t("azHareket"), a.azHareket, v => a.azHareket = v));

  const bas = el("button", "btn altin blok", t("oyunuBaslat"));
  bas.style.marginTop = "18px"; bas.style.minHeight = "58px"; bas.style.fontSize = "1.15rem";
  bas.addEventListener("click", ()=>{
    Ses.baslat(); Ses.basari();
    a.oyuncular.forEach((o, i) => { if(!o.ad.trim()) o.ad = (o.bot ? t("bot") : t("insan")) + " " + (i + 1); });
    oyunKur(JSON.parse(JSON.stringify(a)));
  });
  g.appendChild(bas);
  g.appendChild(el("p", "menu-alt", t("uyariBackend")));
  ui_ekran("ekran-kurulum");
}

function sayiSecici(baslik, degerler, secili, geri){
  const a = el("div", "alan", `<label>${baslik}</label>`);
  const s = el("div", "secim");
  degerler.forEach(v => {
    const b = el("button", "", n(v));
    b.setAttribute("aria-pressed", v === secili ? "true" : "false");
    b.addEventListener("click", ()=>{ Ses.tik(); geri(v); });
    s.appendChild(b);
  });
  a.appendChild(s);
  return a;
}
function dugmeSecici(baslik, secenekler, secili, geri){
  const a = el("div", "alan", `<label>${baslik}</label>`);
  const s = el("div", "secim");
  secenekler.forEach(o => {
    const b = el("button", "", o.ad);
    b.setAttribute("aria-pressed", o.v === secili ? "true" : "false");
    b.addEventListener("click", ()=>{ Ses.tik(); geri(o.v); });
    s.appendChild(b);
  });
  a.appendChild(s);
  return a;
}
function anahtar(baslik, deger, geri){
  const k = el("div", "anahtar", `<span>${baslik}</span>`);
  const sw = el("button", "sw");
  sw.setAttribute("role", "switch");
  sw.setAttribute("aria-checked", deger ? "true" : "false");
  sw.setAttribute("aria-label", baslik);
  sw.addEventListener("click", ()=>{
    const yeni = sw.getAttribute("aria-checked") !== "true";
    sw.setAttribute("aria-checked", yeni ? "true" : "false");
    Ses.tik(); geri(yeni);
  });
  k.appendChild(sw);
  return k;
}
function avatarSec(i){
  const govde = el("div", "avatar-sec");
  AVATARLAR.forEach(av => {
    const b = el("button", "", av);
    b.setAttribute("aria-pressed", kurulumAyar.oyuncular[i].avatar === av ? "true" : "false");
    b.addEventListener("click", ()=>{ kurulumAyar.oyuncular[i].avatar = av; ui_modalKapat(); kurulumCiz(); });
    govde.appendChild(b);
  });
  ui_modal({tip:t("bolumOyuncular"), baslik:t("avatar"), ikon:"i-star", govde, kapatilabilir:true});
}

function kutuSinifi(k){
  if(k.tur === "sehir") return "sehir";
  if(k.tur === "hizmet") return "hizmet";
  if(k.tur === "takdir") return "kart-takdir";
  if(k.tur === "imtihan") return "kart-imtihan";
  if(k.tur === "ticaret") return "kart-ticaret";
  if(k.tur === "ilim") return "kart-ilim";
  if(k.tur === "sadaka" || k.tur === "hayir" || k.tur === "zekat") return "hayir";
  if(k.tur === "olay") return "olay";
  return "";
}

function ui_kutulariGuncelle(){
  $$(".kutu").forEach(kutu => {
    const i = +kutu.dataset.kid, k = TAHTA[i];
    const sv = S ? mulkSeviye(i) : 0;
    const sahip = S ? mulkSahibi(i) : null;
    let ic = `<div class="serit"></div><div class="ad">${c(k.ad)}</div>${ikonSvg(k.ikon, "ikon")}`;
    if(k.maliyet && !sv) ic += `<div class="fiy">${n(k.maliyet)}</div>`;
    if(sv){
      ic += `<div class="pipler">${Array.from({length:sv}, ()=> '<span class="pip"></span>').join("")}</div>`;
      ic += `<div class="sahip-adi">${sahip ? sahip.ad : ""}</div>`;
    }
    kutu.innerHTML = ic;
    kutu.classList.toggle("sahipli", !!sv);
    kutu.style.setProperty("--sahip", sahip ? sahip.renk : "#8a6a1c");
  });
}

function ui_kutuVurgula(i){
  const kutu = $(`.kutu[data-kid="${i}"]`);
  if(!kutu) return;
  kutu.classList.remove("vurgu");
  void kutu.offsetWidth;
  kutu.classList.add("vurgu");
}

function ui_piyonlariGuncelle(){
  if(!S) return;
  S.oyuncular.forEach((p, i) => {
    const kutu = $(`.kutu[data-kid="${p.konum}"]`);
    const e = document.getElementById("piyon" + i);
    if(!kutu || !e) return;
    const ayni = S.oyuncular.filter(o => o.konum === p.konum);
    const idx = ayni.indexOf(p);
    const gx = (idx % 3 - 1) * kutu.offsetWidth * 0.26;
    const gy = (Math.floor(idx / 3) - 0.15) * kutu.offsetHeight * 0.26;
    e.style.left = (kutu.offsetLeft + kutu.offsetWidth / 2 + gx) + "px";
    e.style.top = (kutu.offsetTop + kutu.offsetHeight / 2 + gy) + "px";
    e.classList.toggle("sira", S.sira === i && !S.bitti);
    e.style.opacity = p.elendi ? ".35" : "1";
  });
}

function kutuDetay(i){
  const k = TAHTA[i];
  const sv = mulkSeviye(i), sahip = mulkSahibi(i);
  const yol = k.yol ? YOLLAR[k.yol] : null;
  let metin = c(k.ac);
  if(yol){
    metin += `<br><br><b>${c(yol.ad)}</b><br>` +
      yol.kademeler.map((kd, idx) => `${idx < sv ? "●" : "○"} ${c(kd)}`).join(" · ");
    metin += `<br><br>${t("maliyet")}: <b>${n(k.maliyet)}</b> ${t("altin")} · ${t("gelir")}: <b>${n(k.gelir)}</b>`;
    if(sahip) metin += `<br>${t("sahibi")}: <b>${sahip.ad}</b> · ${t("seviye")} ${sv} · ${t("gelir")}: ${n(mulkGeliri(i))}`;
  }
  ui_modal({tip:t("tikla"), baslik:c(k.ad), ikon:k.ikon, metin, kapatilabilir:true,
    secenekler:[{ad:t("kapat"), sinif:"", is:ui_modalKapat}]});
}

        p.azik = !p.azik; Ses.tik();
        ui_toast(p.azik ? t("yolAzigiAcik") : t("yolAzigiKapali"), p.azik ? "iyi" : "");
        ui_hepsiniGuncelle();
      }}
  ].forEach(o => {
    const b = el("button", "btn kucuk sade", o.ad);
    b.disabled = p.bot || S.bitti || o.pasif;
    b.addEventListener("click", o.is);
    satir.appendChild(b);
  });
  eyl.appendChild(satir);
  k.appendChild(eyl);

  // dönem görevi
  const gorev = DONEM_GOREV[mevsim().id];
  if(gorev){
    const onde = donemOnde();
    const dg = el("div", "kusak-kart");
    dg.innerHTML = `<b>${t("donemGorevi")}:</b> ${t(gorev.anahtar)}<br>
      <span style="opacity:.85">${t("donemOnde")}: ${onde ? onde.ad : "—"} · ${t("donemOdul")}: +${DONEM_ODUL.bereket} ${t("bereket")}, +${DONEM_ODUL.itibar} ${t("itibar")}</span>`;
    k.appendChild(dg);
  }

  // kuşak (set) bonusları
  const kus = kusaklar(p);
  if(kus.length){
    const kk = el("div", "kusak-kart");
    kk.innerHTML = `<b>${t("kusakBonusu")}</b><br>` + kus.map(x =>
      `${c(YOLLAR[x.yol].ad)}: ${x.sayi} × → +%${Math.round((x.carpan - 1) * 100)}`).join("<br>");
    k.appendChild(kk);
  }

  // ortak proje durumu
  const pr = el("div", "proje-kutu");
  const oran = Math.min(100, Math.round(S.proje.toplanan / S.proje.hedef * 100));
  pr.innerHTML = `<div style="font-size:.8rem;font-weight:700">${t("projeBaslik")} · ${c(TAHTA[S.proje.sehir].ad)}</div>
    <div style="font-size:.76rem;opacity:.85;margin-top:3px">${t("projeToplanan")}: ${n(S.proje.toplanan)} / ${n(S.proje.hedef)}</div>
    <div class="bar"><i style="width:${oran}%"></i></div>`;
  k.appendChild(pr);

  // yatırımlar
  const ml = el("div", "mulk-liste");
  k.appendChild(el("div", "bolum-basl", t("mulkler") + (S.gelistirmeYapildi || p.bot ? "" : " · " + t("gelistirmeHakki"))));
  if(!p.mulkler.length) ml.innerHTML = `<div style="font-size:.9rem;color:var(--murekkep3)">${t("mulkYok")}</div>`;
  p.mulkler.forEach(kid => {
    const kk = TAHTA[kid], sv = mulkSeviye(kid);
    const satir = el("div", "mulk");
    satir.innerHTML = `<span style="color:${p.renk}">◆</span>
      <span class="m-ad">${c(kk.ad)}</span><span class="lv">${c(YOLLAR[kk.yol].kademeler[sv-1])} · ${n(mulkGeliri(kid))}</span>`;
    if(sv < 4){
      // Tur başına bir yatırım, tahtaya gelmeden panelden de geliştirilebilir
      const bedel = gelistirmeMaliyeti(kid);
      const b = el("button", "btn kucuk sade", "▲ " + n(bedel));
      b.title = t("gelistir") + " — " + c(YOLLAR[kk.yol].kademeler[sv]);
      b.setAttribute("aria-label", t("gelistir") + " " + c(kk.ad));
      b.disabled = p.bot || S.kilit || S.bitti || S.gelistirmeYapildi || p.altin < bedel;
      b.addEventListener("click", ()=>{
        if(p.altin < bedel){ ui_toast(t("yeterliAltinYok"), "kotu"); return; }
        yatirimYap(p, kid, bedel, sv + 1);
        S.gelistirmeYapildi = true;
        niyetKontrol(p); kaydet(); ui_hepsiniGuncelle();
      });
      satir.appendChild(b);
    }
    ml.appendChild(satir);
  });
  k.appendChild(ml);

  k.appendChild(el("div", "bolum-basl", t("gunluk")));
  const gun = el("div", "gunluk");
  gun.id = "gunluk";
  k.appendChild(gun);
  ui_logCiz();
}

/* O anki adımı sade bir cümleyle anlatır — oyunun nasıl oynandığını
   ayrıca öğrenmeye gerek kalmasın diye. */
function ipucuSeridi(p){
  let metin, im = "▸";
  if(S.bitti){ metin = t("oyunBitti"); im = "✦"; }
  else if(p.bot){ metin = t("ipucuBot").replace("{ad}", p.ad); im = "⏳"; }
  else if(S.kilit){ metin = $("#perde").classList.contains("on") ? t("ipucuSecim") : t("ipucuBekle"); im = "⏳"; }
  else if(!S.zarAtildi){ metin = t("ipucuZar"); im = "⚄"; }
  else { metin = t("ipucuBitir"); im = "✓"; }
  const e = el("div", "ipucu");
  e.innerHTML = `<span class="im">${im}</span><span>${metin}</span>`;
  return e;
}

/* Tek bir büyük düğme: sırasına göre "Zar At" ya da "Turu Bitir" olur. */
function anaEylemDugmesi(p, sinif){
  const zarSirasi = !S.zarAtildi;
  const b = el("button", "btn " + (zarSirasi ? "altin " : "yesil ") + (sinif || ""),
    zarSirasi ? "⚄ " + t("zarAt") : t("turuBitirBuyuk"));
  b.disabled = p.bot || S.kilit || S.bitti;
  b.addEventListener("click", ()=>{
    Ses.baslat();
    if(!S.zarAtildi){ zarAt(); }
    else { Ses.tik(); turBitir(); }
    ui_hepsiniGuncelle();
  });
  return b;
}

function zarNoktalari(v){
  const desen = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  const acik = desen[kelepce(v || 1, 1, 6)];
  let s = "";
  for(let i = 0; i < 9; i++) s += `<b class="${acik.includes(i) ? "g" : ""}"></b>`;
  return s;
}

function ui_zarGoster(a, b, animasyon){
  const z1 = $("#zar1"), z2 = $("#zar2");
  if(!z1) return;
  if(animasyon && !S.ayar.azHareket){
    z1.classList.remove("at"); z2.classList.remove("at");
    void z1.offsetWidth;
    z1.classList.add("at"); if(b) z2.classList.add("at");
  }
  z1.innerHTML = zarNoktalari(a);
  z2.innerHTML = zarNoktalari(b || 1);
  z2.style.opacity = b ? "1" : ".3";
}

function ui_logCiz(){
  const g = $("#gunluk");
  if(!g || !S) return;
  g.innerHTML = S.log.slice(-40).map(l => `<p class="${l.s}">${l.m}</p>`).join("");
  g.scrollTop = g.scrollHeight;
}

/* =============================== MİNİ OYUNLAR ============================ */
function miniOyunBaslat(p, bitince){
  const hangi = rnd(1, 3);
  if(hangi === 1) mgSiralama(p, bitince);
  else if(hangi === 2) mgEslestirme(p, bitince);
  else mgHafiza(p, bitince);
}
function mgBitir(p, basarili, odul, bitince){
  if(basarili){
    kaynakUygula(p, odul, "hayir");
    Ses.basari();
    kayit(`<b>${p.ad}</b> — ${t("mgBaslik")}: ${t("mgBasarili")} ${ozetMetin(odul)}`, "iyi");
  }else{
    kaynakUygula(p, {ilim:2}, null);
    kayit(`<b>${p.ad}</b> — ${t("mgBaslik")}: ${t("mgBasarisiz")}`, "bilgi");
  }
  ui_modalKapat();
  if(bitince) bitince();
}

/* 1) Sıralama */
function mgSiralama(p, bitince){
  const dogruSira = MG_SIRALAMA.ogeler.map((o, i) => ({metin:c(o), i}));
  const karisik = karistir(dogruSira);
  let beklenen = 0, hata = 0;
  const govde = el("div", "mg-alan");
  karisik.forEach(o => {
    const b = el("button", "mg-oge", `<span class="sira-no">–</span><span>${o.metin}</span>`);
    b.addEventListener("click", ()=>{
      if(b.classList.contains("secili")) return;
      if(o.i === beklenen){
        b.classList.add("secili");
        $(".sira-no", b).textContent = beklenen + 1;
        beklenen++;
        Ses.tik();
        if(beklenen >= dogruSira.length){
          $$(".mg-oge", govde).forEach(x => x.disabled = true);
          setTimeout(()=> mgBitir(p, hata <= 2, {ilim:hata <= 2 ? 8 : 4, bereket:6}, bitince), 500);
        }
      }else{
        hata++;
        b.classList.add("hata");
        Ses.hata();
        setTimeout(()=> b.classList.remove("hata"), 400);
      }
    });
    govde.appendChild(b);
  });
  const gec = el("button", "btn sade blok", t("mgGec"));
  gec.style.marginTop = "10px";
  gec.addEventListener("click", ()=> mgBitir(p, false, {}, bitince));
  govde.appendChild(gec);
  ui_modal({tip:t("mgBaslik"), baslik:c(MG_SIRALAMA.ad), ikon:"i-fountain",
    metin:t("mgAbdestMetin"), govde, kapatilabilir:false});
}

/* 2) Eşleştirme */
function mgEslestirme(p, bitince){
  const cift = karistir(MG_ESLESTIRME).slice(0, 4);
  const sol = karistir(cift.map((x, i) => ({m:c(x.a), i})));
  const sag = karistir(cift.map((x, i) => ({m:c(x.b), i})));
  let seciliSol = null, kalan = cift.length, hata = 0;
  const govde = el("div");
  const izgara = el("div", "mg-eslestir");
  const sutA = el("div", "mg-sut"), sutB = el("div", "mg-sut");
  sol.forEach(o => {
    const b = el("button", "mg-oge", o.m);
    b.dataset.i = o.i;
    b.addEventListener("click", ()=>{
      if(b.disabled) return;
      $$(".mg-oge", sutA).forEach(x => x.classList.remove("secili"));
      b.classList.add("secili"); seciliSol = b; Ses.tik();
    });
    sutA.appendChild(b);
  });
  sag.forEach(o => {
    const b = el("button", "mg-oge", o.m);
    b.dataset.i = o.i;
    b.addEventListener("click", ()=>{
      if(!seciliSol || b.disabled) return;
      if(seciliSol.dataset.i === b.dataset.i){
        seciliSol.disabled = true; b.disabled = true;
        seciliSol.classList.add("secili"); b.classList.add("secili");
        seciliSol = null; kalan--; Ses.tik();
        if(kalan === 0) setTimeout(()=> mgBitir(p, hata <= 3, {ilim:hata <= 3 ? 8 : 4, bereket:5}, bitince), 450);
      }else{
        hata++; b.classList.add("hata"); Ses.hata();
        setTimeout(()=> b.classList.remove("hata"), 400);
      }
    });
    sutB.appendChild(b);
  });
  izgara.appendChild(sutA); izgara.appendChild(sutB);
  govde.appendChild(izgara);
  const gec = el("button", "btn sade blok", t("mgGec"));
  gec.style.marginTop = "10px";
  gec.addEventListener("click", ()=> mgBitir(p, false, {}, bitince));
  govde.appendChild(gec);
  ui_modal({tip:t("mgBaslik"), baslik:t("mgEslestir"), ikon:"i-gate",
    metin:t("mgEslestirMetin"), govde, kapatilabilir:false, genis:true});
}

/* 3) Hafıza */
function mgHafiza(p, bitince){
  const motifler = karistir(MG_MOTIFLER).slice(0, 4);
  const kartlar = karistir(motifler.concat(motifler));
  let acik = [], kalan = 4, deneme = 0, kilit = false;
  const govde = el("div");
  const izgara = el("div", "mg-izgara");
  kartlar.forEach((m, i) => {
    const b = el("button", "mg-kart", m);
    b.dataset.m = m;
    b.setAttribute("aria-label", t("mgHafiza"));
    b.addEventListener("click", ()=>{
      if(kilit || b.classList.contains("acik") || b.classList.contains("eslesti")) return;
      b.classList.add("acik"); acik.push(b); Ses.tik();
      if(acik.length === 2){
        deneme++;
        kilit = true;
        const [a, c2] = acik;
        if(a.dataset.m === c2.dataset.m){
          setTimeout(()=>{
            a.classList.add("eslesti"); c2.classList.add("eslesti");
            acik = []; kilit = false; kalan--;
            if(kalan === 0) setTimeout(()=> mgBitir(p, deneme <= 8, {ilim:deneme <= 8 ? 7 : 4, bereket:6}, bitince), 400);
          }, 380);
        }else{
          setTimeout(()=>{ a.classList.remove("acik"); c2.classList.remove("acik"); acik = []; kilit = false; }, 700);
        }
      }
    });
    izgara.appendChild(b);
  });
  govde.appendChild(izgara);
  const gec = el("button", "btn sade blok", t("mgGec"));
  gec.style.marginTop = "12px";
  gec.addEventListener("click", ()=> mgBitir(p, false, {}, bitince));
  govde.appendChild(gec);
  ui_modal({tip:t("mgBaslik"), baslik:t("mgHafiza"), ikon:"i-star",
    metin:t("mgHafizaMetin"), govde, kapatilabilir:false});
}

/* ============================== NASIL OYNANIR ============================ */
function rehberGoster(){
  const sekmeler = [
    {k:"temel", ad:t("sekmeTemel")}, {k:"kaynak", ad:t("sekmeKaynak")},
    {k:"tahta", ad:t("sekmeTahta")}, {k:"kart", ad:t("sekmeKart")}, {k:"kazan", ad:t("sekmeKazan")},
    {k:"gelismis", ad:t("sekmeGelismis")}
  ];
  const govde = el("div");
  const bar = el("div", "sekmeler");
  bar.setAttribute("role", "tablist");
  const icerikler = el("div");

  sekmeler.forEach((s, si) => {
    const b = el("button", "sekme", s.ad);
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", si === 0 ? "true" : "false");
    b.addEventListener("click", ()=>{
      $$(".sekme", bar).forEach(x => x.setAttribute("aria-selected", "false"));
      b.setAttribute("aria-selected", "true");
      $$(".sekme-icerik", icerikler).forEach((x, xi) => x.classList.toggle("on", xi === si));
      Ses.tik();
    });
    bar.appendChild(b);

    const ic = el("div", "sekme-icerik" + (si === 0 ? " on" : ""));
    const kap = el("div", "rehber");
    REHBER[s.k].forEach((o, oi) => {
      if(s.k === "kaynak"){
        const kk = el("div", "kaynak-kart");
        kk.innerHTML = `${ikonSvg(o.ikon)}<div><h4 style="font-family:var(--disp);color:#2b2013">${c(o.b)}</h4>
          <p style="margin:4px 0 0;font-size:.9rem;color:#43341f">${c(o.m)}</p></div>`;
        kap.appendChild(kk);
      }else{
        const a = el("div", "adim");
        a.innerHTML = `<div class="no">${oi + 1}</div><div><h4>${c(o.b)}</h4><p>${c(o.m)}</p></div>`;
        kap.appendChild(a);
      }
    });
    ic.appendChild(kap);
    icerikler.appendChild(ic);
  });
  govde.appendChild(bar);
  govde.appendChild(icerikler);
  ui_modal({tip:t("nasil"), baslik:t("nasil"), ikon:"i-book2", govde, genis:true, kapatilabilir:true,

}

/* ================================ SONUÇ ================================== */
function ui_sonucGoster(sira){
  const g = $("#sonuc-govde");
  g.innerHTML = "";
  g.appendChild(el("div", "marka", `<h1 style="font-size:clamp(2rem,7vw,3rem)">${t("sonBaslik")}</h1>`));

  const podyum = el("div", "podyum");
  sira.forEach((r, i) => {
    const p = r.p;
    const s = el("div", "sira-satir" + (i === 0 ? " bir" : ""));
    const nyt = NIYETLER.find(x => x.id === p.niyet);
    s.innerHTML = `<div class="yer">${i + 1}</div>
      <span class="piyon-ikon" style="background:${p.renk};color:#10202f;width:34px;height:34px;border-radius:50%;display:grid;place-items:center">${p.avatar}</span>
      <div><div style="font-family:var(--disp);font-size:1.08rem">${p.ad} ${p.hac ? "🕋" : ""}${p.umre >= 2 ? "🌙" : ""}</div>
        <div class="detay">
          ${kaynakRozeti("altin", p.altin)}${kaynakRozeti("itibar", p.itibar)}
          ${kaynakRozeti("ilim", p.ilim)}${kaynakRozeti("bereket", p.bereket)}
          <span class="rozet">${p.niyetTamam ? "✓ " + c(nyt.ad) : c(nyt.ad)}</span>
        </div></div>
      <div class="puan">${n(r.puan)}</div>`;
    podyum.appendChild(s);
  });
  g.appendChild(podyum);

  // ödüller
  const enCok = (fn) => S.oyuncular.slice().sort((a, b) => fn(b) - fn(a))[0];
  const oduller = [
    {b:t("enBereketli"), p:enCok(x => x.bereket)},
    {b:t("enBilgili"), p:enCok(x => x.ilim)},
    {b:t("enItibarli"), p:enCok(x => x.itibar)},
    {b:t("enIyiTuccar"), p:enCok(x => servetHesapla(x))},
    {b:t("enHayirsever"), p:enCok(x => x.sadakaSayi)},
    {b:t("enIsbirlikci"), p:enCok(x => x.projeKatki)}
  ];
  const ok = el("div", "oduller");
  oduller.forEach(o => {
    ok.innerHTML += `<div class="odul"><div class="baslik">${o.b}</div><div class="kisi">${o.p.avatar} ${o.p.ad}</div></div>`;
  });
  g.appendChild(el("div", "blok-basl", t("oduller")));
  g.appendChild(ok);

  if(S.anlar.length){
    g.appendChild(el("div", "blok-basl", t("anlar")));
    const al = el("div", "gunluk");
    al.style.maxHeight = "190px";
    al.innerHTML = S.anlar.map(a => `<p>${a}</p>`).join("");
    g.appendChild(al);
  }

  const btnKap = el("div", "satir");
  btnKap.style.marginTop = "18px";
  const tekrar = el("button", "btn altin", t("tekrarOyna"));
  tekrar.addEventListener("click", ()=>{ oyunKur(JSON.parse(JSON.stringify(S.kurulum))); });
  const yeni = el("button", "btn", t("yeniKurulum"));
  yeni.addEventListener("click", ()=> kurulumCiz());
  const ana = el("button", "btn sade", t("anaMenu"));
  ana.addEventListener("click", ()=>{ menuCiz(); ui_ekran("ekran-menu"); });
  btnKap.appendChild(tekrar); btnKap.appendChild(yeni); btnKap.appendChild(ana);
  g.appendChild(btnKap);

  ui_ekran("ekran-sonuc");
}

/* =============================== BAŞLATMA =============================== */
function baglantilar(){
  $("#btn-oyuncular").addEventListener("click", ()=>{
    $("#panel-sag").classList.remove("acik");
    $("#panel-sol").classList.toggle("acik"); Ses.tik();
  });
  $("#btn-panel").addEventListener("click", ()=>{
    $("#panel-sol").classList.remove("acik");
    $("#panel-sag").classList.toggle("acik"); Ses.tik();
  });
  $("#btn-yardim").addEventListener("click", ()=> rehberGoster());
  $("#btn-menu").addEventListener("click", ()=> oyunMenusu());
  $("#btn-ses").addEventListener("click", ()=>{
    Ses.acik = !Ses.acik;
    if(Ses.acik){ Ses.baslat(); Ses.tik(); }
    if(S) S.ayar.ses = Ses.acik;
    ui_toast(Ses.acik ? t("sesAcildi") : t("sesKapandi"));
    ui_ustGuncelle();
  });
  $("#perde").addEventListener("click", e => { if(e.target.id === "perde" && modalKapanabilir) ui_modalKapat(); });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && modalKapanabilir && $("#perde").classList.contains("on")) ui_modalKapat();
    if(!$("#ekran-oyun").classList.contains("on") || $("#perde").classList.contains("on")) return;
    if(e.key === " " || e.key === "Enter"){
      const p = aktif && S && aktif();
      if(p && !p.bot && !S.kilit && !S.bitti && !S.zarAtildi && e.target === document.body){ e.preventDefault(); zarAt(); ui_hepsiniGuncelle(); }
    }
  });
  window.addEventListener("resize", ()=> guvenli(boardBoyutla, "resize"));
  window.addEventListener("orientationchange", ()=> setTimeout(boardBoyutla, 250));
  document.addEventListener("click", ()=> Ses.baslat(), {once:true});
}
