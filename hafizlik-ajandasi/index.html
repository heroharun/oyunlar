<!DOCTYPE html>
<html lang="tr" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0E3B2E">
<meta name="description" content="Hafızlık Ajandası - Ezberle, tekrar et, takip et.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hafızlık Ajandası</title>
<!--
  ============================================================================
  HAFIZLIK AJANDASI - Tek dosyalık prototip (v1)
  ----------------------------------------------------------------------------
  Mimari:
    CONFIG  : sabitler, mod bayrakları (AUTH_MODE, TRANSLATION_MODE)
    I18N    : 4 dilli metin sözlüğü (tr / en / fr / ar)
    Store   : veri katmanı + servis fonksiyonları (localStorage soyutlanmıştır)
    Logic   : iş kuralları (dönüş görevleri, sayfa durumu, aralıklı tekrar)
    Views   : ekran render fonksiyonları (saf fonksiyon -> HTML string)
    App     : router, olay delegasyonu, modal, toast, geliştirici paneli
  Sonraki aşama (Nuxt 3 / Vue 3 / Firebase) için: Store.* fonksiyonlarının
  gövdesi Firestore çağrılarıyla değiştirilerek taşıma yapılabilir.
  PWA: gerçek offline kurulum için manifest.json + service-worker.js
  dosyaları bir sonraki aşamada eklenecektir (bkz. PWA notları, en altta).
  ============================================================================
-->
<style>
/* ===========================================================================
   1. TASARIM TOKENLARI
   =========================================================================== */
:root{
  --green-900:#0E3B2E;   /* koyu yeşil  */
  --green-700:#14584220; /* yardımcı    */
  --emerald:#157A52;     /* zümrüt      */
  --emerald-soft:#E6F1EB;
  --cream:#F7F4EC;       /* krem        */
  --beige:#EFE8D8;       /* açık bej    */
  --gold:#B8912A;        /* altın vurgu */
  --ink:#14261F;
  --ink-soft:#4C6157;
  --surface:#FFFFFF;
  --surface-2:#FBF9F4;
  --line:#E2DACA;
  --danger:#B3261E;
  --warn:#8A5A00;
  --ok:#157A52;
  --info:#1D4E89;
  --shadow:0 1px 2px rgba(20,38,31,.06), 0 8px 24px rgba(20,38,31,.06);
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-full:999px;
  --sp:4px;
  --nav-h:64px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Naskh Arabic", sans-serif;
  --font-num: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
html[data-theme="dark"]{
  --green-900:#0B241C;
  --emerald:#3FB183;
  --emerald-soft:#16302688;
  --cream:#0B1310;
  --beige:#132019;
  --gold:#E0B84B;
  --ink:#E9F0EB;
  --ink-soft:#9DB2A8;
  --surface:#12201B;
  --surface-2:#0F1C17;
  --line:#25382F;
  --danger:#F2B8B5;
  --warn:#E7C06B;
  --ok:#3FB183;
  --info:#8FBCEB;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  background:var(--cream);
  color:var(--ink);
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:650}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--emerald)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ===========================================================================
   2. GENEL BİLEŞENLER
   =========================================================================== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.muted{color:var(--ink-soft);font-size:.85rem}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row-between{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.spacer{flex:1}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:10px 16px;border-radius:var(--r-full);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-weight:600;cursor:pointer;transition:transform .08s ease, background .15s ease;
  text-decoration:none;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--green-900);color:#F7F4EC;border-color:var(--green-900)}
html[data-theme="dark"] .btn-primary{background:var(--emerald);color:#06120D;border-color:var(--emerald)}
.btn-emerald{background:var(--emerald);color:#fff;border-color:var(--emerald)}
html[data-theme="dark"] .btn-emerald{color:#06120D}
.btn-ghost{background:transparent}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn-sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-icon{min-width:44px;padding:10px}

.field{display:block;margin-bottom:12px}
.field > label,.label{display:block;font-size:.82rem;font-weight:650;color:var(--ink-soft);margin-bottom:6px}
.input,select.input,textarea.input{
  width:100%;min-height:44px;padding:10px 12px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
}
textarea.input{min-height:88px;resize:vertical}
.hint{font-size:.78rem;color:var(--ink-soft);margin-top:4px}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-full);
  border:1px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:600;cursor:pointer;
  min-height:36px;
}
.chip[aria-pressed="true"],.chip.active{background:var(--green-900);color:#F7F4EC;border-color:var(--green-900)}
html[data-theme="dark"] .chip[aria-pressed="true"],html[data-theme="dark"] .chip.active{background:var(--emerald);color:#06120D}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.scroll-x::-webkit-scrollbar{height:0}

/* Durum rozetleri: renk + ikon + metin (renk körlüğü için) */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-full);
  font-size:.74rem;font-weight:700;border:1px solid;white-space:nowrap}
.badge .bi{font-size:.9em}
.st-ham{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.st-cig{color:var(--danger);border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.st-pismekte{color:var(--info);border-color:var(--info);background:color-mix(in srgb,var(--info) 10%,transparent)}
.st-pismis{color:var(--ok);border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.st-saglam{color:var(--gold);border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}

.bar{height:8px;border-radius:var(--r-full);background:var(--beige);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--emerald);border-radius:inherit}
.bar.gold > i{background:var(--gold)}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.stat .k{font-size:.76rem;color:var(--ink-soft);font-weight:650;display:block;margin-bottom:4px}
.stat .v{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;display:block}
.stat .s{font-size:.74rem;color:var(--ink-soft)}

.empty{text-align:center;padding:28px 16px;border:1px dashed var(--line);border-radius:var(--r-md);background:var(--surface-2)}
.empty .e-ic{font-size:2rem;display:block;margin-bottom:8px}
.empty h3{margin-bottom:4px}
.empty p{color:var(--ink-soft);font-size:.88rem;margin-bottom:12px}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .li-main{flex:1;min-width:0}
.li-title{font-weight:650;font-size:.94rem}
.li-sub{font-size:.78rem;color:var(--ink-soft)}
.tnum{font-variant-numeric:tabular-nums;font-family:var(--font-num)}

/* İMZA ÖĞE: altı dilimli sayfa halkası --------------------------------- */
.ring{display:inline-block;flex:none}
.ring circle,.ring path{transition:opacity .2s ease}
.seg-off{opacity:.18}

/* ===========================================================================
   3. KABUK: giriş, üst bar, menüler
   =========================================================================== */
#auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 90% at 50% 0%, var(--beige), var(--cream) 60%)}
.auth-box{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:28px 22px;box-shadow:var(--shadow);text-align:center}
.auth-mark{width:76px;height:76px;margin:0 auto 14px}
.auth-box h1{font-size:1.6rem;margin-bottom:6px}
.auth-box .sub{color:var(--ink-soft);margin-bottom:22px;font-size:.95rem}
.auth-box .btn{margin-bottom:10px}
.auth-note{font-size:.75rem;color:var(--ink-soft);margin-top:14px;line-height:1.5}

#app{display:none}
#app.on{display:block}

.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  background:var(--green-900);color:#F7F4EC;
}
html[data-theme="dark"] .topbar{background:var(--surface);border-bottom:1px solid var(--line);color:var(--ink)}
.topbar .tb-title{font-weight:700;font-size:1.02rem;line-height:1.2}
.topbar .tb-sub{font-size:.72rem;opacity:.75}
.topbar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:inherit}
html[data-theme="dark"] .topbar .btn{background:var(--surface-2);border-color:var(--line)}
.lang-select{min-height:40px;padding:6px 10px;border-radius:var(--r-full);
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#F7F4EC;font-weight:600}
html[data-theme="dark"] .lang-select{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.lang-select option{color:#14261F;background:#fff}
.avatar{width:36px;height:36px;border-radius:var(--r-full);background:var(--gold);color:#20180A;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex:none;border:0;cursor:pointer}

.shell{display:block}
main{padding:14px 14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));max-width:1100px;margin:0 auto}
.view-head{margin-bottom:14px}
.view-head p{color:var(--ink-soft);font-size:.86rem;margin-top:2px}

/* Alt menü (mobil) */
.bottomnav{
  position:fixed;inset-inline:0;bottom:0;z-index:40;display:flex;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.bottomnav a{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:var(--nav-h);text-decoration:none;color:var(--ink-soft);font-size:.66rem;font-weight:650;padding:6px 2px;
}
.bottomnav a .ni{font-size:1.15rem;line-height:1}
.bottomnav a[aria-current="page"]{color:var(--emerald)}
.bottomnav a[aria-current="page"] .ni{transform:translateY(-1px)}

/* Yan menü (masaüstü) */
.sidenav{display:none}
@media(min-width:900px){
  .shell{display:grid;grid-template-columns:246px minmax(0,1fr);max-width:1240px;margin:0 auto}
  .sidenav{display:block;position:sticky;top:60px;align-self:start;padding:16px 10px}
  .sidenav a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-full);
    text-decoration:none;color:var(--ink);font-weight:600;font-size:.92rem;margin-bottom:2px}
  .sidenav a:hover{background:var(--surface-2)}
  .sidenav a[aria-current="page"]{background:var(--emerald-soft);color:var(--emerald)}
  html[data-theme="dark"] .sidenav a[aria-current="page"]{color:var(--emerald)}
  .sidenav a .ni{font-size:1.1rem;width:22px;text-align:center}
  .bottomnav{display:none}
  main{padding-bottom:40px}
}

/* ===========================================================================
   4. MODAL / TOAST / SHEET
   =========================================================================== */
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(10,20,16,.5);display:flex;
  align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.modal-back{align-items:center;padding:20px}}
.modal{
  background:var(--surface);width:100%;max-width:560px;max-height:88dvh;overflow:auto;
  border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));
  border:1px solid var(--line);
}
@media(min-width:640px){.modal{border-radius:var(--r-lg)}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.modal-foot{display:flex;gap:8px;margin-top:16px}
.modal-foot .btn{flex:1}

#toasts{position:fixed;z-index:80;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:8px;width:min(94vw,420px);pointer-events:none}
@media(min-width:900px){#toasts{bottom:20px}}
.toast{background:var(--green-900);color:#F7F4EC;border-radius:var(--r-md);padding:11px 14px;
  font-size:.88rem;font-weight:600;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;
  animation:tin .2s ease}
html[data-theme="dark"] .toast{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.toast.ok{background:var(--emerald);color:#04140E}
.toast.err{background:var(--danger);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===========================================================================
   5. EKRANA ÖZEL
   =========================================================================== */
.juz-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px;display:flex;gap:12px;align-items:center;text-align:start;width:100%;cursor:pointer}
.juz-card .li-title,.juz-card .li-sub,.juz-card .bar{display:block}
.juz-no{width:44px;height:44px;border-radius:12px;background:var(--emerald-soft);color:var(--emerald);
  display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
html[data-theme="dark"] .juz-no{background:#16302699}
.page-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;text-align:center}
.page-tile .pn{font-weight:750;font-size:.9rem}
.pages-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}

.six{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media(max-width:400px){
  .six{grid-template-columns:repeat(3,1fr)}
  .topbar .tb-sub{display:none}
  .lang-select{max-width:110px}
}
.six button{min-height:52px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);
  font-weight:700;font-size:.8rem;cursor:pointer;color:var(--ink-soft);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px}
.six button[aria-pressed="true"]{background:var(--emerald);border-color:var(--emerald);color:#fff}
html[data-theme="dark"] .six button[aria-pressed="true"]{color:#06120D}
.six button .tick{font-size:.9rem}

.timer-dial{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:2.6rem;font-weight:700;
  letter-spacing:-.02em;text-align:center;margin:6px 0 2px}
.timer-state{text-align:center;font-size:.8rem;color:var(--ink-soft);margin-bottom:14px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:.68rem;text-align:center;color:var(--ink-soft);font-weight:700;padding:4px 0}
.cal .day{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:2px}
.cal .day.out{opacity:.35}
.cal .day.today{border-color:var(--gold);border-width:2px}
.cal .day.sel{background:var(--emerald-soft);border-color:var(--emerald)}
.cal .day .dn{font-size:.82rem;font-weight:650}
.cal .dots{display:flex;gap:2px}
.cal .dot{width:5px;height:5px;border-radius:50%;background:var(--emerald)}
.cal .dot.pending{background:var(--gold)}
.cal .dot.missed{background:var(--danger)}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:9px;fill:var(--ink-soft);font-family:var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:.76rem;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.stack{display:flex;height:22px;border-radius:var(--r-full);overflow:hidden;border:1px solid var(--line)}
.stack i{display:block;height:100%}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat .hc{aspect-ratio:1;border-radius:5px;background:var(--beige);border:1px solid var(--line)}

.tr-box{position:relative}
.tr-count{position:absolute;inset-inline-end:10px;bottom:8px;font-size:.72rem;color:var(--ink-soft)}
.tr-out{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;min-height:88px}
[dir="rtl"] .tr-ar,.ar-text{font-size:1.08em;line-height:1.9}

.dev pre{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px;font-size:.72rem;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.testrow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.testrow .tf{font-weight:800}
.pass{color:var(--ok)} .fail{color:var(--danger)}

.offline-bar{display:none;background:var(--warn);color:#fff;text-align:center;font-size:.8rem;padding:6px;font-weight:650}
body.offline .offline-bar{display:block}
html[data-theme="dark"] .offline-bar{color:#1a1300}
</style>
</head>
<body>

<!-- ======================= GİRİŞ EKRANI ======================= -->
<section id="auth" aria-labelledby="authTitle">
  <div class="auth-box">
    <svg class="auth-mark" viewBox="0 0 100 100" role="img" aria-hidden="true">
      <circle cx="50" cy="50" r="40" fill="none" stroke="#157A52" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="36 6" transform="rotate(-90 50 50)"/>
      <path d="M62 30a22 22 0 1 0 0 40 26 26 0 1 1 0-40z" fill="#0E3B2E"/>
      <circle cx="72" cy="34" r="4" fill="#B8912A"/>
    </svg>
    <h1 id="authTitle" data-i18n="app_title">Hafızlık Ajandası</h1>
    <p class="sub" data-i18n="app_sub">Ezberle, tekrar et, takip et.</p>
    <button class="btn btn-primary btn-block" data-act="login-google">
      <span aria-hidden="true">◎</span><span data-i18n="login_google">Google ile giriş yap</span>
    </button>
    <button class="btn btn-block" data-act="login-demo">
      <span aria-hidden="true">▷</span><span data-i18n="login_demo">Demo kullanıcı olarak devam et</span>
    </button>
    <p class="auth-note" data-i18n="auth_note">
      Bu bir prototiptir. Veriler yalnızca bu cihazda, tarayıcı hafızasında saklanır.
    </p>
  </div>
</section>

<!-- ======================= UYGULAMA ======================= -->
<div id="app">
  <header class="topbar">
    <button class="avatar" data-act="go" data-view="profile" id="tbAvatar" aria-label="Profil">HA</button>
    <div style="min-width:0">

/* Aktif dil ve çeviri okuyucu */
let LANG = "tr";
function t(key, vars){
  const row = I18N[key];
  let s = row ? (row[LANGS.indexOf(LANG)] || row[0]) : key;
  if(vars) Object.keys(vars).forEach(k => { s = s.split("{"+k+"}").join(vars[k]); });
  return s;
}

/* ===========================================================================
   BÖLÜM 3 — YARDIMCI FONKSİYONLAR
   =========================================================================== */
const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const uid = (p) => (p||"id") + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7);
const clamp = (n,a,b) => Math.min(b, Math.max(a, n));
const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (v,d) => { const n = Number(v); return Number.isFinite(n) ? n : (d||0); };

/* --- Tarih: ISO saklanır, arayüzde yerel gösterilir (İş kuralı 12-13) ------ */
function todayISO(d){ const x = d ? new Date(d) : new Date();
  return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0"); }
function addDaysISO(iso, days){ const d = fromISO(iso); d.setDate(d.getDate()+days); return todayISO(d); }
function fromISO(iso){ const [y,m,dd] = String(iso).split("-").map(Number); return new Date(y, (m||1)-1, dd||1); }
function diffDays(a,b){ return Math.round((fromISO(b) - fromISO(a)) / 86400000); }
function localeOf(){ return { tr:"tr-TR", en:"en-US", fr:"fr-FR", ar:"ar" }[LANG] || "tr-TR"; }
function fmtDate(iso, opts){ if(!iso) return "—";
  try { return fromISO(iso).toLocaleDateString(localeOf(), opts || {day:"numeric",month:"short",year:"numeric"}); }
  catch(e){ return iso; } }
function fmtDateTime(isoTs){ if(!isoTs) return "—";
  try { return new Date(isoTs).toLocaleString(localeOf(), {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }
  catch(e){ return isoTs; } }
function fmtClock(isoTs){ if(!isoTs) return "—";
  try { return new Date(isoTs).toLocaleTimeString(localeOf(), {hour:"2-digit",minute:"2-digit"}); }
  catch(e){ return isoTs; } }
function hhmmss(sec){ sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function humanMin(sec){ const m = Math.round(sec/60);
  if(m < 60) return m + " " + t("min_short");
  return Math.floor(m/60) + " " + t("hour_short") + " " + (m%60) + " " + t("min_short"); }

/* ===========================================================================
   BÖLÜM 4 — VERİ KATMANI (Store)
   Tüm localStorage erişimi buradadır. Firebase'e taşırken sadece bu
   fonksiyonların gövdesi değiştirilir; arayüz kodu aynı kalır.
   =========================================================================== */
const Depo = (function(){
  /* localStorage engellenmişse (iframe/gizli mod) bellek içi yedeğe düşer. */
  let mem = {}; let ok = true;
  try { const k="__t"; localStorage.setItem(k,"1"); localStorage.removeItem(k); }
  catch(e){ ok = false; }
  return {
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { ok ? localStorage.setItem(k,v) : (mem[k]=v); } catch(e){ mem[k]=v; } },
    del(k){ try { ok ? localStorage.removeItem(k) : delete mem[k]; } catch(e){ delete mem[k]; } },
    persistent: ok
  };
})();

function emptyData(){
  return {
    version: APP_VERSION,
    user: { id:"", name:"", email:"", avatar:"", memorizationStartDate: todayISO(),
            currentTurn:1, dailyTargetMinutes:60, weeklyTargetMinutes:420,
            dailyNewPageTarget:1, dailyRevisionTarget:3,
            preferredLanguage:"tr", theme:"light", createdAt:"", lastLoginAt:"",
            notifySaves:true, notifyDue:true, isDemo:false },
    settings: { totalQuranPages:604, juzCount:30, juzStarts: DEFAULT_JUZ_STARTS.slice(),
                cookedRepeatThreshold:3, solidRepeatThreshold:5, weekStartsOn:"monday" },
    pages: [], studySessions: [], revisions: [], turns: [], agendaItems: [], translations: [],
    activeSession: null
  };
}

let DATA = emptyData();
let pageIndex = new Map();   /* pageNumber -> page nesnesi (hızlı erişim) */

function reindexPages(){ pageIndex = new Map(); (DATA.pages||[]).forEach(p => pageIndex.set(p.pageNumber, p)); }

/* --- Servis fonksiyonları (Firebase adaptasyon noktaları) ----------------- */
function loadAppData(){
  const raw = Depo.get(STORAGE_KEY);
  if(!raw){ DATA = emptyData(); reindexPages(); return DATA; }
  try {
    const parsed = JSON.parse(raw);
    DATA = Object.assign(emptyData(), parsed);
    DATA.user = Object.assign(emptyData().user, parsed.user || {});
    DATA.settings = Object.assign(emptyData().settings, parsed.settings || {});
    ["pages","studySessions","revisions","turns","agendaItems","translations"].forEach(k=>{
      if(!Array.isArray(DATA[k])) DATA[k] = [];
    });
  } catch(e){ console.warn("Veri okunamadı, sıfırlanıyor.", e); DATA = emptyData(); }
  reindexPages();
  return DATA;
}
function saveAppData(silent){
  DATA.version = APP_VERSION;
  Depo.set(STORAGE_KEY, JSON.stringify(DATA));
  /* ÜRETİM: setDoc(doc(db,"users",uid), DATA)  -> Firestore */
  if(!silent && DATA.user.notifySaves !== false) toast(t("t_saved"));
}
function setSessionUser(id){ Depo.set(SESSION_KEY, id||""); }
function getSessionUser(){ return Depo.get(SESSION_KEY) || ""; }

/* ===========================================================================
   BÖLÜM 5 — CÜZ / SAYFA MODELİ
   =========================================================================== */
function juzRanges(){
  const st = DATA.settings, starts = (st.juzStarts && st.juzStarts.length ? st.juzStarts : DEFAULT_JUZ_STARTS).slice();
  const total = num(st.totalQuranPages, 604);
  const out = [];
  for(let i=0;i<starts.length;i++){
    const start = clamp(num(starts[i],1),1,total);
    const end = (i === starts.length-1) ? total : clamp(num(starts[i+1],1)-1, start, total);
    out.push({ juz:i+1, start, end, count: end-start+1 });
  }
  return out;
}
function juzOf(pageNumber){ const r = juzRanges().find(j => pageNumber >= j.start && pageNumber <= j.end); return r ? r.juz : 1; }
function juzRange(juzNumber){ return juzRanges()[juzNumber-1] || juzRanges()[0]; }

/* Sayfa nesneleri gerektiğinde oluşturulur (604 boş kayıt tutulmaz). */
function getPage(pageNumber, createIfMissing){
  pageNumber = clamp(Math.round(num(pageNumber,1)), 1, num(DATA.settings.totalQuranPages,604));
  let p = pageIndex.get(pageNumber);
  if(p || !createIfMissing) return p || null;
  const r = juzRanges().find(j => pageNumber >= j.start && pageNumber <= j.end) || juzRanges()[0];
  p = { id:"p"+pageNumber, juzNumber:r.juz, pageNumber, pageIndexInJuz: pageNumber - r.start + 1,
        progressSections:0, status:"ham", statusManual:false, repeatCount:0, successRate:0,
        fluencyScore:0, difficulty:"orta", totalStudySeconds:0, lastStudiedAt:"",
        nextRevisionAt:"", note:"", completedAt:null };
  DATA.pages.push(p); pageIndex.set(pageNumber, p);
  return p;
}
function touchedPages(){ return DATA.pages.filter(p => p.progressSections>0 || p.repeatCount>0 || p.totalStudySeconds>0); }

/* --- Durum hesabı (İş kuralı 3) ------------------------------------------ */
function computeStatus(page){
  const s = DATA.settings;
  const cooked = num(s.cookedRepeatThreshold,3), solid = num(s.solidRepeatThreshold,5);
  const rc = num(page.repeatCount,0), sr = num(page.successRate,0);
  if(num(page.progressSections,0) < 6) return "ham";
  if(rc === 0) return "cig";
  if(rc < cooked) return "pismekte";
  if(rc >= solid && sr >= 90) return "saglam";
  return "pismis";
}
function refreshStatus(page){
  if(page.statusManual) return page.status;   /* İş kuralı 4-5 */
  const prev = page.status;
  page.status = computeStatus(page);
  if(prev !== "pismis" && prev !== "saglam" && (page.status === "pismis" || page.status === "saglam")) toast(t("t_cooked"), "ok");
  return page.status;
}
function statusLabel(s){ return t("st_" + s); }

/* --- Aralıklı tekrar ----------------------------------------------------- */
function nextRevisionDate(repeatCount, fromDate){
  const i = clamp(num(repeatCount,0), 0, REVISION_INTERVALS.length-1);
  return addDaysISO(fromDate || todayISO(), REVISION_INTERVALS[i]);
}

/* --- Sayfa ilerlemesi ---------------------------------------------------- */
function updatePageProgress(pageNumber, sections, extra){
  const p = getPage(pageNumber, true);
  const before = p.progressSections;
  p.progressSections = clamp(Math.round(num(sections,0)), 0, 6);
  if(extra) Object.assign(p, extra);
  if(p.progressSections >= 6 && !p.completedAt) p.completedAt = new Date().toISOString();   /* İş kuralı 1 */
  if(p.progressSections < 6) p.completedAt = null;
  if(before < 6 && p.progressSections >= 6 && !p.nextRevisionAt) p.nextRevisionAt = nextRevisionDate(0);
  p.lastStudiedAt = new Date().toISOString();
  refreshStatus(p);
  saveAppData(true);
  return p;
}

/* --- Çalışma oturumu ----------------------------------------------------- */
function createStudySession(rec){
  const s = Object.assign({ id: uid("ss"), pageId:"", type:"new_memorization", startedAt:"", endedAt:"",
                            pausedSeconds:0, totalSeconds:0, progressBefore:0, progressAfter:0, notes:"" }, rec);
  DATA.studySessions.push(s);
  saveAppData(true);
  return s;
}
/* --- Tekrar kaydı -------------------------------------------------------- */
function createRevision(rec){
  const r = Object.assign({ id: uid("rv"), pageId:"", date: todayISO(), durationSeconds:0, mistakeCount:0,
                            hesitationCount:0, receivedHelp:false, fluencyScore:3, successRate:80, notes:"" }, rec);
  DATA.revisions.push(r);
  const pn = num(String(r.pageId).replace("p",""),0);
  const p = getPage(pn, true);
  if(p){
    p.repeatCount = num(p.repeatCount,0) + 1;                                   /* İş kuralı 2 */
    const prevRate = num(p.successRate,0);
    p.successRate = p.repeatCount === 1 ? num(r.successRate,0)
                  : Math.round((prevRate*(p.repeatCount-1) + num(r.successRate,0)) / p.repeatCount);
    p.fluencyScore = num(r.fluencyScore,3);
    p.totalStudySeconds = num(p.totalStudySeconds,0) + num(r.durationSeconds,0);
    p.lastStudiedAt = new Date().toISOString();
    p.nextRevisionAt = r.nextRevisionAt || nextRevisionDate(p.repeatCount);
    refreshStatus(p);
  }
  saveAppData(true);
  return r;
}
/* --- Ajanda -------------------------------------------------------------- */
function createAgendaItem(rec){
  const a = Object.assign({ id: uid("ag"), title:"", date: todayISO(), startTime:"", estimatedMinutes:30,
                            taskType:"new_memorization", juzNumber:null, pageNumber:null, targetSections:1,
                            status:"pending", notes:"", reminder:false, completedAt:null }, rec);
  DATA.agendaItems.push(a);
  saveAppData(true);
  return a;
}
function setAgendaStatus(id, status){
  const a = DATA.agendaItems.find(x => x.id === id); if(!a) return null;
  a.status = status;
  a.completedAt = (status === "done" || status === "partial") ? new Date().toISOString() : null;
  /* İş kuralı 10: tamamlanan görev bağlı sayfayı günceller */
  if((status === "done" || status === "partial") && a.pageNumber){
    const p = getPage(a.pageNumber, true);
    if(a.taskType === "new_memorization" || a.taskType === "turn_study"){
      const add = status === "done" ? num(a.targetSections,1) : Math.max(1, Math.round(num(a.targetSections,1)/2));
      updatePageProgress(a.pageNumber, clamp(p.progressSections + add, 0, 6));
    } else {
      p.lastStudiedAt = new Date().toISOString();
      p.totalStudySeconds = num(p.totalStudySeconds,0) + num(a.estimatedMinutes,0)*60;
      refreshStatus(p);
    }
  }
  saveAppData(true);
  return a;
}

/* ===========================================================================
   BÖLÜM 6 — DÖNÜŞ SİSTEMİ
   N. dönüşte her cüzün SONDAN N. sayfası yeni (ham) sayfadır; ondan sonra
   cüzün sonuna kadar gelen sayfalar tekrar sayfalarıdır. Sona en yakın
   sayfa en çok tekrar edildiği için en pişmiş olanıdır.
   =========================================================================== */
function maxTurns(){ return Math.max.apply(null, juzRanges().map(j => j.count)); }

function calculateTurnTasks(turnNumber){
  const N = Math.max(1, Math.round(num(turnNumber,1)));
  return juzRanges().map(j => {
    const newPage = j.end - N + 1;
    if(newPage < j.start) return { juz:j.juz, available:false, newPage:null, repeatPages:[], range:j };  /* İş kuralı 9 */
    const repeats = [];
    for(let p = newPage + 1; p <= j.end; p++) repeats.push(p);
    return { juz:j.juz, available:true, newPage, repeatPages:repeats, range:j };
  });
}
function turnTaskDone(task){
  if(!task.available) return false;
  const np = getPage(task.newPage, false);
  return !!(np && np.progressSections >= 6);
}
function turnProgress(turnNumber){
  const tasks = calculateTurnTasks(turnNumber).filter(x => x.available);
  const done = tasks.filter(turnTaskDone).length;
  return { total: tasks.length, done, pct: tasks.length ? Math.round(done/tasks.length*100) : 0, tasks };
}
function currentTurnRecord(){
  const n = num(DATA.user.currentTurn,1);
  let rec = DATA.turns.find(x => x.turnNumber === n);
  if(!rec){ rec = { id: uid("tn"), turnNumber:n, startedAt: todayISO(), completedAt:null, completedJuzNumbers:[], notes:"" };
    DATA.turns.push(rec); }
  return rec;
}

   =========================================================================== */
function sessionsOn(dateISO){ return DATA.studySessions.filter(s => s.endedAt && todayISO(s.endedAt) === dateISO); }
function revisionsOn(dateISO){ return DATA.revisions.filter(r => r.date === dateISO); }
function secondsOn(dateISO){
  return sessionsOn(dateISO).reduce((a,s)=>a+num(s.totalSeconds,0),0)
       + revisionsOn(dateISO).reduce((a,r)=>a+num(r.durationSeconds,0),0);
}
function sectionsOn(dateISO){
  return sessionsOn(dateISO).reduce((a,s)=>a + Math.max(0, num(s.progressAfter,0)-num(s.progressBefore,0)), 0);
}
function activeDays(){
  const set = new Set();
  DATA.studySessions.forEach(s => { if(s.endedAt) set.add(todayISO(s.endedAt)); });
  DATA.revisions.forEach(r => { if(r.date) set.add(r.date); });
  return Array.from(set).sort();
}
function currentStreak(){
  const days = new Set(activeDays());
  let d = todayISO(), n = 0;
  if(!days.has(d)) d = addDaysISO(d,-1);
  while(days.has(d)){ n++; d = addDaysISO(d,-1); }
  return n;
}
function longestStreak(){
  const days = activeDays(); if(!days.length) return 0;
  let best = 1, cur = 1;
  for(let i=1;i<days.length;i++){
    cur = (diffDays(days[i-1], days[i]) === 1) ? cur+1 : 1;
    best = Math.max(best, cur);
  }
  return best;
}
function dueRevisions(){
  const today = todayISO();
  const due = [], late = [], soon = [];
  touchedPages().forEach(p => {
    if(!p.nextRevisionAt || p.progressSections < 6) return;
    const d = diffDays(today, p.nextRevisionAt);
    if(d < 0) late.push(p); else if(d === 0) due.push(p); else if(d <= 7) soon.push(p);
  });
  const byDate = (a,b) => a.nextRevisionAt < b.nextRevisionAt ? -1 : 1;
  return { due: due.sort(byDate), late: late.sort(byDate), soon: soon.sort(byDate) };
}
function statusCounts(){
  const c = { ham:0, cig:0, pismekte:0, pismis:0, saglam:0 };
  touchedPages().forEach(p => { c[p.status] = (c[p.status]||0)+1; });
  return c;
}

let ticker = null;
function activeElapsed(){
  const a = DATA.activeSession; if(!a) return 0;
  const now = Date.now();
  const base = (now - new Date(a.startedAt).getTime()) / 1000;
  const pausedNow = a.pausedAt ? (now - new Date(a.pausedAt).getTime())/1000 : 0;
  return Math.max(0, base - num(a.pausedSeconds,0) - pausedNow);
}
function startTimer(pageNumber, type){

  const p = getPage(pageNumber, true);
  DATA.activeSession = { id: uid("ss"), pageId: p.id, pageNumber: p.pageNumber, type: type || "new_memorization",
                         startedAt: new Date().toISOString(), pausedSeconds:0, pausedAt:null,
                         progressBefore: p.progressSections };

}

function resumeTimer(){ const a = DATA.activeSession; if(!a || !a.pausedAt) return;
  a.pausedSeconds = num(a.pausedSeconds,0) + (Date.now() - new Date(a.pausedAt).getTime())/1000;
  a.pausedAt = null; saveAppData(true); toast(t("t_resumed")); render(); }

function dictLookup(text, from, to){
  const fi = LANGS.indexOf(from), ti = LANGS.indexOf(to);
  const key = String(text).trim().toLowerCase().replace(/[.!?،؛]+$/,"");
  const row = TR_DICT.find(r => r[fi].toLowerCase() === key);
  return row ? row[ti] : null;
}
/**
 * translateText — servis adaptörü.
 * @param {string} sourceText
 * @param {string} sourceLanguage  tr|en|fr|ar
 * @param {string} targetLanguage  tr|en|fr|ar
 * @returns {{text:string, demo:boolean}}
 *
 * ÜRETİM ENTEGRASYONU (backend üzerinden!):
 *   // LibreTranslate:
 *   //   POST https://<kendi-sunucunuz>/translate  { q, source, target, format:"text" }
 *   // Google Cloud Translation v3:
 *   //   POST https://translation.googleapis.com/v3/projects/<id>:translateText
 *   // DeepL:
 *   //   POST https://api-free.deepl.com/v2/translate  (Authorization: DeepL-Auth-Key ...)
 *   API anahtarını frontend'e yazmak GÜVENLİ DEĞİLDİR: anahtar tarayıcıdan
 *   okunabilir. İstek daima kendi backend'iniz (ör. Firebase Cloud Function)
 *   üzerinden gönderilmeli, anahtar orada saklanmalıdır.
 */
function translateText(sourceText, sourceLanguage, targetLanguage){
  const src = String(sourceText||"").trim();
  if(!src) return { text:"", demo:false };
  if(sourceLanguage === targetLanguage) return { text: src, demo:false };
  if(TRANSLATION_MODE !== "demo"){
    /* return await ApiAdapter.translate(src, sourceLanguage, targetLanguage); */
  }
  const whole = dictLookup(src, sourceLanguage, targetLanguage);
  if(whole) return { text: whole, demo:false };
  /* Kelime kelime dene; bulunamayanlar olduğu gibi bırakılır. */
  const parts = src.split(/(\s+)/);
  let hit = 0, tot = 0;
  const out = parts.map(w => {
    if(/^\s+$/.test(w)) return w;
    tot++;
    const m = dictLookup(w, sourceLanguage, targetLanguage);
    if(m){ hit++; return m; }
    return w;
  }).join("");
  return { text: out, demo: hit < tot };
}

function ringSVG(sections, size, label){
  const s = clamp(num(sections,0),0,6), r = 15.5, c = 2*Math.PI*r, seg = c/6 - 2.2;
  let out = '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 40 40" role="img" aria-label="'+
            esc((label||"") + " " + s + "/6")+'">';
  for(let i=0;i<6;i++){
    const off = -(i * c/6);
    out += '<circle cx="20" cy="20" r="'+r+'" fill="none" stroke="'+(i<s?"var(--emerald)":"var(--line)")+'" '+
           'stroke-width="4.5" stroke-linecap="round" stroke-dasharray="'+seg.toFixed(2)+' '+(c-seg).toFixed(2)+'" '+
           'stroke-dashoffset="'+off.toFixed(2)+'" transform="rotate(-90 20 20)"'+(i<s?"":' class="seg-off"')+'/>';
  }
  out += '<text x="20" y="20" text-anchor="middle" dominant-baseline="central" '+
         'style="font-size:11px;font-weight:800;fill:var(--ink)">'+s+'/6</text></svg>';
  return out;
}

  h += '<div class="card"><h2 style="margin-bottom:10px">'+esc(t("weekly_chart"))+'</h2>'+barChart7()+'</div>';

function barChart7(){
  const days = [], vals = [];
  for(let i=6;i>=0;i--){ const d = addDaysISO(todayISO(), -i); days.push(d); vals.push(Math.round(secondsOn(d)/60)); }
  const max = Math.max(60, ...vals);
  const W = 320, H = 110, bw = W/7;
  let s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t("stats_7days"))+'">';
  vals.forEach((v,i)=>{
    const bh = Math.max(2, (v/max)*(H-28));
    s += '<rect x="'+(i*bw+7)+'" y="'+(H-20-bh)+'" width="'+(bw-14)+'" height="'+bh+'" rx="4" fill="var(--emerald)"/>';
    s += '<text x="'+(i*bw+bw/2)+'" y="'+(H-24-bh)+'" text-anchor="middle">'+v+'</text>';
    s += '<text x="'+(i*bw+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+
         fromISO(days[i]).toLocaleDateString(localeOf(),{weekday:"short"})+'</text>';
  });
  s += '</svg>';
  return s;
}

function viewTurns(){

  let h = '<div class="view-head"><h1>'+esc(t("nav_turns"))+'</h1><p>'+esc(t("turn_select"))+'</p></div>';

    ["day","week","month"].map(m => '<button class="chip" data-act="agenda-view" data-mode="'+m+'" aria-pressed="'+(mode===m)+'">'+

  h += '<div class="card"><div class="row-between" style="margin-bottom:10px">' +
       '<button class="btn btn-sm" data-act="agenda-shift" data-dir="-1">‹</button>' +
       '<b>'+esc(agendaHeadLabel())+'</b>' +
       '<button class="btn btn-sm" data-act="agenda-shift" data-dir="1">›</button></div>';
  if(mode === "month") h += calendarHTML(sel);
  else if(mode === "week") h += weekStripHTML(sel);
  h += '</div>';

  const items = agendaItemsForRange();
  h += '<div class="card"><h2 style="margin-bottom:8px">'+esc(t("nav_agenda"))+'</h2>';
  h += items.length ? '<ul class="list">' + items.map(agendaRowHTML).join("") + '</ul>'
                    : emptyState("empty_agenda","empty_agenda_d", t("agenda_add"), 'data-act="agenda-add"');
  h += '</div>';
  return h;
}
function agendaHeadLabel(){
  const d = fromISO(STATE.agendaDate);
  if(STATE.agendaView === "month") return d.toLocaleDateString(localeOf(),{month:"long",year:"numeric"});
  if(STATE.agendaView === "week"){ const s = weekStart(STATE.agendaDate);
    return fmtDate(s,{day:"numeric",month:"short"}) + " – " + fmtDate(addDaysISO(s,6),{day:"numeric",month:"short"}); }
  return fmtDate(STATE.agendaDate,{weekday:"long",day:"numeric",month:"long"});
}
function weekStart(iso){
  const d = fromISO(iso); const dow = d.getDay();
  const startsMon = DATA.settings.weekStartsOn !== "sunday";
  const back = startsMon ? ((dow + 6) % 7) : dow;
  return addDaysISO(iso, -back);
}
function agendaItemsForRange(){
  const mode = STATE.agendaView, sel = STATE.agendaDate;
  let from = sel, to = sel;
  if(mode === "week"){ from = weekStart(sel); to = addDaysISO(from,6); }
  if(mode === "month"){ const d = fromISO(sel);
    from = todayISO(new Date(d.getFullYear(), d.getMonth(), 1));
    to   = todayISO(new Date(d.getFullYear(), d.getMonth()+1, 0)); }
  return DATA.agendaItems.filter(a => a.date >= from && a.date <= to)
    .sort((a,b) => (a.date+a.startTime) < (b.date+b.startTime) ? -1 : 1);
}
function calendarHTML(sel){
  const d = fromISO(sel), y = d.getFullYear(), m = d.getMonth();
  const first = new Date(y, m, 1), dim = new Date(y, m+1, 0).getDate();
  const startsMon = DATA.settings.weekStartsOn !== "sunday";
  const lead = startsMon ? ((first.getDay()+6)%7) : first.getDay();
  const dows = [];
  for(let i=0;i<7;i++){ const dd = new Date(2024,0,(startsMon?1:0)+i);
    dows.push(dd.toLocaleDateString(localeOf(),{weekday:"narrow"})); }
  let h = '<div class="cal">' + dows.map(x => '<div class="dow">'+esc(x)+'</div>').join("");
  for(let i=0;i<lead;i++) h += '<div class="day out" aria-hidden="true"></div>';
  for(let n=1;n<=dim;n++){
    const iso = todayISO(new Date(y,m,n));
    const items = DATA.agendaItems.filter(a => a.date === iso);
    const dots = items.slice(0,3).map(a => '<span class="dot '+(a.status==="done"?"":(a.status==="missed"?"missed":"pending"))+'"></span>').join("");
    h += '<button class="day'+(iso===todayISO()?" today":"")+(iso===sel?" sel":"")+'" data-act="agenda-day" data-date="'+iso+'" '+
         'aria-label="'+esc(fmtDate(iso))+'"><span class="dn">'+n+'</span><span class="dots">'+dots+'</span></button>';
  }
  h += '</div>';
  return h;
}
function weekStripHTML(sel){
  const s = weekStart(sel);
  let h = '<div class="cal">';
  for(let i=0;i<7;i++){
    const iso = addDaysISO(s,i);
    const items = DATA.agendaItems.filter(a => a.date === iso);
    h += '<button class="day'+(iso===todayISO()?" today":"")+(iso===sel?" sel":"")+'" data-act="agenda-day" data-date="'+iso+'">' +
         '<span class="dn">'+fromISO(iso).getDate()+'</span>' +
         '<span class="muted" style="font-size:.62rem">'+fromISO(iso).toLocaleDateString(localeOf(),{weekday:"short"})+'</span>' +
         '<span class="dots">'+items.slice(0,3).map(a=>'<span class="dot '+(a.status==="done"?"":"pending")+'"></span>').join("")+'</span></button>';
  }
  h += '</div>';
  return h;
}
function agendaRowHTML(a){
  const stKey = { pending:"ag_pending", done:"ag_done", partial:"ag_partial", postponed:"ag_postponed", missed:"ag_missed" }[a.status] || "ag_pending";
  const stCls = { done:"st-pismis", partial:"st-pismekte", postponed:"st-ham", missed:"st-cig", pending:"st-ham" }[a.status];
  return '<li><div class="li-main"><div class="li-title">'+esc(a.title || t("tt_"+a.taskType))+'</div>' +
    '<div class="li-sub">'+esc(fmtDate(a.date,{day:"numeric",month:"short"}))+
      (a.startTime ? ' · '+esc(a.startTime) : '') + ' · '+esc(t("tt_"+a.taskType))+' · '+a.estimatedMinutes+' '+esc(t("min_short")) +
      (a.juzNumber ? ' · '+esc(t("juz"))+' '+a.juzNumber : '') + (a.pageNumber ? ' · '+esc(t("page"))+' '+a.pageNumber : '') +
      (a.reminder ? ' · '+esc(t("reminder")) : '') + '</div>' +
    '<div class="li-sub"><span class="badge '+stCls+'"><span class="bi" aria-hidden="true">•</span>'+esc(t(stKey))+'</span>' +
      (a.notes ? ' '+esc(a.notes) : '') + '</div></div>' +
    '<button class="btn btn-sm" data-act="agenda-status" data-id="'+a.id+'" aria-label="'+esc(t("status"))+'">⋯</button>' +
    '<button class="btn btn-sm btn-danger" data-act="agenda-del" data-id="'+a.id+'" aria-label="'+esc(t("del"))+'">✕</button></li>';
}

/* --- 13.8 İSTATİSTİKLER --------------------------------------------------- */
function viewStats(){
  const days = activeDays();
  const totalSec = DATA.studySessions.reduce((a,s)=>a+num(s.totalSeconds,0),0)
                 + DATA.revisions.reduce((a,r)=>a+num(r.durationSeconds,0),0);
  const avg = days.length ? totalSec/days.length : 0;
  let weekSec = 0, monthSec = 0;
  for(let i=0;i<7;i++)  weekSec  += secondsOn(addDaysISO(todayISO(),-i));
  for(let i=0;i<30;i++) monthSec += secondsOn(addDaysISO(todayISO(),-i));
  const sc = statusCounts();
  const totalSections = DATA.studySessions.reduce((a,s)=>a+Math.max(0,num(s.progressAfter,0)-num(s.progressBefore,0)),0);

  /* En çok çalışılan cüz */
  const juzSec = {};
  DATA.pages.forEach(p => { juzSec[p.juzNumber] = (juzSec[p.juzNumber]||0) + num(p.totalStudySeconds,0); });
  const topJuz = Object.keys(juzSec).sort((a,b)=>juzSec[b]-juzSec[a])[0];
  /* En zorlanılan sayfalar: düşük başarı + çok hata */
  const hard = touchedPages().slice().sort((a,b)=>
      (num(a.successRate,100) - num(b.successRate,100)) || (num(b.repeatCount,0)-num(a.repeatCount,0))).slice(0,5);
  /* Görev oranları */
  const past = DATA.agendaItems.filter(a => a.date <= todayISO());
  const onTime = past.filter(a => a.status === "done").length;
  const onTimeRate = past.length ? Math.round(onTime/past.length*100) : 0;
  const memo = touchedPages().filter(p => p.progressSections>=6 && p.nextRevisionAt);
  const lateRate = memo.length ? Math.round(memo.filter(p => diffDays(todayISO(), p.nextRevisionAt) < 0).length / memo.length * 100) : 0;

  let h = '<div class="view-head"><h1>'+esc(t("nav_stats"))+'</h1></div>';
  if(!days.length && !touchedPages().length) return h + '<div class="card">' + emptyState("empty_stats","empty_stats_d") + '</div>';

  h += '<div class="grid g4" style="margin-bottom:12px">' +
    statCard("stats_total_time", humanMin(totalSec)) + statCard("stats_daily_avg", humanMin(avg)) +
    statCard("stats_week_total", humanMin(weekSec)) + statCard("stats_month_total", humanMin(monthSec)) + '</div>';
  h += '<div class="grid g4" style="margin-bottom:12px">' +
    statCard("total_pages_mem", memorizedCount()) + statCard("stats_sections", totalSections) +
    statCard("stats_revisions", DATA.revisions.length) + statCard("streak", currentStreak()+" "+t("streak_days")) + '</div>';
  h += '<div class="grid g4" style="margin-bottom:12px">' +
    statCard("stats_top_juz", topJuz ? (t("juz")+" "+topJuz) : t("none")) +
    statCard("stats_best_streak", longestStreak()+" "+t("streak_days")) +
    statCard("stats_ontime", onTimeRate+"%") + statCard("stats_late_rate", lateRate+"%") + '</div>';

  /* Durum dağılımı */
  const totalTouched = Math.max(1, touchedPages().length);
  const colors = { ham:"var(--warn)", cig:"var(--danger)", pismekte:"var(--info)", pismis:"var(--ok)", saglam:"var(--gold)" };
  h += '<div class="card"><h2 style="margin-bottom:10px">'+esc(t("stats_dist"))+'</h2><div class="stack">' +
    STATUSES.map(s => '<i style="width:'+(sc[s]/totalTouched*100)+'%;background:'+colors[s]+'" title="'+esc(statusLabel(s))+'"></i>').join("") +
    '</div><div class="legend">' + STATUSES.map(s =>
      '<span><i style="background:'+colors[s]+'"></i>'+STATUS_ICON[s]+' '+esc(statusLabel(s))+': <b>'+sc[s]+'</b></span>').join("") + '</div></div>';

  /* 7 gün */
  h += '<div class="card"><h2 style="margin-bottom:10px">'+esc(t("stats_7days"))+'</h2>'+barChart7()+'</div>';

  /* 4 hafta ezber ilerlemesi */
  const wk = [];
  for(let w=3;w>=0;w--){
    let c = 0;
    DATA.pages.forEach(p => { if(!p.completedAt) return;
      const dd = diffDays(todayISO(p.completedAt), todayISO());
      if(dd >= w*7 && dd < (w+1)*7) c++; });
    wk.push(c);
  }
  const wkMax = Math.max(1, ...wk);
  h += '<div class="card"><h2 style="margin-bottom:10px">'+esc(t("stats_4weeks"))+'</h2>' +
       '<svg class="chart" viewBox="0 0 320 110" role="img" aria-label="'+esc(t("stats_4weeks"))+'">' +
       wk.map((v,i)=>{ const bh = Math.max(2,(v/wkMax)*70), x = i*80+16;
         return '<rect x="'+x+'" y="'+(90-bh)+'" width="48" height="'+bh+'" rx="4" fill="var(--gold)"/>' +
                '<text x="'+(x+24)+'" y="'+(86-bh)+'" text-anchor="middle">'+v+'</text>' +
                '<text x="'+(x+24)+'" y="104" text-anchor="middle">-'+(3-i)+' '+esc(t("week"))+'</text>'; }).join("") +
       '</svg></div>';

  /* Cüz bazında tamamlanma */
  h += '<div class="card"><h2 style="margin-bottom:10px">'+esc(t("stats_juz_rate"))+'</h2>';
  h += '<svg class="chart" viewBox="0 0 320 150" role="img" aria-label="'+esc(t("stats_juz_rate"))+'">';
  juzRanges().forEach((j,i)=>{
    const mem = DATA.pages.filter(p => p.pageNumber>=j.start && p.pageNumber<=j.end && p.progressSections>=6).length;
    const pct = mem/j.count;
    const x = 6 + (i%15)*21, y = i<15 ? 8 : 82;
    return h += '<rect x="'+x+'" y="'+y+'" width="16" height="52" rx="3" fill="var(--line)"/>' +
      '<rect x="'+x+'" y="'+(y+52-Math.max(1,pct*52))+'" width="16" height="'+Math.max(1,pct*52)+'" rx="3" fill="var(--emerald)"/>' +
      '<text x="'+(x+8)+'" y="'+(y+64)+'" text-anchor="middle">'+j.juz+'</text>';
  });
  h += '</svg></div>';

  /* Yoğunluk ısı haritası (son 28 gün) */
  const heat = [];
  for(let i=27;i>=0;i--){ const d = addDaysISO(todayISO(),-i); heat.push({ d, m: Math.round(secondsOn(d)/60) }); }
  const hMax = Math.max(1, ...heat.map(x=>x.m));
  h += '<div class="card"><h2 style="margin-bottom:10px">'+esc(t("stats_heat"))+'</h2><div class="heat">' +
    heat.map(x => { const a = x.m ? (0.22 + 0.78*(x.m/hMax)) : 0;
      return '<div class="hc" title="'+esc(fmtDate(x.d))+': '+x.m+' '+esc(t("min_short"))+'" '+
             'style="background:color-mix(in srgb, var(--emerald) '+Math.round(a*100)+'%, var(--beige))"></div>'; }).join("") +
    '</div></div>';

  /* En zorlanılan sayfalar */
  if(hard.length){
    h += '<div class="card"><h2 style="margin-bottom:8px">'+esc(t("stats_hard_pages"))+'</h2><ul class="list">' +
      hard.map(pageRowHTML).join("") + '</ul></div>';
  }
  return h;
}

function initials(name){
  const parts = String(name||"").trim().split(/\s+/).filter(Boolean);
  const a = parts[0] ? parts[0][0] : "", b = parts[1] ? parts[1][0] : "";
  return ((a + b) || "?").toUpperCase();
}

/* ===========================================================================
   BÖLÜM 14 — GELİŞTİRİCİ PANELİ: TEST SENARYOLARI
   =========================================================================== */
function runTests(){
  SILENT = true;
  const out = [];
  const add = (name, pass, detail) => out.push({ name, pass:!!pass, detail: detail||"" });

  /* Senaryo 1: 4. dönüşte 1. cüzün sondan 4. sayfası yeni sayfadır */
  const tasks = calculateTurnTasks(4);
  const j1 = juzRange(1), tk = tasks[0];
  add("S1 · 4. dönüş — yeni sayfa = cüz sonu-3", tk.newPage === j1.end - 3, "newPage=" + tk.newPage + " beklenen=" + (j1.end-3));
  add("S1 · 4. dönüş — 3 tekrar sayfası", tk.repeatPages.length === 3, "repeats=[" + tk.repeatPages.join(",") + "]");
  add("S1 · tekrar sayfaları cüz sonuna kadar", tk.repeatPages[tk.repeatPages.length-1] === j1.end, "son=" + tk.repeatPages[2]);
  const tooBig = calculateTurnTasks(maxTurns()+5).filter(x=>x.available).length;
  add("İK9 · sayfası olmayan cüzde görev üretilmez", tooBig === 0, "üretilen=" + tooBig);

  /* Senaryo 2: 17:40 → 18:30 = 50 dk, ilerleme 2/6 */
  const testPage = 1;
  const p = getPage(testPage, true);
  const snapshot = JSON.parse(JSON.stringify(p));
  const st = new Date(todayISO()+"T17:40:00"), en = new Date(todayISO()+"T18:30:00");
  const secs = (en - st)/1000;
  add("S2 · süre 50 dakika", Math.round(secs/60) === 50, Math.round(secs/60) + " dk");
  const before = p.progressSections;
  updatePageProgress(testPage, 2);
  add("S2 · ilerleme 2/6 kaydedilir", getPage(testPage).progressSections === 2, getPage(testPage).progressSections + "/6");

  /* Senaryo 3: 6/6 -> çiğ, tekrarlarla pişmiş */
  updatePageProgress(testPage, 6);
  const p3 = getPage(testPage);
  p3.repeatCount = 0; p3.successRate = 0; p3.statusManual = false; refreshStatus(p3);
  add("S3 · 6/6 sonrası durum 'çiğ'", p3.status === "cig", p3.status);
  const revIds = [];
  for(let i=0;i<3;i++){ const r = createRevision({ pageId:"p"+testPage, successRate:85, fluencyScore:4, durationSeconds:0 }); revIds.push(r.id); }
  add("S3 · 3 tekrar sonrası sayaç 3", getPage(testPage).repeatCount === 3, "repeatCount=" + getPage(testPage).repeatCount);
  add("S3 · 3 tekrar sonrası 'pişmiş'", getPage(testPage).status === "pismis", getPage(testPage).status);
  add("İK2 · aralıklı tekrar tarihi ilerledi",
      getPage(testPage).nextRevisionAt === addDaysISO(todayISO(), REVISION_INTERVALS[3]),
      getPage(testPage).nextRevisionAt);

  /* Senaryo 4: dil + yön */
  const prevLang = LANG;
  const pagesBefore = DATA.pages.length;
  setLanguage("ar", true);
  add("S4 · Arapça arayüz", t("nav_home") === I18N.nav_home[3], t("nav_home"));
  add("S4 · yön rtl", document.documentElement.getAttribute("dir") === "rtl", document.documentElement.getAttribute("dir"));
  add("S4 · kayıtlar korunur", DATA.pages.length === pagesBefore, DATA.pages.length + " sayfa");
  setLanguage(prevLang, true);

  /* Senaryo 5: yenilemede veri ve aktif sayaç korunur */
  const hadActive = !!DATA.activeSession;
  if(!hadActive){ startTimer(testPage, "new_memorization"); }
  saveAppData(true);
  const raw = JSON.parse(Depo.get(STORAGE_KEY));
  add("S5 · aktif sayaç diske yazılır", !!raw.activeSession, raw.activeSession ? raw.activeSession.startedAt : "yok");
  add("S5 · veriler diske yazılır", Array.isArray(raw.pages) && raw.pages.length > 0, raw.pages.length + " sayfa");
  add("İK7 · ikinci sayaç engellenir", startTimer(testPage + 1, "new_memorization") === false, "engellendi");
  if(!hadActive){ DATA.activeSession = null; stopTicker(); }

  /* Senaryo 6: dışa aktar → sil → içe aktar */
  const backup = JSON.stringify(DATA);
  const countBefore = DATA.pages.length;
  DATA.pages = []; reindexPages();
  const restored = JSON.parse(backup);
  DATA = Object.assign(emptyData(), restored); reindexPages();
  add("S6 · JSON yedeği geri yüklenir", DATA.pages.length === countBefore, DATA.pages.length + "/" + countBefore);

  /* Dil anahtarı bütünlüğü */
  const missing = [];
  Object.keys(I18N).forEach(k => { const row = I18N[k];
    if(!Array.isArray(row) || row.length !== 4 || row.some(x => !x || !String(x).trim())) missing.push(k); });
  add("i18n · 4 dilde eksik anahtar yok", missing.length === 0, missing.slice(0,6).join(", ") || "tamam");

  /* Cüz aralıkları bütünlüğü */
  const rs = juzRanges();
  const contiguous = rs.every((r,i) => i === 0 || r.start === rs[i-1].end + 1);
  add("Cüz aralıkları kesintisiz", contiguous && rs[rs.length-1].end === num(DATA.settings.totalQuranPages,604),
      rs[0].start + "–" + rs[rs.length-1].end);

  /* Test sonrası temizlik: test sayfası eski haline döndürülür */
  DATA.revisions = DATA.revisions.filter(r => revIds.indexOf(r.id) === -1);
  const tp = getPage(testPage, true);
  Object.assign(tp, snapshot);
  DATA.studySessions = DATA.studySessions.filter(s => s.pageId !== "p"+testPage || s.endedAt);
  SILENT = false;
  saveAppData(true);
  return out;
}
function renderTests(){
  const res = runTests();
  const passed = res.filter(r=>r.pass).length;
  $("#devOut").innerHTML = '<p style="font-weight:700;margin-bottom:8px">' + passed + "/" + res.length + ' ✓</p>' +
    res.map(r => '<div class="testrow"><span class="tf '+(r.pass?"pass":"fail")+'">'+(r.pass?"✓":"✕")+'</span>' +
      '<span style="flex:1">'+esc(r.name)+'<br><span class="muted">'+esc(r.detail)+'</span></span></div>').join("");
}

function setLanguage(lang, silent){
  if(LANGS.indexOf(lang) === -1) lang = "tr";
  LANG = lang;
  DATA.user.preferredLanguage = lang;
  Depo.set("hafizlikLang", lang);
  document.documentElement.setAttribute("lang", lang);
  document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
  $$("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  const sel = $("#langSelect"); if(sel) sel.value = lang;
  if(!silent){ saveAppData(true); renderNav(); render(); }
}
function applyTheme(pref){
  const wanted = pref || DATA.user.theme || "light";
  const sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const eff = wanted === "system" ? (sysDark ? "dark" : "light") : wanted;
  document.documentElement.setAttribute("data-theme", eff);
  const ic = $("#themeIcon"); if(ic) ic.textContent = eff === "dark" ? "☀" : "☾";
}
function renderNav(){

   =========================================================================== */
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const act = el.getAttribute("data-act");
  const pn = () => num(el.getAttribute("data-page"), 0);

  /* Sadece tıklamayla çalışan eylemler burada; select/input değişimleri aşağıda */
  if(["set-diff","set-status","set-next","set-note","set-turn","set-turn-note","set-user","set-setting",
      "set-juzstarts","set-lang"].indexOf(act) !== -1) return;

  switch(act){
    case "login-google": {
      if(AUTH_MODE !== "demo"){ /* signInWithPopup(...) */ }
      openModal(t("login_form_title"),
        '<p class="muted" style="margin-bottom:12px">'+esc(t("login_form_desc"))+'</p>' +
        '<div class="field"><label for="gName">'+esc(t("first_name"))+'</label><input class="input" id="gName" autocomplete="given-name"></div>' +
        '<div class="field"><label for="gSur">'+esc(t("last_name"))+'</label><input class="input" id="gSur" autocomplete="family-name"></div>' +
        '<div class="field"><label for="gMail">'+esc(t("email"))+'</label><input class="input" type="email" id="gMail" autocomplete="email"></div>',
        () => {
          const first = $("#gName").value.trim(), mail = $("#gMail").value.trim();
          if(!first || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){ toast(t("t_invalid"), "err"); return false; }
          loginGoogleUser({ firstName:first, lastName:$("#gSur").value.trim(), email:mail });
          enterApp(); return true;
        }, t("login_google"));
      break;
    }
    case "login-demo": loginDemoUser(); enterApp(); break;
    case "logout": confirmBox(t("logout"), () => { logoutUser(); closeModal(); }); break;
    case "go": ev.preventDefault(); go(el.getAttribute("data-view")); break;
    case "more": ev.preventDefault(); moreMenu(); break;
    case "toggle-theme": {
      const order = ["light","dark","system"];
      DATA.user.theme = order[(order.indexOf(DATA.user.theme)+1) % 3];
      applyTheme(); saveAppData(true); if(VIEW==="profile") render();
      toast(t("theme") + ": " + t("theme_" + DATA.user.theme));
      break;
    }
    case "modal-back": if(ev.target.classList.contains("modal-back")) closeModal(); break;
    case "modal-close": closeModal(); break;
    case "modal-save": if(!modalOnSave || modalOnSave() !== false){ closeModal(); renderNav(); render(); } break;

    /* --- takip --- */
    case "open-juz": STATE.juz = num(el.getAttribute("data-juz"),1); STATE.page = null; VIEW="tracking"; renderNav(); render(); break;
    case "back-juz": STATE.juz = null; render(); break;
    case "open-page": {
      if(!el.getAttribute("data-page")) break;
      STATE.page = pn(); STATE.juz = STATE.juz || juzOf(STATE.page); VIEW = "tracking";
      closeModal(); renderNav(); render(); break;
    }
    case "back-page": STATE.page = null; render(); break;
    case "pick-page-number": {
      openModal(t("pick_page"),
        '<div class="field"><label for="jumpPage">'+esc(t("page"))+' (1–'+num(DATA.settings.totalQuranPages,604)+')</label>' +
        '<input class="input" type="number" min="1" max="'+num(DATA.settings.totalQuranPages,604)+'" id="jumpPage" value="1"></div>',
        () => { const n = clamp(num($("#jumpPage").value,1),1,num(DATA.settings.totalQuranPages,604));
                STATE.page = n; STATE.juz = juzOf(n); VIEW = "tracking"; return true; }, t("open_page"));
      break;
    }
    case "start-study": {
      const last = touchedPages().slice().sort((a,b)=>(b.lastStudiedAt||"")<(a.lastStudiedAt||"")?-1:1)[0];
      const suggested = last ? last.pageNumber : (calculateTurnTasks(DATA.user.currentTurn).find(x=>x.available)||{}).newPage || 1;
      openModal(t("start_study"),
        '<div class="field"><label for="startPage">'+esc(t("page"))+'</label>' +
        '<input class="input" type="number" min="1" max="'+num(DATA.settings.totalQuranPages,604)+'" id="startPage" value="'+suggested+'"></div>' +
        '<div class="field"><label for="startType">'+esc(t("task_type"))+'</label><select class="input" id="startType">' +
          '<option value="new_memorization">'+esc(t("tt_new_memorization"))+'</option>' +
          '<option value="revision">'+esc(t("tt_old_revision"))+'</option></select></div>',
        () => { const n = clamp(num($("#startPage").value,1),1,num(DATA.settings.totalQuranPages,604));
          if(!startTimer(n, $("#startType").value)) return false;
          STATE.page = n; STATE.juz = juzOf(n); VIEW = "tracking"; return true; }, t("start"));
      break;
    }
    case "toggle-six": {
      const p = getPage(pn(), true), i = num(el.getAttribute("data-i"),1);
      /* i. dilime tıklandığında: zaten doluysa i-1'e düşer, değilse i'ye çıkar */
      updatePageProgress(p.pageNumber, p.progressSections >= i ? i-1 : i);
      toast(t("t_progress"), "ok"); render(); break;
    }

    /* --- sayaç --- */
    case "timer-start": if(startTimer(pn(), "new_memorization")) render(); break;
    case "timer-pause": pauseTimer(); break;
    case "timer-resume": resumeTimer(); break;
    case "timer-finish": finishTimerFlow(); break;
    case "timer-reset": confirmBox(t("reset"), () => { resetTimer(); closeModal(); }); break;

    /* --- tekrar --- */
    case "rev-add": revisionModal(el.getAttribute("data-page") ? pn() : null); break;
    case "rev-del": {
      const id = el.getAttribute("data-id");
      confirmBox(t("confirm_delete"), () => {
        const r = DATA.revisions.find(x => x.id === id);
        if(r){ const p = getPage(num(String(r.pageId).replace("p",""),0), false);
               if(p){ p.repeatCount = Math.max(0, p.repeatCount-1); refreshStatus(p); } }
        DATA.revisions = DATA.revisions.filter(x => x.id !== id);
        saveAppData(); closeModal(); render();
      });
      break;
    }

    /* --- ajanda --- */
    case "agenda-view": STATE.agendaView = el.getAttribute("data-mode"); render(); break;
    case "agenda-day": STATE.agendaDate = el.getAttribute("data-date");
      if(STATE.agendaView === "month") STATE.agendaView = "day";
      render(); break;
    case "agenda-shift": {
      const dir = num(el.getAttribute("data-dir"),1);
      if(STATE.agendaView === "day") STATE.agendaDate = addDaysISO(STATE.agendaDate, dir);
      else if(STATE.agendaView === "week") STATE.agendaDate = addDaysISO(STATE.agendaDate, dir*7);
      else { const d = fromISO(STATE.agendaDate); STATE.agendaDate = todayISO(new Date(d.getFullYear(), d.getMonth()+dir, 1)); }
      render(); break;
    }
    case "agenda-add": VIEW = "agenda"; renderNav(); agendaModal(null); break;
    case "agenda-del": {
      const id = el.getAttribute("data-id");
      confirmBox(t("confirm_delete"), () => { DATA.agendaItems = DATA.agendaItems.filter(x => x.id !== id);
        saveAppData(); closeModal(); render(); });
      break;
    }
    case "agenda-status": {
      const id = el.getAttribute("data-id");
      const a = DATA.agendaItems.find(x => x.id === id); if(!a) break;
      openModal(t("status"),
        '<div class="chips" style="margin-bottom:12px">' +
        [["done","ag_done"],["partial","ag_partial"],["postponed","ag_postponed"],["missed","ag_missed"],["pending","ag_pending"]]
          .map(([v,k]) => '<button class="chip" data-act="agenda-set" data-id="'+id+'" data-status="'+v+'" aria-pressed="'+(a.status===v)+'">'+
            esc(t(k))+'</button>').join("") + '</div>' +
        '<button class="btn btn-block" data-act="agenda-edit" data-id="'+id+'">'+esc(t("edit"))+'</button>');
      break;
    }
    case "agenda-set": {
      setAgendaStatus(el.getAttribute("data-id"), el.getAttribute("data-status"));
      toast(t("t_task_done"), "ok"); closeModal(); render(); break;
    }
    case "agenda-edit": {
      const a = DATA.agendaItems.find(x => x.id === el.getAttribute("data-id"));
      if(a) agendaModal(a); break;
    }

    /* --- çeviri --- */
    case "tr-swap": { const f = STATE.trFrom; STATE.trFrom = STATE.trTo; STATE.trTo = f;
      if(STATE.trOut){ STATE.trText = STATE.trOut.text; STATE.trOut = null; } render(); break; }
    case "tr-run": {
      STATE.trText = ($("#trText") ? $("#trText").value : "");
      STATE.trFrom = $("#trFrom").value; STATE.trTo = $("#trTo").value;
      if(!STATE.trText.trim()){ toast(t("t_invalid"), "err"); break; }
      STATE.trOut = translateText(STATE.trText, STATE.trFrom, STATE.trTo);
      DATA.translations.push({ id: uid("tr"), sourceLanguage:STATE.trFrom, targetLanguage:STATE.trTo,
        sourceText:STATE.trText, translatedText:STATE.trOut.text, favorite:false, createdAt:new Date().toISOString() });
      saveAppData(true); render();
      if(STATE.trOut.demo) toast(t("tr_demo_notice"));
      break;
    }
    case "tr-copy": {
      const txt = STATE.trOut ? STATE.trOut.text : "";
      if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast(t("copied"),"ok")).catch(()=>toast(t("t_invalid"),"err"));
      else { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
             try{ document.execCommand("copy"); toast(t("copied"),"ok"); }catch(e){} ta.remove(); }
      break;
    }
    case "tr-fav": { const last = DATA.translations[DATA.translations.length-1];
      if(last){ last.favorite = true; saveAppData(); render(); } break; }
    case "tr-togglefav": { const x = DATA.translations.find(y => y.id === el.getAttribute("data-id"));
      if(x){ x.favorite = !x.favorite; saveAppData(true); render(); } break; }
    case "tr-clear": confirmBox(t("clear_history"), () => { DATA.translations = []; saveAppData(); closeModal(); render(); }); break;

    /* --- ayarlar --- */
    case "set-theme": DATA.user.theme = el.getAttribute("data-theme"); applyTheme(); saveAppData(); render(); break;
    case "export": {
      const blob = new Blob([JSON.stringify(DATA, null, 2)], { type:"application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "hafizlik-ajandasi-" + todayISO() + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
      toast(t("export_data"), "ok"); break;
    }
    case "import": $("#importFile").click(); break;
    case "clear-demo": confirmBox(t("clear_demo"), () => { clearDemoData(); closeModal(); render(); toast(t("t_saved"),"ok"); }); break;
    case "reset-all": confirmBox(t("confirm_reset"), () => {
      Depo.del(STORAGE_KEY); Depo.del(SESSION_KEY);
      DATA = emptyData(); reindexPages(); stopTicker(); closeModal();
      toast(t("t_reset"), "ok");
      $("#app").classList.remove("on"); $("#auth").style.display = "flex";
    }); break;

    /* --- geliştirici paneli --- */
    case "dev-seed": seedDemoData(); toast(t("dev_seed"), "ok"); render(); break;
    case "dev-state": $("#devOut").innerHTML = '<pre>'+esc(JSON.stringify(DATA, null, 2).slice(0, 20000))+'</pre>'; break;
    case "dev-active": $("#devOut").innerHTML = '<pre>'+esc(JSON.stringify(
        { activeSession: DATA.activeSession, elapsed: hhmmss(activeElapsed()) }, null, 2))+'</pre>'; break;
    case "dev-recalc": {
      const list = calculateTurnTasks(DATA.user.currentTurn);
      $("#devOut").innerHTML = '<pre>'+esc(list.map(x => "Cüz "+x.juz+": "+(x.available
        ? ("yeni="+x.newPage+" tekrar=["+x.repeatPages.join(",")+"]") : "görev yok")).join("\n"))+'</pre>';
      break;
    }
    case "dev-sample-rev": {
      const rows = REVISION_INTERVALS.map((d,i) => i+". tekrar sonrası → "+nextRevisionDate(i)+" (+"+d+" gün)");
      $("#devOut").innerHTML = '<pre>'+esc(rows.join("\n"))+'</pre>'; break;
    }
    case "dev-i18n": {
      const bad = Object.keys(I18N).filter(k => !Array.isArray(I18N[k]) || I18N[k].length !== 4 || I18N[k].some(v=>!v));
      $("#devOut").innerHTML = '<pre>'+esc("Anahtar sayısı: "+Object.keys(I18N).length+
        "\nEksik/hatalı: "+(bad.length ? bad.join(", ") : "yok"))+'</pre>'; break;
    }
    case "dev-tests": renderTests(); break;
  }
});

/* Değer değişimleri (select / input / textarea) */
document.addEventListener("change", (ev) => {
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const act = el.getAttribute("data-act");
  const pnum = () => num(el.getAttribute("data-page"), 0);
  switch(act){
    case "set-diff": { const p = getPage(pnum(), true); p.difficulty = el.value; saveAppData(); break; }
    case "set-status": {
      const p = getPage(pnum(), true);
      if(!el.value){ p.statusManual = false; refreshStatus(p); }
      else { p.status = el.value; p.statusManual = true; }   /* İş kuralı 5 */
      saveAppData(); render(); break;
    }
    case "set-next": { const p = getPage(pnum(), true); p.nextRevisionAt = el.value; saveAppData(); break; }
    case "set-note": { const p = getPage(pnum(), true); p.note = el.value; saveAppData(); break; }
    case "set-turn": {
      DATA.user.currentTurn = clamp(num(el.value,1), 1, maxTurns());
      currentTurnRecord(); saveAppData(); render(); break;
    }
    case "set-turn-note": { currentTurnRecord().notes = el.value; saveAppData(); break; }
    case "set-user": {
      const k = el.getAttribute("data-k");
      DATA.user[k] = el.getAttribute("data-bool") ? el.checked
                   : (el.getAttribute("data-num") ? num(el.value,0) : el.value);
      saveAppData(); break;
    }
    case "set-setting": {
      const k = el.getAttribute("data-k");
      DATA.settings[k] = el.getAttribute("data-num") ? Math.max(30, num(el.value,604)) : el.value;
      saveAppData(); render(); break;
    }
    case "set-juzstarts": {
      const arr = el.value.split(/[,\s]+/).map(x=>num(x,0)).filter(x=>x>0);
      if(arr.length !== 30 || arr.some((v,i)=> i>0 && v <= arr[i-1])){ toast(t("t_invalid"), "err"); break; }
      DATA.settings.juzStarts = arr; DATA.pages.forEach(p => {
        const r = juzRanges().find(j => p.pageNumber>=j.start && p.pageNumber<=j.end);
        if(r){ p.juzNumber = r.juz; p.pageIndexInJuz = p.pageNumber - r.start + 1; } });
      saveAppData(); render(); break;
    }
    case "set-lang": setLanguage(el.value); break;
  }
});
document.addEventListener("input", (ev) => {
  if(ev.target.id === "trText"){
    STATE.trText = ev.target.value;
    const c = $("#trCount"); if(c) c.textContent = STATE.trText.length + " " + t("chars");
  }
});
$("#langSelect") && $("#langSelect").addEventListener("change", e => setLanguage(e.target.value));

/* Klavye: modal ESC ile kapanır */
document.addEventListener("keydown", (ev) => {
  if(ev.key === "Escape" && $("#modalRoot").innerHTML) closeModal();
});
/* İçe aktarma dosyası */
document.addEventListener("change", (ev) => {
  if(ev.target.id !== "importFile") return;
  const file = ev.target.files && ev.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const obj = JSON.parse(rd.result);
      if(!obj || typeof obj !== "object" || !obj.user) throw new Error("format");
      DATA = Object.assign(emptyData(), obj);
      DATA.user = Object.assign(emptyData().user, obj.user || {});
      DATA.settings = Object.assign(emptyData().settings, obj.settings || {});
      reindexPages(); saveAppData(true);
      setLanguage(DATA.user.preferredLanguage || LANG, true); applyTheme();
      toast(t("t_imported"), "ok"); renderNav(); render();
    } catch(e){ toast(t("t_invalid"), "err"); }
  };
  rd.readAsText(file);
  ev.target.value = "";
});

/* Çevrimiçi / çevrimdışı durumu */
function netState(initial){
  const off = !navigator.onLine;
  document.body.classList.toggle("offline", off);
  if(!initial) toast(off ? t("t_offline") : t("t_online"), off ? "err" : "ok");
}
window.addEventListener("online", () => netState(false));
window.addEventListener("offline", () => netState(false));

/* Sekme geri geldiğinde sayacı tazele (İş kuralı 6) */
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && DATA.activeSession){ const el = $("#timerDial");
    if(el) el.textContent = hhmmss(activeElapsed()); startTicker(); }
});
window.addEventListener("hashchange", () => {
  const v = location.hash.replace("#","");
  if(VIEWS[v] && v !== VIEW) go(v);
});

/* ===========================================================================
   BÖLÜM 17 — BAŞLANGIÇ
   =========================================================================== */
function enterApp(){
  $("#auth").style.display = "none";
  $("#app").classList.add("on");
  setLanguage(DATA.user.preferredLanguage || LANG, true);
  applyTheme();
  netState(true);
  const v = location.hash.replace("#","");
  VIEW = VIEWS[v] ? v : "home";
  renderNav(); render();
  /* Gecikmiş tekrar hatırlatması */
  if(DATA.user.notifyDue !== false){
    const d = dueRevisions();
    if(d.late.length) setTimeout(() => toast(t("overdue_revs") + ": " + d.late.length, "err"), 700);
  }
}
function boot(){
  LANG = Depo.get("hafizlikLang") || (navigator.language||"tr").slice(0,2);
  if(LANGS.indexOf(LANG) === -1) LANG = "tr";
  loadAppData();
  setLanguage(DATA.user.preferredLanguage || LANG, true);
  applyTheme();
  if(window.matchMedia){
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    if(mq.addEventListener) mq.addEventListener("change", () => applyTheme());
  }
  if(getSessionUser() && DATA.user.id === getSessionUser()){
    DATA.user.lastLoginAt = new Date().toISOString();
    saveAppData(true);
    enterApp();
  } else {
    $("#auth").style.display = "flex";
  }
}
boot();

   BÖLÜM 18 — PWA NOTLARI (sonraki aşama)
   ---------------------------------------------------------------------------
   Bu prototip tek dosya olduğu için gerçek PWA kurulumu yapılmamıştır.
   Sonraki aşamada eklenecekler:
     1) manifest.json  -> name, short_name, start_url:"/", display:"standalone",

        navigator.serviceWorker.register("/service-worker.js");
     3) Push notification -> Firebase Cloud Messaging ile tekrar hatırlatmaları.
   Şu anda çevrimdışı çalışma localStorage sayesinde zaten sağlanmaktadır:
   çeviri dışındaki tüm hafızlık özellikleri internet olmadan çalışır.
