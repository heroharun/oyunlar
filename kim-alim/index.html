  .cevap.kilitli b{color:#1a1206}

  .cevap.yanlis b{color:#fff}
  .cevap.silik{opacity:.22;pointer-events:none}
  .cevap:disabled{cursor:default}
  #toast{position:fixed;top:14%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;

    font-size:14.5px;font-weight:800;color:var(--ink);background:linear-gradient(180deg,#1c2557,#10163a);

  .btn{font:inherit;font-weight:900;font-size:15.5px;letter-spacing:.05em;text-transform:uppercase;

  .btn2{font:inherit;font-weight:800;font-size:13px;color:var(--ink);

  <p>12 soruluk ilim merdiveni: her basamakta sorular zorlaşır, puanlar katlanır. 3 jokerin var — <b style="color:var(--altin)">½</b> iki yanlışı eler, <b style="color:var(--altin)">👥</b> seyirciye sorar, <b style="color:var(--altin)">2×</b> iki cevap hakkı verir. 5. ve 10. sorular güvence basamağıdır!</p>
  <div id="katlar">
    <button class="kat" data-kat="ibadet"><span class="ikon">🕌</span>İbadetlerim<span class="alt" id="b-ibadet"></span></button>

    <button class="kat" data-kat="osmanli"><span class="ikon">🏰</span>Osmanlı Tarihi<span class="alt" id="b-osmanli"></span></button>
    <button class="kat" data-kat="akaid"><span class="ikon">☪️</span>Akaid (İnanç)<span class="alt" id="b-akaid"></span></button>
    <button class="kat genis" data-kat="karisik"><span class="ikon">🎲</span>Karışık — Büyük Yarışma<span class="alt" id="b-karisik"></span></button>
  </div>
  <span class="hint">her yarışmada sorular değişir · sesli · reklamsız</span>
</div>

const GUVENCELER=[4,9];           /* 0 tabanlı: 5. ve 10. soru */
const ZORLUK=[1,1,1,2,2,2,3,3,3,4,4,5];

let AC=null;
const audio=()=>{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; };
function nota(f,d=0.15,v=0.12,tip='triangle',gec=0){ try{ const a=audio(),t=a.currentTime+gec,o=a.createOscillator(),g=a.createGain();
  o.type=tip; o.frequency.value=f; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+0.02); }catch(e){} }
function dogruSesi(){ nota(523,0.14,0.14); nota(659,0.14,0.13,'triangle',0.12); nota(784,0.3,0.14,'triangle',0.24); }
function yanlisSesi(){ nota(220,0.35,0.16,'sawtooth'); nota(160,0.5,0.14,'sawtooth',0.2); }
function gerilimSesi(){ nota(110,0.5,0.06,'sine'); nota(112,0.5,0.05,'sine',0.05); }
function kilitSesi(){ nota(330,0.2,0.12,'square'); nota(290,0.3,0.1,'square',0.15); }
function zaferSesi(){ [523,659,784,1046,1318].forEach((f,i)=>nota(f,0.35,0.14,'triangle',i*0.14)); }
const buzz=p=>{ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} };
function toast(t){ const el=document.getElementById('toast'); el.textContent=t;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

let kat='karisik', basamak=0, soru=null, kilit=false, ciftHak=false;
let jokerDurum={j50:true,jSeyirci:true,jCift:true};
let seans=[];   /* bu yarışmada seçilen 12 soru */

/* kullanılan soruları hatırla: tekrar oynamada yeni sorular gelsin */
function kullanilanlar(k){ try{ return JSON.parse(localStorage.getItem('kimalim_used_'+k)||'[]'); }catch(e){ return []; } }
function kullanildi(k,id){ const u=kullanilanlar(k); if(!u.includes(id)){ u.push(id);
  try{ localStorage.setItem('kimalim_used_'+k,JSON.stringify(u)); }catch(e){} } }
function havuz(k){ return k==='karisik' ? Object.entries(BANKA).flatMap(([kk,list])=>list.map((q,i)=>({...q,id:kk+'#'+i})))
  : BANKA[k].map((q,i)=>({...q,id:k+'#'+i})); }

function yarismaKur(){
  const tum=havuz(kat);
  const gecmis=kullanilanlar(kat);
  seans=[];
  for(let b=0;b<12;b++){
    const z=ZORLUK[b];
    let aday=tum.filter(q=>q.z===z&&!gecmis.includes(q.id)&&!seans.some(s=>s.id===q.id));
    if(!aday.length) aday=tum.filter(q=>q.z===z&&!seans.some(s=>s.id===q.id));           /* havuz bitti: sıfırdan */
    if(!aday.length) aday=tum.filter(q=>Math.abs(q.z-z)<=1&&!seans.some(s=>s.id===q.id)); /* komşu zorluk */
    seans.push(aday[Math.floor(Math.random()*aday.length)]);
  }
}
function bestGoster(){
  for(const k of ['ibadet','islam','osmanli','akaid','karisik']){
    const b=+(localStorage.getItem('kimalim_best_'+k)||0);
    document.getElementById('b-'+k).textContent=b>0?'rekor: '+b.toLocaleString('tr-TR'):' ';
  }
}

function soruGoster(){
  kilit=false; ciftHak=false;
  soru=seans[basamak];
  kullanildi(kat,soru.id);
  document.getElementById('puanRozet').textContent='💰 Soru '+(basamak+1)+'/12 · '+ODULLER[basamak].toLocaleString('tr-TR')+' puan';
  document.getElementById('seyirciBar').classList.remove('acik');
  document.getElementById('soruMetin').textContent=soru.s;
  /* cevapları karıştır: c[0] doğru */
  const secenekler=soru.c.map((m,i)=>({m,dogru:i===0}));
  for(let i=secenekler.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));
    [secenekler[i],secenekler[j]]=[secenekler[j],secenekler[i]]; }
  const kut=document.getElementById('cevaplar'); kut.innerHTML='';
  'ABCD'.split('').forEach((harf,i)=>{
    const b=document.createElement('button');
    b.className='cevap'; b.dataset.dogru=secenekler[i].dogru?'1':'0';
    b.innerHTML='<b>'+harf+':</b> <span></span>';
    b.querySelector('span').textContent=secenekler[i].m;
    b.addEventListener('click',()=>secildi(b));
    b.addEventListener('touchend',e=>{ e.preventDefault(); secildi(b); },{passive:false});
    kut.appendChild(b);
  });
  if(basamak>=6) gerilimSesi();
  merdivenCiz();
}
function secildi(btn){
  if(kilit)return;
  audio(); kilit=true;
  btn.classList.add('kilitli'); kilitSesi(); buzz(15);
  const bekle=800+basamak*140;           /* üst basamaklarda gerilim uzar */
  setTimeout(()=>{
    const dogruMu=btn.dataset.dogru==='1';
    if(dogruMu){
      btn.classList.remove('kilitli'); btn.classList.add('dogru');
      dogruSesi(); buzz([20,30,20]);
      setTimeout(()=>{
        basamak++;
        if(basamak>=12){ bitir(true,ODULLER[11]); }
        else{ if(GUVENCELER.includes(basamak-1)) toast('🛡️ Güvence: '+ODULLER[basamak-1].toLocaleString('tr-TR')+' puan!');
          soruGoster(); }
      },1300);
    } else {
      if(ciftHak){ ciftHak=false; kilit=false;
        btn.classList.remove('kilitli'); btn.classList.add('silik');
        toast('2× jokeri: bir hakkın daha var!'); nota(400,0.2,0.1); buzz(20);
        return;
      }
      btn.classList.remove('kilitli'); btn.classList.add('yanlis');
      document.querySelectorAll('.cevap').forEach(b=>{ if(b.dataset.dogru==='1') b.classList.add('dogru'); });
      yanlisSesi(); buzz([60,40,80]);
      const guvence=[...GUVENCELER].reverse().find(g=>basamak>g);
      setTimeout(()=>bitir(false,guvence!==undefined?ODULLER[guvence]:0),1800);
    }
  },bekle);
}
function bitir(sampiyon,puan){
  const bestKey='kimalim_best_'+kat;
  const best=+(localStorage.getItem(bestKey)||0);
  if(puan>best) localStorage.setItem(bestKey,puan);
  document.getElementById('sonBaslik').textContent=sampiyon?'🏆 BÜYÜK ÂLİM!':(puan>0?'YARIŞMA BİTTİ':'ELENDİN!');
  document.getElementById('sonPuan').textContent=puan.toLocaleString('tr-TR')+' puan';
  document.getElementById('sonMsg').textContent=sampiyon
    ?'12 soruyu da bildin — 1.000.000 puanlık ilim tacı senin! Yeni yarışmada yeni sorular seni bekliyor.'
    :(puan>best?'🏆 Bu kategoride yeni rekorun! ':'')+'Her yarışmada farklı sorular gelir — bilgini büyüt, merdiveni tırman!';
  if(sampiyon){ zaferSesi(); buzz([40,60,40,60,120]); }
  setTimeout(()=>document.getElementById('son').classList.remove('gizli'),400);
}
function cekil(){
  if(kilit)return;
  const puan=basamak>0?ODULLER[basamak-1]:0;
  bitir(false,puan);
  document.getElementById('sonBaslik').textContent='ÇEKİLDİN 🚪';
}

/* ── JOKERLER ── */
function j50(){
  if(!jokerDurum.j50||kilit)return;
  jokerDurum.j50=false; document.getElementById('j50').classList.add('gitti');
  const yanlislar=[...document.querySelectorAll('.cevap')].filter(b=>b.dataset.dogru==='0'&&!b.classList.contains('silik'));
  yanlislar.sort(()=>Math.random()-0.5).slice(0,2).forEach(b=>b.classList.add('silik'));
  nota(700,0.12,0.1); nota(500,0.15,0.1,'triangle',0.1); buzz(15);
}
function jSeyirci(){
  if(!jokerDurum.jSeyirci||kilit)return;
  jokerDurum.jSeyirci=false; document.getElementById('jSeyirci').classList.add('gitti');
  const gorunur=[...document.querySelectorAll('.cevap')].filter(b=>!b.classList.contains('silik'));
  /* seyirci: doğruya ağırlıklı ama zorlukta şaşırabilir */
  const dogruPay=Math.max(34,78-ZORLUK[basamak]*9+Math.random()*10);
  let kalan=100-dogruPay;
  const paylar=gorunur.map(b=>b.dataset.dogru==='1'?dogruPay:0);
  const yanlisIdx=gorunur.map((b,i)=>b.dataset.dogru==='0'?i:-1).filter(i=>i>=0);
  yanlisIdx.forEach((gi,k)=>{ const p=k===yanlisIdx.length-1?kalan:Math.random()*kalan; paylar[gi]=p; kalan-=p; });
  const bar=document.getElementById('seyirciBar');
  bar.innerHTML=''; bar.classList.add('acik');
  gorunur.forEach((b,i)=>{
    const harf=b.querySelector('b').textContent.replace(':','');
    const kolon=document.createElement('div'); kolon.className='anket';
    kolon.innerHTML='<div>%'+Math.round(paylar[i])+'</div><div class="cubuk" style="height:'+Math.max(6,paylar[i]*0.8)+'px"></div><div>'+harf+'</div>';
    bar.appendChild(kolon);
  });
  nota(600,0.1,0.1); nota(800,0.12,0.1,'triangle',0.1); buzz(15);
}
function jCift(){
  if(!jokerDurum.jCift||kilit)return;
  jokerDurum.jCift=false; document.getElementById('jCift').classList.add('gitti');
  ciftHak=true; toast('2× aktif: bu soruda iki hakkın var!');
  nota(650,0.12,0.11); buzz(15);
}

/* ── MERDİVEN ── */
function merdivenCiz(){
  const m=document.getElementById('merdiven'); m.innerHTML='';
  for(let i=11;i>=0;i--){
    const d=document.createElement('div');
    d.className='basamak'+(GUVENCELER.includes(i)?' guvence':'')+(i===basamak?' aktif':i<basamak?' gecildi':'');
    d.innerHTML='<span>'+(i+1)+'</span><span>'+(GUVENCELER.includes(i)?'🛡️ ':'')+ODULLER[i].toLocaleString('tr-TR')+'</span>';
    m.appendChild(d);
  }
  const kapat=document.createElement('button');
  kapat.className='btn'; kapat.textContent='Devam'; kapat.style.marginTop='14px';
  kapat.addEventListener('click',()=>m.classList.add('gizli'));
  kapat.addEventListener('touchend',e=>{ e.preventDefault(); m.classList.add('gizli'); },{passive:false});
  m.appendChild(kapat);
}

/* ── AKIŞ ── */
const tap=(el,fn)=>{ el.addEventListener('click',fn);
  el.addEventListener('touchend',e=>{ e.preventDefault(); e.stopPropagation(); fn(); },{passive:false}); };
document.querySelectorAll('.kat').forEach(b=>tap(b,()=>{
  audio(); kat=b.dataset.kat;
  basamak=0; jokerDurum={j50:true,jSeyirci:true,jCift:true};
  document.querySelectorAll('.joker').forEach(j=>j.classList.remove('gitti'));
  yarismaKur();
  document.getElementById('giris').classList.add('gizli');
  soruGoster();
}));
tap(document.getElementById('tekrarBtn'),()=>{
  audio(); basamak=0; jokerDurum={j50:true,jSeyirci:true,jCift:true};
  document.querySelectorAll('.joker').forEach(j=>j.classList.remove('gitti'));
  yarismaKur();
  document.getElementById('son').classList.add('gizli');
  soruGoster();
});
tap(document.getElementById('menuBtn'),()=>{
  document.getElementById('son').classList.add('gizli');
  bestGoster();
  document.getElementById('giris').classList.remove('gizli');
});
tap(document.getElementById('cekilBtn'),cekil);
tap(document.getElementById('merdivenBtn'),()=>{ merdivenCiz(); document.getElementById('merdiven').classList.remove('gizli'); });
tap(document.getElementById('j50'),j50);
tap(document.getElementById('jSeyirci'),jSeyirci);
tap(document.getElementById('jCift'),jCift);
addEventListener('keydown',e=>{
  const i={'a':0,'b':1,'c':2,'d':3}[e.key.toLowerCase()];
  if(i!==undefined){ const b=[...document.querySelectorAll('.cevap')][i]; if(b&&!b.classList.contains('silik')) secildi(b); }
});
bestGoster();
</script>
</html>
