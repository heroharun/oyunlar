  #grid::before{content:'';position:absolute;inset:-11px;border-radius:22px;z-index:-1;

      linear-gradient(165deg,#cd9457 0%,#a06c37 45%,#8a5a2c 75%,#7c4d22 100%);
    box-shadow:0 12px 28px rgba(110,60,15,.38),0 3px 8px rgba(110,60,15,.25),

  .slot{background:linear-gradient(180deg,#8a5f34 0%,#9a6f44 100%);border-radius:9px;
    box-shadow:inset 0 3px 7px rgba(48,24,4,.38),inset 0 -1px 0 rgba(255,226,180,.22)}
  /* 3D şeker/karamel taşları */
  .tile{position:absolute;display:flex;align-items:center;justify-content:center;
    border-radius:9px;font-weight:900;transition:left .12s ease,top .12s ease;will-change:left,top;
    --glow:0 0 0 rgba(0,0,0,0);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.17),
      0 3px 6px rgba(110,60,20,.3),var(--glow);
    text-shadow:0 1px 0 rgba(255,255,255,.3),0 2px 3px rgba(90,45,10,.28)}
  .v2{background:linear-gradient(180deg,#fcf3e0,#efddbd);color:#6b5d4f}
  .v4{background:linear-gradient(180deg,#f9e9c6,#ecd39e);color:#6b5d4f}
  .v2,.v4{text-shadow:0 1px 0 rgba(255,255,255,.65),0 2px 2px rgba(140,90,40,.18)}
  .v8{background:linear-gradient(180deg,#ffc084,#f29a4e);color:#fff}
  .v16{background:linear-gradient(180deg,#ffab72,#f08039);color:#fff}
  .v32{background:linear-gradient(180deg,#ff9a6b,#ee683a);color:#fff}
  .v64{background:linear-gradient(180deg,#ff8557,#e94d24);color:#fff}
  .v128{background:linear-gradient(180deg,#ffe28a,#f1b93d);color:#fff}
  .v256{background:linear-gradient(180deg,#ffdc72,#efb02c);color:#fff}
  .v512{background:linear-gradient(180deg,#ffd558,#eca51d);color:#fff}
  .v1024{background:linear-gradient(180deg,#ffcf40,#e8990f);color:#fff}
  .v2048{background:linear-gradient(180deg,#ffc722,#e58e02);color:#fff}
  .vx{background:linear-gradient(180deg,#6a6152,#3c3a32);color:#ffe9a8}
  .v128,.v256{--glow:0 0 14px rgba(255,205,80,.45)}
  .v512,.v1024{--glow:0 0 18px rgba(255,195,50,.55)}
  .v2048,.vx{--glow:0 0 24px rgba(255,185,30,.65)}
  .tile.new{animation:popin .22s cubic-bezier(.3,1.4,.6,1)}
  .tile.merged{animation:pulse .25s ease}
  .tile.merged::after{content:'';position:absolute;inset:-14px;pointer-events:none;
    background:
      radial-gradient(circle at 16% 20%, rgba(255,255,255,.95) 0 2px, transparent 3.5px),
      radial-gradient(circle at 85% 28%, rgba(255,240,180,.95) 0 2.5px, transparent 4px),
      radial-gradient(circle at 72% 88%, rgba(255,255,255,.9) 0 2px, transparent 3.5px),
      radial-gradient(circle at 20% 82%, rgba(255,225,140,.9) 0 2px, transparent 3.5px),
      radial-gradient(circle at 50% 6%, rgba(255,255,255,.85) 0 1.6px, transparent 3px);
    animation:sparkle .5s ease forwards}
  @keyframes popin{0%{transform:scale(.3)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.22)}100%{transform:scale(1)}}
  @keyframes sparkle{0%{opacity:0;transform:scale(.5)}30%{opacity:1}100%{opacity:0;transform:scale(1.35)}}
  .hint{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#97805e}
  #newBtn{font:inherit;font-weight:800;font-size:13px;letter-spacing:.06em;color:#fff;
    display:inline-flex;align-items:center;gap:8px;

  .card h2{font-size:clamp(38px,10vw,72px);font-weight:900;

  .btn{font:inherit;font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;
    color:#fff;background:linear-gradient(180deg,#f2a44e,#df862a);border:none;border-radius:999px;
    padding:14px 36px;cursor:pointer;text-shadow:0 1px 2px rgba(130,70,10,.35);
    box-shadow:0 5px 0 #a8641e,inset 0 1px 0 rgba(255,255,255,.45),0 8px 16px rgba(160,90,20,.25)}

</style>

<div id="wrap">
  <div id="hud">
    <h1>2048</h1>
    <div class="scores">
      <div class="sbox"><div class="label">Skor</div><div class="value" id="scoreEl">0</div></div>
      <div class="sbox"><div class="label">Rekor</div><div class="value" id="bestEl">0</div></div>
    </div>
  </div>
  <div id="grid"></div>

    <span class="hint" id="ctlHint"></span>
    <button id="newBtn"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5v13M1.5 8h13" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>Yeni Oyun</button>
  </div>
</div>

<div class="card hidden" id="endcard">
  <h2 id="endTitle"></h2>
  <p id="endMsg"></p>
  <button class="btn" id="retryBtn">Yeni Oyun</button>
  <button class="btn" id="goOnBtn" style="background:linear-gradient(180deg,#a3835f,#7c5e3d);box-shadow:0 5px 0 #5f4a33,inset 0 1px 0 rgba(255,255,255,.35),0 8px 16px rgba(110,70,25,.25);display:none">Devam Et</button>
</div>

<script>
'use strict';
const gridEl=document.getElementById('grid');
let cells=[], score=0, best=0, over=false, won=false, keptGoing=false, tileId=0, tiles={};
try{ best=+localStorage.getItem('g2048_best')||0; }catch(e){}
const IS_TOUCH=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
document.getElementById('ctlHint').textContent=IS_TOUCH?'kaydırarak oyna':'ok tuşlarıyla oyna';

/* görsel: taş renkleri CSS sınıflarında (.v2 … .v2048, .vx) */

for(let i=0;i<16;i++){ const s=document.createElement('div'); s.className='slot'; gridEl.appendChild(s); }

function slotPos(i){
  const g=gridEl.getBoundingClientRect();
  const size=(g.width-10*2-10*3)/4;
  const x=10+(i%4)*(size+10), y=10+Math.floor(i/4)*(size+10);
  return {x,y,size};
}
function makeTileEl(v,i,anim){
  const {x,y,size}=slotPos(i);
  const el=document.createElement('div');
  el.className='tile '+(v<=2048?'v'+v:'vx')+(anim?' '+anim:'');
  el.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px;
    font-size:${v<128?size*0.42:v<1024?size*0.34:size*0.27}px`;
  el.textContent=v;
  gridEl.appendChild(el);
  return el;
}
function redrawAll(){
  for(const k in tiles) tiles[k].el.remove();
  tiles={};
  cells.forEach((v,i)=>{ if(v){ const id=++tileId;
    tiles[id]={v,i,el:makeTileEl(v,i)}; } });
}
addEventListener('resize',redrawAll);

function updHud(){
  document.getElementById('scoreEl').textContent=score;
  document.getElementById('bestEl').textContent=best;
  /* görsel: en büyük taşa göre sahne sıcaklığı */
  const m=Math.max(2,...cells);
  document.body.dataset.stage=m>=1024?3:m>=256?2:m>=64?1:0;
}
function save(){
  try{ localStorage.setItem('g2048_save',JSON.stringify({cells,score,won,keptGoing})); }catch(e){}
}
function addRandom(){
  const empty=cells.map((v,i)=>v?null:i).filter(i=>i!==null);
  if(!empty.length) return;
  const i=empty[Math.floor(Math.random()*empty.length)];
  cells[i]=Math.random()<0.9?2:4;
  const id=++tileId; tiles[id]={v:cells[i],i,el:makeTileEl(cells[i],i,'new')};
}
function reset(){
  cells=Array(16).fill(0); score=0; over=false; won=false; keptGoing=false;
  for(const k in tiles) tiles[k].el.remove(); tiles={};
  addRandom(); addRandom(); updHud(); save();
  document.getElementById('endcard').classList.add('hidden');
}
function lineIdx(dir,line,k){
  // dir: 0 sol,1 sağ,2 yukarı,3 aşağı → satır/sütun taraması
  if(dir===0) return line*4+k;
  if(dir===1) return line*4+(3-k);
  if(dir===2) return k*4+line;
  return (3-k)*4+line;
}
function move(dir){
  if(over) return;
  let moved=false, gained=0;
  const mergedAt=new Set();
  for(let line=0;line<4;line++){
    const vals=[];
    for(let k=0;k<4;k++){ const v=cells[lineIdx(dir,line,k)]; if(v) vals.push(v); }
    const out=[];
    for(let k=0;k<vals.length;k++){
      if(k<vals.length-1&&vals[k]===vals[k+1]){
        out.push(vals[k]*2); gained+=vals[k]*2;
        if(vals[k]*2===2048) won=true;
        mergedAt.add(lineIdx(dir,line,out.length-1)); k++;
      } else out.push(vals[k]);
    }
    for(let k=0;k<4;k++){
      const idx=lineIdx(dir,line,k), nv=out[k]||0;
      if(cells[idx]!==nv) moved=true;
      cells[idx]=nv;
    }
  }
  if(!moved) return;
  score+=gained;
  if(score>best){ best=score; try{localStorage.setItem('g2048_best',best);}catch(e){} }
  redrawAll();
  for(const i of mergedAt){
    for(const k in tiles) if(tiles[k].i===i){ tiles[k].el.classList.add('merged'); }
  }
  addRandom(); updHud(); save();
  try{ if(gained>0&&navigator.vibrate)navigator.vibrate(8); }catch(e){}
  if(won&&!keptGoing){ showEnd(true); return; }
  // hamle kaldı mı
  if(cells.every(v=>v)){
    let can=false;
    for(let i=0;i<16;i++){
      if(i%4<3&&cells[i]===cells[i+1]) can=true;
      if(i<12&&cells[i]===cells[i+4]) can=true;
    }
    if(!can){ over=true; showEnd(false); }
  }
}
function showEnd(win){
  const t=document.getElementById('endTitle'), m=document.getElementById('endMsg'),
        go=document.getElementById('goOnBtn');
  if(win){ t.textContent='2048! 🎉'; m.textContent='Efsane kareye ulaştın. Devam edip 4096 dener misin?';
    go.style.display=''; }
  else{ t.textContent='Hamle Kalmadı'; m.textContent='Skor: '+score+' · Rekor: '+best+'. Köşe stratejisini dene: en büyük taşı bir köşede tut.';
    go.style.display='none'; try{localStorage.removeItem('g2048_save');}catch(e){} }
  document.getElementById('endcard').classList.remove('hidden');
}
addEventListener('keydown',e=>{
  const map={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3};
  if(e.code in map){ move(map[e.code]); e.preventDefault(); }
});
let tX=null,tY=null;
addEventListener('touchstart',e=>{ if(e.target.closest('.card,button'))return;
  const t=e.changedTouches[0]; tX=t.clientX; tY=t.clientY; },{passive:true});
addEventListener('touchend',e=>{
  if(tX===null) return;
  const t=e.changedTouches[0], dx=t.clientX-tX, dy=t.clientY-tY;
  tX=tY=null;
  if(Math.abs(dx)<28&&Math.abs(dy)<28) return;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?1:0); else move(dy>0?3:2);
});
function tap(el,fn){ el._fn=fn;
  const fire=e=>{ e.preventDefault(); e.stopPropagation(); if(el._fn)el._fn(); };
  el.addEventListener('click',fire); el.addEventListener('touchend',fire); }
tap(document.getElementById('newBtn'),reset);
tap(document.getElementById('retryBtn'),reset);
tap(document.getElementById('goOnBtn'),()=>{ keptGoing=true; save();
  document.getElementById('endcard').classList.add('hidden'); });

/* kayıttan devam */
let loaded=false;
try{ const s=JSON.parse(localStorage.getItem('g2048_save'));
  if(s&&s.cells&&s.cells.some(v=>v)){ ({cells,score,won,keptGoing}=s); loaded=true; } }catch(e){}
if(loaded){ redrawAll(); updHud(); } else reset();
updHud();
</script>

<script>
(function(){
  var btn=document.getElementById('mpNasilBtn'),
      kap=document.getElementById('mpNasilKap');
  document.querySelector('#mpNasilKart p').textContent='1️⃣ Parmağını kaydır: tüm taşlar o yöne kayar.\n2️⃣ Aynı sayılar çarpışınca birleşip iki katı olur.\n3️⃣ Hedef: 2048 taşına ulaşmak — sonrası da var!\n4️⃣ Tahta dolup hamle kalmayınca oyun biter.\n💡 Büyük taşları bir köşede tutmaya çalış.';
  function ac(e){ if(e){e.preventDefault();e.stopPropagation();} kap.classList.add('mpAcik'); }
  function kapat(e){ if(e){e.preventDefault();e.stopPropagation();} kap.classList.remove('mpAcik'); }
  btn.addEventListener('click',ac); btn.addEventListener('touchend',ac);
  document.getElementById('mpNasilTamam').addEventListener('click',kapat);
  document.getElementById('mpNasilTamam').addEventListener('touchend',kapat);
  kap.addEventListener('click',function(e){ if(e.target===kap) kapat(e); });
  /* oyun başlayınca düğme kaybolsun: butona/modala olmayan 2. dokunuştan sonra */
  var sayac=0;
  document.addEventListener('pointerdown',function(e){
    if(e.target.closest('#mpNasilBtn,#mpNasilKap')) return;
    if(++sayac>=2) setTimeout(function(){ btn.classList.add('mpGizli'); },400);
  },true);
  /* sessiz oyuna yumuşak tuş sesi */
  var mpAC=null;
  function mpTik(){ try{ mpAC=mpAC||new (window.AudioContext||window.webkitAudioContext)();
    if(mpAC.state==='suspended')mpAC.resume();
    var t=mpAC.currentTime,o=mpAC.createOscillator(),g=mpAC.createGain();
    o.type='triangle'; o.frequency.value=520;
    g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
    o.connect(g); g.connect(mpAC.destination); o.start(t); o.stop(t+0.09); }catch(e){} }
  document.addEventListener('click',function(e){
    if(e.target.closest('button, .btn, [data-act], a.sec, .sec, .parca')) mpTik();
  },true);
