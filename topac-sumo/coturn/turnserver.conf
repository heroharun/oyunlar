# coturn — kendi TURN sunucumuz (WebRTC relay, NAT/CGNAT arkası için)
# Kurulum (Ubuntu): apt install coturn ; bu dosyayı /etc/turnserver.conf yap
# systemctl enable --now coturn
#
# index.html RTC_CONFIG içindeki turn: adresi/kullanıcı/parola ile eşleşmeli.

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech

# statik kullanıcı (basit) — prod'da 'use-auth-secret' + zaman kısıtlı kimlik tercih et
user=sumo:topacSumoTurn2026
realm=sumo.ornek.com

# sunucunun genel IP'si (Hetzner/VPS)
external-ip=89.167.89.99

# güvenlik: yerel/özel ağlara relay'i kapat
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

min-port=49152
max-port=65535
# log
verbose
