<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<title>AYNA ARABA — Kontroller Tersine Dönerse?</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  :root{ --bg:#241a33; --ink:#f6f1ff; --dim:#a595c2; --tur:#3ecf9a; --mor:#b06bff; --sari:#ffc94d; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  #hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;
    justify-content:space-between;align-items:flex-start;padding:0 14px;pointer-events:none;z-index:5}
  .kutu{text-align:center}
  .label{font-size:9px;letter-spacing:.2em;color:var(--dim);font-weight:800}
  .deger{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #ortaHud{display:flex;flex-direction:column;align-items:center;gap:4px}
  #durdur{pointer-events:auto;font:inherit;font-size:17px;font-weight:900;color:var(--ink);
    background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.24);
    border-radius:12px;width:44px;height:44px;cursor:pointer}
  #canEl{font-size:15px;letter-spacing:2px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
  #toast{position:fixed;top:18%;left:50%;transform:translateX(-50%);font-size:24px;font-weight:900;
    color:var(--sari);opacity:0;pointer-events:none;white-space:nowrap;z-index:6;
    text-shadow:0 2px 12px rgba(0,0,0,.6)}
  #toast.pop{animation:tp .9s ease-out}
  @keyframes tp{0%{opacity:0;transform:translateX(-50%) scale(.6)}
    15%{opacity:1;transform:translateX(-50%) scale(1.08)}80%{opacity:1}100%{opacity:0}}
  .kart{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;background:rgba(36,26,51,.97);
    transition:opacity .3s;padding:24px;z-index:10}
  .kart.gizli{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
  .kart.gizli .btn{pointer-events:none}
  .kart h1{font-size:clamp(34px,9vw,58px);font-weight:900;line-height:1.05;color:var(--tur);transform:rotate(-2deg)}
  .kart h1 span{display:inline-block;transform:scaleX(-1);color:var(--mor)}
  .kart p{max-width:38ch;color:var(--dim);font-size:14.5px;line-height:1.6}
  .kart .puanlar{font-size:30px;font-weight:900}
  .btn{font:inherit;font-weight:900;font-size:16px;letter-spacing:.06em;text-transform:uppercase;
    color:#101822;background:linear-gradient(180deg,#4fe3ad,#3ecf9a);border:none;border-radius:999px;
    padding:15px 42px;cursor:pointer;box-shadow:0 5px 0 #1e7a58}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1e7a58}
  .btn:focus-visible{outline:3px solid var(--tur);outline-offset:3px}
  .hint{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .btn2{font:inherit;font-weight:800;font-size:13.5px;letter-spacing:.05em;color:var(--ink);
    background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.28);
    border-radius:999px;padding:11px 26px;cursor:pointer}
  .diller{display:flex;gap:8px}
  .dil{font:inherit;font-size:13px;font-weight:900;color:var(--dim);background:none;
    border:1.5px solid rgba(255,255,255,.25);border-radius:10px;padding:8px 14px;cursor:pointer}
  .dil.aktif{color:#101020;background:var(--sari);border-color:var(--sari)}
  #nasilIcerik{text-align:left;white-space:pre-line}
</style>
<canvas id="c"></canvas>
<div id="hud">
  <div class="kutu"><div class="label">PUAN</div><div class="deger" id="puanEl">0</div></div>
  <div id="ortaHud">
    <button id="durdur" aria-label="Durdur / Devam">⏸</button>
    <div id="canEl">❤️❤️❤️</div>
  </div>
  <div class="kutu"><div class="label">⭐</div><div class="deger" id="yildizEl">0</div></div>
</div>
<div id="toast"></div>

<div class="kart" id="giris">
  <h1>AYNA <span>ARABA</span></h1>
  <p id="girisMetin">Sola dokun → sola, sağa dokun → sağa… ta ki <b style="color:var(--mor)">AYNA MODU</b> gelene kadar! Mor ışık yanınca her şey tersine döner: sola dokununca araba <b>sağa</b> gider. Beynin şaşıracak, refleksin güçlenecek. 3 canın var, ❤️ tazeler.</p>
  <div class="diller">
    <button class="dil" data-dil="tr">TR</button>
    <button class="dil" data-dil="en">EN</button>
    <button class="dil" data-dil="es">ES</button>
  </div>
  <button class="btn" id="baslaBtn">Kontağı Çevir</button>
  <button class="btn2" id="nasilBtn">❓ Nasıl Oynanır</button>
  <span class="hint" id="bestIntro"></span>
  <span class="hint" id="klavyeHint">klavye: ← → · ayna modunda tersine!</span>
</div>

<div class="kart gizli" id="nasil">
  <h1 id="nasilBaslik" style="font-size:28px">NASIL OYNANIR</h1>
  <p id="nasilIcerik"></p>
  <button class="btn" id="nasilKapat">Tamam</button>
</div>

<div class="kart gizli" id="son">
  <h1 id="sonBaslik">ÇARPTIN!</h1>
  <div class="puanlar" id="sonPuan"></div>
  <p id="sonMsg"></p>
  <button class="btn" id="tekrarBtn">Tekrar Dene</button>
</div>

<script>
'use strict';
const DILLER={
tr:{giris:'Sola dokun → sola, sağa dokun → sağa… ta ki AYNA MODU gelene kadar! Mor ışık yanınca her şey tersine döner: sola dokununca araba sağa gider. Beynin şaşıracak, refleksin güçlenecek. 3 canın var, ❤️ tazeler.',
 basla:'Kontağı Çevir',tekrar:'Tekrar Dene',nasilBtn:'❓ Nasıl Oynanır',tamam:'Tamam',nasilBaslik:'NASIL OYNANIR',
 nasil:'1️⃣ Sol/sağ yarıya dokun (veya ← →): araba bir şerit kayar.\n\n2️⃣ Konilerden ve karşı arabalardan kaç, ⭐ yıldızları topla.\n\n3️⃣ "🪞 Ayna geliyor…" uyarısından sonra AYNA MODU başlar: kontroller TERSİNE döner!\n\n4️⃣ Ayna modunda araba morlaşır, ekran çerçevelenir; süre çubuğu bitince normale döner.\n\n5️⃣ 3 canın var; ❤️ kalpler tazeler.\n\n💡 Ayna gelince bir saniye dur, düşün, sonra dokun — acele eden şaşırır!',
 klavye:'klavye: ← → · ayna modunda tersine!',lPuan:'PUAN',dur:'DURAKLATILDI',devamIp:'devam için ▶ düğmesine bas',

 enIyiF:b=>'En iyin: '+b.toLocaleString('tr-TR')+'. ',sonEk:'Ayna geldiğinde bir saniye dur, düşün, sonra dokun!',
 canArti:'❤️ +1 can!',canEksi:'💥 -1 can!',aynaGeliyor:'🪞 AYNA GELİYOR…',aynaModu:'🪞 AYNA MODU! TERS!',
 normal:'✅ Normal kontroller',bant:'🪞 AYNA MODU — kontroller TERS',bantMini:'🪞 ayna geliyor…',ters:'🪞 TERS!',
 enIyiIntroF:b=>'EN İYİ: '+b.toLocaleString('tr-TR')},
en:{giris:'Tap left → go left, tap right → go right… until MIRROR MODE hits! When the purple light comes on, everything flips: tapping left sends the car RIGHT. Your brain will wobble, your reflexes will grow. 3 lives, ❤️ refills.',
 basla:'Start the Engine',tekrar:'Try Again',nasilBtn:'❓ How to Play',tamam:'OK',nasilBaslik:'HOW TO PLAY',
 nasil:'1️⃣ Tap the left/right half (or ← →): the car shifts one lane.\n\n2️⃣ Dodge cones and oncoming cars, collect ⭐ stars.\n\n3️⃣ After the "🪞 mirror coming…" warning, MIRROR MODE begins: controls are REVERSED!\n\n4️⃣ In mirror mode the car turns purple and the screen gets a frame; when the timer bar empties, controls return to normal.\n\n5️⃣ You have 3 lives; ❤️ hearts refill them.\n\n💡 When the mirror hits, pause a second, think, then tap — rushing gets you crashed!',

 enIyiF:b=>'Your best: '+b.toLocaleString('en-US')+'. ',sonEk:'When the mirror hits, pause a second, think, then tap!',
 canArti:'❤️ +1 life!',canEksi:'💥 -1 life!',aynaGeliyor:'🪞 MIRROR COMING…',aynaModu:'🪞 MIRROR MODE! REVERSED!',
 normal:'✅ Normal controls',bant:'🪞 MIRROR MODE — controls REVERSED',bantMini:'🪞 mirror coming…',ters:'🪞 FLIPPED!',
 enIyiIntroF:b=>'BEST: '+b.toLocaleString('en-US')},
es:{giris:'Toca a la izquierda → va a la izquierda… ¡hasta que llega el MODO ESPEJO! Con la luz morada todo se invierte: tocar a la izquierda manda el coche a la DERECHA. Tu cerebro se confundirá, tus reflejos crecerán. 3 vidas, ❤️ recarga.',
 basla:'Arrancar',tekrar:'Otra Vez',nasilBtn:'❓ Cómo Jugar',tamam:'Vale',nasilBaslik:'CÓMO JUGAR',
 nasil:'1️⃣ Toca la mitad izquierda/derecha (o ← →): el coche cambia de carril.\n\n2️⃣ Esquiva conos y coches, recoge ⭐ estrellas.\n\n3️⃣ Tras el aviso "🪞 espejo en camino…" empieza el MODO ESPEJO: ¡controles INVERTIDOS!\n\n4️⃣ En modo espejo el coche se vuelve morado y la pantalla se enmarca; al agotarse la barra vuelve a la normalidad.\n\n5️⃣ Tienes 3 vidas; los ❤️ las recargan.\n\n💡 Cuando llegue el espejo: para un segundo, piensa y luego toca. ¡Las prisas estrellan!',
 klavye:'teclas: ← → · ¡invertidas en modo espejo!',lPuan:'PUNTOS',dur:'PAUSA',devamIp:'pulsa ▶ para seguir',
 sonBaslik:'¡CHOCASTE!',sonPuanF:(p2,y)=>p2.toLocaleString('es-ES')+' puntos · ⭐ '+y,rekor:'🏆 ¡NUEVO RÉCORD! ',
 enIyiF:b=>'Tu récord: '+b.toLocaleString('es-ES')+'. ',sonEk:'Cuando llegue el espejo: ¡para, piensa y luego toca!',
 canArti:'❤️ ¡+1 vida!',canEksi:'💥 ¡-1 vida!',aynaGeliyor:'🪞 ESPEJO EN CAMINO…',aynaModu:'🪞 ¡MODO ESPEJO! ¡INVERTIDO!',
 normal:'✅ Controles normales',bant:'🪞 MODO ESPEJO — controles INVERTIDOS',bantMini:'🪞 espejo en camino…',ters:'🪞 ¡INVERTIDO!',
 enIyiIntroF:b=>'RÉCORD: '+b.toLocaleString('es-ES')}};
let dil=localStorage.getItem('mp_dil')||'tr';
if(!DILLER[dil])dil='tr';
const S=k=>DILLER[dil][k]??DILLER.tr[k];
function uygulaDil(){
  document.getElementById('girisMetin').textContent=S('giris');
  document.getElementById('baslaBtn').textContent=S('basla');
  document.getElementById('tekrarBtn').textContent=S('tekrar');
  document.getElementById('nasilBtn').textContent=S('nasilBtn');
  document.getElementById('nasilKapat').textContent=S('tamam');
  document.getElementById('nasilBaslik').textContent=S('nasilBaslik');
  document.getElementById('nasilIcerik').textContent=S('nasil');
  document.getElementById('klavyeHint').textContent=S('klavye');
  document.getElementById('sonBaslik').textContent=S('sonBaslik');
  document.querySelectorAll('#hud .label')[0].textContent=S('lPuan');
  document.getElementById('bestIntro').textContent=best>0?S('enIyiIntroF')(best):'';
  document.querySelectorAll('.dil').forEach(b=>b.classList.toggle('aktif',b.dataset.dil===dil));
}
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,3); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0); }
resize(); addEventListener('resize',resize);

let best=+(localStorage.getItem('aynaaraba_best')||0);


let AC=null;
const audio=()=>{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; };
function blip(f,d=0.1,v=0.12,tip='triangle'){ try{ const a=audio(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=tip; o.frequency.value=f; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+0.02); }catch(e){} }
const buzz=p=>{ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} };
function toast(t){ const el=document.getElementById('toast'); el.textContent=t;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

/* ── DURUM ── */
const SERIT=3;
let state='intro', tick=0, dist=0, puan=0, yildiz=0, can=3, iFrames=0, spd=0;
let lane=1, laneX=1, objs=[], spawnT=0, parcalar=[], popups=[], sarsinti=0;
function patla(x,y,renk){ for(let i=0;i<10;i++){ const a2=Math.random()*6.28,h2=1+Math.random()*2.6;
  parcalar.push({x,y,vx:Math.cos(a2)*h2,vy:Math.sin(a2)*h2,omur:22+Math.random()*14,renk}); } }
function popup(x,y,metin,renk){ popups.push({x,y,metin,renk,omur:44}); }
/* ayna modu */
let ayna=false, aynaT=0, aynaUyari=0, aynaSayac=700;

const ARABA_Y=()=>H*0.8;
const yolW=()=>Math.min(W*0.8,420);
const laneCX=l=>W/2+(l-1)*(yolW()/3);

function reset(){ tick=0; dist=0; puan=0; yildiz=0; can=3; iFrames=0; spd=3.4;
  lane=1; laneX=1; objs=[]; spawnT=100;
  ayna=false; aynaT=0; aynaUyari=0; aynaSayac=700; updHud(); }
function updHud(){
  document.getElementById('puanEl').textContent=Math.floor(puan).toLocaleString('tr-TR');
  document.getElementById('yildizEl').textContent=yildiz;
  document.getElementById('canEl').textContent='❤️'.repeat(can)+'🖤'.repeat(3-can);
}

function spawn(){
  const bos=Math.floor(Math.random()*SERIT);      /* her sırada en az bir şerit boş */
  const r=Math.random();
  if(r<0.6){
    const dolu=[0,1,2].filter(l=>l!==bos);
    const kac=Math.random()<0.6?1:2;
    const renkler=[['#d1524a','#a33028'],['#4a7fd1','#2d5aa8'],['#d1a94a','#a8802d'],['#7a58c9','#5638a0']];
    for(let i=0;i<kac;i++) objs.push({lane:dolu[i],y:-60,tip:'blok',v:Math.random()<0.5?0:1,
      renk:renkler[Math.floor(Math.random()*renkler.length)],hit:false});
  } else if(r<0.85){
    objs.push({lane:Math.floor(Math.random()*SERIT),y:-60,tip:'yildiz',hit:false});
  } else if(can<3){
    objs.push({lane:Math.floor(Math.random()*SERIT),y:-60,tip:'can',hit:false});
  }
}

function physics(dt){
  tick+=dt;
  spd=Math.min(8, 3.4+dist/2400);
  dist+=spd*0.15*dt; puan+=spd*0.05*dt;
  laneX+=(lane-laneX)*(1-Math.pow(0.6,dt));
  if(iFrames>0)iFrames-=dt;
  /* ayna döngüsü */
  if(!ayna){
    aynaSayac-=dt;
    if(aynaSayac<=90&&aynaSayac>0&&aynaUyari<=0){ aynaUyari=90;
      toast(S('aynaGeliyor')); blip(500,0.2,0.1); }
    if(aynaUyari>0)aynaUyari-=dt;
    if(aynaSayac<=0){ ayna=true; aynaT=360;
      toast(S('aynaModu')); blip(300,0.3,0.15,'square'); blip(600,0.3,0.1,'square'); buzz([30,40,30]); }
  } else {
    aynaT-=dt;
    if(aynaT<=0){ ayna=false; aynaSayac=560+Math.random()*280;
      toast(S('normal')); blip(760,0.15,0.12); buzz(15); }
  }
  spawnT-=spd*dt;
  if(spawnT<=0){ spawn(); spawnT=200+Math.random()*160; }
  const ay=ARABA_Y();
  for(const o of objs){
    o.y+=spd*dt;
    if(o.hit)continue;
    if(Math.abs(o.y-ay)<38&&Math.abs(o.lane-laneX)<0.42){
      if(o.tip==='yildiz'){ o.hit=true; yildiz++; puan+=15; updHud(); blip(980,0.08,0.12); buzz(8);
        patla(laneCX(o.lane),o.y,'#ffc94d'); popup(laneCX(o.lane),o.y-24,'+15','#ffc94d'); }
      else if(o.tip==='can'){ o.hit=true; can=Math.min(3,can+1); updHud();
        toast(S('canArti')); blip(660,0.1,0.13); blip(880,0.14,0.12); buzz([15,25,15]); }
      else if(iFrames>0){ }
      else { crash(o); return; }
    }
  }
  objs=objs.filter(o=>!o.hit&&o.y<H+80);
  for(const p of parcalar){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.omur-=dt; }
  parcalar=parcalar.filter(p=>p.omur>0);
  for(const p of popups){ p.y-=1.1*dt; p.omur-=dt; }
  popups=popups.filter(p=>p.omur>0);
  if(sarsinti>0)sarsinti-=dt;
  updHud();
}
function crash(o){
  if(can>1){
    can--; iFrames=110; o.hit=true; sarsinti=12;
    objs=objs.filter(x=>!(x.tip==='blok'&&x.y>ARABA_Y()-260&&x.y<ARABA_Y()+80));
    updHud(); toast(S('canEksi'));
    blip(200,0.2,0.16,'square'); buzz([40,30,40]);
    return;
  }
  state='son';
  blip(140,0.4,0.2,'sawtooth'); buzz([60,40,80]);
  const p=Math.floor(puan), rekor=p>best;
  if(rekor){ best=p; localStorage.setItem('aynaaraba_best',best); }
  document.getElementById('sonPuan').textContent=S('sonPuanF')(p,yildiz);
  document.getElementById('sonMsg').textContent=(rekor?S('rekor'):S('enIyiF')(best))+S('sonEk');
  setTimeout(()=>document.getElementById('son').classList.remove('gizli'),450);
}

/* ── ÇİZİM ── */
function cizYol(){
  const g=ctx.createLinearGradient(0,0,0,H);
  if(ayna){ g.addColorStop(0,'#3a2452'); g.addColorStop(1,'#241a33'); }
  else { g.addColorStop(0,'#2b2140'); g.addColorStop(1,'#1d1530'); }
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const w2=yolW();
  /* yol kenarı: gece silueti binalar + ışıklı pencereler (akar) */
  const binaAkis=(tick*spd*0.5)%180;
  for(const taraf of [-1,1]){
    const bx=W/2+taraf*(w2/2+16);
    for(let by=-180+binaAkis;by<H;by+=180){
      const bw=Math.max(24,(W-w2)/2-24);
      if(bw<18)continue;
      const x0=taraf<0?4:W-4-bw;
      const bh=110+((Math.floor((by-binaAkis)/180)*61)%50);
      ctx.fillStyle=ayna?'#2b1e42':'#221a38';
      ctx.beginPath(); ctx.roundRect(x0,by,bw,bh,6); ctx.fill();
      /* pencereler */
      ctx.fillStyle=ayna?'rgba(176,107,255,.5)':'rgba(255,201,77,.4)';
      for(let wy2=by+12;wy2<by+bh-12;wy2+=24)
        for(let wx2=x0+7;wx2<x0+bw-10;wx2+=17)
          if(((wx2*7+wy2)%5)<3) ctx.fillRect(wx2,wy2,7,9);
    }
  }
  ctx.fillStyle=ayna?'#33254a':'#2a2140';
  ctx.fillRect(W/2-w2/2-14,0,w2+28,H);
  ctx.fillStyle=ayna?'#b06bff':'#5e5378';
  ctx.fillRect(W/2-w2/2-14,0,5,H); ctx.fillRect(W/2+w2/2+9,0,5,H);
  /* şerit çizgileri */
  ctx.fillStyle='rgba(246,241,255,.35)';
  const akis=(tick*spd)%58;
  for(const lx of [W/2-w2/6,W/2+w2/6]){
    for(let y=-58+akis;y<H;y+=58) ctx.fillRect(lx-2.5,y,5,32);
  }
  /* kenar neon parıltısı ayna modunda */
  if(ayna){
    ctx.fillStyle='rgba(176,107,255,.12)';
    ctx.fillRect(0,0,W,H);
  }
}
function cizAraba(){
  const x=laneCX(0)+(laneCX(2)-laneCX(0))*laneX/2, y=ARABA_Y();
  if(iFrames>0&&Math.floor(tick/4)%2===0) return;
  const w=Math.min(W*0.1,52), h=w*1.75;
  /* far huzmesi */
  const far=ctx.createLinearGradient(0,y-h/2,0,y-h*2.6);
  far.addColorStop(0,'rgba(255,233,168,.22)'); far.addColorStop(1,'rgba(255,233,168,0)');
  ctx.fillStyle=far;
  ctx.beginPath();
  ctx.moveTo(x-w*0.32,y-h/2); ctx.lineTo(x-w*0.75,y-h*2.6);
  ctx.lineTo(x+w*0.75,y-h*2.6); ctx.lineTo(x+w*0.32,y-h/2);
  ctx.closePath(); ctx.fill();
  ctx.save(); ctx.translate(x,y);
  ctx.rotate((lane-laneX)*0.18);
  if(ayna) ctx.scale(-1,1);          /* ayna modunda araba da aynalanır — görsel ipucu */
  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(0,h*0.42,w*0.62,10,0,0,6.28); ctx.fill();
  ctx.fillStyle='#10151f';
  for(const [tx,ty] of [[-w*0.56,-h*0.27],[w*0.56,-h*0.27],[-w*0.56,h*0.25],[w*0.56,h*0.25]])
    { ctx.beginPath(); ctx.roundRect(tx-5.5,ty-12,11,24,5); ctx.fill(); }
  const renk=ayna?'#b06bff':'#3ecf9a', koyu=ayna?'#7e44c4':'#249a70';
  ctx.fillStyle=koyu;
  ctx.beginPath(); ctx.roundRect(-w/2,-h/2,w,h,w*0.34); ctx.fill();
  const kaporta=ctx.createLinearGradient(-w/2,0,w/2,0);
  kaporta.addColorStop(0,koyu); kaporta.addColorStop(0.4,renk); kaporta.addColorStop(1,koyu);
  ctx.fillStyle=kaporta;
  ctx.beginPath(); ctx.roundRect(-w/2+3,-h/2+3,w-6,h-6,w*0.3); ctx.fill();
  /* yarış şeridi — asimetrik: ayna modunda yön değiştiği görülsün */
  ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.beginPath(); ctx.roundRect(-w*0.3,-h/2+4,w*0.14,h-8,4); ctx.fill();
  ctx.fillStyle='rgba(16,21,31,.9)';
  ctx.beginPath(); ctx.roundRect(-w*0.34,-h*0.32,w*0.68,h*0.22,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.16)';
  ctx.beginPath(); ctx.roundRect(-w*0.34,-h*0.32,w*0.68,h*0.09,5); ctx.fill();
  ctx.fillStyle='#ffe9a8';
  ctx.beginPath(); ctx.arc(-w*0.26,-h*0.46,4.2,0,6.28); ctx.arc(w*0.26,-h*0.46,4.2,0,6.28); ctx.fill();
  ctx.restore();
}
function cizObj(o){
  const x=laneCX(o.lane);
  if(o.tip==='yildiz'){
    const r=13+Math.sin(tick*0.15+o.y)*2;
    const g=ctx.createRadialGradient(x,o.y,2,x,o.y,r*2);
    g.addColorStop(0,'rgba(255,220,120,.5)'); g.addColorStop(1,'rgba(255,220,120,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,o.y,r*2,0,6.28); ctx.fill();
    ctx.save(); ctx.translate(x,o.y); ctx.rotate(Math.sin(tick*0.05+o.y)*0.25);
    ctx.fillStyle='#ffc94d'; ctx.beginPath();
    for(let i=0;i<10;i++){ const rr=i%2?r*0.45:r, aa=i*Math.PI/5-Math.PI/2;
      ctx[i?'lineTo':'moveTo'](Math.cos(aa)*rr,Math.sin(aa)*rr); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
  } else if(o.tip==='can'){
    const s2=1+Math.sin(tick*0.2)*0.08;
    ctx.save(); ctx.translate(x,o.y); ctx.scale(s2,s2);
    const g=ctx.createRadialGradient(0,0,2,0,0,30);
    g.addColorStop(0,'rgba(255,90,110,.45)'); g.addColorStop(1,'rgba(255,90,110,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,30,0,6.28); ctx.fill();
    ctx.fillStyle='#ff4d6a';
    ctx.beginPath(); ctx.moveTo(0,12);
    ctx.bezierCurveTo(-18,-2,-14,-16,0,-7);
    ctx.bezierCurveTo(14,-16,18,-2,0,12); ctx.fill();
    ctx.restore();
  } else if(o.v===0){
    /* koni */
    const w2=Math.min(W*0.08,42);
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(x,o.y+w2*0.55,w2*0.62,7,0,0,6.28); ctx.fill();
    ctx.fillStyle='#e8632e';
    ctx.beginPath(); ctx.roundRect(x-w2*0.62,o.y+w2*0.34,w2*1.24,w2*0.22,5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x,o.y-w2*0.62);
    ctx.lineTo(x+w2*0.44,o.y+w2*0.4); ctx.lineTo(x-w2*0.44,o.y+w2*0.4); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.beginPath();
    ctx.moveTo(x,o.y-w2*0.62); ctx.lineTo(x+w2*0.44,o.y+w2*0.4); ctx.lineTo(x-w2*0.44,o.y+w2*0.4);
    ctx.closePath(); ctx.clip();
    ctx.fillStyle='#fff4ea';
    ctx.fillRect(x-w2,o.y-w2*0.26,w2*2,w2*0.16);
    ctx.fillRect(x-w2,o.y+w2*0.06,w2*2,w2*0.16);
    ctx.restore();
  } else {
    /* karşı araba (gri) */
    const w=Math.min(W*0.095,48), h=w*1.6;
    ctx.save(); ctx.translate(x,o.y);
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(0,h*0.42,w*0.6,9,0,0,6.28); ctx.fill();
    ctx.fillStyle='#10151f';
    for(const [tx,ty] of [[-w*0.55,-h*0.25],[w*0.55,-h*0.25],[-w*0.55,h*0.25],[w*0.55,h*0.25]])
      { ctx.beginPath(); ctx.roundRect(tx-5,ty-10,10,20,4); ctx.fill(); }
    const [ac,ko]=o.renk||['#6b768f','#525c72'];
    ctx.fillStyle=ko;
    ctx.beginPath(); ctx.roundRect(-w/2,-h/2,w,h,w*0.32); ctx.fill();
    const kg=ctx.createLinearGradient(-w/2,0,w/2,0);
    kg.addColorStop(0,ko); kg.addColorStop(0.4,ac); kg.addColorStop(1,ko);
    ctx.fillStyle=kg;
    ctx.beginPath(); ctx.roundRect(-w/2+3,-h/2+3,w-6,h-6,w*0.28); ctx.fill();
    ctx.fillStyle='rgba(16,21,31,.9)';
    ctx.beginPath(); ctx.roundRect(-w*0.32,h*0.06,w*0.64,h*0.22,6); ctx.fill();
    /* stoplar bize dönük (karşıdan geliyor hissi) */
    ctx.fillStyle='#ff5540';
    ctx.beginPath(); ctx.roundRect(-w*0.34,-h*0.46,w*0.2,6,3); ctx.fill();
    ctx.beginPath(); ctx.roundRect(w*0.14,-h*0.46,w*0.2,6,3); ctx.fill();
    ctx.restore();
  }
}
function draw(){
  ctx.save();
  if(sarsinti>0) ctx.translate((Math.random()-0.5)*sarsinti,(Math.random()-0.5)*sarsinti);
  cizYol();
  objs.sort((a,b)=>a.y-b.y);
  for(const o of objs) cizObj(o);
  cizAraba();
  for(const p of parcalar){ ctx.globalAlpha=Math.min(1,p.omur/14);
    ctx.fillStyle=p.renk; ctx.beginPath(); ctx.arc(p.x,p.y,2.6,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  for(const p of popups){ ctx.globalAlpha=Math.min(1,p.omur/16);
    ctx.fillStyle=p.renk; ctx.font='900 19px "Avenir Next",system-ui'; ctx.textAlign='center';
    ctx.fillText(p.metin,p.x,p.y); }
  ctx.globalAlpha=1;
  ctx.restore();
  /* ayna aktivasyon flaşı */
  if(ayna&&aynaT>320){
    const f=(aynaT-320)/40;
    ctx.fillStyle='rgba(176,107,255,'+(f*0.35)+')'; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.translate(W/2,H/2); ctx.scale(1+(1-f)*0.4,1+(1-f)*0.4);
    ctx.globalAlpha=Math.min(1,f*2);
    ctx.font='900 44px "Avenir Next",system-ui'; ctx.textAlign='center'; ctx.fillStyle='#fff';
    ctx.fillText(S('ters'),0,0); ctx.restore(); ctx.globalAlpha=1;
  }
  /* ayna modu çerçevesi + sayaç */
  if(ayna){
    ctx.strokeStyle='rgba(176,107,255,.85)'; ctx.lineWidth=7;
    ctx.strokeRect(4,4,W-8,H-8);
    ctx.fillStyle='rgba(176,107,255,.95)';
    ctx.font='900 17px "Avenir Next",system-ui'; ctx.textAlign='center';
    ctx.fillText(S('bant'),W/2,H*0.13);
    /* kalan süre çubuğu */
    ctx.fillStyle='rgba(255,255,255,.2)';
    ctx.beginPath(); ctx.roundRect(W/2-70,H*0.145,140,7,4); ctx.fill();
    ctx.fillStyle='#b06bff';
    ctx.beginPath(); ctx.roundRect(W/2-70,H*0.145,140*(aynaT/360),7,4); ctx.fill();
  } else if(aynaSayac<=90){
    if(Math.floor(tick/8)%2===0){
      ctx.fillStyle='rgba(176,107,255,.9)';
      ctx.font='900 15px "Avenir Next",system-ui'; ctx.textAlign='center';
      ctx.fillText(S('bantMini'),W/2,H*0.13);
    }
  }
  if(state==='dur'){
    ctx.fillStyle='rgba(36,26,51,.8)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f6f1ff'; ctx.font='900 30px "Avenir Next",system-ui'; ctx.textAlign='center';
    ctx.fillText(S('dur'),W/2,H/2-8);
    ctx.font='700 14px "Avenir Next",system-ui'; ctx.fillStyle='#a595c2';
    ctx.fillText(S('devamIp'),W/2,H/2+24);
  }
}
let sonTs=0;
function loop(ts){
  const dt=sonTs?Math.min(3,Math.max(0.25,(ts-sonTs)/16.667)):1; sonTs=ts;
  if(state==='play') physics(dt);
  if(state!=='intro') draw();
  requestAnimationFrame(loop);
}

/* ── KONTROLLER ── */
function git(yon){
  if(state!=='play')return;
  audio();
  const gercek=ayna?-yon:yon;
  lane=Math.max(0,Math.min(SERIT-1,lane+gercek));
  blip(gercek<0?420:520,0.05,0.08); buzz(5);
}
cv.addEventListener('touchstart',e=>{ e.preventDefault();
  for(const t of e.changedTouches) git(t.clientX<W/2?-1:1); },{passive:false});
cv.addEventListener('mousedown',e=>git(e.clientX<W/2?-1:1));
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') git(-1);
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') git(1);
  else if(e.key==='p'||e.key==='P'||e.key===' ') durdurToggle();
});
function durdurToggle(){
  if(state==='play'){ state='dur'; document.getElementById('durdur').textContent='▶'; }
  else if(state==='dur'){ state='play'; document.getElementById('durdur').textContent='⏸'; }
}
document.getElementById('durdur').addEventListener('click',durdurToggle);
const tap=(el,fn)=>{ el.addEventListener('click',fn);
  el.addEventListener('touchend',e=>{ e.preventDefault(); e.stopPropagation(); fn(); },{passive:false}); };
tap(document.getElementById('baslaBtn'),()=>{ audio(); reset(); state='play';
  document.getElementById('giris').classList.add('gizli'); });
tap(document.getElementById('tekrarBtn'),()=>{ audio(); reset(); state='play';
  document.getElementById('son').classList.add('gizli'); });
tap(document.getElementById('nasilBtn'),()=>document.getElementById('nasil').classList.remove('gizli'));
tap(document.getElementById('nasilKapat'),()=>document.getElementById('nasil').classList.add('gizli'));
document.querySelectorAll('.dil').forEach(b=>tap(b,()=>{
  dil=b.dataset.dil; localStorage.setItem('mp_dil',dil); uygulaDil();
}));
uygulaDil();
loop();
</script>
