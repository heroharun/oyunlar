/* ---------------------------- Çizim / yönlendirme ---------------------- */
function ciz(){
  var h = "";
  switch(A.ekran){
    case "ana": h = ekranAna(); break;
    case "kurulum": h = ekranKurulum(); break;
    case "devir": h = ekranDevir(); break;
    case "oyun": h = ekranOyun(); break;
    case "turozeti": h = ekranTurOzeti(); break;
    case "son": h = ekranSon(); break;
    case "altin": h = ekranAltin(); break;
    case "nasil": h = ekranNasil(); break;
    case "ayarlar": h = ekranAyarlar(); break;
    case "istatistik": h = ekranIstatistik(); break;
    case "gecmis": h = ekranGecmis(); break;
    case "paketler": h = ekranPaketler(); break;
    case "botkur": h = ekranBotKur(); break;
    case "botdevir": h = ekranBotDevir(); break;
    case "botoyun": h = ekranBotOyun(); break;
    case "botsim": h = ekranBotSim(); break;
    case "botson": h = ekranBotSon(); break;
    default: h = ekranAna();
  }
  UY.innerHTML = h;
  if(A.ekran === "oyun") sayacBasla(); else if(A.ekran !== "altin") sayacDurdur();
}

function turBaslatGerisayim(){
  A.gerisayim = 3; ciz();
  var sayac = setInterval(function(){
    A.gerisayim--;
    if(A.gerisayim <= 0){
      clearInterval(sayac); A.gerisayim = -1; ciz();
      setTimeout(function(){ A.gerisayim = 0; Motor.turBasla(A.d); Ses.basla(); oyunKaydet(); git("oyun"); }, 480);
    } else { Ses.tik(); ciz(); }
  }, 750);
}

function oyunuBitirVeKaydet(){
  sayacDurdur();
  A.d.status = "finished";
  Depo.sil(ANAHTAR.oyun);
  istatistikKaydet(A.d);
  A.kazananZorla = null;
  git("son");
  if(!beraberlikSor()) Ses.zafer();
}

/* ------------------------------ Olaylar -------------------------------- */
document.addEventListener("click", function(ev){
  var t = ev.target;
  while(t && t !== document && !t.getAttribute) t = t.parentNode;
  var dg = t && t.closest ? t.closest("[data-act]") : null;
  if(!dg) return;
  var p = dg.getAttribute("data-act").split(":");
  islemYap(p[0], p[1], p[2], ev);
});

function islemYap(grup, ne, deger){
  if(grup === "modal" ) { modalKapat(); return; }
  if(grup === "git"){ modalKapat(); git(ne); return; }

  if(grup === "menu"){
    if(ne === "yeni"){ Kur = yeniKurulum(false); git("kurulum"); }
    else if(ne === "hizli"){ Kur = yeniKurulum(true); Kur.adim = 2; git("kurulum"); }
    else if(ne === "devam"){ var k = Depo.al(ANAHTAR.oyun, null);
      if(k){ A.d = k; A.kazananZorla = null;
        git(k.status === "playing" || k.status === "handover" ? "devir" : (k.status === "turn-result" ? "turozeti" : "devir")); } }
    else if(ne === "dil"){ dilModal(); }
    else if(ne === "bot"){ git("botkur"); }
    else git(ne);
    return;
  }

  if(grup === "bot"){
    if(ne === "zorluk"){ BotKur.zorluk = deger; Ses.tik(); ciz(); return; }
    if(ne === "turs"){ BotKur.turSayisi = +deger; Ses.tik(); ciz(); return; }
    if(ne === "sure"){ BotKur.sure = +deger; Ses.tik(); ciz(); return; }
    if(ne === "kat"){
      var bi = BotKur.katlar.indexOf(deger);
      if(bi > -1) BotKur.katlar.splice(bi,1); else BotKur.katlar.push(deger);
      Ses.tik(); ciz(); return;
    }
    if(ne === "basla"){ botBaslat(); return; }
    if(ne === "kurulum"){ botTemizle(); git("botkur"); return; }
    if(ne === "turbasla"){
      if(!B) return;
      if(B.evre === "devir-sen") botTurBasla(); else if(B.evre === "devir-bot") botSimBaslat();
      return;
    }
    if(ne === "ipucu"){ botIpucu(); return; }
    if(ne === "sec"){ botCevap(+deger); return; }
    if(ne === "pas"){ botPas(); return; }
    if(ne === "atla"){ botSimAtla(); return; }
    if(ne === "tekrar"){ botTemizle(); botBaslat(); return; }
    if(ne === "cik"){
      modalAc('<h3>'+ka(T("anamenu"))+'</h3><div class="yigin">'+
        '<button class="dg" data-act="bot:cikevet">'+ka(T("evet"))+'</button>'+
        '<button class="dg ikincil" data-act="modal:kapat">'+ka(T("vazgec"))+'</button></div>');
      return;
    }
    if(ne === "cikevet"){ botTemizle(); B = null; modalKapat(); git("ana"); return; }
    return;
  }

  if(grup === "ayar"){
    if(ne === "dil"){ Ayar.dil = deger; ayarKaydet(); dilUygula(); modalKapat(); ciz(); return; }
    if(ne === "tik"){ Ayar[deger] = !Ayar[deger]; ayarKaydet(); dilUygula(); ciz(); return; }
    if(ne === "fs"){ Ayar.yaziBoyutu = parseFloat(deger); ayarKaydet(); dilUygula(); ciz(); return; }
    if(ne === "sifirla"){
      modalAc('<h3>'+ka(T("sifirla"))+'</h3><p class="sessiz">'+ka(T("sifirla_onay"))+'</p><div class="yigin">'+
        '<button class="dg" style="background:var(--yasak)" data-act="ayar:sifirlaevet">'+ka(T("evet"))+'</button>'+
        '<button class="dg ikincil" data-act="modal:kapat">'+ka(T("vazgec"))+'</button></div>'); return;
    }
    if(ne === "sifirlaevet"){
      [ANAHTAR.ist, ANAHTAR.gecmis, ANAHTAR.oyun, ANAHTAR.ozel].forEach(Depo.sil);
      modalKapat(); git("ana"); return;
    }
  }

  if(grup === "kur"){
    if(ne === "ileri"){
      if(Kur.adim === 2) kurulumOku();
      if(Kur.adim === 3 && !Kur.katlar.length){ bilgi(T("kategoriler"), T("en_az_1_kat")); return; }
      if(Kur.adim === 3 && kartSayisiHesap() < 4){ bilgi(T("kart_havuzu"), T("kart_yetersiz")); return; }
      if(Kur.adim === 8 || (Kur.hizli && Kur.adim === 2)){ oyunuBaslat(); return; }
      Kur.adim++; ciz(); return;
    }
    if(ne === "geri"){
      if(Kur.adim === 2) kurulumOku();
      if(Kur.adim === 1){ git("ana"); return; }
      Kur.adim--; ciz(); return;
    }
    if(ne === "takimsayi"){ Kur.takimSayisi = +deger; }
    if(ne === "kat"){ var i = Kur.katlar.indexOf(deger); if(i>-1) Kur.katlar.splice(i,1); else Kur.katlar.push(deger); }
    if(ne === "kattumu"){ Kur.katlar = KAT_SIRA.slice(); }
    if(ne === "kathic"){ Kur.katlar = []; }
    if(ne === "yas"){ Kur.yas = deger; }
    if(ne === "mod"){ Kur.mod = deger; if(deger === "round" && !Kur.kartSayisi) Kur.kartSayisi = 3; }
    if(ne === "sure"){ Kur.sure = +deger; }
    if(ne === "kart"){ Kur.kartSayisi = +deger || null; }
    if(ne === "turs"){ Kur.turSayisi = +deger; }
    if(ne === "hedef"){ Kur.hedef = +deger; }
    if(ne === "pas"){ Kur.pas = +deger; }
    if(ne === "ceza"){ Kur.ceza = deger; }
    if(ne === "puanlama"){ Kur.puanlama = deger; }
    if(ne === "simge"){ simgeModal(+deger); return; }
    Ses.tik(); ciz(); return;
  }

  if(grup === "simge"){
    Kur.takimlar[+ne].icon = SIMGELER[+deger];
    modalKapat(); ciz(); return;
  }

  if(grup === "oyun"){
    if(ne === "hazir"){ turBaslatGerisayim(); return; }
    if(ne === "cik"){
      modalAc('<h3>'+ka(T("anamenu"))+'</h3><p class="sessiz">'+ka(T("cikis_onay"))+'</p><div class="yigin">'+
        '<button class="dg" data-act="oyun:cikevet">'+ka(T("evet"))+'</button>'+
        '<button class="dg ikincil" data-act="modal:kapat">'+ka(T("vazgec"))+'</button></div>'); return;
    }
    if(ne === "cikevet"){ oyunKaydet(); modalKapat(); sayacDurdur(); git("ana"); return; }
    if(ne === "dogru"){ eylem("correct"); return; }
    if(ne === "pas"){ eylem("pass"); return; }
    if(ne === "yasak"){ eylem("forbidden"); return; }
    if(ne === "yasakevet"){ modalKapat(); eylemUygula("forbidden"); return; }
    if(ne === "duraklat"){ duraklat(); return; }
    if(ne === "devamet"){ duraklatKaldir(); return; }
    if(ne === "turozeti"){ modalKapat(); git("turozeti"); return; }
    if(ne === "karistir"){ Motor.desteYenile(A.d); modalKapat(); git("turozeti"); return; }
    if(ne === "bitir"){ modalKapat(); oyunuBitirVeKaydet(); return; }
    if(ne === "sonraki"){
      var durum = Motor.sonraki(A.d);
      oyunKaydet();
      if(durum === "finished"){ oyunuBitirVeKaydet(); } else { Ses.tur(); git("devir"); }
      return;
    }
  }

  if(grup === "son"){
    if(ne === "tekrar"){
      if(A.sonKurulum){ Kur = A.sonKurulum; Kur.adim = 8; A.kazananZorla = null; oyunuBaslat(); }
      else { Kur = yeniKurulum(false); git("kurulum"); }
      return;
    }
    if(ne === "takim"){ if(!Kur) Kur = yeniKurulum(false); Kur.adim = 2; git("kurulum"); return; }
    if(ne === "paylas"){ paylas(); return; }
    if(ne === "altin"){ altinBaslat(Motor.esitler(A.d)); return; }
    if(ne === "beraber"){ modalKapat(); Ses.zafer(); return; }
    if(ne === "altinbitti"){ modalKapat(); git("son"); return; }
  }

  if(grup === "altin"){
    if(ne === "basla"){
      var g = A.altin;
      g.kart = g.kartlar[(g.sonuc.length + g.i) % g.kartlar.length];
      g.evre = "oyun"; g.bitis = Date.now() + 30000; g.basladi = Date.now();
      ciz(); Ses.basla();
      sayacDurdur(); A.sayacId = setInterval(altinTik, 180);
      return;
    }
    if(ne === "dogru"){ Ses.dogru(); altinSonuc(Date.now() - A.altin.basladi); return; }
    if(ne === "yasak"){ Ses.yasak(); altinSonuc(Infinity); return; }
  }

  if(grup === "gecmis" && ne === "sil"){
    var gl = Depo.al(ANAHTAR.gecmis, []); gl.splice(+deger,1); Depo.yaz(ANAHTAR.gecmis, gl); ciz(); return;
  }

  if(grup === "ozel"){
    if(ne === "ekle"){ ozelEkleModal(); return; }
    if(ne === "kaydet"){
      var w = (el("ozelKelime")||{}).value || "", y = (el("ozelYasak")||{}).value || "";
      var yl = y.split(",").map(function(x){return x.trim();}).filter(Boolean);
      if(!w.trim() || yl.length < 3){ bilgi(T("kart_ekle"), T("en_az_3")); return; }
      var l = ozelKartlar();
      l.push({word:w.trim(), forbiddenWords:yl, difficulty:"medium", enabled:true});
      Depo.yaz(ANAHTAR.ozel, l); modalKapat(); ciz(); return;
    }
    if(ne === "sil"){ var lx = ozelKartlar(); lx.splice(+deger,1); Depo.yaz(ANAHTAR.ozel, lx); ciz(); return; }
    if(ne === "disa"){
      modalAc('<h3>'+ka(T("disa"))+'</h3><textarea readonly>'+ka(JSON.stringify(ozelKartlar()))+'</textarea>'+
        '<div class="yigin"><button class="dg ikincil" data-act="modal:kapat">'+ka(T("kapat"))+'</button></div>'); return;
    }
    if(ne === "ice"){
      modalAc('<h3>'+ka(T("ice"))+'</h3><textarea id="iceMetin" placeholder="'+ka(T("ice_ph"))+'"></textarea>'+
        '<div class="yigin"><button class="dg" data-act="ozel:iceOk">'+ka(T("kaydet"))+'</button>'+
        '<button class="dg ikincil" data-act="modal:kapat">'+ka(T("iptal"))+'</button></div>'); return;
    }
    if(ne === "iceOk"){
      try{
        var v = JSON.parse((el("iceMetin")||{}).value || "[]");
        if(!Array.isArray(v)) throw 0;
        var temiz = v.filter(function(k){ return k && k.word && Array.isArray(k.forbiddenWords) && k.forbiddenWords.length >= 3; });
        var mevcut = ozelKartlar().concat(temiz);
        Depo.yaz(ANAHTAR.ozel, mevcut);
        modalKapat(); ciz(); bilgi(T("ice"), T("ice_ok",{n:temiz.length}));
      }catch(e){ bilgi(T("ice"), T("ice_hata")); }
      return;
    }
  }
}

function dilModal(){
  var h = '<h3>'+ka(T("dil"))+'</h3><div class="yigin">';
  DILLER.forEach(function(dl){ h += '<button class="dg '+(Ayar.dil===dl?"":"ikincil")+'" data-act="ayar:dil:'+dl+'">'+ka(DIL_ADI[dl])+'</button>'; });
  modalAc(h+'<button class="dg hayalet" data-act="modal:kapat">'+ka(T("kapat"))+'</button></div>');
}
function simgeModal(ix){
  var h = '<h3>'+ka(T("takim"))+' '+(ix+1)+'</h3><div class="secenekler">';
  SIMGELER.forEach(function(s,i){ h += '<button class="cip" style="font-size:1.4rem;min-width:56px;justify-content:center" data-act="simge:'+ix+':'+i+'">'+s+'</button>'; });
  modalAc(h+'</div><div class="yigin"><button class="dg ikincil" data-act="modal:kapat">'+ka(T("kapat"))+'</button></div>');
}

function duraklat(){
  if(!A.d || A.d.status !== "playing" || A.duraklat) return;
  A.duraklat = true; A.kalanDuraklat = Motor.kalanMs(A.d); sayacDurdur();
  var kart = el("kart"); if(kart) kart.classList.add("gizli");
  modalAc('<h3>'+ka(T("duraklatildi"))+'</h3><p class="sessiz">'+ka(T("kart_gizli"))+'</p><div class="yigin">'+
    '<button class="dg" data-act="oyun:devamet">'+ka(T("devam"))+'</button>'+
    '<button class="dg ikincil" data-act="oyun:bitir">'+ka(T("oyunu_bitir"))+'</button>'+
    '<button class="dg ikincil" data-act="oyun:cik">'+ka(T("anamenu"))+'</button></div>');
}
function duraklatKaldir(){
  if(!A.duraklat) return;
  A.duraklat = false;
  A.d.turnEndsAt = Date.now() + A.kalanDuraklat;
  var kart = el("kart"); if(kart) kart.classList.remove("gizli");
  modalKapat(); sayacBasla();
}

function paylas(){
  var d = A.d, s = Motor.siralama(d);
  var metin = T("ad")+" — "+T("siralama")+"\n"+
    s.map(function(t,i){ return (i+1)+". "+t.icon+" "+t.name+" — "+t.score; }).join("\n");
  if(navigator.share){ navigator.share({text:metin}).catch(function(){}); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(metin).then(function(){ bilgi(T("sonuc_paylas"), T("kopyalandi")); },
      function(){ paylasModal(metin); });
    return;
  }
  paylasModal(metin);
}
function paylasModal(metin){
  modalAc('<h3>'+ka(T("sonuc_paylas"))+'</h3><textarea readonly>'+ka(metin)+'</textarea>'+
    '<div class="yigin"><button class="dg ikincil" data-act="modal:kapat">'+ka(T("kapat"))+'</button></div>');
}

/* ---------------------- Kaydırma hareketleri --------------------------- */
(function(){
  var x0 = null, y0 = null;
  document.addEventListener("touchstart", function(e){
    if(A.ekran !== "oyun" || !Ayar.kaydirma) return;
    var k = e.target.closest ? e.target.closest("#kartalan") : null; if(!k) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if(Math.abs(dx) < 60 && Math.abs(dy) < 60) return;
    if(Math.abs(dx) > Math.abs(dy)) eylem(dx > 0 ? "correct" : "forbidden");
    else if(dy > 0) eylem("pass");
  }, {passive:true});
})();

document.addEventListener("visibilitychange", function(){
  if(document.hidden && Ayar.otoDuraklat && A.d && A.d.status === "playing") duraklat();
});
document.addEventListener("keydown", function(e){
  if(A.ekran !== "oyun") return;
  if(e.key === "ArrowRight") eylem("correct");
  else if(e.key === "ArrowLeft") eylem("forbidden");
  else if(e.key === "ArrowDown") eylem("pass");
});

/* ------------------------------ Başlangıç ------------------------------ */
function baslat(){
  dilUygula();
  git("ana");
  var kayit = Depo.al(ANAHTAR.oyun, null);
  if(kayit && kayit.status && kayit.status !== "finished" && kayit.teams){
    modalAc('<h3>'+ka(T("devam_soru"))+'</h3><p class="sessiz">'+ka(T("devam_soru_a"))+'</p><div class="yigin">'+
      '<button class="dg" data-act="menu:devam">'+ka(T("devamet"))+'</button>'+
      '<button class="dg ikincil" data-act="modal:kapat">'+ka(T("yeniden"))+'</button></div>');
  }
}
window.__UI__ = {A:A, git:git, ciz:ciz, islemYap:islemYap, yeniKurulum:yeniKurulum,
  oyunuBaslat:function(){ oyunuBaslat(); }, kurAyarla:function(k){ Kur = k; }, kurAl:function(){ return Kur; },
  eylem:eylem, eylemUygula:eylemUygula, T:T, Ayar:Ayar, dilUygula:dilUygula};
baslat();
</script>
</body>
</html>
