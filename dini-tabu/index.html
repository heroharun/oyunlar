<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#F5EFE3">
<meta name="description" content="Dini Tabu - ayni telefondan cok takimli kelime oyunu. Reklamsiz, cevrim disi.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Dinî Tabu</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Din%C3%AE%20Tabu","short_name":"Tabu","start_url":".","display":"standalone","background_color":"%23F5EFE3","theme_color":"%23F5EFE3","orientation":"portrait"}'>
<style>
/* ===================== TASARIM JETONLARI ===================== */
:root{
  --parsomen:#F5EFE3;
  --parsomen-2:#EFE7D7;
  --murekkep:#10402C;
  --yesil:#2F6B4F;
  --yesil-acik:#E4EFE8;
  --altin:#C6A15B;
  --altin-koyu:#9A7735;
  --kart:#FFFCF6;
  --dogru:#2E7D4F;
  --pas:#C77D18;
  --yasak:#B03A2E;
  --bilgi:#3C6E91;
  --golge:0 2px 4px rgba(16,64,44,.06), 0 10px 24px rgba(16,64,44,.10);
  --golge-sm:0 1px 2px rgba(16,64,44,.08), 0 4px 10px rgba(16,64,44,.07);
  --r:18px;
  --r-lg:26px;
  --disp:"Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs:1;
  --hiz:1;
}
html[data-kontrast="1"]{
  --parsomen:#FFFFFF; --parsomen-2:#F2F2F2; --murekkep:#000000; --yesil:#0B4A2F;
  --altin:#7A5B12; --altin-koyu:#5A4209; --kart:#FFFFFF; --yesil-acik:#E8F1EC;
  --dogru:#0B5D31; --pas:#8A5300; --yasak:#8C1D13; --golge:0 0 0 2px #000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--ui);
  color:var(--murekkep);
  background:var(--parsomen);
  font-size:calc(16px * var(--fs));
  line-height:1.45;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
/* ince geometrik zemin — okunabilirligi bozmayacak yogunlukta */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    repeating-linear-gradient(45deg,rgba(198,161,91,.10) 0 1px,transparent 1px 22px),
    repeating-linear-gradient(-45deg,rgba(198,161,91,.10) 0 1px,transparent 1px 22px);
}
html[data-kontrast="1"] body::before{display:none}
#uygulama{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.ekran{display:none;flex-direction:column;min-height:100dvh;padding:
  max(14px,env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));}
.ekran.aktif{display:flex}
h1,h2,h3{font-family:var(--disp);font-weight:600;margin:0;letter-spacing:.01em}
p{margin:.4em 0}
.sessiz{color:#6B7B72;font-size:.86em;line-height:1.5}
html[data-kontrast="1"] .sessiz{color:#333}

/* ===================== DUGMELER ===================== */
button{font-family:inherit;font-size:1rem;color:inherit;cursor:pointer;border:0;background:none}
.dg{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:56px;padding:14px 18px;border-radius:14px;
  background:var(--yesil);color:#FFFCF6;font-weight:650;font-size:1.02rem;
  box-shadow:var(--golge-sm);width:100%;text-align:center;
  transition:transform calc(.12s * var(--hiz)),filter .12s;
}
.dg:active{transform:scale(.98)}
.dg.ikincil{background:var(--kart);color:var(--murekkep);border:1.5px solid rgba(16,64,44,.16)}
.dg.altin{background:linear-gradient(180deg,#D8B776,#C6A15B);color:#3A2C0B;border:1px solid var(--altin-koyu)}
.dg.hayalet{background:transparent;color:var(--yesil);box-shadow:none;min-height:48px}
.dg[disabled]{opacity:.42;pointer-events:none}
.dg.kucuk{min-height:44px;padding:10px 14px;font-size:.92rem;width:auto}
.satir{display:flex;gap:10px}
.satir>*{flex:1}
.yigin{display:flex;flex-direction:column;gap:10px}

/* ===================== BASLIK / UST BAR ===================== */
.ustbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:44px}
.ustbar h2{font-size:1.28rem;flex:1}
.geri{width:44px;height:44px;border-radius:12px;background:var(--kart);box-shadow:var(--golge-sm);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex:none}
html[dir="rtl"] .geri span{display:inline-block;transform:scaleX(-1)}

/* ===================== KUTU / LISTE ===================== */
.kutu{background:var(--kart);border-radius:var(--r);padding:16px;box-shadow:var(--golge-sm);margin-bottom:12px}
.kutu h3{font-size:1.05rem;margin-bottom:8px}
.etiket{display:block;font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--altin-koyu);margin-bottom:8px}
.secenekler{display:flex;flex-wrap:wrap;gap:8px}
.cip{
  min-height:44px;padding:10px 14px;border-radius:12px;background:var(--kart);
  border:1.5px solid rgba(16,64,44,.16);font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:6px;
}
.cip[aria-pressed="true"]{background:var(--yesil);color:#FFFCF6;border-color:var(--yesil)}
.cip[aria-pressed="true"] .tik::before{content:"✓ "}
input[type="text"],input[type="number"],select,textarea{
  font-family:inherit;font-size:1rem;width:100%;min-height:48px;padding:12px 14px;
  border-radius:12px;border:1.5px solid rgba(16,64,44,.18);background:#fff;color:var(--murekkep);
}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{
  outline:3px solid var(--altin);outline-offset:2px}
textarea{min-height:120px;font-family:var(--mono);font-size:.82rem}
label{font-size:.9rem;font-weight:600}

/* ===================== ANA EKRAN ===================== */
.kapak{text-align:center;padding:26px 0 10px}
.rozet{
  width:96px;height:96px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
  background:var(--kart);box-shadow:var(--golge);position:relative;
  clip-path:polygon(50% 0,71% 8.6%,80.7% 29.3%,100% 50%,80.7% 70.7%,71% 91.4%,50% 100%,29.3% 91.4%,19.3% 70.7%,0 50%,19.3% 29.3%,29.3% 8.6%);
}
.rozet b{font-family:var(--disp);font-size:2.1rem;color:var(--yesil)}
.kapak h1{font-size:2.05rem;letter-spacing:.02em}
.kapak .alt{font-size:.9rem;color:var(--altin-koyu);letter-spacing:.22em;text-transform:uppercase;margin-top:4px}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.menu .dg{justify-content:flex-start;padding-inline-start:20px}
.menu .em{font-size:1.25rem;width:28px;text-align:center}
.altmenu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.altmenu .dg{font-size:.95rem;min-height:52px}
.dipnot{margin-top:auto;padding-top:18px;text-align:center;font-size:.76rem;color:#7A8A80}

/* kısa ekranlarda menü tek ekrana sığsın */
@media(max-height:700px){
  .ekran{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .kapak{padding:8px 0 4px}
  .rozet{width:64px;height:64px;margin-bottom:8px}
  .rozet b{font-size:1.5rem}
  .kapak h1{font-size:1.6rem}
  .kapak .alt{font-size:.78rem;margin-top:2px}
  .menu{gap:7px;margin-top:12px}
  .menu .dg{min-height:48px;padding-top:10px;padding-bottom:10px}
  .altmenu{gap:7px;margin-top:7px}
  .altmenu .dg{min-height:46px}
  .dipnot{padding-top:8px}
}

/* ===================== KURULUM ===================== */
.adimlar{display:flex;gap:5px;margin-bottom:14px}
.adimlar i{height:5px;flex:1;background:rgba(16,64,44,.13);border-radius:3px}
.adimlar i.ok{background:var(--altin)}
.adimlar i.simdi{background:var(--yesil)}
.takimsatir{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.takimsatir .sim{width:52px;height:52px;flex:none;border-radius:14px;font-size:1.5rem;display:flex;
  align-items:center;justify-content:center;box-shadow:var(--golge-sm);background:var(--kart);border:2px solid transparent}
.takimsatir input{flex:1}
.ozet{list-style:none;padding:0;margin:0}
.ozet li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed rgba(16,64,44,.14)}
.ozet li:last-child{border-bottom:0}
.ozet b{font-weight:650;text-align:end}
.taban{margin-top:auto;padding-top:14px;display:flex;gap:10px}
.taban>*{flex:1}

/* ===================== DEVIR (GIZLILIK) EKRANI ===================== */
#ekran-devir{justify-content:center;align-items:center;text-align:center;background:var(--yesil);color:#FFFCF6}
#ekran-devir .sira{font-size:.82rem;letter-spacing:.24em;text-transform:uppercase;opacity:.75}
#ekran-devir h2{font-size:2rem;margin:8px 0 4px;color:#FFFCF6}
#ekran-devir .uyari{max-width:22rem;opacity:.85;margin-bottom:26px}
#ekran-devir .dg{max-width:22rem}
.devirsim{font-size:3.4rem;margin-bottom:6px}
.gerisayim{font-family:var(--disp);font-size:5.5rem;line-height:1;margin:10px 0 20px}

/* ===================== OYUN EKRANI ===================== */
#ekran-oyun{padding-top:max(10px,env(safe-area-inset-top))}
.oyunust{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.oyunust .tkm{flex:1;min-width:0}
.oyunust .tkm b{display:block;font-size:1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oyunust .tkm span{font-size:.78rem;color:#6B7B72}
.sayac{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:700;
  padding:6px 12px;border-radius:12px;background:var(--kart);box-shadow:var(--golge-sm);transition:all .2s}
.sayac.kritik{background:var(--yasak);color:#fff;font-size:1.9rem;animation:nabiz .9s infinite}
@keyframes nabiz{50%{transform:scale(1.06)}}
.duraklat{width:44px;height:44px;border-radius:12px;background:var(--kart);box-shadow:var(--golge-sm);
  display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex:none}
.gostergeler{display:flex;gap:8px;margin-bottom:10px;font-size:.82rem}
.gostergeler span{background:var(--yesil-acik);border-radius:10px;padding:6px 10px;font-weight:650}
.ilerle{height:6px;border-radius:4px;background:rgba(16,64,44,.12);overflow:hidden;margin-bottom:12px}
.ilerle i{display:block;height:100%;background:var(--altin);width:100%;transition:width .3s linear}

.kartalan{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.kart{
  width:100%;max-width:30rem;background:var(--kart);border-radius:var(--r-lg);
  box-shadow:var(--golge);padding:26px 20px 22px;text-align:center;position:relative;overflow:hidden;
  border:1px solid rgba(198,161,91,.4);
}
/* imza: sekiz kollu yildiz filigrani */
.kart::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.055;
  background:
   conic-gradient(from 0deg at 50% 42%, var(--yesil) 0 12.5%, transparent 0 25%, var(--yesil) 0 37.5%, transparent 0 50%, var(--yesil) 0 62.5%, transparent 0 75%, var(--yesil) 0 87.5%, transparent 0);
  -webkit-mask-image:radial-gradient(circle at 50% 42%, #000 34%, transparent 70%);
  mask-image:radial-gradient(circle at 50% 42%, #000 34%, transparent 70%);
}
.kart .kat{position:relative;z-index:1}
.kart .rutbe{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--altin-koyu);font-weight:700}
.kart .kelime{font-family:var(--disp);font-size:clamp(2.1rem,10vw,3.4rem);line-height:1.08;margin:10px 0 14px;word-break:break-word}
.ayrac{display:flex;align-items:center;gap:10px;margin:0 auto 12px;max-width:16rem;color:var(--altin)}
.ayrac i{flex:1;height:1px;background:currentColor;opacity:.6}
.ayrac b{font-size:.9rem}
.yasaklar{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.yasaklar li{font-size:clamp(1.02rem,4.6vw,1.28rem);font-weight:600;color:var(--yasak);letter-spacing:.01em}
html[data-kontrast="1"] .yasaklar li{color:#8C1D13}
.kart.gizli .kat{filter:blur(14px);opacity:.5}
.kart.cik-sag{transform:translateX(115%) rotate(7deg);opacity:0;transition:transform calc(.28s*var(--hiz)) ease-in,opacity calc(.28s*var(--hiz))}
.kart.cik-sol{transform:translateX(-115%) rotate(-7deg);opacity:0;transition:transform calc(.28s*var(--hiz)) ease-in,opacity calc(.28s*var(--hiz))}
.kart.cik-alt{transform:translateY(60%);opacity:0;transition:transform calc(.28s*var(--hiz)) ease-in,opacity calc(.28s*var(--hiz))}
.kart.gir{animation:gir calc(.3s*var(--hiz)) ease-out}
@keyframes gir{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}

.islemler{display:grid;grid-template-columns:1fr;gap:9px;margin-top:14px}
.islemler .ikili{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.eylem{min-height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:9px;
  font-weight:700;font-size:1.05rem;color:#FFFCF6;box-shadow:var(--golge-sm);transition:transform .1s}
.eylem:active{transform:scale(.97)}
.eylem .em{font-size:1.2rem}
.eylem.e-dogru{background:var(--dogru);min-height:68px;font-size:1.15rem}
.eylem.e-pas{background:var(--pas)}
.eylem.e-yasak{background:var(--yasak)}
.eylem[disabled]{opacity:.4;pointer-events:none}

/* ===================== SONUC / TABLO ===================== */
.tablo{width:100%;border-collapse:collapse;font-size:.94rem}
.tablo th,.tablo td{text-align:start;padding:9px 6px;border-bottom:1px solid rgba(16,64,44,.1)}
.tablo th{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--altin-koyu)}
.tablo td.sag{text-align:end;font-weight:700}
.rozetler{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.mini{background:var(--yesil-acik);border-radius:14px;padding:11px 12px}
.mini b{display:block;font-size:1.3rem;font-family:var(--disp)}
.mini span{font-size:.76rem;color:#4A5D53}
.siralama{list-style:none;padding:0;margin:0}
.siralama li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--kart);
  box-shadow:var(--golge-sm);margin-bottom:9px}
.siralama .no{width:30px;height:30px;border-radius:50%;background:var(--yesil-acik);display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex:none}
.siralama li.bir .no{background:var(--altin);color:#3A2C0B}
.siralama .ad{flex:1;font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.siralama .pn{font-family:var(--disp);font-size:1.4rem;font-weight:700}
.kupa{text-align:center;padding:8px 0 4px}
.kupa .em{font-size:3.2rem}
.kupa h2{font-size:1.9rem;margin-top:4px}

/* ===================== MODAL ===================== */
.perde{position:fixed;inset:0;background:rgba(16,64,44,.55);display:none;align-items:center;justify-content:center;
  padding:20px;z-index:50;backdrop-filter:blur(3px)}
.perde.acik{display:flex}
.modal{background:var(--kart);border-radius:var(--r-lg);padding:22px;max-width:26rem;width:100%;box-shadow:var(--golge);max-height:86dvh;overflow:auto}
.modal h3{font-size:1.35rem;margin-bottom:6px}
.modal .yigin{margin-top:16px}

/* ===================== NASIL OYNANIR ===================== */
.adim{display:flex;gap:14px;margin-bottom:16px}
.adim .say{width:34px;height:34px;flex:none;border-radius:50%;background:var(--yesil);color:#FFFCF6;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem}
.adim h3{font-size:1rem;margin-bottom:2px}
.ornek{background:var(--yesil-acik);border-radius:14px;padding:14px;text-align:center;margin:12px 0}
.ornek .k{font-family:var(--disp);font-size:1.7rem}
.ornek .y{color:var(--yasak);font-weight:600;font-size:.92rem;margin-top:6px}
.renkler{display:flex;gap:8px;flex-wrap:wrap}
.renkler span{padding:7px 11px;border-radius:10px;color:#fff;font-size:.86rem;font-weight:650}

/* ===================== ISTATISTIK / GECMIS ===================== */
.bosluk{text-align:center;padding:34px 16px;color:#6B7B72}
.bosluk .em{font-size:2.4rem;display:block;margin-bottom:8px}
.gecmis{background:var(--kart);border-radius:var(--r);padding:14px;box-shadow:var(--golge-sm);margin-bottom:10px}
.gecmis .tar{font-size:.76rem;color:#6B7B72}
.gecmis b{font-size:1.02rem}
.uyari-kutu{background:#FDF6E7;border:1px solid var(--altin);border-radius:14px;padding:12px 14px;font-size:.88rem;margin-bottom:12px}
.kaydir{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dil{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:640px){
  .ekran{max-width:44rem;margin:0 auto;width:100%}
  .rozetler{grid-template-columns:repeat(4,1fr)}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
html[data-animasyon="0"] *{animation:none !important;transition:none !important}

/* ===================== BOT MODU ===================== */
.bot-balon{position:relative;background:var(--yesil-acik);border:1px solid rgba(47,107,79,.28);
  border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.bot-balon .bav{font-size:1.8rem;flex:none;line-height:1.2}
.bot-balon .bic{flex:1;min-width:0}
.bot-balon .bad{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--altin-koyu)}
.bot-ipucular{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bot-ipucular span{background:var(--kart);border:1px solid var(--altin);border-radius:10px;
  padding:5px 10px;font-weight:700;color:var(--altin-koyu);font-size:.95rem}
.bot-secenek{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.bot-secenek button{min-height:52px;border-radius:12px;background:var(--kart);
  border:1.5px solid rgba(16,64,44,.16);font-weight:650;font-size:.96rem;padding:8px;
  box-shadow:var(--golge-sm);transition:transform .1s;word-break:break-word}
.bot-secenek button:active{transform:scale(.97)}
.bot-secenek button.dogruIsaret{background:var(--dogru);color:#FFFCF6;border-color:var(--dogru)}
.bot-secenek button.yanlisIsaret{background:var(--yasak);color:#FFFCF6;border-color:var(--yasak)}
.bot-zorluk{width:100%;justify-content:flex-start !important;margin-bottom:8px;min-height:60px;text-align:start}
.bot-avatar{width:96px;height:96px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
  font-size:3rem;background:var(--kart);border-radius:50%;box-shadow:var(--golge);border:2px solid var(--altin)}
.bot-avatar.dusun{animation:dusun 1.4s ease-in-out infinite}
@keyframes dusun{50%{transform:rotate(6deg) scale(1.05)}}
.simskor{display:flex;justify-content:center;gap:14px;margin:10px 0}
.simskor .mini{min-width:96px;text-align:center}
.sallan{animation:sallan .5s}
@keyframes sallan{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.konf{position:absolute;width:8px;height:13px;top:-16px;border-radius:2px;pointer-events:none;z-index:6;
  animation:konf .95s ease-in forwards}
@keyframes konf{to{transform:translateY(65vh) rotate(560deg);opacity:0}}
.gizle{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="uygulama"></div>
<div class="perde" id="perde" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<script>
/* =========================================================================
   DİNÎ TABU — tek dosya, çevrim dışı, bağımlılıksız
   Bölüm 1: Dil (i18n)
   ========================================================================= */
"use strict";
var DILLER = ["tr","en","ar","fr"];
var DIL_ADI = {tr:"Türkçe", en:"English", ar:"العربية", fr:"Français"};
var RTL = {ar:true};

/* ------------------------------- Ses ----------------------------------- */
var Ses = (function(){
  var ctx = null;
  function ac(){
    if(!Ayar.ses) return null;
    try{
      if(!ctx){ var C = window.AudioContext || window.webkitAudioContext; if(!C) return null; ctx = new C(); }
      if(ctx.state === "suspended") ctx.resume();
      return ctx;
    }catch(e){ return null; }
  }
  function ton(f, sure, tip, ses){
    var c = ac(); if(!c) return;
    try{
      var o = c.createOscillator(), g = c.createGain();
      o.type = tip || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(ses||0.12, c.currentTime+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+sure);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+sure+0.02);
    }catch(e){}
  }
  function tit(p){ try{ if(Ayar.titresim && navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  return {
    dogru:function(){ ton(660,.12,"sine"); setTimeout(function(){ton(880,.16,"sine");},95); tit(28); },
    pas:function(){ ton(392,.14,"triangle"); tit(18); },
    yasak:function(){ ton(180,.22,"square",.09); tit([40,60,40]); },
    tik:function(){ ton(520,.06,"sine",.06); },
    basla:function(){ ton(523,.12); setTimeout(function(){ton(659,.12);},120); setTimeout(function(){ton(784,.2);},240); tit(30); },
    gerisayim:function(){ ton(880,.07,"sine",.08); tit(12); },
    bitis:function(){ ton(392,.18,"sine"); setTimeout(function(){ton(294,.34,"sine");},170); tit([60,80,120]); },
    zafer:function(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ton(f,.24);}, i*140); }); tit([50,60,50,60,110]); },
    tur:function(){ ton(587,.14); setTimeout(function(){ton(784,.18);},130); }
  };
})();

/* --------------------------- Kart havuzu ------------------------------- */
function ozelKartlar(){ return Depo.al(ANAHTAR.ozel, []); }

function kartCoz(sat, dil, kat, zor, ix){
  var p = sat.split("|");
  var yas = p[1] ? p[1].split(",") : [];
  return {
    id: dil+"-"+kat+"-"+zor+"-"+ix,
    word: p[0].trim(),
    forbiddenWords: yas.map(function(x){return x.trim();}).filter(Boolean),
    category: kat, difficulty: zor==="e"?"easy":(zor==="m"?"medium":"hard"),
    ageGroup: zor==="e"?"children":"general", enabled:true, sourceStatus:"approved"
  };
}

/** Seçilen dil + kategoriler için tüm kartları döndürür. */
function havuzKur(dil, katlar){
  var liste = [], veri = KARTLAR[dil] || KARTLAR.tr;
  katlar.forEach(function(kat){
    if(kat === "ozel"){
      ozelKartlar().forEach(function(k,i){
        if(k.enabled === false) return;
        liste.push({id:"ozel-"+i, word:k.word, forbiddenWords:k.forbiddenWords, category:"ozel",
          difficulty:k.difficulty||"medium", ageGroup:"general", enabled:true, sourceStatus:"draft"});
      });
      return;
    }
    var g = veri[kat]; if(!g) return;
    ["e","m","h"].forEach(function(z){
      (g[z]||[]).forEach(function(sat,i){ liste.push(kartCoz(sat, dil, kat, z, i)); });
    });
  });
  return liste;
}

function karistir(a, rnd){
  var d = a.slice(), r = rnd || Math.random;
  for(var i=d.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=d[i]; d[i]=d[j]; d[j]=t; }
  return d;
}

/**
 * Zorluk dağılımını (%50 kolay, %35 orta, %15 zor) tekrarlayan bir örüntüyle
 * uygular; böylece her takıma benzer zorlukta kartlar düşer.
 */
var ORUNTU = ["easy","easy","medium","easy","medium","hard","easy","medium","easy","medium",
              "easy","easy","medium","hard","easy","medium","easy","medium","easy","hard"];
function desteKur(havuz, rnd){
  var kova = {easy:[], medium:[], hard:[]};
  karistir(havuz, rnd).forEach(function(k){ (kova[k.difficulty]||kova.medium).push(k); });
  var deste = [], i = 0, toplam = havuz.length;
  while(deste.length < toplam){
    var istek = ORUNTU[i % ORUNTU.length]; i++;
    var k = kova[istek].shift();
    if(!k){
      k = kova.easy.shift() || kova.medium.shift() || kova.hard.shift();
      if(!k) break;
    }
    deste.push(k);
  }
  return deste;
}

/* ----------------------------- Oyun motoru ----------------------------- */
var PUANLAMA = {
  standart:{correct:1, pass:0, forbidden:-1},
  rahat:{correct:1, pass:0, forbidden:0},
  rekabet:{correct:2, pass:0, forbidden:-1},
  zor:{correct:1, pass:-1, forbidden:-2}
};

var Motor = {
  /** Yeni oyun durumu üretir. deste: kart nesneleri dizisi */
  kur: function(ayarlar, takimlar, deste){
    var t = takimlar.map(function(x,i){
      return {id:x.id||("t"+i), name:x.name, playerNames:x.playerNames||[], icon:x.icon||"⭐",
        color:x.color||"#2F6B4F", score:0, correctCount:0, passCount:0, forbiddenCount:0,
        streak:0, bestStreak:0};
    });
    return {
      id:"g"+Date.now(), status:"handover", teams:t, currentTeamIndex:0, currentRound:1,
      deck:deste, deckIndex:0, currentCardId:null, remainingPasses:null,
      turnStartedAt:null, turnEndsAt:null, playedCards:[], turnLog:[],
      settings:ayarlar, lastActionAt:0, kilit:false, bitis:null, altin:null, baslangic:Date.now()
    };
  },

  aktifTakim: function(d){ return d.teams[d.currentTeamIndex]; },

  kartBul: function(d, id){
    for(var i=0;i<d.deck.length;i++) if(d.deck[i].id===id) return d.deck[i];
    return null;
  },

  /** Desteden yeni kart çeker; havuz bittiyse null döner. */
  kartCek: function(d){
    if(d.deckIndex >= d.deck.length){ d.currentCardId = null; return null; }
    var k = d.deck[d.deckIndex++];
    d.currentCardId = k.id;
    return k;
  },

  turBasla: function(d, simdi){
    simdi = simdi || Date.now();
    d.remainingPasses = (d.settings.passLimit === null || d.settings.passLimit === undefined)
      ? null : d.settings.passLimit;
    d.turnStartedAt = simdi;
    d.turnEndsAt = simdi + d.settings.turnDurationSeconds*1000;
    d.turnLog = [];
    d.status = "playing";
    d.lastActionAt = 0;
    d.teams[d.currentTeamIndex].streak = 0;
    return Motor.kartCek(d);
  },

  kalanMs: function(d, simdi){
    if(!d.turnEndsAt) return d.settings.turnDurationSeconds*1000;
    return Math.max(0, d.turnEndsAt - (simdi || Date.now()));
  },

  /**
   * Doğru / pas / yasaklı işlemini uygular.
   * Dönen: {ok, sebep, puan, bittiTur, bittiOyun, havuzBitti}
   */
  islem: function(d, sonuc, simdi){
    simdi = simdi || Date.now();
    if(d.status !== "playing") return {ok:false, sebep:"durum"};
    if(Motor.kalanMs(d, simdi) <= 0){ Motor.turBitir(d); return {ok:false, sebep:"sure", bittiTur:true}; }
    if(simdi - d.lastActionAt < 280) return {ok:false, sebep:"cift"};
    if(sonuc === "pass" && d.remainingPasses === 0) return {ok:false, sebep:"pasyok"};
    if(!d.currentCardId) return {ok:false, sebep:"kartyok"};

    var tk = d.teams[d.currentTeamIndex], p = d.settings.scoring, puan = 0;
    if(sonuc === "correct"){ puan = p.correct; tk.correctCount++; tk.streak++;
      if(tk.streak > tk.bestStreak) tk.bestStreak = tk.streak; }
    else if(sonuc === "pass"){ puan = p.pass; tk.passCount++; tk.streak = 0;
      if(d.remainingPasses !== null) d.remainingPasses--; }
    else { tk.forbiddenCount++; tk.streak = 0;
      puan = (d.settings.penalty === "cancel" || d.settings.penalty === "none") ? 0 : p.forbidden; }

    tk.score += puan;
    if(!d.settings.allowNegativeScore && tk.score < 0) tk.score = 0;

    var kayit = {cardId:d.currentCardId, teamId:tk.id, roundNumber:d.currentRound, result:sonuc,
      responseTimeMs: simdi - (d.lastActionAt || d.turnStartedAt || simdi), puan:puan};
    d.playedCards.push(kayit); d.turnLog.push(kayit);
    d.lastActionAt = simdi;

    var yeni = Motor.kartCek(d);
    var cvp = {ok:true, puan:puan, havuzBitti:!yeni};

    var kartHedef = d.settings.cardsPerTurn;
    if(kartHedef && d.turnLog.length >= kartHedef){ Motor.turBitir(d); cvp.bittiTur = true; }
    if(d.settings.targetScore && tk.score >= d.settings.targetScore){
      Motor.turBitir(d); cvp.bittiTur = true; cvp.bittiOyun = true; d.bitis = "hedef";
    }
    if(!yeni && !cvp.bittiTur){ Motor.turBitir(d); cvp.bittiTur = true; }
    return cvp;
  },

  turBitir: function(d){
    if(d.status === "playing"){ d.status = "turn-result"; d.currentCardId = null; }
  },

  /** Tur özetinden sonra sırayı ilerletir. */
  sonraki: function(d){
    d.currentTeamIndex++;
    if(d.currentTeamIndex >= d.teams.length){ d.currentTeamIndex = 0; d.currentRound++; }
    d.status = Motor.oyunBittiMi(d) ? "finished" : "handover";
    return d.status;
  },

  oyunBittiMi: function(d){
    if(d.bitis) return true;
    if(d.settings.targetScore){
      for(var i=0;i<d.teams.length;i++) if(d.teams[i].score >= d.settings.targetScore){ d.bitis = "hedef"; return true; }
    }
    if(d.settings.roundCount && d.currentRound > d.settings.roundCount){ d.bitis = "tur"; return true; }
    if(d.deckIndex >= d.deck.length && d.currentCardId === null && d.status !== "playing"){
      // havuz bittiyse ancak tur sırası başa döndüyse bitir
      if(d.currentTeamIndex === 0 && d.deck.length > 0 && d.deckIndex >= d.deck.length){ d.bitis = "havuz"; return true; }
    }
    return false;
  },

  siralama: function(d){
    return d.teams.slice().sort(function(a,b){
      if(b.score !== a.score) return b.score - a.score;
      if(b.correctCount !== a.correctCount) return b.correctCount - a.correctCount;
      return a.forbiddenCount - b.forbiddenCount;
    });
  },

  /** Zirvede eşitlik varsa eşit takımları döndürür, yoksa boş dizi. */
  esitler: function(d){
    var s = Motor.siralama(d);
    if(s.length < 2 || s[0].score !== s[1].score) return [];
    return s.filter(function(t){ return t.score === s[0].score; });
  },

  turOzeti: function(d){
    var o = {correct:0, pass:0, forbidden:0, puan:0};
    d.turnLog.forEach(function(k){ o[k.result]++; o.puan += k.puan; });
    return o;
  },

  desteYenile: function(d, rnd){
    var oynanan = {};
    d.playedCards.forEach(function(k){ oynanan[k.cardId] = true; });
    d.deck = karistir(d.deck, rnd);
    d.deckIndex = 0;
    return d.deck.length;
  }
};

/* ------------------------- İstatistik & geçmiş ------------------------- */
function istatistikAl(){ return Depo.al(ANAHTAR.ist, {takimlar:{}, kartlar:{}, oyun:0}); }
function istatistikKaydet(d){
  var ist = istatistikAl();
  ist.oyun = (ist.oyun||0) + 1;
  var kazanan = Motor.siralama(d)[0];
  d.teams.forEach(function(t){
    var k = ist.takimlar[t.name] || {oyun:0, kazanma:0, dogru:0, pas:0, yasak:0, enYuksek:0, seri:0};
    k.oyun++; if(kazanan && t.id === kazanan.id) k.kazanma++;
    k.dogru += t.correctCount; k.pas += t.passCount; k.yasak += t.forbiddenCount;
    if(t.score > k.enYuksek) k.enYuksek = t.score;
    if(t.bestStreak > k.seri) k.seri = t.bestStreak;
    ist.takimlar[t.name] = k;
  });
  d.playedCards.forEach(function(p){
    var kart = Motor.kartBul(d, p.cardId); if(!kart) return;
    var k = ist.kartlar[kart.word] || {gosterim:0, dogru:0, pas:0, yasak:0, sure:0};
    k.gosterim++; k[p.result==="correct"?"dogru":(p.result==="pass"?"pas":"yasak")]++;
    k.sure += Math.min(p.responseTimeMs||0, 120000);
    ist.kartlar[kart.word] = k;
  });
  Depo.yaz(ANAHTAR.ist, ist);

  var g = Depo.al(ANAHTAR.gecmis, []);
  g.unshift({
    tarih: Date.now(), takimlar: d.teams.map(function(t){ return {ad:t.name, puan:t.score, sim:t.icon}; }),
    kazanan: kazanan ? kazanan.name : "", tur: d.currentRound-1,
    sure: Math.round((Date.now() - (d.baslangic||Date.now()))/1000),
    paket: (d.settings.categories||[]).length
  });
  Depo.yaz(ANAHTAR.gecmis, g.slice(0,20));
}

    anahtarSatir(T("animasyon"), Ayar.animasyon, "ayar:tik:animasyon")+
    '</div>';

  h += '<div class="kutu"><span class="etiket">'+ka(T("yazi_boyutu"))+'</span><div class="secenekler">';
  [[0.9,"kucuk"],[1,"normal"],[1.15,"buyuk"],[1.3,"cokbuyuk"]].forEach(function(x){
    h += '<button class="cip" aria-pressed="'+(Ayar.yaziBoyutu===x[0])+'" data-act="ayar:fs:'+x[0]+'">'+ka(T(x[1]))+'</button>';
  });
  h += '</div>'+ anahtarSatir(T("kontrast"), Ayar.kontrast, "ayar:tik:kontrast") +'</div>';

  h += '<div class="kutu">'+
    anahtarSatir(T("hakem_mod"), Ayar.hakemModu, "ayar:tik:hakemModu", T("hakem_mod_a"))+
    anahtarSatir(T("otomatik_duraklat"), Ayar.otoDuraklat, "ayar:tik:otoDuraklat")+
    anahtarSatir(T("negatif"), Ayar.negatif, "ayar:tik:negatif")+
    '</div>';

  h += '<div class="kutu"><p class="sessiz">'+ka(T("gizlilik"))+'</p>'+
    '<button class="dg ikincil" data-act="ayar:sifirla">'+ka(T("sifirla"))+'</button></div>';
  return h+'</div>';
}
</script>
<script>
/* ----------------------------- Kurulum --------------------------------- */
function yeniKurulum(hizli){
  var adlar = TAKIM_ADI[Ayar.dil] || TAKIM_ADI.tr;
  var t = [];
  var kalip = TAKIM_KALIP[Ayar.dil] || TAKIM_KALIP.tr;
  for(var i=0;i<8;i++) t.push({id:"t"+i, name:kalip.replace("{a}", adlar[i]), icon:TAKIM_SIM[i],
    color:TAKIM_RENK[i], playerNames:[]});
  return {
    adim:1, hizli:!!hizli, takimSayisi:2, takimlar:t,
    katlar: hizli ? KAT_SIRA.slice() : ["temel","ibadet","peygamber","ahlak"],
    yas:"general", mod:"round", sure:120, kartSayisi:3, turSayisi:6, hedef:30,
    pas:2, ceza:"minus", puanlama:"standart"
  };
}

function adimGosterge(){
  var h = '<div class="adimlar">';
  for(var i=1;i<=8;i++) h += '<i class="'+(i<Kur.adim?"ok":(i===Kur.adim?"simdi":""))+'"></i>';
  return h+'</div>';
}
function cipler(secenekler, secili, act, tam){
  var h = '<div class="secenekler">';
  secenekler.forEach(function(o){
    h += '<button class="cip"'+(tam?' style="flex:1 1 42%;justify-content:center"':'')+
      ' aria-pressed="'+(String(secili)===String(o[0]))+'" data-act="'+act+':'+o[0]+'">'+ka(o[1])+'</button>';
  });
  return h+'</div>';
}

function kartSayisiHesap(){
  var h = havuzKur(Ayar.dil, Kur.katlar);
  if(Kur.yas === "children") h = h.filter(function(k){ return k.difficulty === "easy"; });
  if(Kur.yas === "adult") h = h.filter(function(k){ return k.difficulty !== "easy"; });
  return h.length;
}

function ekranKurulum(){
  var h = '<div class="ekran aktif"><div class="ustbar">'+
    '<button class="geri" data-act="kur:geri" aria-label="'+ka(T("geri"))+'"><span>←</span></button>'+
    '<h2>'+ka(T("a"+Kur.adim))+'</h2></div>'+ adimGosterge();
  h += '<p class="sessiz" style="margin-bottom:14px">'+ka(T("a"+Kur.adim+"a"))+'</p>';

  if(Kur.adim === 1){
    h += '<div class="kutu"><span class="etiket">'+ka(T("takimlar"))+'</span><div class="secenekler">';
    for(var i=2;i<=8;i++)
      h += '<button class="cip" style="min-width:56px;justify-content:center" aria-pressed="'+(Kur.takimSayisi===i)+'" data-act="kur:takimsayi:'+i+'">'+i+'</button>';
    h += '</div></div>';
  }

  if(Kur.adim === 2){
    h += '<div class="kutu">';
    for(var j=0;j<Kur.takimSayisi;j++){
      var t = Kur.takimlar[j];
      h += '<div class="takimsatir">'+
        '<button class="sim" data-act="kur:simge:'+j+'" style="border-color:'+t.color+'" aria-label="'+ka(T("takim"))+' '+(j+1)+'">'+t.icon+'</button>'+
        '<input type="text" value="'+ka(t.name)+'" data-alan="ad" data-ix="'+j+'" maxlength="24" aria-label="'+ka(T("takimadi"))+'"></div>'+
        '<input type="text" value="'+ka((t.playerNames||[]).join(", "))+'" data-alan="oyuncu" data-ix="'+j+'" placeholder="'+ka(T("oyuncu_ph"))+'" aria-label="'+ka(T("oyuncular"))+'" style="margin-bottom:14px">';
    }
    h += '</div>';
  }

  if(Kur.adim === 3){
    h += '<div class="kutu"><span class="etiket">'+ka(T("kategoriler"))+'</span><div class="secenekler">';
    KAT_SIRA.forEach(function(kt){
      var s = Kur.katlar.indexOf(kt) > -1;
      h += '<button class="cip" style="flex:1 1 46%" aria-pressed="'+s+'" data-act="kur:kat:'+kt+'">'+
        '<span>'+KAT_AD[kt].em+'</span><span class="tik">'+ka(KAT_AD[kt][Ayar.dil]||KAT_AD[kt].tr)+'</span></button>';
    });
    if(ozelKartlar().length){
      var so = Kur.katlar.indexOf("ozel") > -1;
      h += '<button class="cip" style="flex:1 1 46%" aria-pressed="'+so+'" data-act="kur:kat:ozel"><span>⭐</span><span class="tik">'+ka(T("ozel_paket"))+'</span></button>';
    }
    h += '</div><div class="satir" style="margin-top:10px">'+
      '<button class="dg hayalet kucuk" data-act="kur:kattumu">'+ka(T("tumu"))+'</button>'+
      '<button class="dg hayalet kucuk" data-act="kur:kathic">'+ka(T("hicbiri"))+'</button></div></div>';
    h += '<div class="kutu"><span class="etiket">'+ka(T("zorluk"))+'</span>'+
      cipler([["children",T("z_cocuk")],["general",T("z_genel")],["adult",T("z_uzman")]], Kur.yas, "kur:yas", true)+
      '<p class="sessiz" style="margin-top:8px">'+ka(Kur.yas==="children"?T("z_cocuk_a"):(Kur.yas==="adult"?T("z_uzman_a"):T("a3a")))+'</p>'+
      '<p class="sessiz"><b>'+ka(T("hazir_kart",{n:kartSayisiHesap()}))+'</b></p></div>';
  }

  if(Kur.adim === 4){
    var modlar = [["timed","mod_sureli"],["card-count","mod_kart"],["round","mod_tur"],["target-score","mod_hedef"]];
    h += '<div class="kutu">';
    modlar.forEach(function(m){
      h += '<button class="cip" style="width:100%;justify-content:flex-start;margin-bottom:8px;min-height:56px" aria-pressed="'+(Kur.mod===m[0])+'" data-act="kur:mod:'+m[0]+'">'+
        '<span style="display:block"><b>'+ka(T(m[1]))+'</b><br><small style="opacity:.75">'+ka(T(m[1]+"_a"))+'</small></span></button>';
    });
    h += '</div>';
  }

  if(Kur.adim === 5){
    h += '<div class="kutu"><span class="etiket">'+ka(T("sure"))+'</span>'+
      cipler([[30,"30 "+T("sn")],[45,"45 "+T("sn")],[60,"60 "+T("sn")],[90,"90 "+T("sn")],[120,"120 "+T("sn")],[180,"180 "+T("sn")]], Kur.sure, "kur:sure", true)+'</div>';
    if(Kur.mod === "card-count" || Kur.mod === "timed")
      h += '<div class="kutu"><span class="etiket">'+ka(T("turbasi_kart"))+'</span>'+
        cipler([[3,"3"],[5,"5"],[7,"7"],[10,"10"],[0,T("sinirsiz")]], (Kur.kartSayisi||0), "kur:kart", true)+'</div>';
    if(Kur.mod !== "target-score")
      h += '<div class="kutu"><span class="etiket">'+ka(T("tur_sayisi"))+'</span>'+
        cipler([[2,"2"],[4,"4"],[6,"6"],[8,"8"],[10,"10"]], Kur.turSayisi, "kur:turs", true)+'</div>';
    if(Kur.mod === "round")
      h += '<div class="kutu"><span class="etiket">'+ka(T("turbasi_kart"))+'</span>'+
        cipler([[3,"3"],[5,"5"],[7,"7"],[0,T("sinirsiz")]], (Kur.kartSayisi||0), "kur:kart", true)+'</div>';
    if(Kur.mod === "target-score")
      h += '<div class="kutu"><span class="etiket">'+ka(T("hedef_puan"))+'</span>'+
        cipler([[10,"10"],[20,"20"],[30,"30"],[50,"50"]], Kur.hedef, "kur:hedef", true)+'</div>';
  }

  if(Kur.adim === 6){
    h += '<div class="kutu">'+cipler([[0,T("pas_yok")],[1,T("pas_n",{n:1})],[2,T("pas_n",{n:2})],
      [3,T("pas_n",{n:3})],[-1,T("pas_sinirsiz")]], Kur.pas, "kur:pas", true)+'</div>';
  }

  if(Kur.adim === 7){
    h += '<div class="kutu"><span class="etiket">'+ka(T("ceza"))+'</span>'+
      cipler([["minus",T("ceza_eksi")],["cancel",T("ceza_iptal")],["none",T("ceza_yok")]], Kur.ceza, "kur:ceza", true)+'</div>';
    h += '<div class="kutu"><span class="etiket">'+ka(T("puanlama"))+'</span>'+
      cipler([["standart",T("p_standart")],["rahat",T("p_rahat")],["rekabet",T("p_rekabet")],["zor",T("p_zor")]], Kur.puanlama, "kur:puanlama", true)+'</div>';
  }

  if(Kur.adim === 8){
    var kn = kartSayisiHesap();
    var satir = function(a,b){ return '<li><span>'+ka(a)+'</span><b>'+ka(b)+'</b></li>'; };
    h += '<div class="kutu"><ul class="ozet">'+
      satir(T("takimlar"), Kur.takimlar.slice(0,Kur.takimSayisi).map(function(t){return t.icon+" "+t.name;}).join(" · "))+
      satir(T("a4"), T({timed:"mod_sureli","card-count":"mod_kart",round:"mod_tur","target-score":"mod_hedef"}[Kur.mod]))+
      satir(T("sure"), Kur.sure+" "+T("sn"))+
      (Kur.mod!=="target-score"?satir(T("tur_sayisi"), Kur.turSayisi):"")+
      (Kur.mod==="target-score"?satir(T("hedef_puan"), Kur.hedef):"")+
      satir(T("turbasi_kart"), Kur.kartSayisi ? Kur.kartSayisi : T("sinirsiz"))+
      satir(T("a6"), Kur.pas===-1?T("pas_sinirsiz"):(Kur.pas===0?T("pas_yok"):T("pas_n",{n:Kur.pas})))+
      satir(T("ceza"), {minus:T("ceza_eksi"),cancel:T("ceza_iptal"),none:T("ceza_yok")}[Kur.ceza])+
      satir(T("puanlama"), T({standart:"p_standart",rahat:"p_rahat",rekabet:"p_rekabet",zor:"p_zor"}[Kur.puanlama]))+
      satir(T("kategoriler"), Kur.katlar.map(function(k){return (KAT_AD[k]||{})[Ayar.dil]||k;}).join(", "))+
      satir(T("kart_havuzu"), T("hazir_kart",{n:kn}))+
      '</ul></div>';
    if(kn < Kur.takimSayisi*6) h += '<div class="uyari-kutu">'+ka(T("kart_yetersiz"))+'</div>';
  }

  h += '<div class="taban">';
  if(Kur.adim > 1) h += '<button class="dg ikincil" data-act="kur:geri">'+ka(T("geri"))+'</button>';
  var sonAdim = (Kur.adim===8) || (Kur.hizli && Kur.adim===2);
  h += '<button class="dg" data-act="kur:ileri">'+ka(sonAdim?T("simdibasla"):T("ileri"))+'</button></div>';
  return h+'</div>';
}

function kurulumOku(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-alan]"), function(g){
    var ix = +g.getAttribute("data-ix");
    if(g.getAttribute("data-alan") === "ad"){
      var v = g.value.trim(); if(v) Kur.takimlar[ix].name = v;
    } else {
      Kur.takimlar[ix].playerNames = g.value.split(",").map(function(x){return x.trim();}).filter(Boolean);
    }
  });
}

function oyunuBaslat(){
  var havuz = havuzKur(Ayar.dil, Kur.katlar);
  if(Kur.yas === "children") havuz = havuz.filter(function(k){ return k.difficulty === "easy"; });
  if(Kur.yas === "adult") havuz = havuz.filter(function(k){ return k.difficulty !== "easy"; });
  if(!havuz.length){ bilgi(T("kart_yetersiz"), T("en_az_1_kat")); return; }
  if(Kur.yas === "children") havuz = havuz.map(function(k){
    return Object.assign({}, k, {forbiddenWords:k.forbiddenWords.slice(0,3)}); });

  var deste = desteKur(havuz);
  var ayarlar = {
    teamCount: Kur.takimSayisi,
    roundCount: Kur.mod === "target-score" ? null : Kur.turSayisi,
    cardsPerTurn: Kur.kartSayisi ? Kur.kartSayisi : null,
    turnDurationSeconds: Kur.sure,
    passLimit: Kur.pas === -1 ? null : Kur.pas,
    categories: Kur.katlar.slice(),
    scoring: PUANLAMA[Kur.puanlama],
    penalty: Kur.ceza,
    allowNegativeScore: Ayar.negatif,
    gameMode: Kur.mod,
    targetScore: Kur.mod === "target-score" ? Kur.hedef : null,
    yas: Kur.yas, dil: Ayar.dil
  };
  A.sonKurulum = JSON.parse(JSON.stringify(Kur));
  A.d = Motor.kur(ayarlar, Kur.takimlar.slice(0, Kur.takimSayisi), deste);
  oyunKaydet();
  git("devir");
}

function oyunKaydet(){ if(A.d) Depo.yaz(ANAHTAR.oyun, A.d); }

/* ------------------------- Devir (gizlilik) ---------------------------- */
function ekranDevir(){
  var t = Motor.aktifTakim(A.d);
  var turBilgi = A.d.settings.roundCount ? (T("tur")+" "+A.d.currentRound+"/"+A.d.settings.roundCount)
                                         : (T("tur")+" "+A.d.currentRound);
  var h = '<div class="ekran aktif" id="ekran-devir">';
  if(A.gerisayim !== 0){
    h += '<div class="gerisayim" aria-live="assertive">'+ka(A.gerisayim>0?A.gerisayim:T("gerisayim_basla"))+'</div>';
  } else {
    h += '<div class="sira">'+ka(turBilgi)+'</div>'+
      '<div class="devirsim">'+t.icon+'</div>'+
      '<h2>'+ka(t.name)+'</h2>'+
      '<p class="uyari">'+ka(T("telefonu_al"))+'</p>'+
      '<button class="dg altin" data-act="oyun:hazir">'+ka(T("hazirim"))+'</button>'+
      '<button class="dg hayalet" style="color:#FFFCF6;margin-top:10px" data-act="oyun:cik">'+ka(T("anamenu"))+'</button>';
  }
  return h+'</div>';
}

/* --------------------------- Oyun ekranı ------------------------------- */
function kartHtml(){
  var d = A.d, k = d.currentCardId ? Motor.kartBul(d, d.currentCardId) : null;
  if(!k) return '<div class="kart" id="kart"><div class="kat"><div class="kelime">—</div></div></div>';
  var kat = KAT_AD[k.category] || {};
  return '<div class="kart gir" id="kart" role="group" aria-live="polite"><div class="kat">'+
    '<div class="rutbe">'+ka((kat[Ayar.dil]||kat.tr||"")) +'</div>'+
    '<div class="kelime">'+ka(k.word)+'</div>'+
    '<div class="ayrac"><i></i><b>'+ka(T("yasakli_kelimeler"))+'</b><i></i></div>'+
    '<ul class="yasaklar">'+k.forbiddenWords.map(function(y){return '<li>'+ka(y)+'</li>';}).join("")+'</ul>'+
    '</div></div>';
}

function ekranOyun(){
  var d = A.d, t = Motor.aktifTakim(d);
  var pasMetin = d.remainingPasses === null ? "∞" : d.remainingPasses;
  var turBilgi = d.settings.roundCount ? (d.currentRound+"/"+d.settings.roundCount) : d.currentRound;
  var h = '<div class="ekran aktif" id="ekran-oyun">';
  h += '<div class="oyunust"><div class="tkm"><b>'+t.icon+' '+ka(t.name)+'</b>'+
    '<span>'+ka(T("tur"))+' '+ka(turBilgi)+'</span></div>'+
    '<div class="sayac" id="sayac" role="timer" aria-live="off">'+suSaniye(Motor.kalanMs(d))+'</div>'+
    '<button class="duraklat" data-act="oyun:duraklat" aria-label="'+ka(T("duraklatildi"))+'">❚❚</button></div>';
  h += '<div class="gostergeler"><span>'+ka(T("puan"))+': <b id="gpuan">'+t.score+'</b></span>'+
    '<span>'+ka(T("pas_kalan"))+': <b id="gpas">'+pasMetin+'</b></span>'+
    (d.settings.cardsPerTurn?'<span>🃏 <b id="gkart">'+d.turnLog.length+'/'+d.settings.cardsPerTurn+'</b></span>':'')+
    '</div><div class="ilerle"><i id="ilerle"></i></div>';
  h += '<div class="kartalan" id="kartalan">'+kartHtml()+'</div>';
  h += '<div class="islemler">'+
    '<button class="eylem e-dogru" data-act="oyun:dogru"><span class="em">✓</span>'+ka(T("dogru"))+'</button>'+
    '<div class="ikili">'+
      '<button class="eylem e-pas" id="dgpas" data-act="oyun:pas"'+(d.remainingPasses===0?" disabled":"")+'><span class="em">→</span>'+ka(T("pas"))+'</button>'+
      '<button class="eylem e-yasak" data-act="oyun:yasak"><span class="em">✕</span>'+ka(T("yasak"))+'</button>'+
    '</div></div>';
  return h+'</div>';
}

function gostergeGuncelle(){
  var d = A.d, t = Motor.aktifTakim(d);
  var p = el("gpuan"); if(p) p.textContent = t.score;
  var q = el("gpas"); if(q) q.textContent = d.remainingPasses === null ? "∞" : d.remainingPasses;
  var kk = el("gkart"); if(kk && d.settings.cardsPerTurn) kk.textContent = d.turnLog.length+"/"+d.settings.cardsPerTurn;
  var dp = el("dgpas"); if(dp){ if(d.remainingPasses === 0) dp.setAttribute("disabled","disabled"); else dp.removeAttribute("disabled"); }
}

function sayacBasla(){
  sayacDurdur();
  A.sonSaniye = null;
  A.sayacId = setInterval(sayacTik, 180);
  sayacTik();
}
function sayacDurdur(){ if(A.sayacId){ clearInterval(A.sayacId); A.sayacId = null; } }
function sayacTik(){
  if(!A.d || A.d.status !== "playing" || A.duraklat) return;
  var kalan = Motor.kalanMs(A.d), s = el("sayac"), ip = el("ilerle");
  if(s){ s.textContent = suSaniye(kalan);
    if(kalan <= 10000) s.classList.add("kritik"); else s.classList.remove("kritik"); }
  if(ip) ip.style.width = Math.max(0, (kalan/(A.d.settings.turnDurationSeconds*1000))*100)+"%";
  var sn = Math.ceil(kalan/1000);
  if(sn !== A.sonSaniye){
    if(sn <= 10 && sn > 0) Ses.gerisayim();
    A.sonSaniye = sn;
  }
  if(kalan <= 0) sureDoldu();
}

function sureDoldu(){
  sayacDurdur();
  Motor.turBitir(A.d);
  Ses.bitis();
  oyunKaydet();
  var kart = el("kart"); if(kart) kart.classList.add("gizli");
  modalAc('<h3>'+ka(T("sure_doldu"))+'</h3><p class="sessiz">'+ka(T("son_kart_sayilmaz"))+'</p>'+
    '<div class="yigin"><button class="dg" data-act="oyun:turozeti">'+ka(T("turozeti"))+'</button></div>');
}

function eylem(sonuc){
  if(A.kilit || !A.d || A.d.status !== "playing") return;
  if(sonuc === "forbidden" && Ayar.hakemModu){
    modalAc('<h3>'+ka(T("yasak_onay"))+'</h3><div class="yigin">'+
      '<button class="dg" style="background:var(--yasak)" data-act="oyun:yasakevet">'+ka(T("yasak_onay_evet"))+'</button>'+
      '<button class="dg ikincil" data-act="modal:kapat">'+ka(T("yasak_onay_hayir"))+'</button></div>');
    return;
  }
  eylemUygula(sonuc);
}

function eylemUygula(sonuc){
  var r = Motor.islem(A.d, sonuc);
  if(!r.ok){
    if(r.sebep === "sure") sureDoldu();
    return;
  }
  A.kilit = true;
  if(sonuc === "correct") Ses.dogru(); else if(sonuc === "pass") Ses.pas(); else Ses.yasak();
  var kart = el("kart");
  if(kart) kart.classList.add(sonuc === "correct" ? "cik-sag" : (sonuc === "pass" ? "cik-alt" : "cik-sol"));
  gostergeGuncelle();
  oyunKaydet();
  var bekle = Ayar.animasyon ? 290 : 60;
  setTimeout(function(){
    A.kilit = false;
    if(A.d.status === "turn-result"){
      sayacDurdur();
      if(r.havuzBitti) havuzBittiSor(); else git("turozeti");
      return;
    }
    var alan = el("kartalan"); if(alan) alan.innerHTML = kartHtml();
  }, bekle);
}

function havuzBittiSor(){
  modalAc('<h3>'+ka(T("havuz_bitti"))+'</h3><p class="sessiz">'+ka(T("havuz_bitti_a"))+'</p>'+
    '<div class="yigin"><button class="dg" data-act="oyun:karistir">'+ka(T("karistir"))+'</button>'+
    '<button class="dg ikincil" data-act="oyun:bitir">'+ka(T("bitir"))+'</button></div>');
}

/* ---------------------------- Tur özeti -------------------------------- */
function ekranTurOzeti(){
  var d = A.d, t = Motor.aktifTakim(d), o = Motor.turOzeti(d);
  var sonraki = d.teams[(d.currentTeamIndex+1) % d.teams.length];
  var h = '<div class="ekran aktif"><div class="ustbar"><h2>'+ka(T("turozeti"))+'</h2></div>';
  h += '<div class="kutu"><h3>'+t.icon+' '+ka(t.name)+'</h3>'+
    '<div class="rozetler" style="margin-top:10px">'+
    '<div class="mini"><b>'+o.correct+'</b><span>'+ka(T("dogru"))+'</span></div>'+
    '<div class="mini"><b>'+o.pass+'</b><span>'+ka(T("pas"))+'</span></div>'+
    '<div class="mini"><b>'+o.forbidden+'</b><span>'+ka(T("yasak"))+'</span></div>'+
    '<div class="mini"><b>'+(o.puan>0?"+":"")+o.puan+'</b><span>'+ka(T("turpuani"))+'</span></div>'+
    '</div><p style="margin-top:12px"><b>'+ka(T("toplampuan"))+': '+t.score+'</b></p></div>';

  if(d.turnLog.length){
    h += '<div class="kutu"><span class="etiket">'+ka(T("oynanan"))+'</span><table class="tablo"><tbody>';
    d.turnLog.forEach(function(p){
      var k = Motor.kartBul(d, p.cardId);
      var im = p.result === "correct" ? '<span style="color:var(--dogru)">✓</span>'
             : p.result === "pass" ? '<span style="color:var(--pas)">→</span>'
             : '<span style="color:var(--yasak)">✕</span>';
      h += '<tr><td>'+ka(k?k.word:"—")+'</td><td class="sag">'+im+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  var bitiyor = d.settings.roundCount && d.currentTeamIndex === d.teams.length-1 && d.currentRound >= d.settings.roundCount;
  h += '<div class="taban"><button class="dg" data-act="oyun:sonraki">'+
    ka(bitiyor || d.bitis ? T("siralama") : T("telefonu_ver",{ad:sonraki.name}))+'</button></div>';
  return h+'</div>';
}
</script>
<script>
/* =========================================================================
   Bölüm 4b: Bot modu (tek kişilik "Bota Karşı")
   Bot, kartın yasaklı kelimelerini tek tek ipucu olarak açar; oyuncu
   seçeneklerden hedefi bulur. Bot kendi turunda olasılıkla puan toplar.
   ========================================================================= */
var BOT_KISI = {
  caylak:{em:"🐦", p:0.45, sec:4, kp:[1,3], ad:{tr:"Meraklı Serçe",en:"Curious Sparrow",ar:"العصفور الفضولي",fr:"Moineau Curieux"}},
  usta:{em:"🐜", p:0.65, sec:6, kp:[2,4], ad:{tr:"Hafız Karınca",en:"Studious Ant",ar:"النملة الحافظة",fr:"Fourmi Savante"}},
  alim:{em:"🦉", p:0.82, sec:8, kp:[3,5], ad:{tr:"Bilge Baykuş",en:"Wise Owl",ar:"البومة الحكيمة",fr:"Hibou Sage"}}
};
var B = null;
var BotKur = {zorluk:"usta", turSayisi:5, sure:90, katlar:["temel","ibadet","peygamber","ahlak"]};

function botAdi(z){
  var k = BOT_KISI[z || (B && B.zorluk) || "usta"];
  return (k.ad[Ayar.dil] || k.ad.tr);
}
function botTemizle(){
  if(!B) return;
  if(B.sayacId){ clearInterval(B.sayacId); B.sayacId = null; }
  if(B.simId){ clearTimeout(B.simId); B.simId = null; }
}

function botBaslat(){
  if(!BotKur.katlar.length){ bilgi(T("kategoriler"), T("en_az_1_kat")); return; }
  var havuz = havuzKur(Ayar.dil, BotKur.katlar);
  if(havuz.length < 12){ bilgi(T("kart_havuzu"), T("kart_yetersiz")); return; }
  B = {
    zorluk:BotKur.zorluk, kisi:BOT_KISI[BotKur.zorluk], turSayisi:BotKur.turSayisi,
    sure:BotKur.sure, havuz:havuz, deste:karistir(havuz), di:0, tur:1, evre:"devir-sen",
    sen:{puan:0, dogru:0, yanlis:0, pas:0, seri1:0, enSeri1:0},
    bot:{puan:0, dogru:0, pas:0},
    kart:null, ipucu:1, secenekler:[], pasKalan:2, bitis:0, kilit:false,
    dokum:[], turSen:0, sonSn:null, sayacId:null, simId:null, sim:null,
    yeniRozet:[], baslangic:Date.now()
  };
  git("botdevir");
}

function botKartCek(){
  if(B.di >= B.deste.length){ B.deste = karistir(B.deste); B.di = 0; }
  var k = B.deste[B.di++], gor = {}, cel = [];
  gor[k.word] = true;
  var doldur = function(liste){
    for(var i=0;i<liste.length && cel.length < B.kisi.sec-1;i++){
      var w = liste[i].word;
      if(!gor[w]){ gor[w] = true; cel.push(w); }
    }
  };
  doldur(karistir(B.havuz.filter(function(c){ return c.category === k.category; })));
  doldur(karistir(B.havuz));
  B.kart = k; B.ipucu = 1; B.kilit = false;
  B.secenekler = karistir([k.word].concat(cel));
}
function botOlasiPuan(){ return Math.max(1, 6 - B.ipucu); }

/* --- Oyuncu turu (bot anlatıyor, sen bil) --- */
function botTurBasla(){
  B.evre = "oyun"; B.pasKalan = 2; B.turSen = 0; B.sonSn = null;
  B.bitis = Date.now() + B.sure*1000;
  botKartCek();
  Ses.basla();
  git("botoyun");
  if(B.sayacId) clearInterval(B.sayacId);
  B.sayacId = setInterval(botTik, 180);
}
function botTik(){
  if(!B || B.evre !== "oyun") return;
  var kalan = Math.max(0, B.bitis - Date.now());
  var s = el("sayac");
  if(s){ s.textContent = suSaniye(kalan);
    if(kalan <= 10000) s.classList.add("kritik"); else s.classList.remove("kritik"); }
  var ip = el("ilerle"); if(ip) ip.style.width = Math.max(0, (kalan/(B.sure*1000))*100)+"%";
  var sn = Math.ceil(kalan/1000);
  if(sn !== B.sonSn){ if(sn <= 5 && sn > 0) Ses.gerisayim(); B.sonSn = sn; }
  if(kalan <= 0){
    clearInterval(B.sayacId); B.sayacId = null;
    Ses.bitis();
    B.evre = "devir-bot"; git("botdevir");
  }
}
function botKonfeti(){
  var alan = el("botkutu"); if(!alan) return;
  var renkler = ["#C6A15B","#2F6B4F","#B03A2E","#3C6E91","#8C5A9E"];
  for(var i=0;i<16;i++){
    var s = document.createElement("span");
    s.className = "konf";
    s.style.left = (6 + Math.random()*88) + "%";
    s.style.background = renkler[i % renkler.length];
    s.style.animationDelay = (Math.random()*0.15) + "s";
    alan.appendChild(s);
    (function(x){ setTimeout(function(){ if(x.parentNode) x.parentNode.removeChild(x); }, 1200); })(s);
  }
}
function botCevap(ix){
  if(!B || B.evre !== "oyun" || B.kilit) return;
  var secilen = B.secenekler[ix];
  if(secilen === undefined) return;
  B.kilit = true;
  var dogruMu = secilen === B.kart.word;
  var dgler = document.querySelectorAll(".bot-secenek button");
  if(dogruMu){
    var p = botOlasiPuan();
    B.turSen += p; B.sen.puan += p; B.sen.dogru++;
    if(B.ipucu === 1){ B.sen.seri1++; if(B.sen.seri1 > B.sen.enSeri1) B.sen.enSeri1 = B.sen.seri1; }
    else B.sen.seri1 = 0;
    Ses.dogru();
    if(dgler[ix]) dgler[ix].classList.add("dogruIsaret");
    botKonfeti();
    setTimeout(botSonrakiKart, Ayar.animasyon ? 700 : 150);
  } else {
    B.sen.yanlis++; B.sen.seri1 = 0;
    Ses.yasak();
    if(dgler[ix]) dgler[ix].classList.add("yanlisIsaret");
    for(var i=0;i<dgler.length;i++)
      if(B.secenekler[i] === B.kart.word) dgler[i].classList.add("dogruIsaret");
    var kutu = el("botkutu"); if(kutu) kutu.classList.add("sallan");
    setTimeout(botSonrakiKart, Ayar.animasyon ? 1400 : 250);
  }
  var gp = el("gpuan"); if(gp) gp.textContent = B.sen.puan;
}
function botPas(){
  if(!B || B.evre !== "oyun" || B.kilit || B.pasKalan <= 0) return;
  B.pasKalan--; B.sen.pas++; B.sen.seri1 = 0;
  Ses.pas();
  botSonrakiKart();
}
function botIpucu(){
  if(!B || B.evre !== "oyun" || B.kilit) return;
  if(B.ipucu >= B.kart.forbiddenWords.length) return;
  B.ipucu++;
  Ses.tik();
  ciz();
}
function botSonrakiKart(){
  if(!B || B.evre !== "oyun") return;
  botKartCek();
  ciz();
}

/* --- Bot turu (hızlı simülasyon) --- */
function botSimSonuc(){
  if(Math.random() < B.kisi.p){
    var kp = B.kisi.kp;
    return {dogru:true, puan: kp[0] + Math.floor(Math.random()*(kp[1]-kp[0]+1))};
  }
  return {dogru:false, puan:0};
}
function botSimBaslat(){
  var n = Math.max(5, Math.min(10, Math.round(B.sure/12)));
  var kartlar = [];
  for(var i=0;i<n;i++){
    if(B.di >= B.deste.length){ B.deste = karistir(B.deste); B.di = 0; }
    kartlar.push(B.deste[B.di++]);
  }
  B.sim = {kartlar:kartlar, ix:0, puan:0, dogru:0, pas:0, durum:""};
  B.evre = "sim";
  git("botsim");
  botSimAdim();
}
function botSimAdim(){
  if(!B || !B.sim) return;
  var s = B.sim;
  if(s.ix >= s.kartlar.length){ botSimBitir(); return; }
  s.durum = "dusun";
  botSimCiz();
  B.simId = setTimeout(function(){
    if(!B || !B.sim) return;
    var r = botSimSonuc();
    if(r.dogru){ s.dogru++; s.puan += r.puan; s.durum = "dogru"; Ses.dogru(); }
    else { s.pas++; s.durum = "pas"; Ses.pas(); }
    botSimCiz();
    B.simId = setTimeout(function(){
      if(!B || !B.sim) return;
      s.ix++;
      botSimAdim();
    }, 420);
  }, 1200 + Math.random()*800);
}
function botSimCiz(){
  var s = B.sim; if(!s) return;
  var k = s.kartlar[Math.min(s.ix, s.kartlar.length-1)];
  var e = el("simkart");
  if(e){
    var renk = s.durum === "dogru" ? "var(--dogru)" : (s.durum === "pas" ? "var(--pas)" : "var(--murekkep)");
    var im = s.durum === "dogru" ? " ✓" : (s.durum === "pas" ? " →" : "");
    e.innerHTML = '<div class="kelime" style="color:'+renk+'">'+ka(k.word)+im+'</div>';
  }
  var sp = el("simpuan"); if(sp) sp.textContent = s.puan;
  var si = el("similerle"); if(si) si.textContent = Math.min(s.ix + (s.durum==="dusun"?1:0), s.kartlar.length) + "/" + s.kartlar.length;
}
function botSimAtla(){
  if(!B || !B.sim) return;
  if(B.simId){ clearTimeout(B.simId); B.simId = null; }
  var s = B.sim;
  if(s.durum === "dusun"){
    var r = botSimSonuc();
    if(r.dogru){ s.dogru++; s.puan += r.puan; } else s.pas++;
    s.ix++;
  }
  while(s.ix < s.kartlar.length){
    var r2 = botSimSonuc();
    if(r2.dogru){ s.dogru++; s.puan += r2.puan; } else s.pas++;
    s.ix++;
  }
  botSimBitir();
}
function botSimBitir(){
  if(B.simId){ clearTimeout(B.simId); B.simId = null; }
  var s = B.sim;
  B.bot.puan += s.puan; B.bot.dogru += s.dogru; B.bot.pas += s.pas;
  B.dokum.push({tur:B.tur, sen:B.turSen, bot:s.puan});
  B.sim = null;
  if(B.tur >= B.turSayisi){ botMacBitir(); return; }
  B.tur++; B.evre = "devir-sen";
  Ses.tur();
  git("botdevir");
}

/* --- Maç sonu, rozetler, kayıt --- */
function botMacBitir(){
  botTemizle();
  B.evre = "son";
  var kazandi = B.sen.puan > B.bot.puan;
  var berabere = B.sen.puan === B.bot.puan;

  var ist = istatistikAl();
  ist.bot = ist.bot || {oyun:0, kazanma:0, dogru:0, yanlis:0, seri:0, rozet:{}};
  ist.bot.oyun++;
  if(kazandi) ist.bot.kazanma++;
  ist.bot.dogru += B.sen.dogru; ist.bot.yanlis += B.sen.yanlis;
  if(B.sen.enSeri1 > ist.bot.seri) ist.bot.seri = B.sen.enSeri1;
  var yeni = [];
  if(kazandi && !ist.bot.rozet.ilk){ ist.bot.rozet.ilk = Date.now(); yeni.push("roz_ilk"); }
  if(kazandi && B.zorluk === "alim" && !ist.bot.rozet.alim){ ist.bot.rozet.alim = Date.now(); yeni.push("roz_alim"); }
  if(B.sen.enSeri1 >= 5 && !ist.bot.rozet.seri){ ist.bot.rozet.seri = Date.now(); yeni.push("roz_seri"); }
  B.yeniRozet = yeni;
  Depo.yaz(ANAHTAR.ist, ist);

  /* Geçmiş: eski biçim korunur, mod+zorluk EK alan olarak eklenir */
  var g = Depo.al(ANAHTAR.gecmis, []);
  g.unshift({
    tarih: Date.now(),
    takimlar: [
      {ad:T("bot_sen"), puan:B.sen.puan, sim:"🧑"},
      {ad:botAdi(), puan:B.bot.puan, sim:B.kisi.em}
    ],
    kazanan: kazandi ? T("bot_sen") : (berabere ? "—" : botAdi()),
    tur: B.turSayisi,
    sure: Math.round((Date.now() - B.baslangic)/1000),
    paket: BotKur.katlar.length,
    mod:"bot", zorluk:B.zorluk
  });
  Depo.yaz(ANAHTAR.gecmis, g.slice(0,20));

  if(kazandi) Ses.zafer(); else Ses.bitis();
  git("botson");
}

/* --- Bot ekranları --- */
function ekranBotKur(){
  var h = '<div class="ekran aktif"><div class="ustbar">'+
    '<button class="geri" data-act="git:ana" aria-label="'+ka(T("geri"))+'"><span>←</span></button>'+
    '<h2>🤖 '+ka(T("bot"))+'</h2></div>';
  h += '<p class="sessiz" style="margin-bottom:14px">'+ka(T("bot_alt"))+'</p>';

  h += '<div class="kutu"><span class="etiket">'+ka(T("bot_zorluk"))+'</span>';
  [["caylak"],["usta"],["alim"]].forEach(function(z){
    var k = BOT_KISI[z[0]];
    h += '<button class="cip bot-zorluk" aria-pressed="'+(BotKur.zorluk===z[0])+'" data-act="bot:zorluk:'+z[0]+'">'+
      '<span style="font-size:1.5rem">'+k.em+'</span>'+
      '<span style="display:block;text-align:start"><b>'+ka(T("bz_"+z[0]))+' · '+ka(k.ad[Ayar.dil]||k.ad.tr)+'</b><br>'+
      '<small style="opacity:.75">'+ka(T("bz_"+z[0]+"_a"))+'</small></span></button>';
  });
  h += '</div>';

  h += '<div class="kutu"><span class="etiket">'+ka(T("tur_sayisi"))+'</span>'+
    cipler([[3,"3"],[5,"5"],[7,"7"]], BotKur.turSayisi, "bot:turs", true)+'</div>';
  h += '<div class="kutu"><span class="etiket">'+ka(T("sure"))+'</span>'+
    cipler([[60,"60 "+T("sn")],[90,"90 "+T("sn")],[120,"120 "+T("sn")]], BotKur.sure, "bot:sure", true)+'</div>';

  h += '<div class="kutu"><span class="etiket">'+ka(T("kategoriler"))+'</span><div class="secenekler">';
  KAT_SIRA.forEach(function(kt){
    var s = BotKur.katlar.indexOf(kt) > -1;
    h += '<button class="cip" style="flex:1 1 46%" aria-pressed="'+s+'" data-act="bot:kat:'+kt+'">'+
      '<span>'+KAT_AD[kt].em+'</span><span class="tik">'+ka(KAT_AD[kt][Ayar.dil]||KAT_AD[kt].tr)+'</span></button>';
  });
  h += '</div><p class="sessiz" style="margin-top:8px"><b>'+
    ka(T("hazir_kart",{n:havuzKur(Ayar.dil, BotKur.katlar).length}))+'</b></p></div>';

  h += '<div class="taban"><button class="dg altin" data-act="bot:basla">'+ka(T("simdibasla"))+'</button></div>';
  return h+'</div>';
}

function ekranBotDevir(){
  var sen = B.evre === "devir-sen";
  var h = '<div class="ekran aktif" id="ekran-devir">'+
    '<div class="sira">'+ka(T("tur"))+' '+B.tur+'/'+B.turSayisi+'</div>'+
    '<div class="devirsim">'+(sen ? B.kisi.em : "🤖")+'</div>'+
    '<h2>'+ka(sen ? T("bot_senin_turun") : T("bot_bot_turu"))+'</h2>'+
    '<p class="uyari">'+ka(sen ? T("bot_anlatiyor",{ad:botAdi()}) : T("bot_dusunuyor",{ad:botAdi()}))+'</p>'+
    '<p style="opacity:.85;margin-bottom:18px">🧑 '+ka(T("bot_sen"))+' <b>'+B.sen.puan+'</b> — <b>'+B.bot.puan+'</b> '+ka(botAdi())+' '+B.kisi.em+'</p>'+
    '<button class="dg altin" data-act="bot:turbasla">'+ka(sen ? T("hazirim") : T("basla"))+'</button>'+
    '<button class="dg hayalet" style="color:#FFFCF6;margin-top:10px" data-act="bot:cik">'+ka(T("anamenu"))+'</button>';
  return h+'</div>';
}

function ekranBotOyun(){
  var k = B.kart;
  var h = '<div class="ekran aktif" id="ekran-oyun">';
  h += '<div class="oyunust"><div class="tkm"><b>🧑 '+ka(T("bot_sen"))+'</b>'+
    '<span>'+ka(T("tur"))+' '+B.tur+'/'+B.turSayisi+'</span></div>'+
    '<div class="sayac" id="sayac" role="timer" aria-live="off">'+suSaniye(Math.max(0, B.bitis - Date.now()))+'</div>'+
    '<button class="duraklat" data-act="bot:cik" aria-label="'+ka(T("anamenu"))+'">✕</button></div>';
  h += '<div class="gostergeler"><span>'+ka(T("puan"))+': <b id="gpuan">'+B.sen.puan+'</b></span>'+
    '<span>'+ka(T("pas_kalan"))+': <b>'+B.pasKalan+'</b></span>'+
    '<span>💡 '+ka(T("bot_olasi"))+': <b>'+botOlasiPuan()+'</b></span>'+
    '</div><div class="ilerle"><i id="ilerle"></i></div>';

  h += '<div class="kutu" id="botkutu" style="position:relative;overflow:hidden;margin-top:4px">';
  h += '<div class="bot-balon"><div class="bav">'+B.kisi.em+'</div><div class="bic">'+
    '<div class="bad">'+ka(botAdi())+'</div>'+
    '<div class="bot-ipucular">'+
    k.forbiddenWords.slice(0, B.ipucu).map(function(y){
      return '<span>'+ka(T("bot_ipucu"))+': '+ka(y)+'</span>';
    }).join("")+
    '</div></div></div>';
  h += '<button class="dg ikincil kucuk" data-act="bot:ipucu"'+
    (B.ipucu >= k.forbiddenWords.length ? " disabled":"")+'>💡 '+ka(T("bot_ipucu_iste"))+' (−1)</button>';
  h += '<p style="font-weight:700;margin:12px 0 2px">'+ka(T("bot_hangisi"))+'</p>';
  h += '<div class="bot-secenek">'+
    B.secenekler.map(function(s,i){
      return '<button data-act="bot:sec:'+i+'">'+ka(s)+'</button>';
    }).join("")+'</div>';
  h += '</div>';

  h += '<div class="islemler" style="margin-top:10px">'+
    '<button class="eylem e-pas" data-act="bot:pas"'+(B.pasKalan<=0?" disabled":"")+'>'+
    '<span class="em">→</span>'+ka(T("pas"))+' ('+B.pasKalan+')</button></div>';
  return h+'</div>';
}

function ekranBotSim(){
  var s = B.sim || {kartlar:[], ix:0, puan:0};
  var h = '<div class="ekran aktif">';
  h += '<div class="ustbar"><h2>🤖 '+ka(T("bot_bot_turu"))+'</h2>'+
    '<span class="sessiz">'+ka(T("tur"))+' '+B.tur+'/'+B.turSayisi+'</span></div>';
  h += '<div style="text-align:center;padding-top:8px">'+
    '<div class="bot-avatar dusun">'+B.kisi.em+'</div>'+
    '<h3>'+ka(botAdi())+'</h3>'+
    '<p class="sessiz">'+ka(T("bot_dusunuyor",{ad:botAdi()}))+'</p></div>';
  h += '<div class="simskor">'+
    '<div class="mini"><b id="simpuan">'+s.puan+'</b><span>'+ka(T("turpuani"))+'</span></div>'+
    '<div class="mini"><b id="similerle">'+Math.min(s.ix+1, s.kartlar.length)+'/'+s.kartlar.length+'</b><span>'+ka(T("kart"))+'</span></div>'+
    '</div>';
  h += '<div class="kartalan"><div class="kart gir" style="min-height:120px;display:flex;align-items:center;justify-content:center">'+
    '<div class="kat" id="simkart"><div class="kelime">…</div></div></div></div>';
  h += '<div class="taban"><button class="dg ikincil" data-act="bot:atla">⏭ '+ka(T("bot_atla"))+'</button></div>';
  return h+'</div>';
}

function ekranBotSon(){
  var kazandi = B.sen.puan > B.bot.puan, berabere = B.sen.puan === B.bot.puan;
  var baslik = kazandi ? T("bot_kazandin") : (berabere ? T("bot_berabere") : T("bot_kaybetti",{ad:botAdi()}));
  var h = '<div class="ekran aktif"><div class="kupa"><div class="em">'+(kazandi?"🏆":(berabere?"🤝":B.kisi.em))+'</div>'+
    '<h2>'+ka(baslik)+'</h2></div>';

  h += '<div class="kutu"><ol class="siralama">';
  var sira = kazandi || berabere
    ? [["🧑",T("bot_sen"),B.sen.puan],[B.kisi.em,botAdi(),B.bot.puan]]
    : [[B.kisi.em,botAdi(),B.bot.puan],["🧑",T("bot_sen"),B.sen.puan]];
  sira.forEach(function(t,i){
    h += '<li class="'+(i===0?"bir":"")+'"><span class="no">'+(i+1)+'</span>'+
      '<span class="ad">'+t[0]+' '+ka(t[1])+'</span><span class="pn">'+t[2]+'</span></li>';
  });
  h += '</ol></div>';

  h += '<div class="kutu"><span class="etiket">'+ka(T("bot_dokum"))+'</span>'+

  if(B.yeniRozet.length){

<script>
/* ---------------------------- Oyun sonu -------------------------------- */
function kartIstatistigi(d){
  var s = {};
  d.playedCards.forEach(function(p){
    var k = Motor.kartBul(d, p.cardId); if(!k) return;
    var x = s[k.word] || (s[k.word] = {dogru:0, pas:0, yasak:0, top:0});
    x.top++; x[p.result === "correct" ? "dogru" : (p.result === "pass" ? "pas" : "yasak")]++;
  });
  var enZor = null, enPas = null;
  for(var w in s){
    var x = s[w];
    if(x.dogru === 0 && (!enZor || x.top > s[enZor].top)) enZor = w;
    if(!enPas || x.pas > s[enPas].pas) enPas = w;
  }
  if(enPas && s[enPas].pas === 0) enPas = null;
  return {enZor:enZor, enPas:enPas};
}

function ekranSon(){
  var d = A.d, sira = Motor.siralama(d);
  if(A.kazananZorla){
    sira = sira.slice().sort(function(a,b){
      if(a.id === A.kazananZorla) return -1; if(b.id === A.kazananZorla) return 1; return 0; });
  }
  var kaz = sira[0], ks = kartIstatistigi(d);
  var enc = d.teams.slice().sort(function(a,b){return b.correctCount-a.correctCount;})[0];
  var enp = d.teams.slice().sort(function(a,b){return a.passCount-b.passCount;})[0];
  var eny = d.teams.slice().sort(function(a,b){return a.forbiddenCount-b.forbiddenCount;})[0];
  var ens = d.teams.slice().sort(function(a,b){return b.bestStreak-a.bestStreak;})[0];

  var h = '<div class="ekran aktif"><div class="kupa"><div class="em">🏆</div>'+
    '<h2>'+ka(T("tebrikler"))+'</h2><p><b>'+ka(T("kazandi",{ad:kaz.icon+" "+kaz.name}))+'</b></p></div>';
  h += '<div class="kutu"><span class="etiket">'+ka(T("siralama"))+'</span><ol class="siralama">';
  sira.forEach(function(t,i){
    h += '<li class="'+(i===0?"bir":"")+'"><span class="no">'+(i+1)+'</span>'+
      '<span class="ad">'+t.icon+' '+ka(t.name)+'</span><span class="pn">'+t.score+'</span></li>';
  });
  h += '</ol></div>';
  h += '<div class="kutu"><span class="etiket">'+ka(T("istatistik"))+'</span><table class="tablo"><tbody>'+
    '<tr><td>'+ka(T("en_cok_dogru"))+'</td><td class="sag">'+ka(enc.name)+' ('+enc.correctCount+')</td></tr>'+
    '<tr><td>'+ka(T("en_az_pas"))+'</td><td class="sag">'+ka(enp.name)+' ('+enp.passCount+')</td></tr>'+
    '<tr><td>'+ka(T("en_az_yasak"))+'</td><td class="sag">'+ka(eny.name)+' ('+eny.forbiddenCount+')</td></tr>'+
    '<tr><td>'+ka(T("en_uzun_seri"))+'</td><td class="sag">'+ka(ens.name)+' ('+ens.bestStreak+')</td></tr>'+
    '<tr><td>'+ka(T("en_zor_kart"))+'</td><td class="sag">'+ka(ks.enZor||T("yok"))+'</td></tr>'+
    '<tr><td>'+ka(T("en_cok_pas_kart"))+'</td><td class="sag">'+ka(ks.enPas||T("yok"))+'</td></tr>'+
    '</tbody></table></div>';
  h += '<div class="yigin">'+
    '<button class="dg" data-act="son:tekrar">'+ka(T("tekrar"))+'</button>'+
    '<button class="dg ikincil" data-act="son:takim">'+ka(T("takim_degis"))+'</button>'+
    '<div class="satir"><button class="dg ikincil" data-act="son:paylas">'+ka(T("sonuc_paylas"))+'</button>'+
    '<button class="dg ikincil" data-act="git:ana">'+ka(T("anamenu"))+'</button></div></div>';
  return h+'</div>';
}

function beraberlikSor(){
  var e = Motor.esitler(A.d);
  if(e.length < 2) return false;
  modalAc('<h3>'+ka(T("beraberlik"))+'</h3><p class="sessiz">'+ka(T("beraberlik_a",{n:e.length}))+'</p>'+

}

/* --------------------------- Altın kart -------------------------------- */
function altinBaslat(takimlar){
  var kalanKart = A.d.deck.slice(A.d.deckIndex);
  if(kalanKart.length < takimlar.length) kalanKart = karistir(A.d.deck);
  A.altin = {takimlar:takimlar, i:0, sonuc:[], kartlar:kalanKart, evre:"devir", bitis:0, kart:null};
  modalKapat(); git("altin");
}
function ekranAltin(){
  var g = A.altin, t = g.takimlar[g.i];
  if(g.evre === "devir"){
    return '<div class="ekran aktif" id="ekran-devir"><div class="sira">'+ka(T("altin_tur"))+'</div>'+
      '<div class="devirsim">'+t.icon+'</div><h2>'+ka(t.name)+'</h2>'+
      '<p class="uyari">'+ka(T("altin_kart_a"))+'</p>'+
      '<button class="dg altin" data-act="altin:basla">'+ka(T("hazirim"))+'</button></div>';
  }
  var k = g.kart;
  return '<div class="ekran aktif"><div class="oyunust"><div class="tkm"><b>'+t.icon+' '+ka(t.name)+'</b>'+
    '<span>'+ka(T("altin_tur"))+'</span></div><div class="sayac" id="sayac">0:30</div></div>'+
    '<div class="kartalan"><div class="kart gir" id="kart"><div class="kat">'+
    '<div class="rutbe">'+ka(T("altin_tur"))+'</div><div class="kelime">'+ka(k.word)+'</div>'+
    '<div class="ayrac"><i></i><b>'+ka(T("yasakli_kelimeler"))+'</b><i></i></div>'+
    '<ul class="yasaklar">'+k.forbiddenWords.map(function(y){return '<li>'+ka(y)+'</li>';}).join("")+'</ul>'+
    '</div></div></div>'+
    '<div class="islemler"><button class="eylem e-dogru" data-act="altin:dogru"><span class="em">✓</span>'+ka(T("dogru"))+'</button>'+
    '<button class="eylem e-yasak" data-act="altin:yasak"><span class="em">✕</span>'+ka(T("yasak"))+'</button></div></div>';
}
function altinTik(){
  var g = A.altin; if(!g || g.evre !== "oyun") return;
  var kalan = Math.max(0, g.bitis - Date.now());
  var s = el("sayac"); if(s){ s.textContent = suSaniye(kalan); if(kalan<=10000) s.classList.add("kritik"); }
  if(kalan <= 0) altinSonuc(Infinity);
}
function altinSonuc(sure){
  var g = A.altin; sayacDurdur();
  g.sonuc.push({takim:g.takimlar[g.i], sure:sure});
  g.i++;
  if(g.i < g.takimlar.length){ g.evre = "devir"; ciz(); return; }
  var enIyi = g.sonuc.slice().sort(function(a,b){ return a.sure - b.sure; });
  var kazananlar = enIyi.filter(function(x){ return x.sure === enIyi[0].sure; });
  if(enIyi[0].sure === Infinity || kazananlar.length > 1){
    altinBaslat(kazananlar.map(function(x){ return x.takim; })); return;
  }
  A.kazananZorla = enIyi[0].takim.id;
  Ses.zafer();
  bilgi(T("altin_tur"), T("altin_kazan",{ad:enIyi[0].takim.name}), "son:altinbitti");
}

  h += '<div class="kutu"><div class="rozetler">'+

  h += '<div class="kutu"><span class="etiket">'+ka(T("ist_takim"))+'</span><div class="kaydir"><table class="tablo"><thead><tr>'+
    '<th>'+ka(T("takim"))+'</th><th>'+ka(T("ist_oyun"))+'</th><th>'+ka(T("ist_kazanma"))+'</th>'+
    '<th>'+ka(T("ist_dogru"))+'</th><th>'+ka(T("ist_oran"))+'</th><th>'+ka(T("ist_enyuksek"))+'</th></tr></thead><tbody>';
  adlar.sort(function(a,b){ return ist.takimlar[b].kazanma - ist.takimlar[a].kazanma; }).forEach(function(n){

    kw.sort(function(a,b){ return ist.kartlar[b].gosterim - ist.kartlar[a].gosterim; });

      '<th>'+ka(T("kelime"))+'</th><th>'+ka(T("gosterim"))+'</th><th>'+ka(T("bilinme"))+'</th></tr></thead><tbody>';
    kw.slice(0,25).forEach(function(w){
      var k = ist.kartlar[w];
      h += '<tr><td>'+ka(w)+'</td><td>'+k.gosterim+'</td><td>'+(k.gosterim?Math.round(k.dogru/k.gosterim*100):0)+'%</td></tr>';
    });
    h += '</tbody></table></div></div>';
  }
  h += '<div class="taban"><button class="dg ikincil" data-act="ayar:sifirla">'+ka(T("sifirla"))+'</button></div>';
  return h+'</div>';
}
