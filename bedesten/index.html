<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="description" content="BEDESTEN — gizli nesneleri bul, üçlü eşleştir. Reklamsız, çevrimdışı, Türkçe.">
<meta name="theme-color" content="#3B2A22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BEDESTEN">
<meta name="color-scheme" content="light">
<title>BEDESTEN — üçlü eşleştirme</title>
<!--
  ================================================================
  BEDESTEN · tek dosya · vanilla JS · SVG · çevrimdışı
  Reklam yok, oyun içi para yok, can/enerji yok.
  İpucu ve yardımcılar oynayarak kazanılır.
  ================================================================
-->
<style>
:root{
  --wood:#3B2A22; --wood-2:#4E382C; --wood-3:#6A4B38;
  --gold:#D9A441; --gold-d:#A87A24; --gold-l:#F0CE84;
  --cream:#F7EEDC; --cream-2:#E9DBC0; --paper:#FFFBF2;
  --ink:#2C211A; --dim:#8B7A68; --line:rgba(44,33,26,.14);
  --ok:#5B8F5A; --warn:#D08A2C; --bad:#B4453A;
  --sh-s:0 2px 5px rgba(44,33,26,.14);
  --sh:0 8px 22px rgba(44,33,26,.20);
  --sh-l:0 22px 52px rgba(44,33,26,.34);
  --disp:Georgia,"Iowan Old Style",Palatino,serif;
  --ui:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --pt:env(safe-area-inset-top,0px); --pb:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--ui);color:var(--ink);background:var(--cream);
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  overscroll-behavior:none;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,p{margin:0} ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html[data-motion="0"] *{animation-duration:.001s!important;transition-duration:.001s!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
.dsp{font-family:var(--disp);letter-spacing:.06em}
.kicker{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600}

#app{position:relative;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.scr{display:none;flex:1;min-height:0;flex-direction:column}
.scr.on{display:flex}
.page{flex:1;overflow-y:auto;padding:calc(16px + var(--pt)) 17px calc(24px + var(--pb));-webkit-overflow-scrolling:touch}
@media(min-width:640px){ .page{max-width:600px;margin:0 auto;width:100%} }

#boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 25%,#5B4231,#2E211A);transition:opacity .5s,visibility .5s}
#boot.gone{opacity:0;visibility:hidden;pointer-events:none}
.bootbox{text-align:center;color:var(--cream);animation:bin .9s cubic-bezier(.2,1,.3,1) both}
.bootbox svg{width:104px;height:104px}
.bootbox h1{font-family:var(--disp);font-size:2rem;letter-spacing:.3em;text-indent:.3em;margin-top:12px}
.bootbox p{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-l);margin-top:8px}
@keyframes bin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* MENÜ */
.hero{text-align:center;padding:12px 0 4px}
.hero svg{width:82px;height:82px}
.hero h1{font-family:var(--disp);font-size:1.85rem;letter-spacing:.28em;text-indent:.28em;margin-top:10px;color:var(--wood)}
.hero .rule{width:44px;height:1px;background:var(--gold-d);margin:11px auto}
.hero p{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.mbtn{display:flex;align-items:center;gap:13px;width:100%;padding:15px 17px;border-radius:16px;
  background:var(--paper);border:1px solid var(--line);box-shadow:var(--sh-s);margin-bottom:10px;text-align:left;
  transition:transform .15s,box-shadow .2s}
.mbtn:active{transform:scale(.985)}
.mbtn .ic{width:42px;height:42px;flex:0 0 42px;border-radius:11px;display:grid;place-items:center;background:var(--cream-2);font-size:1.2rem}
.mbtn b{display:block;font-family:var(--disp);font-size:1.02rem;font-weight:400}
.mbtn span{display:block;font-size:.74rem;color:var(--dim);margin-top:2px}
.mbtn.pri{background:linear-gradient(160deg,var(--wood-3),var(--wood));color:var(--cream);border-color:var(--wood)}
.mbtn.pri .ic{background:rgba(255,255,255,.13)} .mbtn.pri span{color:rgba(247,238,220,.7)}
.sect{display:flex;align-items:center;gap:12px;margin:24px 0 12px}
.sect h2{font-family:var(--disp);font-size:1rem;font-weight:400;white-space:nowrap}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}

/* Bölüm listesi */
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:9px}
.lv{aspect-ratio:1;border-radius:14px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--sh-s);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s}
.lv:active{transform:scale(.93)}
.lv .n{font-family:var(--disp);font-size:1.2rem}
.lv .st{font-size:.6rem;letter-spacing:1px;color:var(--gold-d);height:12px}
.lv .sc{font-size:.52rem;color:var(--dim)}
.lv.done{background:linear-gradient(160deg,#FFF4DE,var(--paper));border-color:var(--gold)}
.lv.now{background:linear-gradient(160deg,var(--wood-3),var(--wood));color:var(--cream);border-color:var(--gold)}
.lv.now .st{color:var(--gold-l)} .lv.now .sc{color:rgba(247,238,220,.6)}
.lv.lock{opacity:.4}

/* OYUN */
#hud{background:linear-gradient(180deg,var(--wood-2),var(--wood));color:var(--cream);
  padding:calc(8px + var(--pt)) 11px 8px;display:flex;align-items:center;gap:9px;position:relative;z-index:6}
#hud::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:repeating-linear-gradient(90deg,var(--gold) 0 8px,transparent 8px 16px);opacity:.6}
.hb{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.14);font-size:.95rem;transition:transform .15s}
.hb:active{transform:scale(.9)}
.hmid{flex:1;min-width:0;text-align:center}
.hmid .t1{font-family:var(--disp);font-size:.92rem;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmid .t2{font-size:.66rem;color:#C9B69C;margin-top:2px}
.clock{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.11);
  font-family:var(--disp);font-size:.86rem;font-variant-numeric:tabular-nums}
.clock.warn{background:rgba(208,138,44,.3);color:#FFD79B}
.clock.crit{background:rgba(180,69,58,.35);color:#FFC0B8;animation:pulse .8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}

#board{flex:1;min-height:0;display:grid;place-items:center;padding:6px 8px;overflow:hidden;background:#2E211A}
#scene{width:100%;height:100%;display:block;touch-action:manipulation}
.obj{cursor:pointer;transition:opacity .2s}
.obj:active{opacity:.75}
.hintring{animation:hring 1.1s ease-out infinite;transform-origin:center;pointer-events:none}
@keyframes hring{0%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(1.5)}}

/* Tepsi */
#tray{background:linear-gradient(180deg,var(--wood),#241A14);padding:9px 8px calc(9px + var(--pb));
  display:flex;justify-content:center;gap:5px;position:relative;z-index:5}
.slot{flex:1;max-width:56px;aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.07);
  border:1.5px solid rgba(217,164,65,.28);display:grid;place-items:center;position:relative;transition:all .22s}
.slot svg{width:78%;height:78%}
.slot.fill{background:rgba(247,238,220,.94);border-color:var(--gold)}
.slot.pop{animation:spop .38s cubic-bezier(.2,1.5,.4,1)}
@keyframes spop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.slot.danger{border-color:var(--bad);box-shadow:0 0 0 2px rgba(180,69,58,.35)}

#tools{display:flex;justify-content:center;gap:8px;padding:7px 0 1px;background:var(--wood)}
.tool{position:relative;min-width:60px;padding:7px 11px;border-radius:12px;background:rgba(255,255,255,.09);
  color:var(--cream);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.62rem;font-weight:600;transition:transform .15s}
.tool i{font-style:normal;font-size:1.05rem}
.tool b{position:absolute;top:-6px;right:-5px;min-width:19px;height:19px;border-radius:99px;background:var(--gold);
  color:#4A3208;font-size:.65rem;display:grid;place-items:center;border:2px solid var(--wood)}
.tool:active{transform:scale(.93)} .tool.out{opacity:.42}

/* MODAL */
.modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:17px}
.modal.on{display:flex}
.mbg{position:absolute;inset:0;background:rgba(28,20,15,.62);backdrop-filter:blur(4px);animation:fade .22s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sh2{position:relative;width:100%;max-width:420px;max-height:88dvh;overflow-y:auto;background:var(--cream);
  border-radius:22px;box-shadow:var(--sh-l);animation:rise .3s cubic-bezier(.2,1.05,.3,1);border:2px solid var(--gold-d)}
@keyframes rise{from{transform:translateY(18px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.sh2 .hd{background:linear-gradient(160deg,var(--wood-3),var(--wood));color:var(--cream);padding:17px 20px 15px;text-align:center;position:relative}
.sh2 .hd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:repeating-linear-gradient(90deg,var(--gold) 0 8px,transparent 8px 16px)}
.sh2 .hd h2{font-family:var(--disp);font-size:1.3rem;letter-spacing:.05em}
.sh2 .hd .sub{font-size:.72rem;color:#C9B69C;margin-top:4px}
.sh2 .bd{padding:17px 20px;text-align:center}
.acts{display:flex;gap:9px;flex-wrap:wrap;padding:0 20px calc(19px + var(--pb))}
.acts .btn{flex:1;min-width:118px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:47px;padding:12px 17px;border-radius:12px;
  font-weight:700;font-size:.9rem;background:linear-gradient(160deg,var(--gold-l),var(--gold));color:#4A3208;
  box-shadow:0 4px 0 var(--gold-d);transition:transform .13s,box-shadow .13s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.btn.q{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 rgba(44,33,26,.16);border:1px solid var(--line)}
.btn.q:active{box-shadow:0 0 0}
.btn[disabled]{opacity:.42;pointer-events:none}
.stars{font-size:1.9rem;letter-spacing:7px;color:var(--gold);height:38px}
.statrow{display:flex;gap:9px;margin-top:14px}
.statrow div{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 6px}
.statrow b{display:block;font-family:var(--disp);font-size:1.15rem}
.statrow span{font-size:.64rem;color:var(--dim)}
.modes{display:grid;gap:9px}
.mode{display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:14px;background:var(--paper);
  border:2px solid var(--line);text-align:left}
.mode.on{border-color:var(--gold-d);background:#FFF6E4}
.mode .mi{font-size:1.5rem}
.mode b{display:block;font-size:.94rem}
.mode span{font-size:.75rem;color:var(--dim);line-height:1.5;display:block;margin-top:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}
.row:last-child{border-bottom:0}
.row .rl{font-weight:700;font-size:.88rem} .row .rs{font-size:.72rem;color:var(--dim);margin-top:2px}
.tg{width:50px;height:29px;flex:0 0 50px;border-radius:99px;background:rgba(44,33,26,.2);position:relative;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:var(--sh-s);transition:transform .2s}
.tg.on{background:var(--ok)} .tg.on::after{transform:translateX(21px)}
.legend{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.legend .lg{display:flex;flex-direction:column;align-items:center;width:54px}
.legend .lg svg{width:42px;height:38px}
.legend .lg span{font-size:.55rem;color:var(--dim);text-align:center;line-height:1.1}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + var(--pt));z-index:150;
  display:flex;flex-direction:column;gap:6px;width:min(92vw,400px);pointer-events:none}
.toast{background:var(--wood);color:var(--cream);padding:10px 15px;border-radius:11px;font-size:.83rem;font-weight:600;
  box-shadow:var(--sh);text-align:center;border-left:4px solid var(--gold);animation:tin .25s cubic-bezier(.2,1.3,.4,1)}
.toast.bad{border-left-color:var(--bad)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="logo" viewBox="0 0 120 120">
    <path d="M18 60a42 42 0 0 1 84 0v46H18Z" fill="#6A4B38"/>
    <path d="M28 60a32 32 0 0 1 64 0v46H28Z" fill="#F7EEDC"/>
    <path d="M44 78a16 16 0 0 1 32 0v28H44Z" fill="#3B2A22"/>
    <path d="M18 60a42 42 0 0 1 84 0" fill="none" stroke="#D9A441" stroke-width="5"/>
    <circle cx="60" cy="34" r="6" fill="#D9A441"/>
    <rect x="12" y="102" width="96" height="10" rx="4" fill="#D9A441"/>
  </symbol>
</defs></svg>

<div id="boot" role="status" aria-label="Yükleniyor">
  <div class="bootbox">
    <svg viewBox="0 0 120 120" width="104" height="104" aria-hidden="true"><use href="#logo" xlink:href="#logo"/></svg>
    <h1>BEDESTEN</h1><p>Bul · Üçle · Temizle</p>
  </div>
</div>

<div id="app">
  <section id="menuScr" class="scr" aria-labelledby="mT">
    <div class="page">
      <div class="hero">
        <svg viewBox="0 0 120 120" width="82" height="82" aria-hidden="true"><use href="#logo" xlink:href="#logo"/></svg>
        <h1 id="mT">BEDESTEN</h1><div class="rule"></div><p>Gizli nesne · üçlü eşleştirme</p>
      </div>
      <div style="margin-top:20px">
        <button class="mbtn pri" data-act="play" type="button">
          <span class="ic" aria-hidden="true">🔍</span><span><b id="mNext">Başla</b><span id="mNextSub">1. Bölüm</span></span></button>
        <button class="mbtn" data-act="go-levels" type="button">
          <span class="ic" aria-hidden="true">▦</span><span><b>Bölümler</b><span id="mStars">0 yıldız</span></span></button>
        <button class="mbtn" data-act="pick-mode" type="button">
          <span class="ic" aria-hidden="true">⏱</span><span><b>Oyun modu</b><span id="mMode">Sakin</span></span></button>
        <button class="mbtn" data-act="how" type="button">
          <span class="ic" aria-hidden="true">📜</span><span><b>Nasıl oynanır</b><span>Tek kuralı var</span></span></button>
        <button class="mbtn" data-act="settings" type="button">
          <span class="ic" aria-hidden="true">⚙</span><span><b>Ayarlar</b><span>Ses, hareket, veri</span></span></button>
      </div>
      <p style="text-align:center;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:20px;line-height:1.8">
        Reklam yok · Can yok · Satın alma yok<br>Tamamen Türkçe · İnternet gerekmez</p>
    </div>
  </section>

  <section id="levelScr" class="scr" aria-labelledby="lT">
    <div class="page">
      <div style="display:flex;align-items:center;gap:11px;margin-bottom:16px">
        <button class="hb" data-act="go-menu" type="button" aria-label="Geri"
          style="background:var(--paper);border:1px solid var(--line);color:var(--ink)">←</button>
        <h2 id="lT" class="dsp" style="font-size:1.2rem;font-weight:400">Bölümler</h2>
        <span style="margin-left:auto;font-size:.8rem;font-weight:700" id="lStars">★ 0</span>
      </div>
      <div id="lvList"></div>
    </div>
  </section>

  <section id="gameScr" class="scr" aria-labelledby="gT">
    <header id="hud">
      <button class="hb" data-act="pause" type="button" aria-label="Duraklat">⏸</button>
      <div class="hmid"><div class="t1" id="hLv">1. Bölüm</div><div class="t2" id="hLeft">0 nesne kaldı</div></div>
      <span class="clock" id="hClock">∞</span>
    </header>
    <h2 id="gT" class="sr">Sahne</h2>
    <div id="board"><svg id="scene" role="img" aria-label="Gizli nesne sahnesi" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div id="tools">
      <button class="tool" data-act="tool" data-v="hint" type="button"><i aria-hidden="true">💡</i>İpucu<b id="tHint">3</b></button>
      <button class="tool" data-act="tool" data-v="undo" type="button"><i aria-hidden="true">↩</i>Geri al<b id="tUndo">2</b></button>
      <button class="tool" data-act="tool" data-v="clear" type="button"><i aria-hidden="true">✦</i>Tepsi<b id="tClear">1</b></button>
    </div>
    <div id="tray" role="group" aria-label="Tepsi"></div>
  </section>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalT" hidden>
  <div class="mbg" data-act="modal-bg"></div>
  <div class="sh2">
    <div class="hd"><h2 id="modalT"></h2><div class="sub" id="modalS"></div></div>
    <div class="bd" id="modalB"></div>
    <div class="acts" id="modalA"></div>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================
   A · SABİTLER
   ===================================================================== */
const CFG = { key:"bedesten_v1", W:1000, H:700, SLOTS:7, MATCH:3, maxLevel:12,
              tools:{ hint:3, undo:2, clear:1 } };
const MODES = {
  sakin:   { id:"sakin",   name:"Sakin",   icon:"🍃", time:0,
             desc:"Süre yok. İstediğin kadar bak, istediğin kadar düşün." },
  carsi:   { id:"carsi",   name:"Çarşı",   icon:"⏱", time:1,
             desc:"Süre işler. Bedestenin telaşını hissedersin." }
};

/* çizim yardımcıları */
const R=(x,y,w,h,f,rx)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+f+'"'+(rx?' rx="'+rx+'"':'')+'/>';
const C=(cx,cy,r,f)=>'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+f+'"/>';
const E=(cx,cy,rx,ry,f)=>'<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+f+'"/>';
const P=(d,f)=>'<path d="'+d+'" fill="'+f+'"/>';
const S=(d,st,w,cap)=>'<path d="'+d+'" fill="none" stroke="'+st+'" stroke-width="'+w+'"'+(cap?' stroke-linecap="round"':'')+'/>';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
function shuffleR(a,rnd){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=b[i];b[i]=b[j];b[j]=t; } return b; }

/* =====================================================================
   B · NESNELER  (hepsi 100x100 kutuda, tabanı y=96)
   ===================================================================== */
const OBJ = [
  { id:"cezve", name:"Cezve", draw:()=>
    P("M28 42 L64 42 L58 92 L34 92 Z","#C08A3A")+P("M28 42 L64 42 L62 54 L30 54 Z","#E0AC5A")
    +S("M64 58 L88 50","#8A5F22",7,1)+P("M40 42 L30 26 L58 26 Z","#D9A441")+E(46,92,16,5,"#8A5F22") },
  { id:"semaver", name:"Semaver", draw:()=>
    P("M32 30 Q20 60 30 84 L66 84 Q76 60 64 30 Z","#D9A441")+R(38,20,20,12,"#B7862A",3)

/* zone tanımlarından gerçek yuva listesi üret */
function slotsOf(sceneId){
  const sc = SCENES[sceneId], out = [];
  sc.zones.forEach((z,zi)=>{
    for(let i=0;i<z.n;i++){
      const t = z.n===1 ? .5 : i/(z.n-1);
      out.push({ x: z.x1 + (z.x2-z.x1)*t, y: z.y, s: z.s, f: !!z.f, zi });
    }
  });
  return out;
}

const LEVELS = [];
(function(){
  const scenes = ["bedesten","sahil","pazar"];
  for(let i=1;i<=CFG.maxLevel;i++){
    const sc = scenes[Math.floor((i-1)/4)];
    const kinds = clamp(3 + Math.floor((i-1)/1.7), 3, 9);   // kaç farklı nesne
    const sets  = clamp(3 + Math.floor((i-1)/1.5), 3, 8);  // toplam üçlü sayısı
    LEVELS.push({ id:i, scene:sc, kinds, sets, time: 55 + sets*13 });
  }
})();

/* bölümü kur: her nesneden 3'ün katı adet, yuvalara dağıt */
function buildLevel(id){
  const L = LEVELS.find(l=>l.id===id) || LEVELS[0];
  const rnd = rng(id*7919 + 331);
  const slots = slotsOf(L.scene);
  const maxSets = Math.floor(slots.length / CFG.MATCH);
  const sets = Math.min(L.sets, maxSets);
  const kinds = Math.min(L.kinds, OBJ.length, sets);
  const pool = shuffleR(OBJ.map(o=>o.id), rnd).slice(0, kinds);
  /* üçlüleri türlere dağıt: her tür en az 1 üçlü */
  const per = new Array(kinds).fill(1);
  for(let k=kinds;k<sets;k++) per[Math.floor(rnd()*kinds)]++;
  const items = [];
  per.forEach((cnt,ki)=>{ for(let n=0;n<cnt*CFG.MATCH;n++) items.push(pool[ki]); });
  const place = shuffleR(slots, rnd).slice(0, items.length);
  const bag = shuffleR(items, rnd);
  return { lv:L, scene:L.scene, time:L.time,
           objs: bag.map((id,i)=>({ uid:"o"+i, id, x:place[i].x, y:place[i].y,
                                    s:place[i].s * (0.92 + rnd()*0.16),
                                    r:(rnd()*10-5), f:place[i].f, gone:false })) };
}

const Game = {
  G:null,
  start(id){
    const b = buildLevel(id);
    this.G = { id, scene:b.scene, objs:b.objs, tray:[], t:0,
               time: MODES[save.mode].time ? b.time : 0,
               taps:0, matches:0, over:false, won:false,
               tools:Object.assign({},save.tools), history:[] };
    return this.G;
  },
  left(){ return this.G.objs.filter(o=>!o.gone).length; },
  /* nesneye dokun → tepsiye */
  tap(uid){
    const G=this.G; if(!G || G.over) return { ok:false, why:"bitti" };
    const o = G.objs.find(x=>x.uid===uid);
    if(!o || o.gone) return { ok:false, why:"yok" };
    if(G.tray.length >= CFG.SLOTS) return { ok:false, why:"dolu" };
    G.history.push(uid);
    o.gone = true; G.taps++;
    G.tray.push({ uid, id:o.id });
    const res = { ok:true, cleared:null };
    /* aynı türden 3 varsa temizle */
    const same = G.tray.filter(t=>t.id===o.id);
    if(same.length >= CFG.MATCH){
      const rm = same.slice(0, CFG.MATCH);
      G.tray = G.tray.filter(t=>rm.indexOf(t)<0);
      G.matches++;
      res.cleared = { id:o.id, items:rm };
    }
    /* tepsiyi türe göre grupla ki boşluk kalmasın */
    G.tray.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
    this.check();
    return res;
  },
  undo(){
    const G=this.G;
    if(!G || G.over || G.tools.undo<=0 || !G.history.length) return false;
    const uid = G.history[G.history.length-1];
    const inTray = G.tray.findIndex(t=>t.uid===uid);
    if(inTray<0) return false;                 // eşleşip gitmişse geri alınamaz
    G.history.pop();
    G.tray.splice(inTray,1);
    const o = G.objs.find(x=>x.uid===uid);
    if(o) o.gone = false;
    G.tools.undo--; G.over=false;
    return true;
  },
  /* tepsiyi boşalt: nesneler sahneye döner */
  clearTray(){
    const G=this.G;
    if(!G || G.over || G.tools.clear<=0 || !G.tray.length) return false;
    G.tray.forEach(t=>{ const o=G.objs.find(x=>x.uid===t.uid); if(o) o.gone=false; });
    G.tray = []; G.tools.clear--; G.over=false;
    return true;
  },
  /* ipucu: sahnede tamamlanabilecek bir üçlü bul */
  hint(){
    const G=this.G;
    if(!G || G.over || G.tools.hint<=0) return null;
    const counts={};
    G.objs.forEach(o=>{ if(!o.gone) counts[o.id]=(counts[o.id]||0)+1; });
    /* tepsideki bir türü tamamlamayı öncele */
    const inTray={}; G.tray.forEach(t=>{ inTray[t.id]=(inTray[t.id]||0)+1; });
    let pick=null, bestScore=-Infinity;
    Object.keys(counts).forEach(id=>{
      const need = CFG.MATCH - (inTray[id]||0);
      if(counts[id] < need) return;
      const sc = (inTray[id]||0)*10 - need;
      if(sc > bestScore){ bestScore=sc; pick=id; }
    });
    if(!pick) return null;
    const need = CFG.MATCH - (inTray[pick]||0);
    const list = G.objs.filter(o=>!o.gone && o.id===pick).slice(0, need);
    G.tools.hint--;
    return { id:pick, objs:list.map(o=>o.uid) };
  },
  check(){
    const G=this.G; if(!G || G.over) return;
    if(this.left()===0 && G.tray.length===0){ G.over=true; G.won=true; return; }
    /* tepsi doluysa eşleşme olmamış demektir: hamle kalmadı */
    if(G.tray.length >= CFG.SLOTS){ G.over = true; G.won = false; G.lost = "tepsi"; }
  },
  tick(dt){
    const G=this.G; if(!G || G.over) return;
    G.t += dt;
    if(G.time > 0 && G.t >= G.time){ G.over=true; G.won=false; G.lost="sure"; }
  },
  stars(){
    const G=this.G;
    const perfect = G.matches * CFG.MATCH;
    const waste = G.taps - perfect;
    if(G.time > 0){
      const r = G.t / G.time;
      return r<=0.55 ? 3 : r<=0.8 ? 2 : 1;
    }
    return waste<=0 ? 3 : waste<=4 ? 2 : 1;
  }
};

const Sfx = {
  ctx:null,
  ac(){ if(!save.settings.sound) return null;
    try{ const A=window.AudioContext||window.webkitAudioContext; if(!A) return null;
      if(!this.ctx) this.ctx=new A(); if(this.ctx.state==="suspended") this.ctx.resume(); return this.ctx; }catch(e){ return null; } },
  t(f,d,v,ty){ const c=this.ac(); if(!c) return;
    try{ const o=c.createOscillator(), g=c.createGain(); o.type=ty||"triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,c.currentTime);
      g.gain.exponentialRampToValueAtTime(v||.04,c.currentTime+.015);
      g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+(d||.16));
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+(d||.16)+.02); }catch(e){} },
  pick(){ this.t(560,.09,.03); },
  match(){ [660,880,1100].forEach((f,i)=>setTimeout(()=>this.t(f,.16,.04),i*70)); },
  win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.t(f,.3,.045),i*130)); },
  fail(){ this.t(300,.28,.04,"sine"); setTimeout(()=>this.t(200,.4,.035,"sine"),160); },
  no(){ this.t(160,.12,.04,"square"); },
  buzz(m){ if(navigator.vibrate){ try{ navigator.vibrate(m||10); }catch(e){} } }
};
const Toast={ show(m,k){ const b=$("#toasts"); if(!b) return;
  const e=document.createElement("div"); e.className="toast "+(k||""); e.textContent=m; b.appendChild(e);
  setTimeout(()=>{ e.style.opacity="0"; e.style.transition="opacity .3s"; },1600);
  setTimeout(()=>{ if(e.parentNode) e.parentNode.removeChild(e); },2000); } };
const Modal={
  open(t,sub,body,acts,opts){ const m=$("#modal");
    $("#modalT").textContent=t||""; $("#modalS").textContent=sub||""; $("#modalB").innerHTML=body||"";
    $("#modalA").innerHTML=(acts||[]).map(a=>'<button type="button" class="btn '+(a.cls||"")+'" data-act="'+esc(a.act)+'"'+(a.v!=null?' data-v="'+esc(a.v)+'"':'')+'>'+esc(a.label)+'</button>').join("");
    m.dataset.dismiss=(opts&&opts.dismiss===false)?"0":"1"; m.hidden=false; m.classList.add("on");
    const f=m.querySelector(".btn"); if(f) setTimeout(()=>f.focus(),50); },
  close(){ const m=$("#modal"); m.classList.remove("on"); m.hidden=true; },
  isOpen(){ return $("#modal").classList.contains("on"); }
};

/* =====================================================================
   H · ÇİZİM
   ===================================================================== */
const Render = {
  build(){
    const G=Game.G, sc=SCENES[G.scene], svg=$("#scene");
    svg.setAttribute("viewBox","0 0 "+CFG.W+" "+CFG.H);
    svg.innerHTML =
      '<g data-ly="back">'+sc.back()+'</g>'
      + '<g data-ly="mid"></g>'
      + '<g data-ly="front">'+sc.front()+'</g>'
      + '<g data-ly="top"></g>'
      + '<g data-ly="fx"></g>';
    this.objs();
  },
  objSVG(o){
    const d=OB(o.id); if(!d) return "";
    const tf="translate("+o.x.toFixed(1)+","+o.y.toFixed(1)+") scale("+o.s.toFixed(3)+") rotate("+o.r.toFixed(1)+") translate(-50,-96)";
    return '<g class="obj" data-o="'+o.uid+'" transform="'+tf+'" role="button" tabindex="0" aria-label="'+esc(d.name)+'">'
      + '<rect x="8" y="8" width="84" height="88" fill="transparent"/>' + d.draw() + '</g>';
  },
  objs(){
    const G=Game.G, svg=$("#scene");
    const live=G.objs.filter(o=>!o.gone);
    svg.querySelector('[data-ly="mid"]').innerHTML = live.filter(o=>o.f).map(o=>this.objSVG(o)).join("");
    svg.querySelector('[data-ly="top"]').innerHTML = live.filter(o=>!o.f).map(o=>this.objSVG(o)).join("");
  },
  hint(uids){
    const G=Game.G, fx=$("#scene").querySelector('[data-ly="fx"]');
    fx.innerHTML = uids.map(u=>{ const o=G.objs.find(x=>x.uid===u); if(!o) return "";
      return '<circle class="hintring" cx="'+o.x+'" cy="'+(o.y-46*o.s)+'" r="'+(52*o.s)+'" fill="none" stroke="#F0CE84" stroke-width="5"/>';
    }).join("");
    setTimeout(()=>{ if(fx) fx.innerHTML=""; }, 3200);
  },
  mini(id){ const d=OB(id); if(!d) return "";
    return '<svg viewBox="0 0 100 100" aria-hidden="true">'+d.draw()+'</svg>'; },
  tray(popId){
    const G=Game.G, box=$("#tray");
    let h="";
    for(let i=0;i<CFG.SLOTS;i++){
      const t=G.tray[i];
      const danger = G.tray.length>=CFG.SLOTS-1 && i>=CFG.SLOTS-2;
      h += '<div class="slot'+(t?" fill":"")+(danger?" danger":"")+(t&&t.id===popId?" pop":"")+'"'
         + ' aria-label="'+(t?esc(OB(t.id).name):"boş")+'">'+(t?this.mini(t.id):"")+'</div>';
    }
    box.innerHTML=h;
  },
  hud(){
    const G=Game.G;
    $("#hLv").textContent = G.id+". Bölüm · "+SCENES[G.scene].name;
    $("#hLeft").textContent = Game.left()+" nesne kaldı · "+G.matches+" üçlü";
    const c=$("#hClock");
    if(G.time>0){ const left=Math.max(0,G.time-G.t);
      c.textContent = String(Math.floor(left/60)).padStart(2,"0")+":"+String(Math.floor(left%60)).padStart(2,"0");
      c.className = "clock" + (left<15?" crit":left<35?" warn":"");
    } else { c.textContent="🍃"; c.className="clock"; }
    [["hint","#tHint"],["undo","#tUndo"],["clear","#tClear"]].forEach(p=>{
      const n=G.tools[p[0]]||0; $(p[1]).textContent=n; $(p[1]).parentNode.classList.toggle("out", n<=0);
    });
  }
};

/* =====================================================================
   I · AKIŞ
   ===================================================================== */
const Flow = {
  timer:null,
  play(id){
    Modal.close();
    Game.start(id);
    Render.build(); Render.tray(); Render.hud();
    Nav.go("gameScr");
    clearInterval(this.timer);
    this.timer = setInterval(()=>this.tick(), 250);
  },
  tick(){
    const G=Game.G;
    if(!G || G.over || Modal.isOpen() || Nav.cur!=="gameScr") return;
    Game.tick(0.25);
    Render.hud();
    if(G.over) this.end();
  },
  tap(uid){
    const G=Game.G; if(!G||G.over||Modal.isOpen()) return;
    const r = Game.tap(uid);
    if(!r.ok){ Sfx.no(); return; }
    Sfx.pick(); Sfx.buzz(8);
    Render.objs();
    Render.tray(r.cleared ? r.cleared.id : null);
    Render.hud();
    if(r.cleared){ Sfx.match(); Sfx.buzz([12,40,12]); }
    if(G.over) setTimeout(()=>this.end(), 260);
  },
  tool(kind){
    const G=Game.G; if(!G||G.over) return;
    if(kind==="hint"){
      const h = Game.hint();
      if(!h){ Sfx.no(); Toast.show(G.tools.hint<=0 ? "İpucu hakkın kalmadı." : "Şu an gösterilecek üçlü yok.","bad"); return; }
      Render.hint(h.objs); Render.hud();
      Toast.show(OB(h.id).name + " ara.");
      return;
    }
    if(kind==="undo"){
      if(!Game.undo()){ Sfx.no(); Toast.show(G.tools.undo<=0?"Geri alma hakkın kalmadı.":"Geri alınacak hamle yok.","bad"); return; }
      Modal.close(); Render.objs(); Render.tray(); Render.hud(); Toast.show("Son nesne yerine kondu.");
      return;
    }
    if(kind==="clear"){
      if(!Game.clearTray()){ Sfx.no(); Toast.show(G.tools.clear<=0?"Tepsi boşaltma hakkın kalmadı.":"Tepsi zaten boş.","bad"); return; }
      Modal.close(); Render.objs(); Render.tray(); Render.hud(); Toast.show("Tepsi boşaltıldı.");
    }
  },
  end(){
    const G=Game.G;
    clearInterval(this.timer);
    if(G.won){
      const st=Game.stars(), prev=save.stars[G.id]||0;
      if(st>prev) save.stars[G.id]=st;
      if(G.id>=save.level && G.id<CFG.maxLevel) save.level=G.id+1;
      const b=save.best[G.id];
      if(!b || G.t<b) save.best[G.id]=Math.round(G.t);
      save.tools.hint=Math.min(9,save.tools.hint+1);
      if(G.id%2===0) save.tools.undo=Math.min(9,save.tools.undo+1);
      if(G.id%4===0) save.tools.clear=Math.min(9,save.tools.clear+1);
      persist(); Sfx.win(); Sfx.buzz([16,50,16]);
      Modal.open("Tezgâh temizlendi", SCENES[G.scene].name+" · "+G.id+". Bölüm",
        '<div class="stars">'+"★".repeat(st)+"☆".repeat(3-st)+'</div>'
        + '<div class="statrow"><div><b>'+G.matches+'</b><span>Üçlü</span></div>'
        + '<div><b>'+Math.round(G.t)+' sn</b><span>Süre</span></div>'
        + '<div><b>'+G.taps+'</b><span>Dokunuş</span></div></div>'
        + (st<3 ? '<p style="font-size:.8rem;color:var(--dim);margin-top:13px">'
            + (G.time>0 ? "Daha hızlı bitirirsen üç yıldız." : "Gereksiz dokunuş yapmadan bitirirsen üç yıldız.")+'</p>' : ''),
        G.id<CFG.maxLevel
          ? [{label:"Sonraki", act:"next"},{label:"Tekrar", act:"retry", cls:"q"},{label:"Menü", act:"go-menu", cls:"q"}]
          : [{label:"Menü", act:"go-menu"},{label:"Tekrar", act:"retry", cls:"q"}], {dismiss:false});
    }else{
      Sfx.fail();
      const why = G.lost==="sure" ? "Süre doldu." : "Tepsi doldu ve eşleşecek nesne kalmadı.";
      const canUndo = G.tools.undo>0 && G.tray.length>0;
      const canClear = G.tools.clear>0 && G.tray.length>0;
      const acts=[];
      if(canClear) acts.push({label:"Tepsiyi boşalt ✦", act:"tool", v:"clear"});
      else if(canUndo) acts.push({label:"Son hamleyi geri al", act:"tool", v:"undo"});
      acts.push({label:"Yeniden", act:"retry", cls:acts.length?"q":""});
      acts.push({label:"Menü", act:"go-menu", cls:"q"});
      Modal.open("Bölüm yarım kaldı", SCENES[G.scene].name,
        '<p style="font-size:.9rem;line-height:1.6">'+esc(why)+'</p>'
        + '<div class="statrow"><div><b>'+Game.left()+'</b><span>Kalan nesne</span></div>'
        + '<div><b>'+G.matches+'</b><span>Üçlü</span></div></div>'
        + (save.mode==="carsi" ? '<p style="font-size:.8rem;color:var(--dim);margin-top:12px">Sakin modda süre işlemez; menüden değiştirebilirsin.</p>' : ''),
        acts, {dismiss:false});
    }
  },
  stop(){ clearInterval(this.timer); this.timer=null; }
};

/* =====================================================================
   J · EKRANLAR
   ===================================================================== */
const Nav = {
  cur:"menuScr",
  go(id){
    $$(".scr").forEach(s=>s.classList.toggle("on", s.id===id));
    this.cur=id;
    if(id!=="gameScr") Flow.stop();
    if(id==="menuScr") Screens.menu();
    if(id==="levelScr") Screens.levels();
  }
};
const Screens = {
  menu(){
    $("#mNext").textContent = save.level>1 ? "Devam et" : "Başla";
    $("#mNextSub").textContent = save.level + ". Bölüm · " + SCENES[LEVELS[save.level-1].scene].name;
    $("#mStars").textContent = totalStars() + " / " + (CFG.maxLevel*3) + " yıldız";
    $("#mMode").textContent = MODES[save.mode].name + " — " + (MODES[save.mode].time ? "süreli" : "süresiz");
  },
  levels(){
    $("#lStars").textContent = "★ " + totalStars();
    const groups = {};
    LEVELS.forEach(l=>{ (groups[l.scene]=groups[l.scene]||[]).push(l); });
    $("#lvList").innerHTML = Object.keys(groups).map(sc=>{
      const rows = groups[sc].map(l=>{
        const st=save.stars[l.id]||0, lock=l.id>save.level;
        const cls = lock?"lock":(l.id===save.level?"now":(st?"done":""));
        return '<button type="button" class="lv '+cls+'" data-act="pick" data-v="'+l.id+'"'
          + ' aria-label="'+l.id+'. bölüm'+(lock?", kilitli":"")+'">'
          + '<span class="n">'+(lock?"🔒":l.id)+'</span>'
          + '<span class="st">'+(st?"★".repeat(st):"")+'</span>'
          + '<span class="sc">'+(save.best[l.id]?save.best[l.id]+" sn":"")+'</span></button>';
      }).join("");
      return '<div style="margin-bottom:18px"><h3 class="dsp" style="font-size:.92rem;font-weight:400;margin-bottom:9px">'
        + esc(SCENES[sc].name)+'</h3><div class="lvgrid">'+rows+'</div></div>';
    }).join("");
  },
  pickMode(){
    Modal.open("Oyun modu","İstediğin zaman değiştir",
      '<div class="modes">'+Object.keys(MODES).map(k=>{ const m=MODES[k];
        return '<button type="button" class="mode'+(save.mode===k?" on":"")+'" data-act="set-mode" data-v="'+k+'">'
          + '<span class="mi">'+m.icon+'</span><span><b>'+esc(m.name)+'</b><span>'+esc(m.desc)+'</span></span></button>';
      }).join("")+'</div>',
      [{label:"Tamam", act:"close"}]);
  },
  how(){
    const demo = ["cezve","cezve","cezve"].map(id=>'<span style="display:inline-block;width:38px;height:38px">'+Render.mini(id)+'</span>').join("");
    Modal.open("Nasıl oynanır","Tek kuralı var",
      '<div style="text-align:left;font-size:.9rem;line-height:1.7">'
      + '<p><b>1.</b> Sahnedeki nesnelere dokun; alttaki tepsiye giderler.</p>'
      + '<p style="margin-top:9px"><b>2.</b> Aynı nesneden <b>üç tane</b> toplarsan tepsiden silinir.</p>'
      + '<div style="text-align:center;margin:10px 0">'+demo+' → ✦</div>'
      + '<p><b>3.</b> Tepside 7 yuva var. Yedisi de eşleşmeyen nesneyle dolarsa bölüm biter.</p>'
      + '<p style="margin-top:9px"><b>4.</b> Bazı nesneler tezgâhın, sandığın, teknenin arkasında yarı gizlidir. İyi bak.</p>'
      + '<p style="margin-top:12px;color:var(--dim);font-size:.82rem"><b>Yardımcılar:</b> 💡 bir üçlünün yerini gösterir, '
      + '↩ son nesneyi yerine koyar, ✦ tepsiyi tamamen boşaltır. Bölüm bitirdikçe kazanılır — satın alınmaz.</p></div>',
      [{label:"Anladım", act:"close"}]);
  },
  settings(){
    const s=save.settings;
    const tg=(k,l,d)=>'<div class="row"><div><div class="rl">'+l+'</div><div class="rs">'+d+'</div></div>'
      + '<button type="button" class="tg'+(s[k]?" on":"")+'" role="switch" aria-checked="'+!!s[k]+'" aria-label="'+l+'" data-act="set" data-v="'+k+'"></button></div>';
    Modal.open("Ayarlar","",
      '<div style="background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:2px 14px;text-align:left">'
      + tg("sound","Ses","Toplama ve eşleşme sesleri.") + tg("motion","Hareket","Işıltı ve geçişler.") + '</div>'
      + '<button type="button" class="btn q" style="width:100%;margin-top:12px" data-act="pick-mode">Mod: '+MODES[save.mode].name+'</button>'
      + '<button type="button" class="btn q" style="width:100%;margin-top:9px" data-act="ask-wipe">İlerlemeyi sıfırla</button>'
      + '<p style="font-size:.74rem;color:var(--dim);margin-top:13px;line-height:1.6;text-align:left">'
      + 'BEDESTEN internete bağlanmaz, reklam göstermez, kişisel veri toplamaz. Can/enerji sistemi ve oyun içi para yoktur.</p>',
      [{label:"Kapat", act:"close"}]);
  },
  pause(){
    const G=Game.G;
    Modal.open("Ara verdin", G?(G.id+". Bölüm"):"",
      '<div class="statrow"><div><b>'+(G?Game.left():0)+'</b><span>Kalan</span></div>'
      + '<div><b>'+(G?G.matches:0)+'</b><span>Üçlü</span></div></div>',
      [{label:"Devam", act:"close"},{label:"Yeniden", act:"retry", cls:"q"},{label:"Menü", act:"go-menu", cls:"q"}]);
  }
};
function applySettings(){ document.documentElement.dataset.motion = save.settings.motion?"1":"0"; }

/* =====================================================================
   K · OLAYLAR
   ===================================================================== */
document.addEventListener("click", function(ev){
  const o = ev.target.closest ? ev.target.closest(".obj") : null;
  if(o && Nav.cur==="gameScr" && !Modal.isOpen()){ Flow.tap(o.dataset.o); return; }
  const b = ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v;
  switch(a){
    case "play":       Flow.play(save.level); break;
    case "pick":
      if(Number(v)>save.level){ Sfx.no(); Toast.show("Bu bölüm henüz kilitli."); break; }
      Flow.play(Number(v)); break;
    case "next":       Flow.play(Math.min(CFG.maxLevel, Game.G.id+1)); break;
    case "retry":      Flow.play(Game.G.id); break;
    case "go-levels":  Nav.go("levelScr"); break;
    case "go-menu":    Modal.close(); Nav.go("menuScr"); break;
    case "pause":      Screens.pause(); break;
    case "how":        Screens.how(); break;
    case "settings":   Screens.settings(); break;
    case "pick-mode":  Screens.pickMode(); break;
    case "set-mode":
      save.mode = MODES[v]?v:"sakin"; persist();
      Screens.pickMode(); Screens.menu(); Toast.show("Mod: "+MODES[save.mode].name); break;
    case "tool":       Flow.tool(v); break;
    case "close":      Modal.close(); break;
    case "modal-bg":   if($("#modal").dataset.dismiss!=="0") Modal.close(); break;
    case "set":
      save.settings[v]=!save.settings[v]; persist(); applySettings();
      b.classList.toggle("on", !!save.settings[v]);
      b.setAttribute("aria-checked", !!save.settings[v]); break;
    case "ask-wipe":
      Modal.open("Emin misin?","Geri alınamaz",
        '<p style="font-size:.88rem;line-height:1.6">Bütün bölüm ilerlemen, yıldızların ve yardımcıların silinecek.</p>',
        [{label:"Vazgeç", act:"close", cls:"q"},{label:"Sıfırla", act:"wipe"}]); break;
    case "wipe":
      Store.wipe(); save=Store.read(); persist(); applySettings();
      Modal.close(); Nav.go("menuScr"); Toast.show("Sıfırlandı."); break;
  }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    if(Modal.isOpen() && $("#modal").dataset.dismiss!=="0"){ Modal.close(); return; }
    if(Nav.cur==="gameScr" && !Modal.isOpen()) Screens.pause();
    return;
  }
  const o=document.activeElement && document.activeElement.closest ? document.activeElement.closest(".obj") : null;
  if(o && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); Flow.tap(o.dataset.o); }
});
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) Flow.stop();
  else if(Nav.cur==="gameScr" && Game.G && !Game.G.over){ clearInterval(Flow.timer); Flow.timer=setInterval(()=>Flow.tick(),250); } });

/* =====================================================================
   L · BAŞLANGIÇ
   ===================================================================== */
function boot(){
  Store.init(); save=Store.read(); applySettings();
  Nav.go("menuScr");
  if(!Store.ok) setTimeout(()=>Toast.show("Bu tarayıcıda kayıt kapalı."),1400);
  setTimeout(()=>$("#boot").classList.add("gone"),1100);
}
(function(){
  const api={ CFG,MODES,OBJ,OB,SCENES,LEVELS,buildLevel,slotsOf,Store,Game,Render,Flow,Nav,Screens,
    Modal,Toast,Sfx,applySettings,boot,persist,totalStars,clamp,esc,rng,shuffleR };
  Object.keys(api).forEach(k=>{ try{ window[k]=api[k]; }catch(e){} });
  window.BD=api;
  try{ Object.defineProperty(window,"save",{get:()=>save,set:v=>{save=v;},configurable:true}); }catch(e){}
  if(/[?&]debug=1/.test(location.search)){
    const box=document.createElement("div");
    box.style.cssText="position:fixed;left:6px;top:6px;z-index:190;background:rgba(44,33,26,.95);color:#fff;padding:8px;border-radius:10px;font:11px/1.4 monospace;max-width:170px";
    const b=(t,f)=>{const x=document.createElement("button");x.textContent=t;
      x.style.cssText="display:block;width:100%;margin:3px 0;padding:5px;border-radius:6px;background:#D9A441;color:#3A2708;font:inherit;font-weight:700";
      x.addEventListener("click",f);box.appendChild(x);};
    b("Tüm bölümler",()=>{save.level=CFG.maxLevel;persist();Screens.menu();Toast.show("Açıldı");});
    b("+5 yardımcı",()=>{ if(Game.G){Game.G.tools.hint+=5;Game.G.tools.undo+=5;Game.G.tools.clear+=5;Render.hud();} });
    b("Bölümü bitir",()=>{ if(Game.G){ Game.G.objs.forEach(o=>o.gone=true); Game.G.tray=[]; Game.G.over=true; Game.G.won=true; Flow.end(); } });
    b("Kapat",()=>box.remove());
    document.body.appendChild(box);
  }
})();
boot();
</script>
