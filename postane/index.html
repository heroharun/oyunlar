<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E23E3E">
<meta name="description" content="Minik Postane: Kasabanın Mektupları — 6-12 yaş için ücretsiz, reklamsız, çevrimdışı çalışan postane oyunu.">
<title>Minik Postane: Kasabanın Mektupları</title>
<style>
/* ==========================================================================
   MİNİK POSTANE: KASABANIN MEKTUPLARI
   Tek dosya · vanilla JS · çevrimdışı
   Tasarım fikri: tırtıklı pul kenarı ana motif; kağıt-karton dokusu,
   posta kırmızısı + hardal sarısı, yumuşak "sticker" gölgeleri.
   ========================================================================== */
:root{
  --kirmizi:#E23E3E;   --kirmizi-koyu:#B92C2C;
  --sari:#FFC93C;      --sari-koyu:#E0A711;
  --mavi:#8ED2F5;      --mavi-koyu:#3D9AD1;
  --yesil:#6FCF97;     --yesil-koyu:#3EA46B;
  --turuncu:#FF9A52;   --turuncu-koyu:#E2762B;
  --mor:#B79CE8;       --mor-koyu:#8365C4;
  --krem:#FFF6E9;      --kagit:#FDECD4;
  --kart:#FFFFFF;
  --murekkep:#3A2B3F;  --murekkep-soft:#7A6A80;
  --cizgi:#E7D8C4;
  --golge:0 5px 0 rgba(58,43,63,.13), 0 12px 26px rgba(58,43,63,.13);
  --golge-kucuk:0 3px 0 rgba(58,43,63,.12);
  --r:20px; --r-buyuk:28px;
  --f-baslik:"Comic Sans MS","Chalkboard SE","Baloo 2",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --f-govde:"Trebuchet MS",ui-rounded,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{
  font-family:var(--f-govde); font-size:17px; line-height:1.45; color:var(--murekkep);
  background:
    radial-gradient(circle at 12% 6%, #FFF9EE 0%, transparent 45%),
    radial-gradient(circle at 88% 8%, #E6F4FF 0%, transparent 45%),
    linear-gradient(180deg,#FFF3E2 0%, #FDEBD8 55%, #EAF7EE 100%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
h1,h2,h3{font-family:var(--f-baslik); margin:0 0 8px; letter-spacing:.2px}
h1{font-size:30px} h2{font-size:23px} h3{font-size:19px}
p{margin:0 0 10px}
button{font-family:inherit;color:inherit;font-size:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:4px solid var(--mavi-koyu); outline-offset:3px; border-radius:8px}
.gizli{display:none !important}

/* ---------- ortak bileşenler ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;min-width:52px;padding:12px 20px;
  border-radius:16px;background:var(--kart);color:var(--murekkep);
  font-family:var(--f-baslik);font-size:18px;
  box-shadow:var(--golge-kucuk); border:3px solid var(--cizgi);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.birincil{background:var(--kirmizi);color:#fff;border-color:var(--kirmizi-koyu)}
.btn.sari{background:var(--sari);border-color:var(--sari-koyu)}
.btn.yesil{background:var(--yesil);border-color:var(--yesil-koyu);color:#12371f}
.btn.mavi{background:var(--mavi);border-color:var(--mavi-koyu);color:#0d3448}
.btn.kucuk{min-height:44px;padding:8px 14px;font-size:16px;border-radius:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* pul kenarı — imza motifi */
.pulkenar{
  background:var(--kart);
  border-radius:6px;
  filter:drop-shadow(0 4px 0 rgba(58,43,63,.10)) drop-shadow(0 10px 18px rgba(58,43,63,.12));
  -webkit-mask:
    radial-gradient(circle at 0 0, transparent 5px, #000 5.5px) 0 0/12px 12px,
    linear-gradient(#000,#000) 6px 6px/calc(100% - 12px) calc(100% - 12px) no-repeat;
  mask:
    radial-gradient(circle at 0 0, transparent 5px, #000 5.5px) 0 0/12px 12px,
    linear-gradient(#000,#000) 6px 6px/calc(100% - 12px) calc(100% - 12px) no-repeat;
}
.panel{background:var(--kart);border:3px solid var(--cizgi);border-radius:var(--r);box-shadow:var(--golge);padding:16px}

/* ---------- ekran yapısı ---------- */
#uyg{min-height:100%;display:flex;flex-direction:column}
.ekran{display:none;flex:1;flex-direction:column}
.ekran.aktif{display:flex}

/* ---------- ANA MENÜ ---------- */
#menu{position:relative;overflow:hidden;padding:0 0 24px}
.gokyuzu{position:absolute;inset:0 0 auto;height:260px;background:linear-gradient(180deg,#BFE7FF,#E9F7FF 85%);z-index:0}
.bulut{position:absolute;top:26px;left:-160px;opacity:.95;z-index:1;animation:suz 46s linear infinite}
.bulut.b2{top:78px;animation-duration:64s;animation-delay:-18s;transform:scale(.72)}
.bulut.b3{top:132px;animation-duration:80s;animation-delay:-40s;transform:scale(.55);opacity:.8}
@keyframes suz{from{transform:translateX(0)}to{transform:translateX(120vw)}}
.zarfucus{position:absolute;z-index:2;animation:zarfuc 14s ease-in-out infinite}
@keyframes zarfuc{0%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(28px,-22px) rotate(9deg)}100%{transform:translate(0,0) rotate(-8deg)}}
.menu-sahne{position:relative;z-index:3;padding:14px 16px 0;max-width:940px;margin:0 auto;width:100%}
.menu-baslik{text-align:center;margin-bottom:6px}
.menu-baslik h1{
  font-size:clamp(28px,7vw,46px);color:var(--kirmizi);
  text-shadow:0 3px 0 #fff, 0 5px 0 rgba(58,43,63,.18);
}
.menu-baslik .alt{font-family:var(--f-baslik);color:#2c5b74;font-size:clamp(14px,3.4vw,19px)}
.sahne-resim{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:4px 0 10px;position:relative;min-height:170px}
.bisikletli{position:absolute;bottom:-4px;left:-140px;animation:gec 17s linear infinite;z-index:4}
@keyframes gec{from{transform:translateX(0)}to{transform:translateX(110vw)}}
.menu-liste{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px;max-width:720px;margin:0 auto}
.menu-liste .btn{width:100%;justify-content:flex-start;font-size:17px}
.rozet-satiri{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px}
.sayac{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--cizgi);border-radius:999px;padding:6px 14px;font-family:var(--f-baslik);box-shadow:var(--golge-kucuk)}

/* ---------- OYUN EKRANI ---------- */
.ust-bar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 12px;background:rgba(255,246,233,.94);backdrop-filter:blur(6px);
  border-bottom:3px solid var(--cizgi);
}
.ust-bar .sayac{padding:4px 11px;font-size:15px;border-width:2px}
.ust-bar .bosluk{flex:1}
.oyun-govde{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px;max-width:1000px;margin:0 auto;width:100%}
.pati-kutu{display:flex;gap:12px;align-items:flex-start}
.pati-kutu svg{flex:0 0 auto}
.balon{
  position:relative;background:var(--kart);border:3px solid var(--cizgi);border-radius:18px;
  padding:11px 14px;box-shadow:var(--golge-kucuk);flex:1;min-height:56px;font-size:17px;
}
.balon::before{content:"";position:absolute;left:-13px;top:20px;width:0;height:0;
  border:11px solid transparent;border-right-color:var(--cizgi)}
.balon::after{content:"";position:absolute;left:-8px;top:20px;width:0;height:0;
  border:11px solid transparent;border-right-color:var(--kart)}
.balon b{color:var(--kirmizi-koyu)}

.adim-rayi{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.adim-rozet{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  background:#fff;border:3px solid var(--cizgi);font-family:var(--f-baslik);font-size:14px;
  color:var(--murekkep-soft);white-space:nowrap;
}
.adim-rozet.simdi{background:var(--sari);border-color:var(--sari-koyu);color:var(--murekkep);transform:scale(1.04)}
.adim-rozet.bitti{background:var(--yesil);border-color:var(--yesil-koyu);color:#12371f}

.calisma{
  background:var(--kart);border:3px solid var(--cizgi);border-radius:var(--r-buyuk);
  box-shadow:var(--golge);padding:16px;min-height:260px;
  background-image:linear-gradient(180deg,#fff, #FFFBF4);
}
.calisma h3{text-align:center;color:var(--kirmizi-koyu)}
.aciklama{text-align:center;color:var(--murekkep-soft);margin-bottom:12px;font-size:16px}

.secim-izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.secim{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;
  background:var(--kagit);border:3px solid var(--cizgi);border-radius:16px;
  font-family:var(--f-baslik);font-size:14px;text-align:center;min-height:96px;justify-content:center;
  transition:transform .12s ease;
}
.secim:hover{transform:translateY(-3px)}
.secim.secili{border-color:var(--yesil-koyu);background:#EAFBF0;box-shadow:0 0 0 4px rgba(111,207,151,.35)}
.secim.dogru{border-color:var(--yesil-koyu);background:#DDF7E6}
.secim.yanlis{animation:salla .4s ease}
.secim.parla{animation:parla 1.1s ease-in-out infinite}
@keyframes salla{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes parla{0%,100%{box-shadow:0 0 0 0 rgba(255,201,60,0)}50%{box-shadow:0 0 0 8px rgba(255,201,60,.65)}}
.secim .tik{position:absolute;top:4px;right:6px;font-size:18px}
.secim{position:relative}

.satir{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.merkez{text-align:center}

/* sürükle-bırak */
.tasinir{cursor:grab;touch-action:none;user-select:none}
.tasinir.tutuluyor{opacity:.55}
.hedef{border:4px dashed var(--cizgi);border-radius:18px;min-height:92px;display:flex;align-items:center;
  justify-content:center;flex-wrap:wrap;gap:6px;padding:8px;background:#FFFDF7;transition:background .15s}
.hedef.uzerinde{background:#EAFBF0;border-color:var(--yesil-koyu)}
.hedef-baslik{font-family:var(--f-baslik);font-size:14px;text-align:center;margin-bottom:4px}
.bolme-izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.havuz{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:80px;margin-bottom:12px}

/* adres kartı */
.adres-kart{
  max-width:330px;margin:0 auto 14px;padding:12px 14px;border-radius:16px;
  background:repeating-linear-gradient(45deg,#FFFDF6,#FFFDF6 9px,#FFF7E6 9px,#FFF7E6 18px);
  border:3px solid var(--cizgi);box-shadow:var(--golge-kucuk);
}
.adres-kart .sat{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:16px}
.renk-nokta{width:20px;height:20px;border-radius:6px;border:2px solid rgba(58,43,63,.28);flex:0 0 auto}

/* terazi */
.terazi{display:flex;flex-direction:column;align-items:center;gap:6px}
.terazi-cizgi{width:220px;height:14px;background:var(--cizgi);border-radius:8px;overflow:hidden}
.terazi-dolgu{height:100%;background:linear-gradient(90deg,var(--yesil),var(--sari),var(--turuncu));transition:width .5s ease}

/* bant çekme */
.bant-yol{position:relative;width:min(300px,88%);height:46px;margin:14px auto;border-radius:12px;
  background:repeating-linear-gradient(90deg,#EFE2CC,#EFE2CC 10px,#E5D5B9 10px,#E5D5B9 20px);
  border:3px solid var(--cizgi);overflow:hidden;touch-action:none}
.bant-dolgu{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(180deg,#FFE9A8,#F6CF67);border-right:3px solid #D9AE3E}
.bant-tut{position:absolute;top:-6px;left:0;width:44px;height:58px;border-radius:12px;background:var(--kirmizi);
  border:3px solid var(--kirmizi-koyu);box-shadow:var(--golge-kucuk);cursor:grab;touch-action:none}

/* harita */
.harita-sar{overflow:auto;padding:6px;display:flex;justify-content:center}
.harita{display:grid;gap:2px;background:#CDE9C9;padding:8px;border-radius:18px;border:3px solid var(--cizgi);box-shadow:var(--golge)}
.kare{width:42px;height:42px;border-radius:7px;background:#CDE9C9;position:relative;display:flex;align-items:center;justify-content:center;font-size:18px}
.kare.yol{background:#E9E2D3;border:1px dashed #CDBFA5}
.kare.yol.kapali{background:#F0C9C9;border:2px solid var(--kirmizi)}
.kare.yol.rota{background:var(--sari);box-shadow:inset 0 0 0 2px var(--sari-koyu)}
.kare.yol.oneri{background:#FFF0C2}
.kare.yer{background:#FBF3E4;border:2px solid var(--cizgi);cursor:pointer}
.kare.yer.hedef-ev{box-shadow:0 0 0 4px rgba(111,207,151,.7)}
.kare.yer.secili{box-shadow:0 0 0 4px var(--yesil-koyu)}
.kare.su{background:#A9DDF5}
.kare.postane{background:var(--kirmizi);color:#fff;border:2px solid var(--kirmizi-koyu)}
.harita-efsane{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:14px;margin-top:8px;color:var(--murekkep-soft)}

/* mini oyun sahneleri */
.sahne{position:relative;width:100%;max-width:560px;height:280px;margin:0 auto;border-radius:20px;overflow:hidden;
  border:3px solid var(--cizgi);box-shadow:var(--golge-kucuk);touch-action:none}
.sahne.yol{background:linear-gradient(180deg,#CFEBFF 0%,#CFEBFF 32%,#8FD3A2 32%,#8FD3A2 44%,#DED2BC 44%,#DED2BC 100%)}
.sahne.gok{background:linear-gradient(180deg,#BFE7FF,#E9F7FF)}
.sahne.deniz{background:linear-gradient(180deg,#BFE7FF 0%,#BFE7FF 38%,#7FC9EC 38%,#7FC9EC 100%)}
.oyuncu{position:absolute;transition:none;z-index:5}
.engel{position:absolute;z-index:3}
.puan-rozet{position:absolute;top:8px;right:10px;background:rgba(255,255,255,.9);border-radius:999px;padding:4px 12px;
  font-family:var(--f-baslik);font-size:15px;z-index:9;border:2px solid var(--cizgi)}
.yon-tus{display:flex;gap:14px;justify-content:center;margin-top:12px}
.yon-tus .btn{width:84px;height:60px;font-size:26px}

/* modal */
.perde{position:fixed;inset:0;background:rgba(58,43,63,.5);display:flex;align-items:center;justify-content:center;
  padding:14px;z-index:60;animation:ac .2s ease}
@keyframes ac{from{opacity:0}to{opacity:1}}
.modal{background:var(--krem);border:4px solid var(--cizgi);border-radius:var(--r-buyuk);box-shadow:0 18px 50px rgba(58,43,63,.3);
  max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.modal h2{text-align:center;color:var(--kirmizi-koyu)}
.modal-kapat{position:sticky;top:0;float:right;margin:-8px -6px 0 0}

/* albüm & defter */
.izgara-kart{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pul-hucre{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;text-align:center;cursor:pointer}
.pul-hucre.kilitli{opacity:.32;filter:grayscale(1)}
.defter-satir{display:flex;gap:12px;align-items:center;padding:10px;border-bottom:2px dashed var(--cizgi)}
.defter-satir:last-child{border-bottom:none}
.etiket{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-family:var(--f-baslik);
  background:var(--mavi);color:#0d3448;border:2px solid var(--mavi-koyu)}
.etiket.nadir{background:var(--sari);border-color:var(--sari-koyu)}
.etiket.efsane{background:var(--mor);border-color:var(--mor-koyu);color:#fff}

/* kutlama */
.kutlama{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.konfeti{position:absolute;font-size:26px;animation:dus 2.4s ease-in forwards}
@keyframes dus{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(105vh) rotate(540deg);opacity:.2}}

.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

.dukkan-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.dukkan-kart{background:#fff;border:3px solid var(--cizgi);border-radius:16px;padding:10px;text-align:center;font-size:14px}
.dukkan-kart.alindi{background:#EAFBF0;border-color:var(--yesil-koyu)}

.mini-ipucu{background:#FFF6DA;border:3px dashed var(--sari-koyu);border-radius:14px;padding:10px 12px;margin:10px 0;font-size:16px}

@media (max-width:520px){
  body{font-size:16px}
  .kare{width:34px;height:34px;font-size:15px}
  .sahne{height:240px}
  .oyun-govde{padding:9px}
  .calisma{padding:12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .bulut,.bisikletli,.zarfucus{display:none}
}

/* ── mobil kompakt ── */
@media (max-height:860px){
  .gokyuzu{height:165px}
  .menu-sahne{padding:8px 14px 0}
  .menu-baslik{margin-bottom:2px}
  .menu-liste{gap:8px}
  .menu-liste .btn{font-size:14.5px;min-height:46px;padding:8px 10px}
  #menu{padding-bottom:10px}
}
</style>
</head>
<body>
<div id="uyg">

  <!-- ================= ANA MENÜ ================= -->
  <section id="menu" class="ekran aktif" aria-label="Ana menü">
    <div class="gokyuzu" aria-hidden="true"></div>
    <div class="bulut" aria-hidden="true"></div>
    <div class="bulut b2" aria-hidden="true"></div>
    <div class="bulut b3" aria-hidden="true"></div>
    <div class="bisikletli" aria-hidden="true"></div>

    <div class="menu-sahne">
      <div class="menu-baslik">
        <h1>Minik Postane</h1>
        <div class="alt">Kasabanın Mektupları</div>
      </div>

      <div class="sahne-resim" id="menuSahne" aria-hidden="true"></div>

      <div class="rozet-satiri" id="menuSayaclar"></div>

      <div class="menu-liste" id="menuListe">
        <button class="btn birincil" data-act="basla">▶️ Oyuna Başla</button>
        <button class="btn sari" data-act="serbest">✉️ Serbest Teslimat</button>
        <button class="btn mavi" data-act="harita">🗺️ Kasaba Haritası</button>
        <button class="btn" data-act="album">📔 Pul Albümüm</button>
        <button class="btn" data-act="defter">👥 Karakter Defteri</button>
        <button class="btn" data-act="dukkan">🎀 Postanemi Süsle</button>
        <button class="btn" data-act="rozetler">🏅 Rozetlerim</button>
        <button class="btn" data-act="nasil">❓ Nasıl Oynanır?</button>
        <button class="btn" data-act="ses">🔊 Ses Açık</button>
        <button class="btn" data-act="sifirla">♻️ Oyunu Sıfırla</button>
      </div>
      <p class="merkez" style="margin-top:14px;color:var(--murekkep-soft);font-size:14px">
        Reklamsız · üyeliksiz · internetsiz çalışır
      </p>
    </div>
  </section>

  <!-- ================= OYUN ================= -->
  <section id="oyun" class="ekran" aria-label="Postane">
    <header class="ust-bar">
      <button class="btn kucuk" data-act="menuye">🏠 Menü</button>
      <span class="sayac" id="sAltin">🪙 0</span>
      <span class="sayac" id="sYildiz">⭐ 0</span>
      <span class="sayac" id="sMutlu">💗 0</span>
      <span class="bosluk"></span>
      <span class="sayac" id="sBolum">📍 1. Bölge</span>
      <button class="btn kucuk" data-act="ipucu">💡 İpucu</button>
      <button class="btn kucuk" data-act="ses2">🔊</button>
    </header>

    <div class="oyun-govde">
      <div class="pati-kutu">
        <div id="patiResim"></div>
        <div class="balon" id="patiBalon" role="status" aria-live="polite">Hazırlanıyor…</div>
      </div>

      <div class="adim-rayi" id="adimRayi" aria-label="Görev adımları"></div>

      <div class="calisma" id="calisma"></div>

      <div id="ipucuKutu"></div>
    </div>
  </section>

</div>

<div id="modalYuva"></div>
<div class="kutlama" id="kutlamaYuva" aria-hidden="true"></div>

<script>
/* ==========================================================================
   1) ÇİZİM KİTAPLIĞI — hepsi inline SVG, harici görsel yok
   ========================================================================== */
const KONTUR = '#3A2B3F';

function sv(w,h,vb,ic,ek){return `<svg width="${w}" height="${h}" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" ${ek||''} aria-hidden="true">${ic}</svg>`;}

/* ---------- pul ---------- */
function svgPul(p, boy){
  const w = boy||58, h = Math.round((boy||58)*1.24);
  const delik=[];
  for(let i=0;i<7;i++){ delik.push(`<circle cx="${5+i*8.3}" cy="0" r="3" fill="#fff"/>`); delik.push(`<circle cx="${5+i*8.3}" cy="72" r="3" fill="#fff"/>`); }
  for(let i=0;i<9;i++){ delik.push(`<circle cx="0" cy="${5+i*8}" r="3" fill="#fff"/>`); delik.push(`<circle cx="58" cy="${5+i*8}" r="3" fill="#fff"/>`); }
  const motif = (MOTIFLER[p.motif]||MOTIFLER.cicek)(p.r1,p.r2);
  return sv(w,h,'0 0 58 72',
    `<rect x="2" y="2" width="54" height="68" rx="4" fill="${p.zemin}" stroke="${KONTUR}" stroke-width="1.6"/>
     <rect x="6" y="6" width="46" height="46" rx="3" fill="#FFFDF6" stroke="${KONTUR}" stroke-width="1"/>
     <g transform="translate(9 9) scale(1.15)">${motif}</g>
     <text x="29" y="61" font-size="7" text-anchor="middle" fill="${KONTUR}" font-family="Trebuchet MS">MİNİK POSTA</text>
     <text x="29" y="68" font-size="6.5" text-anchor="middle" fill="${KONTUR}" font-family="Trebuchet MS">${p.deger}</text>
     ${delik.join('')}`);
}

/* ---------- karakterler ---------- */
function yuz(ifade){

    mutlu:'<circle cx="41" cy="40" r="3.4" fill="#3A2B3F"/><circle cx="59" cy="40" r="3.4" fill="#3A2B3F"/><path d="M42 50 q8 7 16 0" stroke="#3A2B3F" stroke-width="2.4" fill="none" stroke-linecap="round"/>',
    dusunen:'<circle cx="41" cy="40" r="3.4" fill="#3A2B3F"/><circle cx="59" cy="40" r="3.4" fill="#3A2B3F"/><path d="M44 51 h12" stroke="#3A2B3F" stroke-width="2.4" stroke-linecap="round"/><path d="M34 33 q6-4 12-1" stroke="#3A2B3F" stroke-width="2" fill="none"/>',
    ipucu:'<circle cx="41" cy="40" r="3.4" fill="#3A2B3F"/><circle cx="59" cy="40" r="3.4" fill="#3A2B3F"/><path d="M43 50 q7 5 14 0" stroke="#3A2B3F" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M72 20 a6 6 0 1 1 -8 5 v4 h6 v-4 a6 6 0 0 0 2-5Z" fill="#FFC93C" stroke="#3A2B3F" stroke-width="1.6"/>',
    sasiran:'<circle cx="41" cy="39" r="4.6" fill="#fff" stroke="#3A2B3F" stroke-width="1.6"/><circle cx="41" cy="39" r="2.2" fill="#3A2B3F"/><circle cx="59" cy="39" r="4.6" fill="#fff" stroke="#3A2B3F" stroke-width="1.6"/><circle cx="59" cy="39" r="2.2" fill="#3A2B3F"/><ellipse cx="50" cy="52" rx="5" ry="6" fill="#3A2B3F"/>',
    alkis:'<path d="M37 40 q4-4 8 0 M55 40 q4-4 8 0" stroke="#3A2B3F" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M41 49 q9 9 18 0" stroke="#3A2B3F" stroke-width="2.6" fill="none" stroke-linecap="round"/>',
    kutlama:'<path d="M37 40 q4-4 8 0 M55 40 q4-4 8 0" stroke="#3A2B3F" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M40 48 q10 12 20 0 Z" fill="#B92C2C" stroke="#3A2B3F" stroke-width="2"/>'
  };
  return g[ifade]||g.mutlu;
}

function svgKarakter(m, boy){
  const h = boy||128, w = Math.round(h*0.83);
  const ten = m.ten||'#F6D3B6', kiy = m.kiyafet||'#8ED2F5';
  let bas='', kulak='', ust='';
  if(m.tur==='kedi') kulak=`<path d="M28 26 L24 6 L44 16Z M72 26 L76 6 L56 16Z" fill="${ten}" stroke="${KONTUR}" stroke-width="2.4"/>`;
  if(m.tur==='kopek') kulak=`<ellipse cx="24" cy="42" rx="8" ry="16" fill="${m.sac||'#C98A4B'}" stroke="${KONTUR}" stroke-width="2.4"/><ellipse cx="76" cy="42" rx="8" ry="16" fill="${m.sac||'#C98A4B'}" stroke="${KONTUR}" stroke-width="2.4"/>`;
  if(m.tur==='tavsan') kulak=`<ellipse cx="38" cy="12" rx="6" ry="18" fill="${ten}" stroke="${KONTUR}" stroke-width="2.4"/><ellipse cx="62" cy="12" rx="6" ry="18" fill="${ten}" stroke="${KONTUR}" stroke-width="2.4"/>`;
  if(m.tur==='robot'){
    bas=`<rect x="24" y="18" width="52" height="48" rx="10" fill="${ten}" stroke="${KONTUR}" stroke-width="2.6"/>
         <path d="M50 18 v-8" stroke="${KONTUR}" stroke-width="2.6"/><circle cx="50" cy="7" r="4.5" fill="${m.sac||'#FFC93C'}" stroke="${KONTUR}" stroke-width="2"/>`;
  } else {
    bas=`<circle cx="50" cy="42" r="26" fill="${ten}" stroke="${KONTUR}" stroke-width="2.6"/>`;
  }
  if(m.tur==='insan'||!m.tur){
    const s=m.sac||'#4A3220';
    if(m.sacTip===0) ust=`<path d="M24 40 q3-26 26-26 q23 0 26 26 q-6-12-26-12 q-20 0-26 12Z" fill="${s}" stroke="${KONTUR}" stroke-width="2.2"/>`;
    if(m.sacTip===1) ust=`<path d="M24 40 q3-26 26-26 q23 0 26 26 q-6-12-26-12 q-20 0-26 12Z" fill="${s}" stroke="${KONTUR}" stroke-width="2.2"/><ellipse cx="24" cy="52" rx="7" ry="18" fill="${s}" stroke="${KONTUR}" stroke-width="2.2"/><ellipse cx="76" cy="52" rx="7" ry="18" fill="${s}" stroke="${KONTUR}" stroke-width="2.2"/>`;
    if(m.sacTip===2) ust=`<path d="M24 40 q3-26 26-26 q23 0 26 26 q-6-12-26-12 q-20 0-26 12Z" fill="${s}" stroke="${KONTUR}" stroke-width="2.2"/><circle cx="50" cy="10" r="10" fill="${s}" stroke="${KONTUR}" stroke-width="2.2"/>`;
    if(m.sacTip===3) ust=`<path d="M20 34 h60 v-4 q0-16-30-16 q-30 0-30 16Z" fill="${m.sapka||'#E23E3E'}" stroke="${KONTUR}" stroke-width="2.4"/><rect x="14" y="32" width="72" height="7" rx="3.5" fill="${m.sapka||'#E23E3E'}" stroke="${KONTUR}" stroke-width="2.2"/>`;
  }
  if(m.basortu) ust=`<path d="M20 46 q0-32 30-32 q30 0 30 32 q0 10-6 12 q-4-30-24-30 q-20 0-24 30 q-6-2-6-12Z" fill="${m.basortu}" stroke="${KONTUR}" stroke-width="2.4"/>
    <path d="M22 52 q-6 22 4 32 h48 q10-10 4-32 q-8 8-28 8 q-20 0-28-8Z" fill="${m.basortu}" stroke="${KONTUR}" stroke-width="2.4"/>`;
  const govde=`<path d="M22 118 v-16 q0-18 28-20 q28 2 28 20 v16Z" fill="${kiy}" stroke="${KONTUR}" stroke-width="2.6"/>`;
  const aks = m.gozluk? `<circle cx="41" cy="40" r="9" fill="none" stroke="${KONTUR}" stroke-width="2"/><circle cx="59" cy="40" r="9" fill="none" stroke="${KONTUR}" stroke-width="2"/><path d="M50 40 h0" stroke="${KONTUR}" stroke-width="2"/><path d="M50 40 h0"/>`:'';
  return sv(w,h,'0 0 100 128', kulak+govde+bas+ust+yuz(m.ifade||'mutlu')+aks);
}

     <ellipse cx="78" cy="44" rx="9" ry="17" fill="#C98A4B" stroke="${KONTUR}" stroke-width="2.4"/>

/* ---------- zarf ---------- */
function svgZarf(renk, opt){
  opt=opt||{};
  const w=opt.w||150, h=Math.round((opt.w||150)*0.66);
  const pul = opt.pul? `<g transform="translate(70 12) scale(.36)">${svgPul(opt.pul,58).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')}</g>`:'';
  const yazi = opt.adres? `<g font-family="Trebuchet MS" font-size="8" fill="${KONTUR}">
      <text x="18" y="60">${opt.adres[0]||''}</text><text x="18" y="72">${opt.adres[1]||''}</text></g>`:'';
  const kapak = opt.acik
    ? `<path d="M4 8 L98 8 L51 -22Z" fill="${renk}" stroke="${KONTUR}" stroke-width="2.4"/>`
    : `<path d="M4 8 L51 48 L98 8" fill="none" stroke="${KONTUR}" stroke-width="2.4"/>`;
  return sv(w,h,'-4 -26 110 96',
    `<rect x="4" y="8" width="94" height="60" rx="5" fill="${renk}" stroke="${KONTUR}" stroke-width="2.6"/>
     ${kapak}${yazi}${pul}`);
}

/* ---------- kutu ---------- */
const KUTU_OLCU={cokkucuk:[34,26],kucuk:[46,36],orta:[62,48],buyuk:[80,62],uzun:[92,30],yuvarlak:[58,58]};
function svgKutu(boyut, opt){
  opt=opt||{};
  const o=KUTU_OLCU[boyut]||KUTU_OLCU.orta, w=o[0], h=o[1], ol=1.9;
  const cx=60, cy=54;
  if(boyut==='yuvarlak'){
    return sv(96,84,'0 0 120 100',
      `<ellipse cx="60" cy="58" rx="30" ry="30" fill="#E0B682" stroke="${KONTUR}" stroke-width="2.6"/>
       <ellipse cx="60" cy="58" rx="22" ry="22" fill="#C98A4B" stroke="${KONTUR}" stroke-width="2"/>
       ${opt.bant?`<path d="M30 58 h60 M60 28 v60" stroke="#F6CF67" stroke-width="7"/>`:''}`);
  }
  return sv(96,84,'0 0 120 100',
    `<rect x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="5" fill="#E0B682" stroke="${KONTUR}" stroke-width="2.6"/>
     <path d="M${cx-w/2} ${cy-h/2+8} h${w}" stroke="${KONTUR}" stroke-width="${ol}" opacity=".55"/>
     ${opt.bant?`<path d="M${cx} ${cy-h/2} v${h}" stroke="#F6CF67" stroke-width="8"/><path d="M${cx} ${cy-h/2} v${h}" stroke="#D9AE3E" stroke-width="1.6"/>`:''}
     ${opt.etiket?`<rect x="${cx-w/2+5}" y="${cy-h/2+5}" width="18" height="12" rx="2" fill="#FFFDF6" stroke="${KONTUR}" stroke-width="1.4"/>`:''}`);
}

});
let D = varsayilanDurum();

function kaydet(){
  try{ localStorage.setItem(KAYIT_ANAHTAR, JSON.stringify(D)); }catch(e){}

function yukle(){
  try{
    const h = localStorage.getItem(KAYIT_ANAHTAR);
    if(h){ const o=JSON.parse(h); D = Object.assign(varsayilanDurum(), o);
      D.sayac = Object.assign(varsayilanDurum().sayac, o.sayac||{});
      D.sayac.arac = Object.assign({}, (o.sayac&&o.sayac.arac)||{});
    }
  }catch(e){ D = varsayilanDurum(); }
  if(Object.keys(D.pulAcik).length===0){

/* ---- kısayollar ---- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function yap(tag, cls, ic){ const e=document.createElement(tag); if(cls) e.className=cls; if(ic!=null) e.innerHTML=ic; return e; }
function karistir(a, tohum){ // deterministik karıştırma
  const d=a.slice(); let t=(tohum||7)*9301+49297;
  for(let i=d.length-1;i>0;i--){ t=(t*9301+49297)%233280; const j=Math.floor(t/233280*(i+1)); [d[i],d[j]]=[d[j],d[i]]; }
  return d;
}

/* ---- ses (Web Audio, harici dosya yok) ---- */
let sesBaglam=null;
function sesAc(){ if(!sesBaglam){ try{ sesBaglam = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ sesBaglam=null; } } return sesBaglam; }
function ton(f, sure, tip, ses){
  if(!D.ses) return; const b=sesAc(); if(!b) return;
  try{
    const o=b.createOscillator(), g=b.createGain();
    o.type=tip||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0, b.currentTime);
    g.gain.linearRampToValueAtTime(ses||0.06, b.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, b.currentTime+(sure||0.18));
    o.connect(g); g.connect(b.destination); o.start(); o.stop(b.currentTime+(sure||0.18)+0.02);
  }catch(e){}
}
const SESLER = {
  tik:()=>ton(520,.09,'triangle',.05),
  zarf:()=>{ton(700,.1,'sine',.05); setTimeout(()=>ton(900,.1,'sine',.04),70);},
  pul:()=>{ton(1200,.07,'square',.03); setTimeout(()=>ton(1500,.07,'square',.025),60);},
  kutu:()=>{ton(240,.14,'sine',.06);},
  bant:()=>ton(180,.3,'sawtooth',.03),
  zil:()=>{ton(1400,.09,'sine',.05); setTimeout(()=>ton(1050,.14,'sine',.045),90);},
  dudUk:()=>{ton(320,.3,'sawtooth',.04); setTimeout(()=>ton(260,.35,'sawtooth',.035),160);},
  kapizili:()=>{ton(880,.15,'sine',.05); setTimeout(()=>ton(660,.22,'sine',.045),150);},
  dogru:()=>{[660,880,1100].forEach((f,i)=>setTimeout(()=>ton(f,.14,'sine',.05),i*90));},
  yumusak:()=>ton(330,.22,'sine',.035),
  rozet:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>ton(f,.2,'triangle',.05),i*110));},
  bolum:()=>{[392,523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>ton(f,.22,'sine',.05),i*120));}
};

/* ---- ekranlar ---- */
function ekranAc(id){
  $$('.ekran').forEach(e=>e.classList.toggle('aktif', e.id===id));
  window.scrollTo(0,0);
}

/* ---- modal ---- */
function modalAc(baslikHtml, govdeHtml, opt){
  opt=opt||{};
  modalKapat();
  const perde = yap('div','perde');
  const m = yap('div','modal pop');
  m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
  m.innerHTML = `<button class="btn kucuk modal-kapat" data-act="modalKapat" aria-label="Kapat">✖</button>
     <h2>${baslikHtml}</h2><div class="modal-ic">${govdeHtml}</div>`;
  perde.appendChild(m);
  perde.addEventListener('click', e=>{ if(e.target===perde && !opt.zorunlu) modalKapat(); });
  $('#modalYuva').appendChild(perde);
  if(opt.zorunlu) m.querySelector('.modal-kapat').classList.add('gizli');
  const ilk = m.querySelector('button:not(.gizli)'); if(ilk) ilk.focus();
  return m;
}
function modalKapat(){ $('#modalYuva').innerHTML=''; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') modalKapat(); });

/* ---- pul kilidi ---- */
function pulAc(id, gorevNo){
  if(D.pulAcik[id]) return false;
  D.pulAcik[id] = {gorev:(gorevNo==null?D.bitenGorev.length:gorevNo), kullanim:0};
  return true;
}
function temaGarantile(tema){
  const acik = PULLAR.filter(p=>p.tema===tema && D.pulAcik[p.id]);
  if(acik.length>=1) return null;
  const kilitli = PULLAR.find(p=>p.tema===tema && !D.pulAcik[p.id]);
  if(kilitli){ pulAc(kilitli.id); return kilitli; }
  return null;
}
function siradakiPuluAc(){
  const kilitli = PULLAR.find(p=>!D.pulAcik[p.id] && p.nadir==='normal');
  if(kilitli){ pulAc(kilitli.id); return kilitli; }
  return null;
}

/* ---- rozet kontrolü ---- */
function rozetVerisi(){
  const s=D.sayac;
  return {mektup:s.mektup, paket:s.paket, dogruPul:s.dogruPul, dedektif:s.dedektif,
    kirilabilir:s.kirilabilir, teslimat:s.teslimat, gorev:D.bitenGorev.length,
    arac:Object.assign({},s.arac), aracSayi:D.aracAcik.length,
    pul:Object.keys(D.pulAcik).length, bolum:D.bolum,
    hikaye:Object.keys(D.hikaye).filter(h=>bittiMiHikaye(h)).length};
}
function bittiMiHikaye(h){
  const enBuyuk = GOREVLER.filter(g=>g.h===h).reduce((a,g)=>Math.max(a,g.hs||0),0);
  return (D.hikaye[h]||0) >= enBuyuk && enBuyuk>0;
}
function rozetKontrol(){
  const v = rozetVerisi(); const yeni=[];
  ROZETLER.forEach(r=>{ if(!D.rozet.includes(r.id) && r.kos(v)){ D.rozet.push(r.id); yeni.push(r); } });
  return yeni;
}
function rozetGoster(liste, sonra){
  if(!liste.length){ if(sonra) sonra(); return; }
  const r = liste.shift();
  SESLER.rozet(); kutlama(['🏅','⭐','✉️','🎉']);
  const m = modalAc('Yeni rozet!',
    `<div class="merkez"><div style="font-size:78px" class="pop">${r.ikon}</div>
     <h3>${r.ad}</h3><p>${r.aciklama}</p>
     <button class="btn birincil" data-act="rozetDevam">Harika!</button></div>`, {zorunlu:true});
  m.querySelector('[data-act="rozetDevam"]').onclick = ()=>{ modalKapat(); rozetGoster(liste, sonra); };
}

  D.altin += o.altin||0; D.yildiz += o.yildiz||0; D.mutluluk += o.mutluluk||0;

}

/* ==========================================================================
   4) GÖREV MOTORU — adımlar, çalışma tezgâhı
   ========================================================================== */
const ADIM_BILGI = {
  dinle:{ad:'Dinle',ikon:'👂'}, zarf:{ad:'Zarf',ikon:'✉️'}, katla:{ad:'Katla',ikon:'📄'},
  pul:{ad:'Pul',ikon:'🎫'}, kutu:{ad:'Kutu',ikon:'📦'}, koruma:{ad:'Koruma',ikon:'🫧'},
  bant:{ad:'Bant',ikon:'🎞️'}, tart:{ad:'Tartı',ikon:'⚖️'}, adres:{ad:'Adres',ikon:'🏠'},
  ayir:{ad:'Ayırma',ikon:'🗂️'}, arac:{ad:'Araç',ikon:'🚲'}, rota:{ad:'Rota',ikon:'🗺️'},
  teslim:{ad:'Teslimat',ikon:'📬'}, dedektif:{ad:'Dedektif',ikon:'🔍'}
};

let O = null;   // aktif görev oturumu

function kodCoz(kod){
  return kod.trim().split(/\s+/).map(t=>{
    const [t0,p] = t.split(':');
    return ADIM_BILGI[t0] ? {t:t0, p:p} : null;
  }).filter(Boolean);
}

/* ---------- görev başlat ---------- */
function gorevBaslat(indeks){
  const ham = GOREVLER[indeks];
  const adimlar = kodCoz(ham.kod);
  O = {
    idx:indeks, ham, serbest:false,
    musteri: M_BUL(ham.musteri),
    ev: EV_BUL(ham.ev) || EVLER[0],
    adimlar, i:0, hata:0, bonus:{}, zarfRenk:'#FFFDF6', kutuBoyut:'orta',
    arac:null, rota:null, istenenPul:null, secilenPul:null, bantli:false
  };
  const pulAdim = adimlar.find(a=>a.t==='pul');
  if(pulAdim){ const yeni = temaGarantile(pulAdim.p); if(yeni) O.yeniPulHaberi = yeni; }
  if(!D.tanisilan.includes(ham.musteri)) D.tanisilan.push(ham.musteri);
  ekranAc('oyun'); barGuncelle(); adimCiz();
}

function serbestBaslat(secim){
  const mektupMu = secim.tur==='mektup';
  const kod = mektupMu ? 'zarf katla pul adres arac rota teslim'
                       : 'kutu koruma bant tart adres arac rota teslim';
  O = {
    idx:-1, ham:{istek:'Serbest teslimat', tip:secim.tur==='mektup'?'mektup':'kucukpaket', bolum:D.bolum},
    serbest:true, musteri:M_BUL('kopuk'), ev:secim.ev, adimlar:kodCoz(kod), i:0, hata:0,
    bonus:{}, zarfRenk:'#FFFDF6', kutuBoyut:'orta', arac:null, rota:null, istenenPul:null, secilenPul:null
  };
  ekranAc('oyun'); barGuncelle(); adimCiz();
}

/* ---------- adım rayı ---------- */
function rayCiz(){
  const r = $('#adimRayi'); r.innerHTML='';
  O.adimlar.forEach((a,k)=>{
    const b = ADIM_BILGI[a.t];
    const e = yap('div','adim-rozet'+(k<O.i?' bitti':'')+(k===O.i?' simdi':''),
      `<span>${k<O.i?'✅':b.ikon}</span><span>${b.ad}</span>`);
    r.appendChild(e);
  });
  const s = r.querySelector('.simdi'); if(s && s.scrollIntoView) try{s.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}
}

function adimCiz(){
  document.onkeydown = null; miniDurdur();
  if(O.i >= O.adimlar.length){ gorevBitir(); return; }
  rayCiz();
  $('#ipucuKutu').innerHTML='';
  const a = O.adimlar[O.i];
  const k = $('#calisma'); k.innerHTML='';
  (ADIMLAR[a.t]||ADIMLAR.dinle)(k, a);
}
function adimBitti(bonusAdi){
  if(bonusAdi) O.bonus[bonusAdi]=true;
  SESLER.yumusak();
  O.i++; adimCiz();
}
function hataYap(mesaj, ifade){
  O.hata++;
  patiSoyle(mesaj, ifade||'dusunen');
  SESLER.yumusak();
}

/* ---------- ortak yardımcılar ---------- */
function baslik(k, b, aciklama){
  k.appendChild(yap('h3',null,b));
  if(aciklama) k.appendChild(yap('p','aciklama',aciklama));
}
function izgara(k){ const g=yap('div','secim-izgara'); k.appendChild(g); return g; }

/** Seçim ekranı: doğru olanı seçince ilerle. */
function secimEkrani(kap, secenekler, dogruMu, opt){
  opt=opt||{};
  const g = izgara(kap);
  g.__dogruMu = dogruMu;   // otomatik testlerin okuduğu ölçüt
  let deneme = 0;
  secenekler.forEach(s=>{
    const b = secimKart(s.id, s.ust, s.alt);
    b.onclick = ()=>{
      if(b.classList.contains('dogru')) return;
      if(O.serbest || dogruMu(s.id)){
        g.querySelectorAll('.secim').forEach(x=>{x.classList.remove('parla'); x.disabled=true;});
        b.classList.add('dogru');
        b.insertAdjacentHTML('beforeend','<span class="tik">✅</span>');
        (opt.ses||SESLER.tik)();
        patiSoyle(opt.basari? opt.basari(s.id) : 'Harika seçim!', 'alkis');
        setTimeout(()=>{ if(opt.secildi) opt.secildi(s.id); adimBitti(opt.bonus); }, 480);
      }else{
        deneme++;
        b.classList.add('yanlis'); setTimeout(()=>b.classList.remove('yanlis'),420);
        hataYap(opt.uyari? opt.uyari(s.id) : 'Bu olmadı. Bir daha bakalım mı?');
        if(deneme>=2){
          g.querySelectorAll('.secim').forEach(x=>{ if(dogruMu(x.dataset.sec)) x.classList.add('parla'); });
        }
      }
    };
    g.appendChild(b);
  });
  return g;
}

/** Tıkla-seç / sürükle-bırak taşıma. Her ikisi de çalışır. */
function tasimaKur(kap, birak){
  let secili=null;
  function temizle(){ kap.querySelectorAll('[data-parca]').forEach(p=>p.classList.remove('secili')); secili=null; }
  kap.addEventListener('click', e=>{
    const p = e.target.closest('[data-parca]');
    const h = e.target.closest('[data-hedef]');
    if(p && !p.classList.contains('bitti')){ temizle(); p.classList.add('secili'); secili=p; SESLER.tik(); return; }
    if(h && secili){ birak(secili, h); temizle(); }
  });
  // işaretçiyle sürükleme (dokunmatik + fare)
  let tasinan=null, hayalet=null;
  kap.addEventListener('pointerdown', e=>{
    const p = e.target.closest('[data-parca]');
    if(!p || p.classList.contains('bitti')) return;
    tasinan = p;
    hayalet = p.cloneNode(true);
    hayalet.style.position='fixed'; hayalet.style.pointerEvents='none'; hayalet.style.zIndex='90';
    hayalet.style.opacity='.9'; hayalet.style.transform='scale(1.05)';
    document.body.appendChild(hayalet);
    konumla(e);
    p.classList.add('tutuluyor');
  });
  function konumla(e){
    if(!hayalet) return;
    hayalet.style.left = (e.clientX-40)+'px'; hayalet.style.top = (e.clientY-40)+'px';
  }
  kap.addEventListener('pointermove', e=>{
    if(!tasinan) return; konumla(e);
    const alt = document.elementFromPoint(e.clientX, e.clientY);
    kap.querySelectorAll('[data-hedef]').forEach(h=>h.classList.remove('uzerinde'));
    const h = alt && alt.closest && alt.closest('[data-hedef]'); if(h) h.classList.add('uzerinde');
  });
  function bitir(e){
    if(!tasinan) return;
    const alt = document.elementFromPoint(e.clientX, e.clientY);
    const h = alt && alt.closest && alt.closest('[data-hedef]');
    tasinan.classList.remove('tutuluyor');
    if(hayalet){ hayalet.remove(); hayalet=null; }
    kap.querySelectorAll('[data-hedef]').forEach(x=>x.classList.remove('uzerinde'));
    const t = tasinan; tasinan=null;
    if(h) birak(t, h);
  }
  kap.addEventListener('pointerup', bitir);
  kap.addEventListener('pointercancel', bitir);
}

    oran = Math.max(0, Math.min(1, y));

    if(oran>0.05 && oran<0.99) SESLER.bant();

      patiSoyle('Kutu kapandı! 📦','alkis');

      b.onclick=()=>adimBitti(); s.appendChild(b); k.appendChild(s);
    }
  }
  yol.addEventListener('pointermove', e=>{ if(e.buttons) ayarla((e.clientX - yol.getBoundingClientRect().left)/yol.clientWidth); });
  yol.addEventListener('pointerdown', e=>{ ayarla((e.clientX - yol.getBoundingClientRect().left)/yol.clientWidth); });
  yol.addEventListener('click', ()=>{ if(!bitti) ayarla(Math.min(1, oran+0.34)); });

/* ==========================================================================
   5) HARİTA, ROTA ve TESLİMAT MİNİ OYUNLARI
   ========================================================================== */
const POSTANE = SIMGE_YER[0];
const anahtar = (r,c)=>r+','+c;
const YER_HARITA = {}; YERLER.forEach(y=>{ YER_HARITA[anahtar(y.r,y.c)] = y; });

function komsular(r,c){
  return [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]
    .filter(([a,b])=>a>=0&&a<SATIR&&b>=0&&b<SUTUN&&yolMu(a,b));
}
function yolKomsulari(yer){ return komsular(yer.r, yer.c); }

/** En kısa yol (BFS). Dönüş: kare dizisi ya da null */
function enKisaYol(bas, son, kapali){
  const kap = new Set(kapali||[]);
  if(kap.has(anahtar(bas[0],bas[1]))) return null;
  const kuyruk=[bas], geldi={}; geldi[anahtar(bas[0],bas[1])]=null;
  while(kuyruk.length){
    const [r,c] = kuyruk.shift();
    if(r===son[0]&&c===son[1]){
      const yol=[]; let k=anahtar(r,c);
      while(k){ const [a,b]=k.split(',').map(Number); yol.unshift([a,b]); k=geldi[k]; }
      return yol;
    }
    komsular(r,c).forEach(([a,b])=>{
      const k=anahtar(a,b);
      if(!(k in geldi) && !kap.has(k)){ geldi[k]=anahtar(r,c); kuyruk.push([a,b]); }
    });
  }
  return null;
}

/** Göreve göre kapalı yollar (deterministik, yol her zaman açık kalır) */
function kapaliYollar(gorevIdx, bas, son){
  if(gorevIdx<0 || GOREVLER[gorevIdx].bolum < 6) return [];
  const aday=[]; 
  for(let r=0;r<SATIR;r++) for(let c=0;c<SUTUN;c++) if(yolMu(r,c)) aday.push(anahtar(r,c));
  const sirali = karistir(aday, 41+gorevIdx);
  const kapali=[];
  for(const k of sirali){
    if(kapali.length>=3) break;
    if(k===anahtar(bas[0],bas[1])||k===anahtar(son[0],son[1])) continue;
    const deneme = kapali.concat([k]);
    if(enKisaYol(bas, son, deneme)) kapali.push(k);
  }
  return kapali;
}

/** Harita ızgarasını çizer. */
function haritaCiz(opt){
  opt=opt||{};
  const g = yap('div','harita');
  g.style.gridTemplateColumns = `repeat(${SUTUN}, auto)`;
  for(let r=0;r<SATIR;r++){
    for(let c=0;c<SUTUN;c++){
      const k = yap('div','kare');
      k.dataset.r=r; k.dataset.c=c; k.dataset.k=anahtar(r,c);
      if(yolMu(r,c)){
        k.classList.add('yol');
        if(opt.kapali && opt.kapali.includes(anahtar(r,c))){ k.classList.add('kapali'); k.textContent='⛔'; k.title='Yol kapalı'; }
      }else{
        const y = YER_HARITA[anahtar(r,c)];
        if(y){
          k.classList.add('yer');
          if(y.tip==='postane'){ k.classList.add('postane'); k.textContent='📮'; }
          else if(y.tip==='yer'){ k.textContent=y.ikon; }
          else { k.innerHTML = svgEv(y, 34); }
          k.title = y.ad || y.id;
          k.setAttribute('role','button'); k.tabIndex=0;
          k.setAttribute('aria-label', y.ad||y.id);
          if(opt.hedef && y.id===opt.hedef.id) k.classList.add('hedef-ev');
          if(opt.yereTikla) k.onclick = ()=>opt.yereTikla(y, k);
        }else{
          k.style.background = ((r+c)%3===0)?'#C4E3C0':'#CDE9C9';
        }
      }
      g.appendChild(k);
    }
  }
  return g;
}

/* ---- 12. Rota çiz ---- */
ADIMLAR.rota = (k) => {
  const hedef = O.ev;
  const bas = yolKomsulari(POSTANE)[0];
  const sonlar = yolKomsulari(hedef).map(x=>anahtar(x[0],x[1]));
  const kapali = kapaliYollar(O.idx, bas, [hedef.r-1, hedef.c]);
  const enKisa = sonlar.map(s=>enKisaYol(bas, s.split(',').map(Number), kapali)).filter(Boolean)
                       .sort((a,b)=>a.length-b.length)[0];
  patiSoyle('Şimdi haritada rotamızı çizelim.','dusunen');
  $('#calisma').innerHTML='';
  baslik(k,'Teslimat rotasını çiz', `Postaneden başla, yollara dokunarak ${hedef.ad} adresine ulaş.`);
  const sar = yap('div','harita-sar');
  const oneriGoster = (O.ham.bolum||1) <= 3;
  const g = haritaCiz({hedef, kapali});
  sar.appendChild(g); k.appendChild(sar);
  k.appendChild(yap('div','harita-efsane',
    `<span>📮 postane</span><span>⛔ kapalı yol</span><span>🏠 hedef ev yeşil çerçeveli</span>${oneriGoster?'<span>🟡 açık sarı: önerilen rota</span>':''}`));

  if(oneriGoster && enKisa) enKisa.forEach(([r,c])=>{ const e=g.querySelector(`[data-k="${anahtar(r,c)}"]`); if(e) e.classList.add('oneri'); });

  let rota = [bas];
  function boya(){
    g.querySelectorAll('.yol').forEach(e=>e.classList.remove('rota'));
    rota.forEach(([r,c])=>{ const e=g.querySelector(`[data-k="${anahtar(r,c)}"]`); if(e) e.classList.add('rota'); });
    const son = rota[rota.length-1];
    const varMi = sonlar.includes(anahtar(son[0],son[1]));
    btn.disabled = !varMi;
    durum.textContent = varMi ? '✅ Eve ulaştın! Teslimata geçebilirsin.' : `Rota uzunluğu: ${rota.length} kare`;
  }
  function ekle(r,c){
    const kk = anahtar(r,c);
    if(!yolMu(r,c)) return;
    if(kapali.includes(kk)){ hataYap('Bu yol kapalı. Başka bir yoldan dolaşalım.'); return; }
    const son = rota[rota.length-1];
    if(rota.length>1 && kk===anahtar(rota[rota.length-2][0],rota[rota.length-2][1])){ rota.pop(); boya(); SESLER.tik(); return; }
    if(Math.abs(son[0]-r)+Math.abs(son[1]-c)!==1){ hataYap('Rota kopmasın: bitişik yollardan devam et.'); return; }
    if(rota.some(([a,b])=>a===r&&b===c)) return;
    rota.push([r,c]); SESLER.tik(); boya();
  }
  g.querySelectorAll('.yol').forEach(e=>{
    e.tabIndex = 0; e.setAttribute('role','button'); e.setAttribute('aria-label','yol karesi');
    e.onclick = ()=>ekle(+e.dataset.r, +e.dataset.c);
  });

  const durum = yap('p','merkez','Rota uzunluğu: 1 kare'); k.appendChild(durum);
  const s = yap('div','satir');
  const geri = yap('button','btn kucuk','↩️ Son kareyi sil');
  geri.onclick = ()=>{ if(rota.length>1){ rota.pop(); boya(); } };
  const btn = yap('button','btn yesil','Rotayı tamamla');
  btn.disabled = true;
  btn.onclick = ()=>{
    O.rota = rota;
    const kisa = enKisa && rota.length <= enKisa.length+2;
    if(kisa){ D.sayac.kisaRota++; patiSoyle('Kısa ve akıllı bir rota! 🌟','alkis'); }
    adimBitti(kisa?'kisaRota':null);
  };
  s.appendChild(geri); s.appendChild(btn); k.appendChild(s);
  boya();
  TEST.rotaTamamla = ()=>{ const y = enKisa||[bas]; rota = y.slice(); boya(); btn.disabled=false; btn.onclick(); };
};

  k.appendChild(sahne);
  const seritY = [58,118,178];
  const oyuncu = yap('div','oyuncu', svgArac(kizakMi?'kizak':'bisiklet',86));
  let serit=1; oyuncu.style.left='8%'; oyuncu.style.top=seritY[serit]+'px'; sahne.appendChild(oyuncu);

  const nesneler=[];
  const desen = karistir([0,1,2,0,1,2,0,1,2,0,1,2], 7+O.idx);
  for(let i=0;i<12;i++){
    const yildizMi = i%2===0;
    const e = yap('div','engel', yildizMi?'⭐':(kizakMi?'❄️':'💧'));
    e.style.fontSize='26px'; e.style.top=(seritY[desen[i]]+16)+'px';
    e.style.left = (110 + i*46)+'%';
    sahne.appendChild(e);
    nesneler.push({el:e, serit:desen[i], x:110+i*46, yildiz:yildizMi, bitti:false});
  }
  let ilerleme=0, puan=0, calisiyor=true;
  function ciz(){ oyuncu.style.top = seritY[serit]+'px'; }
  function adim(){
    if(!calisiyor) return;
    ilerleme += 0.35;
    nesneler.forEach(n=>{
      n.x -= 0.55; n.el.style.left = n.x+'%';
      if(!n.bitti && n.x < 14 && n.x > 2 && n.serit===serit){
        n.bitti=true;
        if(n.yildiz){ puan++; D.altin++; SESLER.pul(); n.el.style.opacity='.2'; }
        else { SESLER.yumusak(); n.el.style.opacity='.35';
          patiSoyle(kizakMi?'Ufak bir kar yığını, önemli değil!':'Küçük bir su birikintisi, önemli değil!','sasiran'); }
      }
    });
    sahne.querySelector('#mPuan').textContent = `⭐ ${puan} · 🛣️ %${Math.min(100,Math.round(ilerleme))}`;
    if(ilerleme>=100){ calisiyor=false; teslimBitti('Kapıya vardık! Paket teslim edildi. 📬'); return; }
    miniDongu = requestAnimationFrame(adim);
  }
  const tus = yap('div','yon-tus');
  const sol = yap('button','btn mavi','◀'); sol.setAttribute('aria-label','Sola geç');
  const sag = yap('button','btn mavi','▶'); sag.setAttribute('aria-label','Sağa geç');
  sol.onclick=()=>{ serit=Math.max(0,serit-1); ciz(); SESLER.tik(); };
  sag.onclick=()=>{ serit=Math.min(2,serit+1); ciz(); SESLER.tik(); };
  tus.appendChild(sol); tus.appendChild(sag); k.appendChild(tus);
  document.onkeydown = e=>{ if(e.key==='ArrowLeft') sol.click(); if(e.key==='ArrowRight') sag.click(); };
  ciz();
  if(typeof requestAnimationFrame==='function') miniDongu = requestAnimationFrame(adim);
  TEST.miniBitir = ()=>{ calisiyor=false; teslimBitti('Kapıya vardık! Paket teslim edildi. 📬'); };
}

        patiSoyle('Yumuşak bir bulut! Biraz savrulduk, devam.','sasiran');
      }
    });
    sahne.querySelector('#mPuan').textContent = (ucakMi?'✈️ %':'🎈 %')+Math.min(100,Math.round(ilerleme));
    if(ilerleme>=100){ calisiyor=false; D.altin+=3; teslimBitti('Adaya indik, paket teslim edildi! 🎈'); return; }
    miniDongu = requestAnimationFrame(adim);
  }
  const tus = yap('div','yon-tus');
  const yuk = yap('button','btn sari','⬆️'); yuk.setAttribute('aria-label','Yüksel');
  yuk.addEventListener('pointerdown',()=>{yukari=true;});
  yuk.addEventListener('pointerup',()=>{yukari=false;});
  yuk.addEventListener('pointerleave',()=>{yukari=false;});
  yuk.addEventListener('click',()=>{ yukari=true; setTimeout(()=>yukari=false,420); });
  tus.appendChild(yuk); k.appendChild(tus);
  sahne.addEventListener('pointerdown',()=>{yukari=true;});
  sahne.addEventListener('pointerup',()=>{yukari=false;});
  document.onkeydown = e=>{ if(e.key==='ArrowUp'){ yukari=true; setTimeout(()=>yukari=false,380); } };
  if(typeof requestAnimationFrame==='function') miniDongu = requestAnimationFrame(adim);
  TEST.miniBitir = ()=>{ calisiyor=false; teslimBitti('Adaya indik, paket teslim edildi! 🎈'); };
}
/* ==========================================================================
   6) GÖREV SONU, BÖLÜM İLERLEMESİ, MENÜLER
   ========================================================================== */
const NADIR_ODUL = {2:'p41', 4:'p42', 6:'p43'};

function araclariAc(){
  ARACLAR.forEach(a=>{ if(a.bolum<=D.bolum && !D.aracAcik.includes(a.id)) D.aracAcik.push(a.id); });
}

function gorevBitir(){
  miniDurdur(); document.onkeydown=null;
  const m = O.musteri;
  if(O.serbest){
    SESLER.dogru(); kutlama(['✉️','⭐','💌']);
    D.altin += 5; barGuncelle(); kaydet();
    const md = modalAc('Serbest teslimat tamam!',
      `<div class="merkez">${svgKarakter(m,120)}<p>Kendi gönderini hazırlayıp teslim ettin. 🪙 +5 altın</p>
       <div class="satir"><button class="btn birincil" data-act="serbest">Bir tane daha</button>
       <button class="btn" data-act="menuye2">Menüye dön</button></div></div>`,{zorunlu:true});
    return;
  }
  const bonusSayi = Object.keys(O.bonus).length;
  const yildiz = Math.min(3, 1 + (O.hata===0?1:0) + (bonusSayi>=2?1:0));
  const altin  = 10 + bonusSayi*3 + (O.hata===0?5:0);
  const mutlu  = 1;

  if(!D.bitenGorev.includes(O.idx)) D.bitenGorev.push(O.idx);
  odulVer({altin, yildiz, mutluluk:mutlu});

  // pul ödülü
  let yeniPul = null;
  if(O.ham.pulOdul && !D.pulAcik[O.ham.pulOdul]){ pulAc(O.ham.pulOdul); yeniPul = PUL_BUL(O.ham.pulOdul); }
  else yeniPul = siradakiPuluAc();

  // hikâye ilerlemesi
  let hikayeMetni = '';
  if(O.ham.h){
    D.hikaye[O.ham.h] = Math.max(D.hikaye[O.ham.h]||0, O.ham.hs||1);
    hikayeMetni = `<div class="mini-ipucu">${HIKAYELER[O.ham.h].ikon} <b>${HIKAYELER[O.ham.h].ad}</b><br>${O.ham.hMetin||''}</div>`;
  }
  kaydet();

  SESLER.dogru(); kutlama();
  const bonusListe = [];
  if(O.bonus.dogruPul) bonusListe.push('🎫 İstenen pul');
  if(O.bonus.dogruArac) bonusListe.push('🚚 Doğru araç');
  if(O.bonus.kisaRota) bonusListe.push('🛣️ Kısa rota');
  if(O.bonus.guvenli) bonusListe.push('🫧 Güvenli paketleme');
  if(O.hata===0) bonusListe.push('✨ İlk denemede doğru');

  const md = modalAc('Teşekkür kartı geldi!',
    `<div class="merkez">
      <div style="display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap">
        ${svgKarakter(Object.assign({},m,{ifade:'alkis'}),120)}
        <div class="adres-kart" style="margin:0"><b>${m.ad}</b><p style="margin:6px 0 0">“${m.tesekkur}”</p></div>
      </div>
      <p style="font-size:22px;font-family:var(--f-baslik)">${'⭐'.repeat(yildiz)}${'☆'.repeat(3-yildiz)}</p>
      <p>🪙 +${altin} altın · ⭐ +${yildiz} yıldız · 💗 +${mutlu} mutluluk</p>
      ${bonusListe.length?`<p style="color:var(--murekkep-soft);font-size:15px">${bonusListe.join(' · ')}</p>`:''}
      ${yeniPul?`<div class="mini-ipucu">Yeni pul açıldı: ${yeniPul.ad}</div>`:''}
      ${hikayeMetni}
      <div class="satir">
        <button class="btn birincil" data-act="sonraki">Sıradaki müşteri ▶</button>
        <button class="btn" data-act="menuye2">Menüye dön</button>
      </div>
     </div>`, {zorunlu:true});

  // bölüm tamamlandı mı?
  const bolumGorevleri = GOREVLER.map((g,i)=>({g,i})).filter(x=>x.g.bolum===O.ham.bolum);
  const bitti = bolumGorevleri.every(x=>D.bitenGorev.includes(x.i));
  md.querySelector('[data-act="sonraki"]').onclick = ()=>{
    modalKapat();
    if(bitti && D.bolum===O.ham.bolum) bolumTamamla(O.ham.bolum);
    else devamEt();
  };
}

function bolumTamamla(no){
  const eski = D.bolum;
  if(D.bolum===no && D.bolum<8) D.bolum++;
  araclariAc();
  const nadir = NADIR_ODUL[no]; let np=null;
  if(nadir && !D.pulAcik[nadir]){ pulAc(nadir); np = PUL_BUL(nadir); }
  D.altin += 25; kaydet(); barGuncelle();
  SESLER.bolum(); kutlama(['🎉','⭐','📮','✉️','🎊','🏅']);
  const yeniArac = ARACLAR.filter(a=>a.bolum===D.bolum);
  const b = BOLUMLER[no-1], sonraki = BOLUMLER[Math.min(7, D.bolum-1)];
  const md = modalAc('Bölüm tamamlandı!',
    `<div class="merkez">
      <div style="font-size:64px" class="pop">${b.ikon}</div>
      <h3>${b.no}. Bölge: ${b.ad}</h3>
      <p>Postane büyüdü, kasabanın yeni bir köşesi açıldı. 🪙 +25 altın</p>
      ${yeniArac.length&&eski!==D.bolum?`<div class="mini-ipucu">Yeni araç: ${yeniArac.map(a=>a.ad).join(', ')}</div>`:''}
      ${np?`<div class="merkez">${svgPul(np,86)}<p>Nadir pul: <b>${np.ad}</b></p></div>`:''}
      ${eski!==D.bolum?`<p><b>Sıradaki bölge:</b> ${sonraki.ikon} ${sonraki.ad}</p>`:'<p>Kasabanın tamamını dolaştın!</p>'}
      <button class="btn birincil" data-act="bolumDevam">Devam</button>
     </div>`,{zorunlu:true});
  md.querySelector('[data-act="bolumDevam"]').onclick = ()=>{ modalKapat(); devamEt(); };
}

function siradakiGorevIndeksi(){
  let i = GOREVLER.findIndex((g,k)=>!D.bitenGorev.includes(k) && g.bolum<=D.bolum);
  if(i<0) i = GOREVLER.findIndex((g,k)=>!D.bitenGorev.includes(k));
  return i;
}
function devamEt(){
  const yeni = rozetKontrol();
  rozetGoster(yeni, ()=>{
    kaydet();
    const i = siradakiGorevIndeksi();
    if(i<0){
      modalAc('Bütün kasaba mutlu! 🎊',
        `<div class="merkez"><div style="font-size:64px">👑</div>
         <p>Kasabadaki ${GOREVLER.length} görevin hepsini tamamladın. Serbest Teslimat modunda istediğin kadar gönderi hazırlayabilirsin.</p>
         <button class="btn birincil" data-act="menuye2">Menüye dön</button></div>`);
      return;
    }
    gorevBaslat(i);
  });
}

/* ==========================================================================
   7) MENÜ EKRANLARI
   ========================================================================== */
function menuCiz(){
  const s = $('#menuSahne');
  const susIkon = D.sus.map(id=>{ const x=SUSLER.find(y=>y.id===id); return x?x.ikon:''; }).join(' ');
  s.innerHTML = `${svgPati('mutlu',110)}${svgPostane(210)}${svgKarakter(MUSTERILER[2],96)}
    <div style="position:absolute;bottom:-6px;left:0;right:0;text-align:center;font-size:22px">${susIkon}</div>`;
  $('.bulut').innerHTML = svgBulut(150);
  $('.bulut.b2').innerHTML = svgBulut(150);
  $('.bulut.b3').innerHTML = svgBulut(150);
  $('.bisikletli').innerHTML = svgArac('bisiklet',110);
  const zarf = yap('div','zarfucus'); zarf.style.right='8%'; zarf.style.top='60px';

  $('.menu-sahne').appendChild(zarf);

  $('#menuSayaclar').innerHTML =
    `<span class="sayac">🪙 ${D.altin}</span><span class="sayac">⭐ ${D.yildiz}</span>
     <span class="sayac">💗 ${D.mutluluk}</span>
     <span class="sayac">📮 ${D.bitenGorev.length}/${GOREVLER.length} görev</span>
     <span class="sayac">🎫 ${Object.keys(D.pulAcik).length}/${PULLAR.length} pul</span>
     <span class="sayac">🏅 ${D.rozet.length}/${ROZETLER.length}</span>`;
  const sb = $('[data-act="ses"]'); if(sb) sb.textContent = D.ses? '🔊 Ses Açık' : '🔇 Ses Kapalı';
}

/* ---- pul albümü ---- */
function albumAc(){
  const temalar = [...new Set(PULLAR.map(p=>p.tema))];
  const govde = temalar.map(t=>{
    const list = PULLAR.filter(p=>p.tema===t);
    return `<h3>${TEMA_AD[t]} <span style="font-size:14px;color:var(--murekkep-soft)">(${list.filter(p=>D.pulAcik[p.id]).length}/${list.length})</span></h3>
      <div class="izgara-kart">${list.map(p=>{
        const a = D.pulAcik[p.id];
        return `<div class="pul-hucre ${a?'':'kilitli'}" data-pul="${p.id}" tabindex="0" role="button" aria-label="${a?p.ad:'kilitli pul'}">
          ${a?svgPul(p,64):`<div style="width:64px;height:80px;border-radius:6px;background:#EFE6D6;display:flex;align-items:center;justify-content:center;font-size:26px">🔒</div>`}
          <span>${a?p.ad:'???'}</span></div>`;}).join('')}</div>`;
  }).join('');
  const m = modalAc(`Pul Albümüm · ${Object.keys(D.pulAcik).length}/${PULLAR.length}`, govde);
  m.addEventListener('click', e=>{
    const h = e.target.closest('[data-pul]'); if(!h) return;
    const p = PUL_BUL(h.dataset.pul), a = D.pulAcik[p.id];
    if(!a) return;
    modalAc(p.ad, `<div class="merkez">${svgPul(p,110)}
      <p><span class="etiket ${p.nadir==='nadir'?'nadir':(p.nadir==='efsane'?'efsane':'')}">${p.nadir==='normal'?'Sıradan':(p.nadir==='nadir'?'Nadir':'Efsane')}</span>
      <span class="etiket">${TEMA_AD[p.tema]}</span></p>
      <p>Değeri: ${p.deger}</p>
      <p>Kaç kez kullanıldı: <b>${a.kullanim}</b></p>
      <p>Açıldığı görev: <b>${a.gorev===0?'başlangıç':a.gorev+'. görev'}</b></p>
      <button class="btn" data-act="album">Albüme dön</button></div>`);
  });
}

function defterAc(){
  const govde = MUSTERILER.map(m=>{
    const tanis = (D.tanisilan||[]).includes(m.id);

        <p style="margin:6px 0 0;font-size:15px">${tanis? m.hikaye : 'Henüz tanışmadınız. Görevlerde karşına çıkacak.'}</p>

}

/* ---- dükkân ---- */
function dukkanAc(){
  const govde = `<p class="merkez">Altınların: <b>🪙 ${D.altin}</b> — süsler yalnızca postaneni güzelleştirir, oyunu kolaylaştırmaz.</p>
   <div class="dukkan-izgara">${SUSLER.map(s=>{
      const alindi = D.sus.includes(s.id);
      return `<div class="dukkan-kart ${alindi?'alindi':''}">
        <div style="font-size:34px">${s.ikon}</div><div>${s.ad}</div>
        ${alindi?'<div class="etiket">Postanede ✓</div>':
          `<button class="btn kucuk ${D.altin>=s.fiyat?'sari':''}" data-sus="${s.id}" ${D.altin<s.fiyat?'disabled':''}>🪙 ${s.fiyat}</button>`}
      </div>`;}).join('')}</div>`;
  const m = modalAc('Postanemi Süsle', govde);
  m.addEventListener('click', e=>{
    const b = e.target.closest('[data-sus]'); if(!b) return;
    const s = SUSLER.find(x=>x.id===b.dataset.sus);
    if(D.altin < s.fiyat) return;
    D.altin -= s.fiyat; D.sus.push(s.id); kaydet(); SESLER.dogru(); kutlama(['🎀','✨','🪙']);
    menuCiz(); dukkanAc();
  });
}

/* ---- rozetler ---- */
function rozetlerAc(){
  const govde = `<div class="izgara-kart" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">
    ${ROZETLER.map(r=>{ const v=D.rozet.includes(r.id);
      return `<div class="dukkan-kart ${v?'alindi':''}" style="${v?'':'opacity:.5'}">

        <div style="font-size:12px;color:var(--murekkep-soft)">${r.aciklama}</div></div>`;}).join('')}</div>`;
  modalAc(`Rozetlerim · ${D.rozet.length}/${ROZETLER.length}`, govde);
}

/* ---- kasaba haritası (görüntüleme) ---- */
function haritaAc(secimIcin){
  const m = modalAc(secimIcin?'Nereye göndereceksin?':'Kasaba Haritası',
    `<p class="merkez">${secimIcin?'Bir eve dokun.':'Bir yere dokunursan orayı tanıtırım.'}</p><div id="haritaYuva" class="harita-sar"></div><div id="haritaBilgi" class="merkez"></div>`);
  const g = haritaCiz({yereTikla:(y,el)=>{
    if(secimIcin){
      if(y.tip!=='ev'){ $('#haritaBilgi').innerHTML = 'Gönderiler evlere gider. Bir ev seç.'; return; }
      modalKapat(); serbestBaslat({tur:secimIcin, ev:y}); return;
    }
    if(y.tip==='ev'){
      $('#haritaBilgi').innerHTML = `<div class="adres-kart"><b>${SOKAK[y.sokak].ad} ${y.no}</b><br>
        ${MAHALLE[y.mahalle].sembol} ${MAHALLE[y.mahalle].ad} · ${KAPI_AD[y.kapiAd]} kapı · ${KUTU_AD[y.kutu]} posta kutusu</div>`;
    }else{
      $('#haritaBilgi').innerHTML = `<div class="adres-kart"><b>${y.ikon} ${y.ad}</b><br>Kasabanın uğrak yerlerinden.</div>`;
    }
  }});

}

/* ---- serbest teslimat ---- */
function serbestAc(){
  const m = modalAc('Serbest Teslimat',
    `<p class="merkez">Görev yok, süre yok. Ne göndermek istersin?</p>
     <div class="satir">
       <button class="btn sari" data-serbest="mektup">✉️ Mektup hazırla</button>

     </div>`);

    const b = e.target.closest('[data-serbest]'); if(!b) return;

/* ---- nasıl oynanır ---- */
function nasilAc(zorunlu){
  const adimlar = [
    ['👂','Gönderiyi incele','Müşteriyi dinle, ne göndermek istediğini öğren.'],
    ['✉️','Doğru zarf veya kutuyu seç','Ne çok büyük ne çok küçük olsun.'],
    ['🎫','Pulu yapıştır','Müşterinin istediği temayı seç.'],
    ['🏠','Adresi kontrol et','Kartla evin rengini, numarasını, posta kutusunu karşılaştır.'],
    ['🗂️','Gönderiyi doğru bölmeye ayır','Yanlış olursa geri döner, ceza yok.'],
    ['🚲','Teslimat aracını seç','Aracın açıklaması ipucu verir.'],
    ['🗺️','Haritada doğru evi bul','Yollara dokunarak rotanı çiz.'],
    ['📬','Teslimatı tamamla','Mini oyunu bitir, teşekkür kartını al.']
  ];
  const govde = `<div class="pati-kutu" style="margin-bottom:10px">${svgPati('ipucu',96)}
     <div class="balon">Önce müşterimizi dinleyeceğiz. Sonra gönderiyi hazırlayıp doğru adresi bulacağız. En sonunda kasabada teslimat yapacağız!</div></div>
    ${adimlar.map((a,i)=>`<div class="defter-satir"><div style="font-size:30px">${a[0]}</div>
      <div><b>${i+1}. ${a[1]}</b><br><span style="font-size:15px;color:var(--murekkep-soft)">${a[2]}</span></div></div>`).join('')}
    <div class="satir"><button class="btn birincil" data-act="${zorunlu?'ogreticiBitir':'modalKapat'}">${zorunlu?'Hadi başlayalım!':'Anladım'}</button></div>`;
  const m = modalAc('Nasıl Oynanır?', govde, {zorunlu:!!zorunlu});
  if(zorunlu){
    m.querySelector('[data-act="ogreticiBitir"]').onclick = ()=>{
      D.ogreticiGorulen = true; kaydet(); modalKapat(); oyunaBasla();
    };
  }
}

/* ---- oyuna başla ---- */
function oyunaBasla(){
  if(!D.ogreticiGorulen){ nasilAc(true); return; }
  const i = siradakiGorevIndeksi();
  if(i<0){ modalAc('Her şey teslim edildi 🎊',
      `<div class="merkez"><p>Bütün görevleri bitirdin! Serbest Teslimat modunda oynamaya devam edebilirsin.</p>
       <button class="btn birincil" data-act="serbest">Serbest Teslimat</button></div>`); return; }
  gorevBaslat(i);
}

/* ---- sıfırla ---- */
function sifirlaAc(){
  const m = modalAc('Oyunu sıfırla?',
    `<div class="merkez"><div style="font-size:52px">♻️</div>
     <p>Bütün altınların, pulların, rozetlerin ve ilerlemen silinecek. Bu geri alınamaz.</p>
     <div class="satir"><button class="btn" data-act="modalKapat">Vazgeç</button>
     <button class="btn birincil" data-act="sifirlaOnay">Evet, sıfırla</button></div></div>`);
  m.querySelector('[data-act="sifirlaOnay"]').onclick = ()=>{
    try{ localStorage.removeItem(KAYIT_ANAHTAR); }catch(e){}
    D = varsayilanDurum(); yukle(); araclariAc(); kaydet();
    modalKapat(); menuCiz(); barGuncelle(); ekranAc('menu');
    patiSoyle('Yepyeni bir posta günü!','mutlu');
  };
}

   8) OLAY YÖNETİMİ + AÇILIŞ

  basla: oyunaBasla,

  defter: defterAc,

  ses: ()=>{ D.ses=!D.ses; if(D.ses) SESLER.tik(); kaydet(); menuCiz(); barGuncelle(); },
  ses2: ()=>{ D.ses=!D.ses; if(D.ses) SESLER.tik(); kaydet(); barGuncelle(); },
  menuye: ()=>{ miniDurdur(); document.onkeydown=null; kaydet(); menuCiz(); ekranAc('menu'); },
  menuye2: ()=>{ modalKapat(); miniDurdur(); document.onkeydown=null; kaydet(); menuCiz(); ekranAc('menu'); },

};
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;

/* ---- ipucu ---- */

  const metinler = {
    dinle:'Müşterinin cümlesinde rengi, temayı ve gönderi türünü ara.',
    zarf:'İstenen rengi büyük harflerle söyledim; kartların altındaki isimlere bak.',
    katla:'Önce kâğıda dokun, sonra zarfa dokun.',
    pul:`Pulun üstündeki resme bak: ${TEMA_AD[a.p]||'istenen tema'} arıyoruz.`,
