<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <script>
      /* GitHub Pages bu dosyayı derlenmemiş hâliyle sunar (kaynak girişi).
         Orada isek oynanabilir derlemeye yönlendir; dev sunucusu ve dist bundan etkilenmez. */
      if ((location.hostname.endsWith('github.io') || location.hostname.endsWith('masalpark.com')) && !location.pathname.includes('/dist')) {
        location.replace('./dist/');
      }
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gölge Protokol" />
    <title>Teşkilat: Gölge Protokol</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0f14;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #oyun {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #oyun canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="oyun"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>

<script>/* MasalPark: oyun sirasinda ekran uykuya gecmesin */
(function(){var wl=null;function al(){try{if(navigator.wakeLock&&document.visibilityState==='visible')
navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){});}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden)al();});
document.addEventListener('pointerdown',al,{once:true});al();})();</script>
