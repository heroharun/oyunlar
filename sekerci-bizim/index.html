<title>ŞEKERCİ BİZİM — Çınar Kuruyemiş</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  :root{ --bg:#fdf6ec; --ink:#5a4028; --dim:#a3855f; --gold:#e8963e; --green:#7cb356; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#f8e7cd;color:var(--ink);
    font-family:"Avenir Next","Futura","Trebuchet MS",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  /* ---- şekerci dükkânı sahnesi ---- */
  #scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    background:
      repeating-linear-gradient(90deg,rgba(232,150,62,.05) 0 20px,rgba(232,150,62,0) 20px 40px),
      linear-gradient(180deg,#fbeed6 0%,#f6dfba 60%,#f0d5a8 100%)}
  #counter{position:absolute;left:0;right:0;bottom:0;height:34%;
    background:
      repeating-linear-gradient(90deg,rgba(40,15,0,.12) 0 2px,rgba(255,255,255,0) 2px 70px),
      repeating-linear-gradient(180deg,rgba(255,220,170,.06) 0 3px,rgba(255,220,170,0) 3px 26px),
      linear-gradient(180deg,#a06a3a 0%,#7d4d24 55%,#623a18 100%)}
  #counter::before{content:'';position:absolute;left:0;right:0;top:0;height:10px;
    background:linear-gradient(180deg,#c68d55,#8f5c2d);box-shadow:0 3px 8px rgba(50,20,0,.4)}
  #shopSvg{position:absolute;top:0;left:0;width:100%;height:44%;min-height:210px}
  #vin{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%,rgba(255,200,120,.10) 0%,rgba(255,180,90,0) 42%,rgba(70,32,6,.30) 100%)}
  #wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
  #hud{width:min(94vw,440px);display:flex;justify-content:space-between;align-items:stretch;gap:8px}
  #hud>div{flex:1;background:linear-gradient(180deg,rgba(255,252,246,.78),rgba(255,241,219,.6));
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    border:1px solid rgba(255,255,255,.75);border-radius:14px;padding:6px 10px;
    box-shadow:0 4px 12px rgba(90,50,15,.22),inset 0 1px 0 rgba(255,255,255,.9)}
  .label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .value{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #fff}
  #lvlbar{width:min(94vw,440px);height:12px;background:rgba(74,42,16,.35);border-radius:99px;overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(40,18,0,.35),0 1px 0 rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.4)}
  #lvlfill{height:100%;width:0%;border-radius:99px;transition:width .3s;
    background:linear-gradient(90deg,#7cb356,#e8963e,#ff6f91);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.45)}
  #board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
  canvas{display:block;border-radius:18px;
    background:linear-gradient(180deg,#5f3c20,#472a10);
    box-shadow:0 12px 36px rgba(55,25,0,.5),inset 0 0 0 3px rgba(255,215,160,.22),inset 0 3px 20px rgba(0,0,0,.4)}
  #comboTxt{position:fixed;top:16%;left:50%;transform:translateX(-50%);font-size:26px;font-weight:900;
    color:var(--gold);opacity:0;pointer-events:none;text-shadow:0 0 14px rgba(232,150,62,.6);white-space:nowrap}
  #comboTxt.pop{animation:cp .8s ease-out}
  @keyframes cp{0%{opacity:0;transform:translateX(-50%) scale(.5)}
    18%{opacity:1;transform:translateX(-50%) scale(1.1)}80%{opacity:1}100%{opacity:0}}
  .card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;
    background:
      radial-gradient(circle at 12% 18%,rgba(255,111,145,.16),transparent 26%),
      radial-gradient(circle at 88% 14%,rgba(124,179,86,.16),transparent 26%),
      radial-gradient(circle at 16% 84%,rgba(140,95,184,.14),transparent 26%),
      radial-gradient(circle at 86% 82%,rgba(232,150,62,.18),transparent 28%),
      radial-gradient(rgba(232,150,62,.12) 2.4px,transparent 2.6px),
      repeating-linear-gradient(45deg,#fdf3e2 0 26px,#fae9d0 26px 52px);
    background-size:auto,auto,auto,auto,34px 34px,auto;
    transition:opacity .3s;padding:24px;z-index:10}
  .card.hidden{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
  .card.hidden .btn{pointer-events:none}
  .card h1{font-size:clamp(34px,9vw,66px);font-weight:900;line-height:1;
    background:linear-gradient(180deg,#ff6f91 0%,#e8963e 52%,#7cb356 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;transform:rotate(-2deg);
    filter:drop-shadow(0 3px 0 rgba(120,70,20,.28)) drop-shadow(0 8px 14px rgba(120,60,10,.18))}
  .card .marka{font-size:14px;font-weight:800;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
  .card p{max-width:34ch;color:#8a6b45;font-size:15px;line-height:1.5}
  .card .menuArt{width:min(58vw,240px);height:auto;filter:drop-shadow(0 6px 10px rgba(120,60,10,.25))}
  .btn{font:inherit;font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;
    color:#fff;text-shadow:0 1px 2px rgba(140,50,20,.5);
    background:linear-gradient(180deg,#ffb35c 0%,#f0883a 45%,#d96f24 100%);
    border:2px solid rgba(255,255,255,.55);border-radius:999px;
    padding:14px 38px;cursor:pointer;
    box-shadow:0 5px 0 #8f5218,0 10px 20px rgba(150,80,20,.35),inset 0 2px 0 rgba(255,255,255,.6)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8f5218}
  .btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

<script>
'use strict';
const N=8, TYPES=5;
const EMO=['🥜','🌰','🍇','🍑','🌻','🍯'];
const COLS=['#c9925a','#8a5a3a','#8c5fb8','#ff9f5f','#e8c93e','#e8b45f'];
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let CELL=44, DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  const b=document.getElementById('board');
  CELL=Math.floor(Math.min(b.clientWidth*0.94,b.clientHeight*0.98,460)/N);
  cv.style.width=cv.style.height=CELL*N+'px';
  cv.width=cv.height=CELL*N*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  makeSprites();
}
addEventListener('resize',resize);

/* ---- özel çizim şeker taşları (sprite önbelleği) ---- */
let sprites=[];
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function powder(g,cx,cy,rad,n,col){ let s=13+n; g.fillStyle=col;
  for(let i=0;i<n;i++){ s=(s*16807)%2147483647; const a=(s%628)/100;
    s=(s*16807)%2147483647; const d=rad*0.85*((s%97)/97);
    s=(s*16807)%2147483647; const pr=rad*(0.03+0.03*((s%89)/89));
    g.beginPath(); g.arc(cx+Math.cos(a)*d, cy+Math.sin(a)*d*0.85, pr, 0, 6.29); g.fill(); } }
function gloss(g,x,y,rx,ry,rot){ g.save(); g.translate(x,y); g.rotate(rot);
  g.fillStyle='rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(0,0,rx,ry,0,0,6.29); g.fill(); g.restore(); }
function drawCandy(g,t,S){
  const cx=S/2, cy=S*0.47, r=S*0.355, LW=Math.max(1,S*0.02);
  const edge='rgba(88,45,18,.45)';
  g.clearRect(0,0,S,S);
  // alt gölge
  g.fillStyle='rgba(30,12,0,.32)';
  g.beginPath(); g.ellipse(cx,S*0.875,r*0.92,r*0.24,0,0,6.29); g.fill();
  if(t===0||t===2){ /* lokum küpleri: fıstıklı & gül */
    const w=r*1.95,h=r*1.85,x=cx-w/2,y=cy-h/2,rad=S*0.12;
    const cols=t===0?['#d3e69a','#a4c45f','#79993a']:['#f0b7e0','#c77bc4','#94519e'];
    const gr=g.createRadialGradient(cx-w*0.22,y+h*0.26,r*0.2,cx,cy,r*1.55);
    gr.addColorStop(0,cols[0]); gr.addColorStop(.55,cols[1]); gr.addColorStop(1,cols[2]);
    rr(g,x,y,w,h,rad); g.fillStyle=gr; g.fill();
    g.lineWidth=LW; g.strokeStyle=edge; g.stroke();
    gloss(g,cx-w*0.17,y+h*0.26,w*0.24,h*0.12,-0.35);
    powder(g,cx,cy,r,24,'rgba(255,255,255,.8)');
    if(t===0){ g.fillStyle='#48632a';
      g.beginPath(); g.ellipse(cx+w*0.16,cy+h*0.12,S*0.055,S*0.036,0.6,0,6.29); g.fill();
      g.beginPath(); g.ellipse(cx-w*0.2,cy+h*0.2,S*0.045,S*0.03,-0.4,0,6.29); g.fill(); }
  } else if(t===1||t===5){ /* toplar: çikolata & ballı draje */
    const cols=t===1?['#b07a4e','#7a4a2a','#452510']:['#ffe0a0','#efa94a','#a8621a'];
    const gr=g.createRadialGradient(cx-r*0.35,cy-r*0.42,r*0.14,cx,cy,r*1.18);
    gr.addColorStop(0,cols[0]); gr.addColorStop(.62,cols[1]); gr.addColorStop(1,cols[2]);
    g.beginPath(); g.arc(cx,cy,r,0,6.29); g.fillStyle=gr; g.fill();
    g.lineWidth=LW; g.strokeStyle=edge; g.stroke();
    g.save(); g.beginPath(); g.arc(cx,cy,r*0.96,0,6.29); g.clip();
    if(t===1){ g.strokeStyle='rgba(255,236,214,.6)'; g.lineWidth=S*0.028;
      for(let i=-1;i<=1;i++){ g.beginPath();
        g.moveTo(cx-r,cy+i*r*0.42-r*0.12);
        g.quadraticCurveTo(cx,cy+i*r*0.42+r*0.22,cx+r,cy+i*r*0.42-r*0.06); g.stroke(); }
    } else { g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=S*0.03;
      g.beginPath(); g.ellipse(cx,cy+r*0.1,r*0.85,r*0.34,0,0,6.29); g.stroke(); }
    g.restore();
    gloss(g,cx-r*0.34,cy-r*0.4,r*0.32,r*0.18,-0.5);
  } else if(t===3){ /* meyve jölesi dilimi */
    const gr=g.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.1,cx,cy,r*1.2);
    gr.addColorStop(0,'#ffc98f'); gr.addColorStop(.55,'#ff9f5f'); gr.addColorStop(1,'#e0702a');
    g.beginPath(); g.arc(cx,cy,r,0,6.29); g.fillStyle=gr; g.fill();
    g.lineWidth=LW; g.strokeStyle=edge; g.stroke();
    g.strokeStyle='rgba(255,240,215,.85)'; g.lineWidth=S*0.035;
    g.beginPath(); g.arc(cx,cy,r*0.82,0,6.29); g.stroke();
    g.strokeStyle='rgba(255,246,225,.75)'; g.lineWidth=S*0.022;
    for(let i=0;i<8;i++){ const a=i*Math.PI/4+0.39;
      g.beginPath(); g.moveTo(cx+Math.cos(a)*r*0.16,cy+Math.sin(a)*r*0.16);
      g.lineTo(cx+Math.cos(a)*r*0.72,cy+Math.sin(a)*r*0.72); g.stroke(); }
    g.fillStyle='rgba(255,250,235,.85)';
    g.beginPath(); g.arc(cx,cy,r*0.12,0,6.29); g.fill();
    gloss(g,cx-r*0.32,cy-r*0.4,r*0.3,r*0.16,-0.5);
    powder(g,cx,cy,r,10,'rgba(255,255,255,.5)');
  } else { /* akide şekeri: faset damla */
    const p=[[cx,cy-r*1.08],[cx+r*0.88,cy-r*0.1],[cx+r*0.5,cy+r*0.85],[cx-r*0.5,cy+r*0.85],[cx-r*0.88,cy-r*0.1]];
    const gr=g.createRadialGradient(cx-r*0.3,cy-r*0.35,r*0.12,cx,cy,r*1.3);
    gr.addColorStop(0,'#fff0a8'); gr.addColorStop(.55,'#eec93e'); gr.addColorStop(1,'#bf9410');
    g.beginPath(); g.moveTo(p[0][0],p[0][1]);
    for(let i=1;i<p.length;i++) g.lineTo(p[i][0],p[i][1]);
    g.closePath(); g.fillStyle=gr; g.fill();
    g.lineWidth=LW; g.strokeStyle=edge; g.stroke();
    g.strokeStyle='rgba(255,248,210,.6)'; g.lineWidth=Math.max(1,S*0.016);
    for(const q of p){ g.beginPath(); g.moveTo(cx,cy+r*0.05); g.lineTo(q[0],q[1]); g.stroke(); }
    gloss(g,cx-r*0.28,cy-r*0.42,r*0.26,r*0.15,-0.6);
    powder(g,cx,cy,r*0.9,8,'rgba(255,255,255,.55)');
  }
}
function makeSprites(){
  const S=Math.max(24,Math.round(CELL*DPR));
  sprites=[];
  for(let t=0;t<EMO.length;t++){
    const c=document.createElement('canvas'); c.width=c.height=S;
    drawCandy(c.getContext('2d'),t,S);
    sprites.push(c);
  }
}

let AC=null;
const audio=()=>{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; };
function blip(f,d=0.08,v=0.15,t='triangle'){ try{ const a=audio(),n=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.001,n+d);
  o.connect(g).connect(a.destination);o.start(n);o.stop(n+d+0.02);}catch(e){} }
const buzz=ms=>{ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} };

let grid, score=0, level=1, state='intro', busy=false, particles=[], offsetY, tick=0;
let best=0; try{ best=+localStorage.getItem('sekerci_best')||0; }catch(e){}
const LVL=l=>l*1500;                 // seviye eşiği (kümülatif)

function randT(){ return Math.floor(Math.random()*TYPES); }
function findMatches(){
  const out=new Set();
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const v=grid[y][x]; if(v<0)continue;
    if(x<N-2&&grid[y][x+1]===v&&grid[y][x+2]===v){ out.add(y*N+x); out.add(y*N+x+1); out.add(y*N+x+2); }
    if(y<N-2&&grid[y+1][x]===v&&grid[y+2][x]===v){ out.add(y*N+x); out.add((y+1)*N+x); out.add((y+2)*N+x); }
  }
  return [...out].map(i=>({x:i%N,y:Math.floor(i/N)}));
}
function hasMove(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)
    for(const [dx,dy] of [[1,0],[0,1]]){
      const nx=x+dx,ny=y+dy; if(nx>=N||ny>=N)continue;
      [grid[y][x],grid[ny][nx]]=[grid[ny][nx],grid[y][x]];
      const ok=findMatches().length>0;
      [grid[y][x],grid[ny][nx]]=[grid[ny][nx],grid[y][x]];
      if(ok) return true;
    }
  return false;
}
function makeGrid(){
  grid=Array.from({length:N},()=>Array(N).fill(0).map(randT));
  let guard=0;
  while(findMatches().length&&guard++<300)
    for(const m of findMatches()) grid[m.y][m.x]=randT();
  if(!hasMove()) makeGrid();
}
function updHud(){
  document.getElementById('lvlEl').textContent=level;
  document.getElementById('scoreEl').textContent=score.toLocaleString('tr-TR');
  document.getElementById('bestEl').textContent=best.toLocaleString('tr-TR');
  const prev=LVL(level-1), next=LVL(level);
  document.getElementById('lvlfill').style.width=
    Math.min(100,Math.max(0,(score-prev)/(next-prev)*100))+'%';
}
function save(){ try{ localStorage.setItem('sekerci_save',JSON.stringify({grid,score,level})); }catch(e){} }
function comboMsg(t){ const c=document.getElementById('comboTxt'); c.textContent=t;
  c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }

async function clearAndFall(){
  let chain=0;
  while(true){
    const m=findMatches();
    if(!m.length) break;
    chain++;
    score+=m.length*10*chain;
    if(score>best){ best=score; try{localStorage.setItem('sekerci_best',best);}catch(e){} }
    for(const c of m){
      const px=(c.x+.5)*CELL, py=(c.y+.5)*CELL, cc=COLS[grid[c.y][c.x]]||'#e8963e';
      for(let i=0;i<7;i++) particles.push({x:px,y:py,
        vx:(Math.random()-.5)*5.5,vy:-Math.random()*4.5,life:1,
        col:cc,size:Math.random()*4.5+2.5});
      for(let i=0;i<3;i++) particles.push({x:px,y:py,shape:'star',
        vx:(Math.random()-.5)*3.5,vy:-Math.random()*3-1,life:1,
        rot:Math.random()*6.28,vr:(Math.random()-.5)*0.5,
        col:i?'#fff6dc':'#ffffff',size:Math.random()*3+2.5});
      particles.push({x:px,y:py,shape:'ring',vx:0,vy:0,life:1,
        col:'rgba(255,240,200,1)',size:CELL*0.18});
      grid[c.y][c.x]=-1;
    }
    blip(400+chain*90,0.12,0.18); buzz(10);
    if(chain>=2) comboMsg(chain+'× ZİNCİR!');
    updHud();
    await new Promise(r=>setTimeout(r,170));
    for(let x=0;x<N;x++){
      const col=[];
      for(let y=N-1;y>=0;y--) if(grid[y][x]>=0) col.push(grid[y][x]);
      for(let y=N-1;y>=0;y--){
        const nv=col[N-1-y];
        if(nv===undefined){ grid[y][x]=randT(); offsetY[y][x]=-(y+1)*CELL*0.55; }
        else{ if(grid[y][x]!==nv&&offsetY[y][x]===0) offsetY[y][x]=-CELL*0.35; grid[y][x]=nv; }
      }
    }
    await new Promise(r=>setTimeout(r,150));
  }
  // seviye atlama
  while(score>=LVL(level)){
    level++; comboMsg('SEVİYE '+level+'! 🎉');
    blip(523,0.2,0.2); blip(659,0.25,0.15); buzz([30,50,30]);
  }
  // hamle kalmadıysa tahta tazelenir (oyun bitmez!)
  if(!hasMove()){ comboMsg('TEZGÂH TAZELENDİ 🥜'); makeGrid();
    offsetY=Array.from({length:N},()=>Array(N).fill(-CELL*2)); }
  updHud(); save();
}

/* girdi: sürükleyerek takas — tek seferlik, tahta üzerinde */
let selC=null, startP=null;
function cellAt(px,py){
  const r=cv.getBoundingClientRect();
  const x=Math.floor((px-r.left)/CELL), y=Math.floor((py-r.top)/CELL);
  if(x<0||x>=N||y<0||y>=N) return null; return {x,y};
}
function pt(e){ const t=e.touches?e.touches[0]:e; return {x:t.clientX,y:t.clientY}; }
function down(e){
  if(state!=='play'||busy||e.target.closest('.card'))return;
  const p=pt(e), c=cellAt(p.x,p.y);
  if(!c) return;
  selC=c; startP=p; audio();
}
async function moveH(e){
  if(!selC||busy||!startP) return;
  const p=pt(e), dx=p.x-startP.x, dy=p.y-startP.y;
  if(Math.abs(dx)<CELL*0.35&&Math.abs(dy)<CELL*0.35) return;
  const dir=Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)};
  const a=selC, t={x:a.x+dir.x,y:a.y+dir.y};
  selC=null; startP=null;
  if(t.x<0||t.x>=N||t.y<0||t.y>=N) return;
  busy=true;
  [grid[a.y][a.x],grid[t.y][t.x]]=[grid[t.y][t.x],grid[a.y][a.x]];
  if(findMatches().length){
    blip(350,0.06,0.12);
    await clearAndFall();
  } else {
    blip(180,0.1,0.1,'sawtooth');
    await new Promise(r=>setTimeout(r,140));
    [grid[a.y][a.x],grid[t.y][t.x]]=[grid[t.y][t.x],grid[a.y][a.x]];
  }
  busy=false;
}
addEventListener('touchstart',down,{passive:true});
addEventListener('touchmove',moveH,{passive:true});
addEventListener('touchend',()=>{ selC=null; startP=null; });
addEventListener('mousedown',down);
addEventListener('mousemove',moveH);
addEventListener('mouseup',()=>{ selC=null; startP=null; });

function draw(){
  tick++;
  ctx.clearRect(0,0,N*CELL,N*CELL);
  // yuva damalı zemin (koyu panel üstünde)
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    ctx.fillStyle=(x+y)%2===0?'rgba(255,235,205,.09)':'rgba(0,0,0,.14)';
    ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  }
  // panel üst iç ışık
  const lg=ctx.createLinearGradient(0,0,0,N*CELL);
  lg.addColorStop(0,'rgba(255,215,150,.10)'); lg.addColorStop(.25,'rgba(255,215,150,0)');
  lg.addColorStop(.85,'rgba(0,0,0,0)'); lg.addColorStop(1,'rgba(0,0,0,.18)');
  ctx.fillStyle=lg; ctx.fillRect(0,0,N*CELL,N*CELL);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const v=grid?.[y]?.[x]; if(v===undefined||v<0) continue;
    if(offsetY[y][x]<0) offsetY[y][x]=Math.min(0,offsetY[y][x]+CELL*0.16);
    const sel=selC&&selC.x===x&&selC.y===y;
    const dy=offsetY[y][x]+(sel?Math.sin(tick*0.3)*2:0);
    if(sel){ const gg=ctx.createRadialGradient((x+.5)*CELL,(y+.5)*CELL+dy,CELL*0.1,(x+.5)*CELL,(y+.5)*CELL+dy,CELL*0.62);
      gg.addColorStop(0,'rgba(255,235,170,.55)'); gg.addColorStop(1,'rgba(255,235,170,0)');
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc((x+.5)*CELL,(y+.5)*CELL+dy,CELL*0.62,0,6.29); ctx.fill(); }
    const sp=sprites[v];
    if(sp) ctx.drawImage(sp,x*CELL,y*CELL+dy,CELL,CELL);
  }
  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy; p.life-=0.04;
    ctx.globalAlpha=Math.max(0,p.life);
    if(p.shape==='ring'){ p.size+=CELL*0.045;
      ctx.strokeStyle=p.col; ctx.lineWidth=Math.max(0.5,3*p.life);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,6.28); ctx.stroke();
    } else if(p.shape==='star'){ p.vy+=0.12; p.rot+=p.vr;
      const s=Math.max(0.01,p.size*p.life*1.7);
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.col; ctx.beginPath();
      for(let k=0;k<8;k++){ const rr2=k%2?s*0.4:s, a=k*Math.PI/4;
        k?ctx.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2):ctx.moveTo(s,0); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    } else { p.vy+=0.2;
      ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0.01,p.size*p.life),0,6.28); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  particles=particles.filter(p=>p.life>0);
  requestAnimationFrame(draw);
}
function tap(el,fn){ el._fn=fn;
  const fire=e=>{ e.preventDefault(); e.stopPropagation(); if(el._fn)el._fn(); };
  el.addEventListener('click',fire); el.addEventListener('touchend',fire); }
tap(document.getElementById('startBtn'),()=>{ try{audio();}catch(e){}
  state='play';
  document.getElementById('intro').classList.add('hidden'); });

resize();
let loaded=false;
try{ const s=JSON.parse(localStorage.getItem('sekerci_save'));
  if(s&&s.grid){ grid=s.grid; score=s.score||0; level=s.level||1; loaded=true;
    document.getElementById('startBtn').textContent='Devam Et'; } }catch(e){}
if(!loaded){ score=0; level=1; makeGrid(); }
offsetY=Array.from({length:N},()=>Array(N).fill(0));
if(loaded&&!hasMove()) makeGrid();
updHud();
draw();
</script>
