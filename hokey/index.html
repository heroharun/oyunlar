<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<title>HAVA HOKEYİ — İki Kişilik Düello</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{ --bg:#0e1a2b; --ice:#dceffc; --line:#8fc3e8; --p1:#ff5f6d; --p2:#3fa9f5; --ink:#0e1a2b; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);
    font-family:"Avenir Next","Futura","Trebuchet MS",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%}
  .card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;color:#dceffc;
    background:rgba(14,26,43,.94);transition:opacity .3s;padding:24px;z-index:10}
  .card.hidden{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
  .card.hidden .btn{pointer-events:none}
  .card h1{font-size:clamp(36px,10vw,76px);font-weight:900;line-height:.98}
  .card h1 .a{color:var(--p1)} .card h1 .b{color:var(--p2)}
  .card p{max-width:36ch;color:#7fa8c9;font-size:14px;line-height:1.55}
  .btn{font:inherit;font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase;
    color:#0e1a2b;background:linear-gradient(180deg,#dceffc,#a8d4f0);border:none;border-radius:999px;
    padding:14px 36px;cursor:pointer;box-shadow:0 5px 0 #5c8cb0}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #5c8cb0}
  .btn.red{background:linear-gradient(180deg,#ff8f99,#ff5f6d);box-shadow:0 5px 0 #b03844;color:#fff}
  .btn.red:active{box-shadow:0 2px 0 #b03844}
  .btn:focus-visible{outline:3px solid #dceffc;outline-offset:3px}
  .netrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  .btn.kucuk{font-size:13px;padding:12px 22px}
  #joinCode{font:800 16px "Avenir Next",system-ui;letter-spacing:.3em;text-transform:uppercase;
    width:104px;text-align:center;background:rgba(220,239,252,.08);color:#dceffc;
    border:2px solid rgba(143,195,232,.4);border-radius:12px;padding:12px 8px;outline:none}
  #netMsg{font-size:13px;font-weight:700;color:#8fc3e8;min-height:18px;letter-spacing:.04em}
  #netMsg.hata{color:#ff8f99}
</style>

<canvas id="cv"></canvas>

<div class="card" id="intro">
  <h1><span class="a">HAVA</span> <span class="b">HOKEYİ</span></h1>
  <p>Topu rakip kaleye sok, 7 sayıya ilk ulaşan kazanır. İki kişilik modda telefonu aranıza koyun — herkes kendi yarısından tokmağını sürükler!</p>
  <button class="btn red" id="vsBtn">🤝 2 Kişilik</button>
  <button class="btn" id="aiBtn">🤖 Bilgisayara Karşı</button>
  <div class="netrow">
    <button class="btn kucuk" id="hostBtn">🌐 Oda Kur</button>
    <input id="joinCode" maxlength="4" placeholder="KOD" autocomplete="off">
    <button class="btn kucuk" id="joinBtn">Katıl</button>
  </div>
  <p id="netMsg"></p>
</div>

<div class="card hidden" id="endcard">
  <h1 id="endTitle"></h1>
  <p id="endMsg"></p>
  <button class="btn" id="againBtn">Tekrar</button>
  <button class="btn red" id="menuBtn">Menü</button>
</div>

<script>
'use strict';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();

let AC=null;
const audio=()=>{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; };
function clack(v=0.2,f=900){ try{ const a=audio(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*0.5,t+0.06);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+0.1);}catch(e){} }
function horn(){ try{ const a=audio(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='sawtooth';o.frequency.value=220;
  g.gain.setValueAtTime(0.22,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+0.5);}catch(e){} }
const buzz=ms=>{ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} };

const GOAL_W=()=>Math.min(W*0.42,220);
let mode='vs', state='intro', tick=0;
let puck, mal1, mal2, score1, score2, freeze=0;
const R_M=()=>Math.min(44,W*0.11), R_P=()=>Math.min(20,W*0.05);

function reset(server){
  puck={x:W/2, y:H/2+(server===1?80:-80), vx:0, vy:0};
  mal1={x:W/2, y:H-110, tx:W/2, ty:H-110};   // alt (kırmızı)
  mal2={x:W/2, y:110, tx:W/2, ty:110};       // üst (mavi)
  freeze=30;
}
function newMatch(){ score1=0; score2=0; reset(1); state='play'; }

/* girdi: her yarı kendi parmağını takip eder */
const touches={};
addEventListener('touchstart',e=>{
  if(state!=='play'||e.target.closest('.card')) return;
  audio();
  for(const t of e.changedTouches){
    if(t.clientY>H/2) touches[t.identifier]='m1';
    else if(mode==='vs') touches[t.identifier]='m2';
    else if(mode==='ai') touches[t.identifier]='m1';
    else continue; // online: rakibin yarısına dokunulmaz
    moveTo(t);
  }
},{passive:true});
addEventListener('touchmove',e=>{
  for(const t of e.changedTouches) if(touches[t.identifier]) moveTo(t);
},{passive:true});
addEventListener('touchend',e=>{ for(const t of e.changedTouches) delete touches[t.identifier]; });
function moveTo(t){
  const who=touches[t.identifier];
  if(who==='m1'){ mal1.tx=t.clientX; mal1.ty=Math.max(H/2+R_M(),t.clientY); }
  else{ mal2.tx=t.clientX; mal2.ty=Math.min(H/2-R_M(),t.clientY); }
}
addEventListener('mousemove',e=>{
  if(state!=='play') return;
  mal1.tx=e.clientX; mal1.ty=Math.max(H/2+R_M(),e.clientY);
});

function stepMallet(m){
  const ox=m.x, oy=m.y;
  m.x+=(m.tx-m.x)*0.5; m.y+=(m.ty-m.y)*0.5;
  m.x=Math.max(R_M(),Math.min(W-R_M(),m.x));
  m.vx=m.x-ox; m.vy=m.y-oy;
}
function aiStep(){
  const m=mal2, sp=0.075+Math.min(score1,5)*0.012;
  // topa doğru; top kendi yarısındaysa saldır, değilse merkezde bekle
  let gx, gy;
  if(puck.y<H/2){ gx=puck.x; gy=puck.y-18; }
  else { gx=W/2+(puck.x-W/2)*0.4; gy=140; }
  m.tx=gx; m.ty=Math.min(H/2-R_M(),gy);
  m.x+=(m.tx-m.x)*sp*2; m.y+=(m.ty-m.y)*sp*2;
  m.x=Math.max(R_M(),Math.min(W-R_M(),m.x));
}
function collideMallet(m){
  const dx=puck.x-m.x, dy=puck.y-m.y, d=Math.hypot(dx,dy), min=R_M()+R_P();
  if(d<min&&d>0){
    const nx=dx/d, ny=dy/d;
    puck.x=m.x+nx*min; puck.y=m.y+ny*min;
    const dot=puck.vx*nx+puck.vy*ny;
    if(dot<0){ puck.vx-=2*dot*nx; puck.vy-=2*dot*ny; }
    puck.vx+= (m.vx||0)*0.7; puck.vy+=(m.vy||0)*0.7;
    const sp=Math.hypot(puck.vx,puck.vy);
    if(sp>16){ puck.vx*=16/sp; puck.vy*=16/sp; }
    clack(0.18,700+Math.random()*300); buzz(6);
  }
}
function physics(){
  tick++;
  stepMallet(mal1);
  if(mode==='vs'||mode==='host') stepMallet(mal2);
  else if(mode==='ai') aiStep();
  if(freeze>0){ freeze--; return; }
  puck.x+=puck.vx; puck.y+=puck.vy;
  puck.vx*=0.995; puck.vy*=0.995;
  const r=R_P(), gw=GOAL_W();
  if(puck.x<r){ puck.x=r; puck.vx=Math.abs(puck.vx); clack(0.1,500); }
  if(puck.x>W-r){ puck.x=W-r; puck.vx=-Math.abs(puck.vx); clack(0.1,500); }
  const inGoalX=Math.abs(puck.x-W/2)<gw/2;
  if(puck.y<r){ if(inGoalX){ goal(1); return; } puck.y=r; puck.vy=Math.abs(puck.vy); clack(0.1,500); }
  if(puck.y>H-r){ if(inGoalX){ goal(2); return; } puck.y=H-r; puck.vy=-Math.abs(puck.vy); clack(0.1,500); }
  collideMallet(mal1); collideMallet(mal2);
}
function goal(who){
  horn(); buzz([40,60,40]);
  if(who===1) score1++; else score2++;
  if(score1>=7||score2>=7){ endMatch(); return; }
  reset(who===1?2:1);
}
function endMatch(){
  state='over';
  const w1=score1>score2;
  const t=document.getElementById('endTitle'), m=document.getElementById('endMsg');
  if(mode==='ai'){
    t.innerHTML=w1?'<span class="a">Kazandın!</span> 🏆':'<span class="b">Bilgisayar Kazandı</span> 🤖';
    m.textContent=score1+' – '+score2+(w1?' · İyi bilekmiş!':' · Rövanş?');
  } else if(mode==='host'||mode==='guest'){
    t.innerHTML=w1?'<span class="a">Kazandın!</span> 🏆':'<span class="b">Rakip Kazandı</span>';
    m.textContent=score1+' – '+score2+(w1?' · Süpersin!':' · Rövanş?');
  } else {
    t.innerHTML=w1?'<span class="a">Kırmızı Kazandı!</span>':'<span class="b">Mavi Kazandı!</span>';
    m.textContent=score1+' – '+score2+' · Rövanş şart.';
  }
  document.getElementById('endcard').classList.remove('hidden');
}

function draw(){
  // buz
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#cfe9fa'); g.addColorStop(0.5,'#eaf6fe'); g.addColorStop(1,'#cfe9fa');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // çizgiler
  ctx.strokeStyle='#8fc3e8'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,70,0,6.28); ctx.stroke();
  ctx.fillStyle='rgba(143,195,232,.25)';
  ctx.beginPath(); ctx.arc(W/2,H/2,12,0,6.28); ctx.fill();
  // kaleler
  const gw=GOAL_W();
  ctx.strokeStyle='#3fa9f5'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(W/2-gw/2,4); ctx.lineTo(W/2+gw/2,4); ctx.stroke();
  ctx.strokeStyle='#ff5f6d';
  ctx.beginPath(); ctx.moveTo(W/2-gw/2,H-4); ctx.lineTo(W/2+gw/2,H-4); ctx.stroke();
  // skor
  ctx.font='900 46px "Avenir Next",system-ui,sans-serif'; ctx.textAlign='center';
  ctx.fillStyle='rgba(63,169,245,.3)'; ctx.fillText(score2??0,W/2,H/2-40);
  ctx.save(); ctx.translate(W/2,H/2+40); ctx.rotate(mode==='vs'?Math.PI:0);
  ctx.fillStyle='rgba(255,95,109,.3)'; ctx.fillText(score1??0,0,mode==='vs'?-14:14);
  ctx.restore();
  if(state==='intro') return;
  // tokmaklar
  drawMallet(mal2,'#3fa9f5','#1e78b8');
  drawMallet(mal1,'#ff5f6d','#c0392b');
  // top
  ctx.fillStyle='rgba(14,26,43,.25)';
  ctx.beginPath(); ctx.arc(puck.x+2,puck.y+3,R_P(),0,6.28); ctx.fill();
  const pg=ctx.createRadialGradient(puck.x-4,puck.y-4,2,puck.x,puck.y,R_P());
  pg.addColorStop(0,'#4a5568'); pg.addColorStop(1,'#1a2332');
  ctx.fillStyle=pg;
  ctx.beginPath(); ctx.arc(puck.x,puck.y,R_P(),0,6.28); ctx.fill();
  if(freeze>0&&Math.floor(tick/8)%2===0){
    ctx.strokeStyle='rgba(14,26,43,.4)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(puck.x,puck.y,R_P()+8,0,6.28); ctx.stroke();
  }
}
function drawMallet(m,col,dark){
  ctx.fillStyle='rgba(14,26,43,.25)';
  ctx.beginPath(); ctx.arc(m.x+2,m.y+4,R_M(),0,6.28); ctx.fill();
  const g=ctx.createRadialGradient(m.x-8,m.y-8,4,m.x,m.y,R_M());
  g.addColorStop(0,col); g.addColorStop(1,dark);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(m.x,m.y,R_M(),0,6.28); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.arc(m.x,m.y,R_M()*0.45,0,6.28); ctx.fill();
  ctx.fillStyle=dark;
  ctx.beginPath(); ctx.arc(m.x,m.y,R_M()*0.28,0,6.28); ctx.fill();
}
function loop(){
  if(state==='play'){ if(mode==='guest') guestStep(); else physics(); }
  draw(); requestAnimationFrame(loop);
}

function tap(el,fn){ el._fn=fn;
  const fire=e=>{ e.preventDefault(); e.stopPropagation(); if(el._fn)el._fn(); };
  el.addEventListener('click',fire); el.addEventListener('touchend',fire); }
tap(document.getElementById('vsBtn'),()=>{ try{audio();}catch(e){} mode='vs'; newMatch();
  document.getElementById('intro').classList.add('hidden'); });
tap(document.getElementById('aiBtn'),()=>{ try{audio();}catch(e){} mode='ai'; newMatch();
  document.getElementById('intro').classList.add('hidden'); });
tap(document.getElementById('againBtn'),()=>{
  if(mode==='guest'){ try{ net.conn.send({t:'again'}); }catch(e){} return; }
  newMatch();
  document.getElementById('endcard').classList.add('hidden'); });
tap(document.getElementById('menuBtn'),()=>{
  if(mode==='host'||mode==='guest'){ try{ net.conn && net.conn.close(); }catch(e){} location.reload(); return; }
  state='intro';
  document.getElementById('endcard').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden'); });
/* ================= ONLINE (PeerJS, host-otoriter) =================
   Kasmasın diye: misafirin KENDİ tokmağı tamamen yerel (sıfır gecikme),
   fizik host'ta; top misafirde ölü-hesapla akar, kar deltasında yumuşak
   düzeltilir. Koordinatlar ekran oranına normalize, misafir sahayı ayna
   görür: HERKES kendini ALTTA KIRMIZI oynar. */
const PEER_ONEK='hokeytr-';
const net={ peer:null, conn:null, role:null };
const netMsgEl=document.getElementById('netMsg');
function netMsg(t,hata){ netMsgEl.textContent=t; netMsgEl.classList.toggle('hata',!!hata); }
function kodUret(){ const A='ABCDEFGHJKLMNPRSTUVYZ23456789'; let k='';
  for(let i=0;i<4;i++) k+=A[Math.floor(Math.random()*A.length)]; return k; }

function odaKur(){
  if(!window.Peer){ netMsg('PeerJS yüklenemedi — internet gerekli', true); return; }
  audio();
  const kod=kodUret();
  netMsg('Kod: '+kod+' — arkadaşın bekleniyor…');
  net.peer=new Peer(PEER_ONEK+kod);
  net.peer.on('error', e=>netMsg('Bağlantı hatası: '+e.type, true));
  net.peer.on('connection', c=>{
    net.conn=c; net.role='host';
    c.on('open', ()=>{ netBasla('host'); });
    c.on('data', d=>{
      if(d.t==='pos'){ mal2.tx=d.x*W; mal2.ty=Math.min(H/2-R_M(), d.y*H); }
      else if(d.t==='again' && state==='over'){ newMatch();
        document.getElementById('endcard').classList.add('hidden'); }
    });
    c.on('close', ()=>{ netMsg('Rakip ayrıldı', true); setTimeout(()=>location.reload(), 1200); });
  });
}
function katil(){
  if(!window.Peer){ netMsg('PeerJS yüklenemedi — internet gerekli', true); return; }
  audio();
  const kod=(document.getElementById('joinCode').value||'').trim().toUpperCase();
  if(kod.length!==4){ netMsg('4 haneli oda kodunu yaz', true); return; }
  netMsg('Bağlanılıyor…');
  net.peer=new Peer();
  net.peer.on('error', e=>netMsg('Bağlantı hatası: '+e.type, true));
  net.peer.on('open', ()=>{
    const c=net.peer.connect(PEER_ONEK+kod, {reliable:false});
    net.conn=c; net.role='guest';
    c.on('open', ()=>{ netBasla('guest'); });
    c.on('data', d=>{ if(d.t==='snap') snapAl(d); });
    c.on('close', ()=>{ netMsg('Bağlantı koptu', true); setTimeout(()=>location.reload(), 1200); });
  });
}
function netBasla(rol){
  mode=rol; newMatch();
  document.getElementById('intro').classList.add('hidden');
  netMsg('');
}

/* Host → misafir: 30Hz anlık görüntü (host uzayında normalize) */
setInterval(()=>{
  if(net.role!=='host' || !net.conn || !net.conn.open) return;
  net.conn.send({ t:'snap',
    px:puck.x/W, py:puck.y/H, pvx:puck.vx/W, pvy:puck.vy/H,
    mx:mal1.x/W, my:mal1.y/H,
    s1:score1, s2:score2, f:freeze, st:state });
}, 33);
/* Misafir → host: 30Hz kendi tokmağı (host uzayına aynalanmış) */
setInterval(()=>{
  if(net.role!=='guest' || !net.conn || !net.conn.open) return;
  net.conn.send({ t:'pos', x:1-mal1.x/W, y:1-mal1.y/H });
}, 33);

/* Misafir: karı uygula (ayna) + yumuşak düzeltme */
let sonS1=0, sonS2=0;
function snapAl(d){
  // skorlar aynalanır: misafirin "kendi" skoru altta (score1)
  const yeni1=d.s2, yeni2=d.s1;
  if(yeni1>sonS1 || yeni2>sonS2){ horn(); buzz([40,60,40]); }
  sonS1=yeni1; sonS2=yeni2; score1=yeni1; score2=yeni2;
  freeze=d.f;
  // top: hedef konum (ayna)
  const hx=(1-d.px)*W, hy=(1-d.py)*H;
  const hvx=-d.pvx*W, hvy=-d.pvy*H;
  const fark=Math.hypot(puck.x-hx, puck.y-hy);
  if(fark>70){ puck.x=hx; puck.y=hy; }        // büyük sapma: anında düzelt
  else { puck.x+=(hx-puck.x)*0.35; puck.y+=(hy-puck.y)*0.35; }
  puck.vx=hvx; puck.vy=hvy;
  // host tokmağı (misafirde üstte görünür)
  mal2.tx=(1-d.mx)*W; mal2.ty=(1-d.my)*H;
  // durum geçişleri
  if(d.st==='over' && state==='play'){ score1=yeni1; score2=yeni2; endMatch(); }
  if(d.st==='play' && state==='over'){ state='play';
    document.getElementById('endcard').classList.add('hidden'); reset(1); }
}

/* Misafir yerel adımı: kendi tokmağı anında, top ölü-hesap */
function guestStep(){
  tick++;
  stepMallet(mal1);                 // kendi tokmağın: sıfır gecikme
  mal2.x+=(mal2.tx-mal2.x)*0.4;     // rakip tokmağı yumuşak izler
  mal2.y+=(mal2.ty-mal2.y)*0.4;
  if(freeze>0){ freeze--; return; }
  puck.x+=puck.vx; puck.y+=puck.vy;
  puck.vx*=0.995; puck.vy*=0.995;
  const r=R_P();
  if(puck.x<r){ puck.x=r; puck.vx=Math.abs(puck.vx); }
  if(puck.x>W-r){ puck.x=W-r; puck.vx=-Math.abs(puck.vx); }
  if(puck.y<r){ puck.y=r; puck.vy=Math.abs(puck.vy); }
  if(puck.y>H-r){ puck.y=H-r; puck.vy=-Math.abs(puck.vy); }
  collideMallet(mal1);              // kendi vuruşun anında hissedilir (ses+sekme)
}

tap(document.getElementById('hostBtn'), odaKur);
tap(document.getElementById('joinBtn'), katil);
document.getElementById('joinCode').addEventListener('touchend', e=>e.stopPropagation());

score1=0;score2=0;reset(1);
loop();
</script>

<style>
#mpNasilBtn{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:2147483000;
  width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.55);cursor:pointer;
  background:rgba(20,22,40,.78);color:#ffc94d;font-size:22px;font-weight:900;
  font-family:system-ui,sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.35);transition:opacity .4s}
#mpNasilBtn.mpGizli{opacity:0;pointer-events:none}
#mpNasilKap{position:fixed;inset:0;z-index:2147483001;display:none;align-items:center;justify-content:center;
  background:rgba(10,12,26,.82);padding:20px}
#mpNasilKap.mpAcik{display:flex}
#mpNasilKart{background:#fff;color:#26283a;border-radius:20px;max-width:420px;width:100%;
  padding:22px 20px;font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;
  box-shadow:0 18px 50px rgba(0,0,0,.4);max-height:82vh;overflow-y:auto}
#mpNasilKart h2{font-size:20px;font-weight:900;margin:0 0 12px;color:#1a1c30}
#mpNasilKart p{font-size:14.5px;line-height:1.75;white-space:pre-line;margin:0 0 16px}
#mpNasilKart button{font:inherit;font-weight:800;font-size:15px;width:100%;padding:13px;
  border:none;border-radius:999px;background:#1a1c30;color:#ffc94d;cursor:pointer}
</style>
<button id="mpNasilBtn" aria-label="Nasıl oynanır">?</button>
<div id="mpNasilKap" role="dialog" aria-modal="true">
  <div id="mpNasilKart">
    <h2>❓ NASIL OYNANIR — HAVA HOKEYİ</h2>
    <p></p>
    <button id="mpNasilTamam">Anladım, Oynayalım!</button>
  </div>
</div>
<script>
(function(){
  var btn=document.getElementById('mpNasilBtn'),
      kap=document.getElementById('mpNasilKap');
  document.querySelector('#mpNasilKart p').textContent='1️⃣ Raketini parmağınla sürükle, topa vur.\n2️⃣ Rakip kaleye gol atmaya çalış.\n3️⃣ 2 kişilik: telefonu aranıza koyun; veya oda koduyla online oynayın.\n4️⃣ Tek kişilik modda bota karşı oynarsın.\n💡 Topa raketin kenarıyla vurursan açı kazanır.';
  function ac(e){ if(e){e.preventDefault();e.stopPropagation();} kap.classList.add('mpAcik'); }
  function kapat(e){ if(e){e.preventDefault();e.stopPropagation();} kap.classList.remove('mpAcik'); }
  btn.addEventListener('click',ac); btn.addEventListener('touchend',ac);
  document.getElementById('mpNasilTamam').addEventListener('click',kapat);
  document.getElementById('mpNasilTamam').addEventListener('touchend',kapat);
  kap.addEventListener('click',function(e){ if(e.target===kap) kapat(e); });
  /* oyun başlayınca düğme kaybolsun: butona/modala olmayan 2. dokunuştan sonra */
  var sayac=0;
  document.addEventListener('pointerdown',function(e){
    if(e.target.closest('#mpNasilBtn,#mpNasilKap')) return;
    if(++sayac>=2) setTimeout(function(){ btn.classList.add('mpGizli'); },400);
  },true);
})();
</script>
