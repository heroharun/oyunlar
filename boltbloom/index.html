<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#241D3A">
<meta name="description" content="Bolt Bloom — renkli vidalari sok, kutulara yerlestir, mekanik yaratiklari onar.">
<title>Bolt Bloom — Vida Atolyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-state="BOOT" data-theme="workshop">

<div id="frame">
<div id="app" class="app">

  <!-- ============ ACILIS ============ -->
  <section class="screen active" data-screen="boot">
    <div class="boot-inner">
      <div class="logo">
        <svg viewBox="-60 -60 120 120" aria-hidden="true">
          <g class="logo-bolt">
            <circle r="46" fill="#F2A03D" stroke="#241D3A" stroke-width="6"/>
            <path d="M-46 0a46 46 0 0 1 92 0" fill="#FFD08A"/>
            <circle r="30" fill="#FFF8EE" stroke="#241D3A" stroke-width="5"/>
            <path d="M-18 -5h36v10h-36z M-5 -18h10v36h-10z" fill="#241D3A"/>
          </g>
        </svg>
      </div>
      <h1 class="brand">Bolt<span>Bloom</span></h1>
      <p class="tagline">Sihirli tamir atolyesine hos geldin.</p>
      <button class="btn primary big" data-act="boot">Atolyeyi ac</button>
      <p class="fineprint">Reklamsiz, kayitsiz, cevrimdisi calisir.</p>
    </div>
  </section>

  <!-- ============ ANA MENU ============ -->
  <section class="screen" data-screen="menu">
    <header class="topbar">
      <span class="brand small">Bolt<span>Bloom</span></span>
      <span class="coinpill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 3a7 7 0 1 1 0 14 7 7 0 0 1 0-14z"/></svg><b data-coins>0</b></span>
    </header>
    <div class="menu-body">
      <div id="menuLast" class="menu-last"></div>
      <button class="btn primary huge" data-act="continue">Oyna</button>
      <div class="menu-grid">
        <button class="tile" data-nav="map"><span class="tile-ic">🗺️</span>Bolumler</button>
        <button class="tile" data-nav="collection"><span class="tile-ic">🧩</span>Koleksiyon</button>
        <button class="tile" data-nav="shop"><span class="tile-ic">🛠️</span>Magaza</button>
        <button class="tile" data-nav="daily"><span class="tile-ic">🎁</span>Gunluk odul</button>
        <button class="tile" data-nav="settings"><span class="tile-ic">⚙️</span>Ayarlar</button>
      </div>
      <p class="menu-stars">Toplam yildiz: <b id="menuStars">0</b></p>
    </div>
  </section>

  <!-- ============ BOLUM HARITASI ============ -->
  <section class="screen" data-screen="map">
    <header class="topbar">
      <button class="iconbtn" data-nav="menu" aria-label="Geri">‹</button>
      <h2>Atolye yolu</h2>
      <span class="coinpill"><b data-coins>0</b></span>
    </header>
    <div id="mapScroll" class="map-scroll"></div>
  </section>

  <!-- ============ OYUN ============ -->
  <section class="screen" data-screen="game">
    <header class="hud">
      <button class="iconbtn" data-act="pause" aria-label="Duraklat">❚❚</button>
      <div class="hud-mid">
        <strong id="hudLevel">Bolum 1</strong>
        <small id="hudSub"></small>
      </div>
      <span id="hudTimer" class="timer">0:00</span>
      <span class="coinpill small"><b data-coins>0</b></span>
    </header>

    <div class="boxzone">
      <div id="boxRow" class="boxrow"></div>
      <div class="nextwrap"><span class="nextlabel">sirada</span><div id="nextBoxes" class="nextboxes"></div></div>
    </div>

    <div id="stageWrap" class="stage-wrap">
      <svg id="stage" viewBox="-210 -230 420 460" preserveAspectRatio="xMidYMid meet" aria-label="Puzzle nesnesi">
        <defs id="stageDefs"></defs>
        <g id="objRoot"></g>
      </svg>
      <div id="trayWarn" class="tray-warn" aria-hidden="true"></div>
      <div id="pipBox" class="pip">
        <div class="pip-bubble"></div>
        <div class="pip-body">
          <svg viewBox="-30 -34 60 64" aria-hidden="true">
            <rect x="-2" y="-32" width="4" height="9" rx="2" fill="#241D3A"/>
            <circle cx="0" cy="-33" r="4.5" fill="#F2A03D" stroke="#241D3A" stroke-width="2"/>
            <circle cx="0" cy="4" r="21" fill="#8FD8E8" stroke="#241D3A" stroke-width="3"/>
            <circle cx="0" cy="0" r="14" fill="#FFF8EE" stroke="#241D3A" stroke-width="2.5"/>
            <circle cx="-5" cy="-1" r="3" fill="#241D3A"/><circle cx="5" cy="-1" r="3" fill="#241D3A"/>
            <path d="M-5 7q5 4 10 0" stroke="#241D3A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="trayzone">
      <span class="traylabel">bekleme yuvalari</span>
      <div id="tray" class="tray"></div>
    </div>

    <div class="bottombar">
      <div id="boosterRow" class="boosters"></div>
      <div class="camctl">
        <button class="iconbtn tiny" data-cam="out" aria-label="Uzaklastir">−</button>
        <button class="iconbtn tiny" data-cam="reset" aria-label="Kamerayi sifirla">⌖</button>
        <button class="iconbtn tiny" data-cam="in" aria-label="Yakinlastir">+</button>
      </div>
    </div>
  </section>

  <!-- ============ KOLEKSIYON ============ -->
  <section class="screen" data-screen="collection">
    <header class="topbar">
      <button class="iconbtn" data-nav="menu" aria-label="Geri">‹</button>
      <h2>Koleksiyon</h2>
      <span class="coinpill"><b id="collCount">0</b></span>
    </header>
    <div id="collGrid" class="coll-grid"></div>
  </section>

  <!-- ============ MAGAZA ============ -->
  <section class="screen" data-screen="shop">
    <header class="topbar">
      <button class="iconbtn" data-nav="menu" aria-label="Geri">‹</button>
      <h2>Magaza</h2>
      <span class="coinpill"><b data-coins>0</b></span>
    </header>
    <div id="shopGrid" class="shop-grid"></div>
  </section>

  <!-- ============ GUNLUK ODUL ============ -->
  <section class="screen" data-screen="daily">
    <header class="topbar">
      <button class="iconbtn" data-nav="menu" aria-label="Geri">‹</button>
      <h2>Gunluk odul</h2>
      <span class="coinpill"><b data-coins>0</b></span>
    </header>
    <div class="daily-body">
      <div id="dailyGrid" class="daily-grid"></div>
      <p id="dailyNote" class="daily-note"></p>
      <button id="dailyClaim" class="btn primary" data-act="claimDaily">Odulu al</button>
    </div>
  </section>

  <!-- ============ AYARLAR ============ -->
  <section class="screen" data-screen="settings">
    <header class="topbar">
      <button class="iconbtn" data-nav="menu" aria-label="Geri">‹</button>
      <h2>Ayarlar</h2>
      <span class="coinpill"><b data-coins>0</b></span>
    </header>
    <div id="settingsList" class="settings-list"></div>
  </section>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="flyLayer" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot" class="modal-root"></div>
  <div id="tutorialRoot" class="tut-root"></div>
  <div id="debugPanel"></div>
</div>
</div>

<script src="js/core.js"></script>
<script src="js/objects.js"></script>
<script src="js/levels.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>

<!-- MasalPark: Nasıl Oynanır katmanı (oyun koduna dokunmaz) -->
<style>
#mpNasilBtn{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:2147483000;
  width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.55);cursor:pointer;
  background:rgba(20,22,40,.78);color:#ffc94d;font-size:22px;font-weight:900;
  font-family:system-ui,sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.35);transition:opacity .4s}
#mpNasilBtn.mpGizli{opacity:0;pointer-events:none}
#mpNasilKap{position:fixed;inset:0;z-index:2147483001;display:none;align-items:center;justify-content:center;
  background:rgba(10,12,26,.82);padding:20px}
#mpNasilKap.mpAcik{display:flex}
#mpNasilKart{background:#fff;color:#26283a;border-radius:20px;max-width:420px;width:100%;
  padding:22px 20px;font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;
  box-shadow:0 18px 50px rgba(0,0,0,.4);max-height:82vh;overflow-y:auto}
#mpNasilKart h2{font-size:20px;font-weight:900;margin:0 0 12px;color:#1a1c30}
#mpNasilKart p{font-size:14.5px;line-height:1.75;white-space:pre-line;margin:0 0 16px}
#mpNasilKart button{font:inherit;font-weight:800;font-size:15px;width:100%;padding:13px;
  border:none;border-radius:999px;background:#1a1c30;color:#ffc94d;cursor:pointer}
</style>
<button id="mpNasilBtn" aria-label="Nasıl oynanır">?</button>
<div id="mpNasilKap" role="dialog" aria-modal="true">
  <div id="mpNasilKart">
    <h2>❓ NASIL OYNANIR — BOLT BLOOM</h2>
    <p></p>
    <button id="mpNasilTamam">Anladım, Oynayalım!</button>
  </div>
</div>
<script>
(function(){
  var btn=document.getElementById('mpNasilBtn'),
      kap=document.getElementById('mpNasilKap');
  document.querySelector('#mpNasilKart p').textContent='1️⃣ Renkli vidalara dokunarak sök — üstü kapalı vidalar sökülemez.\n2️⃣ Söktüğün vida aynı renkteki kutuya gider.\n3️⃣ Kutu dolunca kapanır, yenisi açılır.\n4️⃣ Tüm vidalar sökülünce parçalar düşer, bölüm biter.\n💡 Kutu renklerine bakarak sökme sırası planla.';
  function ac(e){ if(e){e.preventDefault();e.stopPropagation();} kap.classList.add('mpAcik'); }
  function kapat(e){ if(e){e.preventDefault();e.stopPropagation();} kap.classList.remove('mpAcik'); }
  btn.addEventListener('click',ac); btn.addEventListener('touchend',ac);
  document.getElementById('mpNasilTamam').addEventListener('click',kapat);
  document.getElementById('mpNasilTamam').addEventListener('touchend',kapat);
  kap.addEventListener('click',function(e){ if(e.target===kap) kapat(e); });
  /* oyun başlayınca düğme kaybolsun: butona/modala olmayan 2. dokunuştan sonra */
  var sayac=0;
  document.addEventListener('pointerdown',function(e){
    if(e.target.closest('#mpNasilBtn,#mpNasilKap')) return;
    if(++sayac>=2) setTimeout(function(){ btn.classList.add('mpGizli'); },400);
  },true);
  /* sessiz oyuna yumuşak tuş sesi */
  var mpAC=null;
  function mpTik(){ try{ mpAC=mpAC||new (window.AudioContext||window.webkitAudioContext)();
    if(mpAC.state==='suspended')mpAC.resume();
    var t=mpAC.currentTime,o=mpAC.createOscillator(),g=mpAC.createGain();
    o.type='triangle'; o.frequency.value=520;
    g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
    o.connect(g); g.connect(mpAC.destination); o.start(t); o.stop(t+0.09); }catch(e){} }
  document.addEventListener('click',function(e){
    if(e.target.closest('button, .btn, [data-act], a.sec, .sec, .parca')) mpTik();
  },true);
})();
</script>
<script>/* MasalPark: oyun sirasinda ekran uykuya gecmesin */
(function(){var wl=null;function al(){try{if(navigator.wakeLock&&document.visibilityState==='visible')
navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){});}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden)al();});
document.addEventListener('pointerdown',al,{once:true});al();})();</script>
</html>
